/* ─── 2) BẢN ĐỒ HOẠT ĐỘNG (kiểu GitHub) ──────────────────── */
function ActivityHeatmap({matches}){
  const weeks=14;
  const days=useMemo(()=>computeActivityHeatmap(matches, weeks), [matches]);
  const maxCount=Math.max(1, ...days.map(d=>d.count));

  // Nhóm theo cột tuần (7 ngày/cột)
  const cols=[];
  for(let i=0;i<days.length;i+=7) cols.push(days.slice(i,i+7));

  const colorFor=count=>{
    if(count===0) return 'var(--surface2)';
    const ratio=count/maxCount;
    if(ratio<=0.34) return 'var(--green)22';
    if(ratio<=0.67) return 'var(--green)77';
    return 'var(--green)';
  };

  const totalMatches=days.reduce((a,d)=>a+d.count,0);
  const activeDays=days.filter(d=>d.count>0).length;

  return (
    <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',padding:'16px',marginBottom:'20px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px',flexWrap:'wrap',gap:'6px'}}>
        <div className="section-title" style={{fontSize:'15px'}}>🗓️ Bản Đồ Hoạt Động ({weeks} tuần gần nhất)</div>
        <div style={{fontSize:'11px',color:'var(--muted)'}}>{totalMatches} trận · {activeDays} ngày có đấu</div>
      </div>
      <div style={{overflowX:'auto',paddingBottom:'4px'}}>
        <div style={{display:'flex',gap:'3px',width:'fit-content'}}>
          {cols.map((col,ci)=>(
            <div key={ci} style={{display:'flex',flexDirection:'column',gap:'3px'}}>
              {col.map((d,di)=>(
                <div key={di} title={`${d.date.toLocaleDateString('vi-VN')}: ${d.count} trận`} style={{
                  width:'13px',height:'13px',borderRadius:'3px',background:colorFor(d.count),
                  border:d.count>0?'none':'1px solid var(--border)'
                }}/>
              ))}
            </div>
          ))}
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:'6px',marginTop:'10px',fontSize:'10px',color:'var(--muted)'}}>
        <span>Ít</span>
        <div style={{width:'11px',height:'11px',borderRadius:'3px',background:'var(--surface2)',border:'1px solid var(--border)'}}/>
        <div style={{width:'11px',height:'11px',borderRadius:'3px',background:'var(--green)22'}}/>
        <div style={{width:'11px',height:'11px',borderRadius:'3px',background:'var(--green)77'}}/>
        <div style={{width:'11px',height:'11px',borderRadius:'3px',background:'var(--green)'}}/>
        <span>Nhiều</span>
      </div>
    </div>
  );
}

        <div style={{fontSize:'15px',lineHeight:1.6,marginBottom:'10px'}}>
          <b style={{color:'#fbbf24'}}>{winnerTeam}</b> đánh bại <b>{loserTeam}</b> với tỷ số <b>{m.score1}–{m.score2}</b>
          {isUpset ? `, giành đến +${h.delta} Công Đức — một cú lật kèo không ai ngờ tới!` : `.`}

        <div style={{fontSize:'11px',color:'#c4b5fd'}}>💡 Tự động chọn dựa trên mức Công Đức thay đổi mạnh nhất trong các trận gần đây.</div>
      </div>

  );
}

/* ─── EDIT MATCH MODAL ───────────────────────────────────── */
function EditMatchModal({match,players,onClose,onSave}){
  const [type,setType]=useState(match.type||'Đôi');
  const [date,setDate]=useState(match.date||'');
  const [score1,setScore1]=useState(String(match.score1??''));
  const [score2,setScore2]=useState(String(match.score2??''));
  const [isStar,setIsStar]=useState(match.isStar||false);
  const t1p=match.team1Players||[];
  const t2p=match.team2Players||[];
  const [p1,setP1]=useState(t1p[0]||'');
  const [p2,setP2]=useState(t2p[0]||'');
  const [t1a,setT1a]=useState(t1p[0]||'');
  const [t1b,setT1b]=useState(t1p[1]||'');
  const [t2a,setT2a]=useState(t2p[0]||'');
  const [t2b,setT2b]=useState(t2p[1]||'');
  const s1=parseInt(score1)||0,s2=parseInt(score2)||0;
  const win=s1>s2;
  const pOpts=players.map(p=>p.name);
  const sel=(val,fn,others=[])=>(
    <select className="fi" value={val} onChange={e=>fn(e.target.value)}>
      <option value="">-- Chọn --</option>
      {pOpts.filter(n=>n===val||!others.filter(Boolean).includes(n)).map(n=><option key={n}>{n}</option>)}
    </select>
  );
  const eloPreview=useMemo(()=>{
    if(!score1||!score2) return null;
    const mult=isStar?2:1;
    if(type==='Đơn'){
      const pa=players.find(p=>p.name===p1),pb=players.find(p=>p.name===p2);
      if(!pa||!pb) return null;
      const d=calcEloChangePair(pa.elo,pb.elo,win,'Đơn')*mult;
      return [{name:pa.name,delta:d},{name:pb.name,delta:-d}];
    } else {
      const pa=players.find(p=>p.name===t1a),pb=players.find(p=>p.name===t1b);
      const pc=players.find(p=>p.name===t2a),pd=players.find(p=>p.name===t2b);
      if(!pa||!pc) return null;
      const elo1=pa&&pb?Math.round((pa.elo+(pb?.elo||pa.elo))/2):pa?.elo||1500;
      const elo2=pc&&pd?Math.round((pc.elo+(pd?.elo||pc.elo))/2):pc?.elo||1500;
      const d=calcEloChangePair(elo1,elo2,win,'Đôi')*mult;
      const res=[];
      if(pa)res.push({name:pa.name,delta:d});
      if(pb)res.push({name:pb.name,delta:d});
      if(pc)res.push({name:pc.name,delta:-d});
      if(pd)res.push({name:pd.name,delta:-d});
      return res;
    }
  },[score1,score2,type,isStar,p1,p2,t1a,t1b,t2a,t2b,players]);

  const save=()=>{
    if(!score1||!score2) return;
    let team1,team2,team1P,team2P;
    if(type==='Đơn'){if(!p1||!p2)return;team1=p1;team2=p2;team1P=[p1];team2P=[p2];}
    else{if(!t1a||!t2a)return;team1=t1b?`${t1a} & ${t1b}`:t1a;team2=t2b?`${t2a} & ${t2b}`:t2a;team1P=[t1a,t1b].filter(Boolean);team2P=[t2a,t2b].filter(Boolean);}
    onSave({...match,type,date,score1:s1,score2:s2,result:win?'W':'L',myTeam:team1,oppTeam:team2,team1Players:team1P,team2Players:team2P,isStar:isStar||false,eloChanges:eloPreview||[]});
    onClose();
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">✏️ Sửa trận đấu</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div style={{display:'flex',gap:'6px',marginBottom:'14px'}}>
          {['Đơn','Đôi'].map(t=>(
            <button key={t} onClick={()=>setType(t)} style={{flex:1,padding:'8px',borderRadius:'8px',border:'1px solid',fontSize:'13px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:600,
              borderColor:type===t?'var(--green)':'var(--border)',background:type===t?'var(--green-bg)':'var(--surface)',color:type===t?'var(--green)':'var(--muted)'}}>
              {t==='Đơn'?'🧍 Đánh Đơn':'👥 Đánh Đôi'}
            </button>
          ))}
        </div>
        {type==='Đơn'?(
          <div className="form-grid" style={{marginBottom:'12px'}}>
            <div className="fg"><label className="fl">Người 1 (Đội A)</label>{sel(p1,setP1,[p2])}</div>
            <div className="fg"><label className="fl">Người 2 (Đội B)</label>{sel(p2,setP2,[p1])}</div>
          </div>
        ):(
          <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:'8px',alignItems:'center',marginBottom:'12px'}}>
            <div>
              <div className="fl" style={{marginBottom:'6px',textAlign:'center',color:'var(--green)'}}>⚡ Đội A</div>
              <div className="fg" style={{marginBottom:'6px'}}><label className="fl">Người 1</label>{sel(t1a,setT1a,[t1b,t2a,t2b])}</div>
              <div className="fg"><label className="fl">Người 2</label>{sel(t1b,setT1b,[t1a,t2a,t2b])}</div>
            </div>
            <div style={{textAlign:'center',fontFamily:'Quicksand',fontWeight:700,color:'var(--muted)',fontSize:'14px',paddingTop:'16px'}}>VS</div>
            <div>
              <div className="fl" style={{marginBottom:'6px',textAlign:'center',color:'var(--red)'}}>🔥 Đội B</div>
              <div className="fg" style={{marginBottom:'6px'}}><label className="fl">Người 1</label>{sel(t2a,setT2a,[t1a,t1b,t2b])}</div>
              <div className="fg"><label className="fl">Người 2</label>{sel(t2b,setT2b,[t1a,t1b,t2a])}</div>
            </div>
          </div>
        )}
        <div className="score-row">
          <div className="score-team">
            <div className="score-lbl" style={{color:'var(--green)'}}>Đội A</div>
            <input className="score-num" type="number" min="0" max="99" value={score1} onChange={e=>setScore1(e.target.value)} placeholder="0"/>
          </div>
          <div className="score-vs">VS</div>
          <div className="score-team">
            <div className="score-lbl" style={{color:'var(--red)'}}>Đội B</div>
            <input className="score-num" type="number" min="0" max="99" value={score2} onChange={e=>setScore2(e.target.value)} placeholder="0"/>
          </div>
        </div>
        {/* Ngôi sao hy vọng (edit) */}
        <div style={{marginBottom:'10px'}}>
          <button onClick={()=>setIsStar(v=>!v)} style={{width:'100%',padding:'8px',borderRadius:'10px',border:`2px solid ${isStar?'#fbbf24':'var(--border)'}`,
            background:isStar?'rgba(251,191,36,.15)':'var(--surface2)',cursor:'pointer',display:'flex',alignItems:'center',gap:'8px',justifyContent:'center',
            fontFamily:'Nunito,sans-serif',fontWeight:700,fontSize:'13px',color:isStar?'#fbbf24':'var(--muted)',transition:'.15s'}}>
            <span>⭐</span><span>Ngôi sao hy vọng</span>
            {isStar&&<span style={{fontSize:'11px',background:'rgba(251,191,36,.25)',padding:'2px 7px',borderRadius:'20px'}}>×2</span>}
          </button>
        </div>
        {eloPreview&&(
          <div className="elo-preview">
            <div className="ep-label">{isStar?'⭐ Công Đức dự kiến (×2)':'Công Đức dự kiến sau chỉnh sửa'}</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:'8px',justifyContent:'center',marginTop:'6px'}}>
              {eloPreview.map(e=>(
                <span key={e.name} style={{fontSize:'13px',fontWeight:700,fontFamily:'Quicksand,sans-serif',color:e.delta>=0?'var(--green)':'var(--red)'}}>
                  {e.name}: {e.delta>0?'+':''}{e.delta}
                </span>
              ))}
            </div>
          </div>
        )}
        <div className="fg" style={{marginTop:'12px'}}>
          <label className="fl">📅 Ngày</label>
          <DateInput value={date} onChange={setDate}/>
        </div>
        <div className="form-actions">
          <button className="btn-cancel" onClick={onClose}>Hủy</button>
          <button className="btn-save" onClick={save}>Lưu thay đổi</button>
        </div>
      </div>
    </div>
  );
}

/* ─── MATCH LIST ─────────────────────────────────────────── */
function MatchItem({m, showDel, onDelete, onEdit, perspective}){
  const [expanded, setExpanded] = React.useState(false);
  const team1 = m.team1Players || (m.myTeam ? [m.myTeam] : []);
  const team2 = m.team2Players || (m.oppTeam ? [m.oppTeam] : []);
  const eloChanges = m.eloChanges || [];

  // m.result luôn theo góc nhìn Đội A. Nếu đang lọc/xem theo 1 người cụ thể
  // và người đó ở Đội B thì phải đảo lại kết quả cho đúng góc nhìn của họ.
  const inT1 = perspective ? team1.includes(perspective) : true;
  const displayResult = perspective ? (inT1 ? m.result : (m.result==='W'?'L':'W')) : m.result;
  // +/- điểm ELO của đúng người đang được xem (khi lọc theo 1 người), hiện ngay ở dòng chính
  const myChange = perspective ? eloChanges.find(e=>e.name===perspective) : null;

  return (
    <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',marginBottom:'8px',overflow:'hidden'}}>
      {/* Row chính — tap để mở rộng */}
      <div style={{padding:'13px 15px',display:'grid',gridTemplateColumns:showDel?(myChange?'34px 1fr 56px 50px 30px 30px':'34px 1fr 56px 30px 30px'):(myChange?'34px 1fr 56px 50px 28px':'34px 1fr 56px 28px'),gap:'8px',alignItems:'center',cursor:'pointer'}}
        onClick={()=>setExpanded(e=>!e)}>
        <div className={`result-badge rb-${displayResult}`}>{displayResult}</div>
        <div style={{minWidth:0,overflow:'hidden'}}>
          <div className="m-vs">{m.myTeam} vs {m.oppTeam}</div>
          <div className="m-meta"><span>{m.date}</span><span>{m.type}</span>{m.isStar&&<span style={{color:'#fbbf24',fontWeight:700}}>⭐×2</span>}</div>
        </div>
        <div>
          <div className="m-score" style={{color:displayResult==='W'?'var(--green)':'var(--red)'}}>{m.score1}–{m.score2}</div>
        </div>
        {myChange && <div className={`m-elo ${myChange.delta>0?'pos':'neg'}`}>{myChange.delta>0?'+':''}{myChange.delta}</div>}
        {showDel && <button className="del-btn" title="Sửa" onClick={e=>{e.stopPropagation();onEdit&&onEdit(m);}} style={{background:'var(--blue-bg)',color:'var(--blue)'}}>✏️</button>}
        {showDel && <button className="del-btn" onClick={e=>{e.stopPropagation();onDelete(m.id);}}>🗑</button>}
        {!showDel && <div style={{textAlign:'center',fontSize:'11px',color:'var(--muted)',opacity:.5}}>{expanded?'▲':'▼'}</div>}
      </div>

      {/* Chi tiết mở rộng */}
      {expanded && (
        <div style={{borderTop:'1px solid var(--border)',background:'var(--bg3)',padding:'12px 15px',fontSize:'13px'}}>
          {/* Đội A */}
          <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:'8px',alignItems:'start',marginBottom:'10px'}}>
            <div>
              <div style={{fontSize:'10px',color:'var(--green)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'5px'}}>Đội A {m.result==='W'?'🏆':''}</div>
              {team1.map(name=>{
                const ch=eloChanges.find(e=>e.name===name);
                return (
                  <div key={name} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'4px 8px',background:'var(--surface)',borderRadius:'7px',marginBottom:'3px',border:'1px solid var(--border)'}}>
                    <span style={{fontWeight:600,fontSize:'12px'}}>{name}</span>
                    {ch && <span style={{fontSize:'11px',fontWeight:700,color:ch.delta>0?'var(--green)':'var(--red)'}}>{ch.delta>0?'+':''}{ch.delta}</span>}
                  </div>
                );
              })}
            </div>
            <div style={{textAlign:'center',paddingTop:'18px',fontFamily:'Quicksand,sans-serif',fontSize:'20px',fontWeight:700,color:'var(--muted)'}}>VS</div>
            <div>
              <div style={{fontSize:'10px',color:'var(--red)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'5px'}}>Đội B {m.result==='L'?'🏆':''}</div>
              {team2.map(name=>{
                const ch=eloChanges.find(e=>e.name===name);
                return (
                  <div key={name} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'4px 8px',background:'var(--surface)',borderRadius:'7px',marginBottom:'3px',border:'1px solid var(--border)'}}>
                    <span style={{fontWeight:600,fontSize:'12px'}}>{name}</span>
                    {ch && <span style={{fontSize:'11px',fontWeight:700,color:ch.delta>0?'var(--green)':'var(--red)'}}>{ch.delta>0?'+':''}{ch.delta}</span>}
                  </div>
                );
              })}
            </div>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:'11px',color:'var(--muted)',paddingTop:'6px',borderTop:'1px solid var(--border)'}}>
            <span>📅 {m.date} · {m.type==='Đôi'?'👥 Đánh đôi':'🧍 Đánh đơn'}{m.isStar?' · ⭐ Ngôi sao hy vọng':''}</span>
            <span style={{fontFamily:'Quicksand',fontWeight:700,fontSize:'14px',color:displayResult==='W'?'var(--green)':'var(--red)'}}>{m.score1}–{m.score2}</span>
          </div>
        </div>
      )}
    </div>
  );
}

function MatchList({matches,showDel,onDelete,players,onEdit,perspective}){
  if(!matches.length) return <div style={{textAlign:'center',padding:'32px',color:'var(--muted)'}}>Chưa có trận nào</div>;
  return (
    <div className="match-list">
      {matches.map(m=>(
        <MatchItem key={m.id} m={m} showDel={showDel} onDelete={onDelete} onEdit={onEdit} perspective={perspective}/>
      ))}
    </div>
  );
}

/* ─── DATE PICKER HELPER ─────────────────────────────────── */
// Convert DD/MM string <-> YYYY-MM-DD for input[type=date]
function toInputDate(ddmm){
  if(!ddmm) return '';
  const [d,m]=ddmm.split('/');
  if(!d||!m) return '';
  const y=new Date().getFullYear();
  return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
}
function fromInputDate(val){
  if(!val) return '';
  const [,m,d]=val.split('-');
  return `${d}/${m}`;
}
function DateInput({value,onChange,style}){
  return (
    <input
      type="date"
      className="fi"
      style={{...style,colorScheme:'dark'}}
      value={toInputDate(value)}
      onChange={e=>onChange(fromInputDate(e.target.value))}
    />
  );
}

/* Ô nhập tiền: tự thêm dấu phẩy ngăn cách nghìn khi gõ (VD 300000 -> 300,000).
   Giá trị trả về qua onChange luôn là chuỗi số thuần (không dấu phẩy) để không đổi
   cách tính toán (parseInt) ở những nơi đang dùng. */
function MoneyInput({value,onChange,placeholder,className='fi',style}){
  const digits = String(value??'').replace(/[^\d]/g,'');
  const display = digits ? Number(digits).toLocaleString('en-US') : '';
  return (
    <input
      className={className}
      type="text"
      inputMode="numeric"
      value={display}
      onChange={e=>onChange(e.target.value.replace(/[^\d]/g,''))}
      placeholder={placeholder}
      style={style}
    />
  );
}

/* ─── ADD MATCH MODAL (MULTI-PLAYER) ─────────────────────── */
function AddMatchModal({players,sessions,onClose,onSave}){
  const [type,setType]=useState('Đôi');
  const today=new Date();
  const [date,setDate]=useState(`${String(today.getDate()).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')}`);
  const [score1,setScore1]=useState('');
  const [score2,setScore2]=useState('');
  const [isStar,setIsStar]=useState(false);
  // Quick-pick: {name: 'A'|'B'}
  const [picks,setPicks]=useState({});

  // Buổi chơi đã đặt sân — dùng để lọc danh sách người chơi khi ghi trận
  // Chỉ tính các buổi có TIỀN SÂN (buổi thật sự đặt sân để chơi), không tính buổi
  // chỉ là khoản chi phụ (mua bóng, tiền nước riêng...) không có ai chơi thật.
  // Buổi cũ chưa có chi tiết khoản chi (chưa dùng tính năng chia khoản) vẫn hiển thị
  // như trước để không mất dữ liệu.
  const isCourtSession=s=>{
    const hasBreakdown=(s.courtFee||0)>0||(s.shuttleFee||0)>0||(s.waterFee||0)>0||(s.otherFee||0)>0;
    if(!hasBreakdown) return true;
    return (s.courtFee||0)>0;
  };
  // Sắp xếp theo NGÀY CHƠI thực tế (s.date, dạng dd/mm) chứ không phải theo id
  // (id = thời điểm tạo buổi trong app, có thể không trùng thứ tự ngày chơi).
  const parseDdMm=str=>{
    if(!str) return 0;
    const [d,m]=str.split('/').map(Number);
    if(!d||!m) return 0;
    return m*100+d; // vd 18/08 -> 818, 19/08 -> 819 => so sánh đúng thứ tự trong năm
  };
  const recentSessions=useMemo(()=>[...(sessions||[])].filter(isCourtSession).sort((a,b)=>parseDdMm(b.date)-parseDdMm(a.date)||b.id-a.id).slice(0,10),[sessions]);
  const [sessionId,setSessionId]=useState(recentSessions.length?recentSessions[0].id:'');
  const activeSession=recentSessions.find(s=>s.id===sessionId);
  const sessionAttendees=activeSession?.attendees ? Object.entries(activeSession.attendees).filter(([,v])=>v).map(([k])=>k) : null;

  const s1=parseInt(score1)||0, s2=parseInt(score2)||0;
  const hasScore=score1!==''&&score2!=='';
  const win=s1>s2;

  const pOpts=(sessionAttendees && sessionAttendees.length>0)
    ? players.filter(p=>sessionAttendees.includes(p.name)).map(p=>p.name)
    : players.map(p=>p.name);

  const maxPerSide=type==='Đơn'?1:2;
  const sideA=Object.entries(picks).filter(([,v])=>v==='A').map(([n])=>n);
  const sideB=Object.entries(picks).filter(([,v])=>v==='B').map(([n])=>n);

  // compute ELO preview (×2 nếu ngôi sao hy vọng — đối xứng cả 2 đội)
  const eloPreview=useMemo(()=>{
    if(!hasScore||!sideA.length||!sideB.length) return null;
    const pA=sideA.map(n=>players.find(p=>p.name===n)).filter(Boolean);
    const pB=sideB.map(n=>players.find(p=>p.name===n)).filter(Boolean);
    if(!pA.length||!pB.length) return null;
    const elo1=Math.round(pA.reduce((s,p)=>s+p.elo,0)/pA.length);
    const elo2=Math.round(pB.reduce((s,p)=>s+p.elo,0)/pB.length);
    const matchType=type==='Đơn'?'Đơn':'Đôi';
    let d=calcEloChangePair(elo1,elo2,win,matchType);
    if(isStar) d=d*2;
    return [
      ...pA.map(p=>({name:p.name,delta:d})),
      ...pB.map(p=>({name:p.name,delta:-d})),
    ];
  },[hasScore,win,type,isStar,sideA.join(','),sideB.join(','),players]);

  const togglePick=name=>{
    setPicks(prev=>{
      const cur=prev[name];
      const next={...prev};
      const aCount=Object.values(prev).filter(v=>v==='A').length;
      const bCount=Object.values(prev).filter(v=>v==='B').length;
      if(!cur){
        if(aCount<maxPerSide) next[name]='A';
        else if(bCount<maxPerSide) next[name]='B';
      } else if(cur==='A'){
        if(bCount<maxPerSide) next[name]='B';
        else delete next[name];
      } else {
        delete next[name];
      }
      return next;
    });
  };

  const save=()=>{
    if(!hasScore||score1===''||score2==='') return;
    if(!sideA[0]||!sideB[0]) return;
    const team1=sideA.join(' & '), team2=sideB.join(' & ');
    onSave({id:Date.now(),type,date,score1:s1,score2:s2,result:win?'W':'L',
      myTeam:team1,oppTeam:team2,
      team1Players:sideA, team2Players:sideB,
      isStar:isStar||false,
      eloChanges:eloPreview||[]
    });
    onClose();
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">🏓 Ghi trận đấu</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>

        {/* Buổi chơi — lọc người chơi theo ai đã đặt sân/tham gia */}
        {recentSessions.length>0 && (
          <div className="fg" style={{marginBottom:'12px'}}>
            <label className="fl">Buổi chơi</label>
            <select className="fi" value={sessionId} onChange={e=>setSessionId(e.target.value?Number(e.target.value):'')}>
              {recentSessions.map(s=>{
                const cnt=s.attendees?Object.values(s.attendees).filter(Boolean).length:0;
                return <option key={s.id} value={s.id}>📅 {s.date} · {cnt} người{s.note?` · ${s.note}`:''}</option>;
              })}
              <option value="">👥 Tất cả người chơi (không lọc)</option>
            </select>
            {sessionAttendees && sessionAttendees.length>0 && (
              <div style={{fontSize:'11px',color:'var(--muted)',marginTop:'4px'}}>
                Đang chỉ hiện {sessionAttendees.length} người đã đặt sân buổi này. Chọn "Tất cả người chơi" nếu cần thêm người khác.
              </div>
            )}
          </div>
        )}

        {/* Loại */}
        <div style={{display:'flex',gap:'6px',marginBottom:'14px'}}>
          {['Đơn','Đôi'].map(t=>(
            <button key={t} onClick={()=>{setType(t);setPicks({});}} style={{flex:1,padding:'8px',borderRadius:'8px',border:'1px solid',fontSize:'13px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:600,
              borderColor:type===t?'var(--green)':'var(--border)',
              background:type===t?'var(--green-bg)':'var(--surface)',
              color:type===t?'var(--green)':'var(--muted)'}}>
              {t==='Đơn'?'🧍 Đánh Đơn':'👥 Đánh Đôi'}
            </button>
          ))}
        </div>

        {/* Quick-pick: chọn người bằng chip — tap 1 lần → Đội A, tap 2 lần → Đội B, tap 3 lần → bỏ chọn */}
        <div style={{marginBottom:'12px'}}>
          {/* Slot hiển thị */}
          <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:'6px',alignItems:'start',marginBottom:'10px'}}>
            <div style={{background:'var(--green-bg)',border:'1px solid var(--green)',borderRadius:'10px',padding:'8px'}}>
              <div style={{fontSize:'11px',fontWeight:700,color:'var(--green)',marginBottom:'5px',textAlign:'center'}}>⚡ Đội A</div>
              {Array.from({length:maxPerSide}).map((_,i)=>(
                <div key={i} style={{background:sideA[i]?'var(--green)':'rgba(0,0,0,.05)',borderRadius:'7px',padding:'5px 8px',
                  fontSize:'12px',fontWeight:700,color:sideA[i]?'#fff':'var(--muted)',textAlign:'center',
                  marginBottom:i<maxPerSide-1?'4px':0,minHeight:'28px',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {sideA[i]?sideA[i].split(' ').slice(-2).join(' '):'—'}
                </div>
              ))}
            </div>
            <div style={{textAlign:'center',fontFamily:'Quicksand',fontWeight:700,color:'var(--muted)',fontSize:'14px',paddingTop:'20px'}}>VS</div>
            <div style={{background:'var(--red-bg)',border:'1px solid var(--red)',borderRadius:'10px',padding:'8px'}}>
              <div style={{fontSize:'11px',fontWeight:700,color:'var(--red)',marginBottom:'5px',textAlign:'center'}}>🔥 Đội B</div>
              {Array.from({length:maxPerSide}).map((_,i)=>(
                <div key={i} style={{background:sideB[i]?'var(--red)':'rgba(0,0,0,.05)',borderRadius:'7px',padding:'5px 8px',
                  fontSize:'12px',fontWeight:700,color:sideB[i]?'#fff':'var(--muted)',textAlign:'center',
                  marginBottom:i<maxPerSide-1?'4px':0,minHeight:'28px',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {sideB[i]?sideB[i].split(' ').slice(-2).join(' '):'—'}
                </div>
              ))}
            </div>
          </div>

          {/* Chip người chơi */}
          <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'6px'}}>
            👇 Bấm chọn người · <span style={{color:'var(--green)'}}>1 lần = Đội A</span> · <span style={{color:'var(--red)'}}>2 lần = Đội B</span> · 3 lần = bỏ
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
            {pOpts.map(name=>{
              const side=picks[name];
              const isA=side==='A', isB=side==='B';
              return (
                <button key={name} onClick={()=>togglePick(name)} style={{
                  padding:'7px 12px',borderRadius:'20px',border:'2px solid',fontSize:'13px',cursor:'pointer',
                  fontFamily:'Nunito,sans-serif',fontWeight:700,transition:'.12s',
                  borderColor:isA?'var(--green)':isB?'var(--red)':'var(--border)',
                  background:isA?'var(--green)':isB?'var(--red)':'var(--surface2)',
                  color:isA||isB?'#fff':'var(--muted)'}}>
                  {isA?'A · ':isB?'B · ':''}
                  {name.split(' ').slice(-2).join(' ')}
                </button>
              );
            })}
          </div>
          {(sideA.length>0||sideB.length>0)&&(
            <button onClick={()=>setPicks({})} style={{marginTop:'6px',fontSize:'11px',color:'var(--red)',background:'transparent',border:'none',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✕ Xoá chọn</button>
          )}
        </div>

        {/* Score */}
        <div className="score-row">
          <div className="score-team">
            <div className="score-lbl" style={{color:'var(--green)'}}>Đội A</div>
            <input className="score-num" type="number" min="0" max="99" value={score1} onChange={e=>setScore1(e.target.value)} placeholder="0"/>
          </div>
          <div className="score-vs">VS</div>
          <div className="score-team">
            <div className="score-lbl" style={{color:'var(--red)'}}>Đội B</div>
            <input className="score-num" type="number" min="0" max="99" value={score2} onChange={e=>setScore2(e.target.value)} placeholder="0"/>
          </div>
        </div>

        {/* Ngôi sao hy vọng */}
        <div style={{marginBottom:'10px'}}>
          <button onClick={()=>setIsStar(v=>!v)} style={{width:'100%',padding:'10px',borderRadius:'10px',border:`2px solid ${isStar?'#fbbf24':'var(--border)'}`,
            background:isStar?'rgba(251,191,36,.15)':'var(--surface2)',cursor:'pointer',display:'flex',alignItems:'center',gap:'8px',justifyContent:'center',

/* ─── THÙNG RÁC ───────────────────────────────────────────
   Hiện các mục đã xóa (còn trong 30 ngày), cho phép khôi phục hoặc xóa vĩnh viễn. */
function daysLeft(deletedAt){
  const RETENTION=30;
  const passed=(Date.now()-deletedAt)/(24*60*60*1000);
  return Math.max(0, Math.ceil(RETENTION-passed));
}
function TrashSection({title, icon, items, renderLabel, onRestore, onPurge}){
  if(!items.length) return null;
  return (
    <div style={{marginBottom:'18px'}}>
      <div style={{fontSize:'12px',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'8px'}}>{icon} {title} ({items.length})</div>
      <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
        {items.map((item,idx)=>(
          <div key={idx} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'10px',padding:'9px 12px',display:'flex',alignItems:'center',gap:'8px'}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:'13px',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{renderLabel(item)}</div>
              <div style={{fontSize:'10px',color:'var(--muted)',marginTop:'2px'}}>Còn {daysLeft(item.deletedAt)} ngày trước khi tự xóa vĩnh viễn</div>
            </div>
            <button onClick={()=>onRestore(idx)} title="Khôi phục" style={{background:'var(--green-bg)',border:'1px solid var(--green)',borderRadius:'7px',color:'var(--green)',padding:'6px 10px',fontSize:'11px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif',whiteSpace:'nowrap'}}>↩️ Khôi phục</button>
            <button onClick={()=>onPurge(idx)} title="Xóa vĩnh viễn" style={{background:'var(--red-bg)',border:'1px solid var(--red)',borderRadius:'7px',color:'var(--red)',padding:'6px 8px',fontSize:'11px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>🗑</button>
          </div>

      </div>
    </div>
  );
}

function BackupModal({data,onClose,onRestore}){
  const [confirmRestore,setConfirmRestore]=useState(null); // parsed object chờ xác nhận
  const [error,setError]=useState('');
  const fileRef=React.useRef(null);

  const downloadBackup=()=>{
    const payload={...data,_backupAt:new Date().toISOString(),_app:'PickCoBonPhongBat'};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const stamp=new Date().toISOString().slice(0,10);
    a.href=url;a.download=`pcb-saoluu-${stamp}.json`;a.click();
    URL.revokeObjectURL(url);
  };

  const pickFile=()=>fileRef.current && fileRef.current.click();
  const onFileChange=e=>{
    const file=e.target.files && e.target.files[0];
    e.target.value='';
    if(!file) return;
    setError('');
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const parsed=JSON.parse(reader.result);
        if(!parsed||typeof parsed!=='object'||!Array.isArray(parsed.players)){
          setError('File không đúng định dạng bản sao lưu của app này.');
          return;
        }
        setConfirmRestore(parsed);
      }catch(e){ setError('Không đọc được file JSON. Hãy chọn đúng file sao lưu đã tải trước đó.'); }
    };
    reader.readAsText(file);
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:'440px'}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">💾 Sao lưu / Khôi phục dữ liệu</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>

        {!confirmRestore ? (
          <>
            <div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'10px',padding:'12px 14px',marginBottom:'14px',fontSize:'12.5px',color:'var(--muted)',lineHeight:1.5}}>
              Dữ liệu CLB được lưu trên máy chủ, nhưng nên thỉnh thoảng tải về 1 bản sao lưu JSON để phòng trường hợp mất mạng, lỗi server hoặc thao tác nhầm. File này chứa toàn bộ: người chơi, trận đấu, buổi chơi, thành viên quỹ, thùng rác.
            </div>
            <button onClick={downloadBackup} style={{width:'100%',background:'var(--green)',border:'none',borderRadius:'10px',color:'#fff',padding:'12px',fontSize:'14px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif',marginBottom:'10px',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'}}>
              ⬇️ Tải bản sao lưu (JSON)
            </button>
            <div style={{height:'1px',background:'var(--border)',margin:'14px 0'}}/>
            <div className="fl" style={{marginBottom:'8px'}}>Khôi phục từ file sao lưu</div>
            <div style={{background:'var(--red-bg)',border:'1px solid var(--red)',borderRadius:'10px',padding:'10px 12px',marginBottom:'10px',fontSize:'12px',color:'var(--red)'}}>
              ⚠️ Khôi phục sẽ GHI ĐÈ toàn bộ dữ liệu hiện tại bằng dữ liệu trong file. Chỉ dùng khi chắc chắn dữ liệu hiện tại bị sai/mất.
            </div>
            <input ref={fileRef} type="file" accept="application/json" style={{display:'none'}} onChange={onFileChange}/>
            <button onClick={pickFile} style={{width:'100%',background:'var(--surface)',border:'1px dashed var(--border2)',borderRadius:'10px',color:'var(--text)',padding:'12px',fontSize:'14px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
              📂 Chọn file sao lưu để khôi phục
            </button>
            {error && <div style={{fontSize:'12px',color:'var(--red)',marginTop:'8px'}}>⚠️ {error}</div>}
          </>
        ) : (
          <>
            <div style={{background:'var(--red-bg)',border:'1px solid var(--red)',borderRadius:'10px',padding:'14px',marginBottom:'16px',textAlign:'center'}}>
              <div style={{fontSize:'28px',marginBottom:'6px'}}>🚨</div>
              <div style={{fontFamily:'Quicksand,sans-serif',fontWeight:700,fontSize:'16px',color:'var(--red)',marginBottom:'4px'}}>Xác nhận khôi phục</div>
              <div style={{fontSize:'13px',color:'var(--muted)'}}>
                File sao lưu này có {Array.isArray(confirmRestore.players)?confirmRestore.players.length:0} người chơi, {Array.isArray(confirmRestore.matches)?confirmRestore.matches.length:0} trận đấu, {Array.isArray(confirmRestore.sessions)?confirmRestore.sessions.length:0} buổi chơi{confirmRestore._backupAt?`, sao lưu lúc ${new Date(confirmRestore._backupAt).toLocaleString('vi-VN')}`:''}.
                Dữ liệu hiện tại sẽ bị thay thế hoàn toàn. Tiếp tục?
              </div>
            </div>
            <div className="form-actions">
              <button className="btn-cancel" onClick={()=>setConfirmRestore(null)}>Thôi, không khôi phục</button>
              <button className="btn-danger" onClick={()=>{ onRestore(confirmRestore); setConfirmRestore(null); onClose(); }}>Khôi phục ngay</button>
            </div>
          </>
        )}
      </div>
    </div>
  );

/* ─── EXPORT CSV ─────────────────────────────────────────── */
function exportCSV(matches,players){
  // Matches sheet
  const mRows=[['Ngày','Loại','Đội A','Đội B','Tỉ số','Kết quả','Công Đức thay đổi']];
  matches.forEach(m=>{
    const eloStr=(m.eloChanges||[]).map(e=>`${e.name}:${e.delta>0?'+':''}${e.delta}`).join(' | ');
    mRows.push([m.date,m.type,m.myTeam,m.oppTeam,`${m.score1}-${m.score2}`,m.result,eloStr]);
  });
  // Players sheet
  const pRows=[['Tên','Công Đức','Thắng','Thua','Tỉ lệ thắng']];
  [...players].sort((a,b)=>b.elo-a.elo).forEach(p=>{
    const total=p.wins+p.losses;
    pRows.push([p.name,p.elo,p.wins,p.losses,total?Math.round(p.wins/total*100)+'%':'—']);
  });
  const toCSV=rows=>rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const csv='=== LỊCH SỬ TRẬN ===\n'+toCSV(mRows)+'\n\n=== BXH NGƯỜI CHƠI ===\n'+toCSV(pRows);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='picklepro_export.csv';a.click();
  URL.revokeObjectURL(url);
}

/* ─── ELO HISTORY CHART ──────────────────────────────────── */
/* ─── TRANG RIÊNG: LỊCH SỬ ĐÁNH CHI TIẾT CỦA NGƯỜI CHƠI ──── */
function PlayerHistoryPage({player, players, matches, sessions, onBack, onEditMatch, onDeleteMatch, onUpdateAvatar, onResyncStats, onViewHistory}){
  const [typeFilter,setTypeFilter]=useState('Tất cả');
  const [monthFilter,setMonthFilter]=useState('Tất cả');
  const [editMatch,setEditMatch]=useState(null);
  const [showFullAvatar,setShowFullAvatar]=useState(false);
  const [cropSrc,setCropSrc]=useState(null);
  const [duyenTab,setDuyenTab]=useState('opp');
  const avatarInputRef=React.useRef(null);
  const handleAvatarFile=(e)=>{
    const file=e.target.files?.[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>setCropSrc(ev.target.result);
    reader.readAsDataURL(file);
    e.target.value='';
  };

  const tier=getTier(player.elo);

  // Toàn bộ trận có sự tham gia của người này (cũ→mới để build timeline ELO)
  const myMatchesAsc=useMemo(()=>{
    return [...matches].reverse().filter(m=>{
      const all=[...(m.team1Players||(m.myTeam?[m.myTeam]:[])),...(m.team2Players||(m.oppTeam?[m.oppTeam]:[]))];
      return all.includes(player.name);
    });
  },[matches,player.name]);

  // Thắng/thua ĐẾM TRỰC TIẾP từ danh sách trận đấu thật (nguồn dữ liệu gốc) —
  // KHÔNG dùng bộ đếm lũy kế player.wins/player.losses vì bộ đếm này có thể bị
  // lệch dần theo thời gian do đồng bộ đa thiết bị (ghi đè không nguyên tử qua Firebase).
  // Cách tính này đảm bảo luôn khớp 100% với số trận hiển thị bên dưới.
  const realWins=myMatchesAsc.filter(m=>{
    const inT1=(m.team1Players||(m.myTeam?[m.myTeam]:[])).includes(player.name);
    return inT1?m.result==='W':m.result==='L';
  }).length;
  const realLosses=myMatchesAsc.length-realWins;
  const total=realWins+realLosses;
  const wr=total?Math.round(realWins/total*100):0;
  // Phát hiện lệch số liệu so với bộ đếm đang lưu trên hồ sơ
  const statsMismatch = player.wins!==realWins || player.losses!==realLosses;

  const allBadges=useMemo(()=>computeBadges(players||[], matches), [players, matches]);
  const myBadges=allBadges.filter(b=>b.holder&&b.holder.id===player.id);

  const history=useMemo(()=>{
    let elo=1500;
    const pts=[{date:'Bắt đầu',elo:1500}];
    myMatchesAsc.forEach(m=>{
      const change=(m.eloChanges||[]).find(e=>e.name===player.name);
      if(change){elo+=change.delta;pts.push({date:m.date,elo,delta:change.delta});}
    });
    return pts;
  },[myMatchesAsc,player.name]);

  const minE=history.length?Math.min(...history.map(h=>h.elo))-30:1470;
  const maxE=history.length?Math.max(...history.map(h=>h.elo))+30:1530;
  const W=680,H=200,PAD=40;
  const xScale=i=>history.length>1?PAD+(i/(history.length-1))*(W-PAD*2):W/2;
  const yScale=e=>H-PAD-((e-minE)/(maxE-minE||1))*(H-PAD*2);
  const pathD=history.map((h,i)=>`${i===0?'M':'L'}${xScale(i)},${yScale(h.elo)}`).join(' ');

  // Danh sách trận (mới→cũ) áp bộ lọc loại trận / tháng, giữ nguyên góc nhìn của người này
  const months=useMemo(()=>{
    const s=new Set();
    myMatchesAsc.forEach(m=>{
      const parts=m.date.split(/[\/\-]/);
      if(parts.length>=2) s.add(parts[1]);
    });
    return ['Tất cả',...[...s].sort((a,b)=>parseInt(a)-parseInt(b)).map(m=>`Tháng ${m}`)];
  },[myMatchesAsc]);

  const filteredMatches=useMemo(()=>{
    return [...myMatchesAsc].reverse().filter(m=>{
      if(typeFilter!=='Tất cả'&&m.type!==typeFilter) return false;
      if(monthFilter!=='Tất cả'){
        const mon=monthFilter.replace('Tháng ','');
        const parts=m.date.split(/[\/\-]/);
        if(parts.length<2||parts[1]!==mon) return false;
      }
      return true;
    });
  },[myMatchesAsc,typeFilter,monthFilter]);

  const fWins=filteredMatches.filter(m=>{
    const inT1=(m.team1Players||(m.myTeam?[m.myTeam]:[])).includes(player.name);
    return inT1?m.result==='W':m.result==='L';
  }).length;
  const fLosses=filteredMatches.length-fWins;

  // Đối thủ hay gặp nhất: đếm số trận đối đầu (khác đội) với từng người,
  // cùng thắng/thua riêng với người đó — cùng logic với Đối Đầu Trực Tiếp ở tab BXH.
  const opponentStats=useMemo(()=>{
    const map={};
    myMatchesAsc.forEach(m=>{
      const team1=m.team1Players||(m.myTeam?[m.myTeam]:[]);
      const team2=m.team2Players||(m.oppTeam?[m.oppTeam]:[]);
      const inT1=team1.includes(player.name);
      const oppTeam=inT1?team2:team1;
      const won=inT1?m.result==='W':m.result==='L';
      oppTeam.forEach(oppName=>{
        if(!oppName||oppName===player.name) return;
        if(!map[oppName]) map[oppName]={name:oppName,matches:0,wins:0,losses:0};
        map[oppName].matches++;
        if(won) map[oppName].wins++; else map[oppName].losses++;
      });
    });
    return Object.values(map)
      .map(s=>({...s,winRate:s.matches?Math.round(s.wins/s.matches*100):0}))
      .sort((a,b)=>b.matches-a.matches)
      .slice(0,5);
  },[myMatchesAsc,player.name]);

  // Khắc tinh (đối thủ mình thua nhiều nhất) & khắc chế (đối thủ mình thắng nhiều nhất) —
  // dùng toàn bộ đối thủ có ≥2 trận đối đầu, không giới hạn top 5 như opponentStats ở trên.
  const {nemesis, favoriteVictim} = useMemo(()=>{
    const map={};
    myMatchesAsc.forEach(m=>{
      const team1=m.team1Players||(m.myTeam?[m.myTeam]:[]);
      const team2=m.team2Players||(m.oppTeam?[m.oppTeam]:[]);
      const inT1=team1.includes(player.name);
      const oppTeam=inT1?team2:team1;
      const won=inT1?m.result==='W':m.result==='L';
      oppTeam.forEach(oppName=>{
        if(!oppName||oppName===player.name) return;
        if(!map[oppName]) map[oppName]={name:oppName,matches:0,wins:0,losses:0};
        map[oppName].matches++;
        if(won) map[oppName].wins++; else map[oppName].losses++;
      });
    });
    const list=Object.values(map)
      .map(s=>({...s,winRate:s.matches?Math.round(s.wins/s.matches*100):0}))
      .filter(s=>s.matches>=2);
    const nem=[...list].sort((a,b)=>a.winRate-b.winRate||b.matches-a.matches)[0]||null;
    const fav=[...list].sort((a,b)=>b.winRate-a.winRate||b.matches-a.matches)[0]||null;
    return {nemesis:nem, favoriteVictim:fav};
  },[myMatchesAsc,player.name]);

  // Phong độ gần đây: so tỷ lệ thắng 5 trận gần nhất với tỷ lệ thắng chung
  const recentForm=useMemo(()=>{
    const last5=myMatchesAsc.slice(-5);
    if(last5.length===0) return null;
    const seq=last5.map(m=>{
      const inT1=(m.team1Players||(m.myTeam?[m.myTeam]:[])).includes(player.name);
      return (inT1?m.result==='W':m.result==='L')?'W':'L';
    });
    const recentWins=seq.filter(r=>r==='W').length;
    const recentWr=Math.round(recentWins/seq.length*100);
    return {seq, recentWins, recentLosses:seq.length-recentWins, recentWr, count:seq.length};
  },[myMatchesAsc,player.name]);

  // Chuỗi thắng/thua hiện tại (≥2)
  const matchStreak=useMemo(()=>{
    if(!myMatchesAsc.length) return null;
    const recent=[...myMatchesAsc].reverse();
    const getR=m=>{const inT1=(m.team1Players||(m.myTeam?[m.myTeam]:[])).includes(player.name);return(inT1?m.result==='W':m.result==='L')?'W':'L';};
    const first=getR(recent[0]);
    let count=0;
    for(const m of recent){if(getR(m)===first)count++;else break;}
    return count>=2?{type:first,count}:null;
  },[myMatchesAsc,player.name]);

  // Chuỗi tham dự buổi tập + tổng số buổi đã đến
  const mySessionStreak=useMemo(()=>{
    if(!sessions||!sessions.length) return 0;
    return computeSessionStreaks([player],sessions)[player.name]||0;
  },[player,sessions]);
  const sessionsAttended=useMemo(()=>{
    if(!sessions) return null;
    return sessions.filter(s=>s.attendees&&s.attendees[player.name]===true).length;
  },[sessions,player.name]);

  // Số trận Ngôi sao hy vọng đã chơi
  const starMatchCount=useMemo(()=>myMatchesAsc.filter(m=>m.isStar).length,[myMatchesAsc]);

  // Đồng đội (đánh đôi cùng đội, tối thiểu 2 trận chung) — dùng để xếp
  // "Quý Nhân Phù Trợ" (thắng cao) và "Vận Rủi Đồng Hành" (thua nhiều)
  const teammateStats=useMemo(()=>{
    const map={};
    myMatchesAsc.forEach(m=>{
      const team1=m.team1Players||(m.myTeam?[m.myTeam]:[]);
      const team2=m.team2Players||(m.oppTeam?[m.oppTeam]:[]);
      const inT1=team1.includes(player.name);
      const myTeam=inT1?team1:team2;
      const won=inT1?m.result==='W':m.result==='L';
      myTeam.forEach(mateName=>{
        if(!mateName||mateName===player.name) return;
        if(!map[mateName]) map[mateName]={name:mateName,matches:0,wins:0,losses:0};
        map[mateName].matches++;
        if(won) map[mateName].wins++; else map[mateName].losses++;
      });
    });
    return Object.values(map)
      .map(s=>({...s,winRate:s.matches?Math.round(s.wins/s.matches*100):0}))
      .filter(s=>s.matches>=2);
  },[myMatchesAsc,player.name]);

  const teammateBest=useMemo(()=>
    [...teammateStats].sort((a,b)=>b.winRate-a.winRate||b.matches-a.matches).slice(0,5),
  [teammateStats]);
  const teammateWorst=useMemo(()=>
    [...teammateStats].sort((a,b)=>a.winRate-b.winRate||b.matches-a.matches).slice(0,5),
  [teammateStats]);

  // Tổng điểm ELO cộng/trừ trong khoảng đang lọc
  const netElo=filteredMatches.reduce((sum,m)=>{
    const ch=(m.eloChanges||[]).find(e=>e.name===player.name);
    return sum+(ch?ch.delta:0);
  },0);

  return (
    <div>
      <button onClick={onBack} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--text)',padding:'7px 14px',fontSize:'12px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif',marginBottom:'16px',display:'flex',alignItems:'center',gap:'5px'}}>← Quay lại BXH</button>

      <div style={{display:'flex',alignItems:'center',gap:'16px',marginBottom:'18px',flexWrap:'wrap'}}>
        <div style={{position:'relative',flexShrink:0}}>
          <div
            className="av"
            onClick={()=>player.avatar&&setShowFullAvatar(true)}
            style={{
              width:96,height:96,borderRadius:'50%',
              background:player.avatar?'transparent':player.color+'22',
              color:player.color,overflow:'hidden',
              display:'flex',alignItems:'center',justifyContent:'center',
              fontSize:'28px',fontWeight:700,
              cursor:player.avatar?'zoom-in':'default'
            }}
            title={player.avatar?'Xem ảnh cỡ lớn':''}
          >
            {player.avatar
              ? <img src={player.avatar} alt={player.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              : initials(player.name)}
          </div>
          {onUpdateAvatar && (
            <>
              <button onClick={()=>avatarInputRef.current?.click()} title="Đổi ảnh đại diện"
                style={{position:'absolute',bottom:0,right:0,width:'30px',height:'30px',borderRadius:'50%',background:'var(--green)',border:'2px solid var(--surface)',color:'#fff',fontSize:'13px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>📷</button>
              <input ref={avatarInputRef} type="file" accept="image/*" onChange={handleAvatarFile} style={{display:'none'}}/>
            </>
          )}
        </div>
        <div style={{minWidth:0}}>
          <div style={{fontFamily:'Quicksand,sans-serif',fontWeight:700,fontSize:'21px'}}>{player.name}</div>
          <div style={{display:'flex',alignItems:'center',gap:'6px',marginTop:'4px',flexWrap:'wrap'}}>
            <span style={{fontSize:'11px',padding:'2px 9px',borderRadius:'20px',background:tier.bg,color:tier.color,fontWeight:700}}>{tier.icon} {tier.label}</span>
            <span style={{fontSize:'14px',color:'var(--muted)'}}>Công Đức {player.elo}</span>
            {mySessionStreak>=2&&<span style={{fontSize:'11px',padding:'2px 9px',borderRadius:'20px',background:'rgba(251,146,60,.15)',color:'var(--orange)',fontWeight:700}}>🔥 {mySessionStreak} buổi liên tiếp</span>}
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'12px',marginTop:'5px',flexWrap:'wrap'}}>
            {sessionsAttended!==null&&<span style={{fontSize:'11px',color:'var(--muted)'}}>🏸 {sessionsAttended} buổi tham dự</span>}
            {starMatchCount>0&&<span style={{fontSize:'11px',color:'#fbbf24',fontWeight:600}}>⭐ {starMatchCount} trận sao</span>}
          </div>
          {onUpdateAvatar && <div style={{fontSize:'11px',color:'var(--muted)',marginTop:'6px'}}>Bấm biểu tượng 📷 để đổi ảnh · bấm vào ảnh để xem cỡ lớn</div>}
        </div>
      </div>

      {showFullAvatar && player.avatar && (
        <div className="overlay" onClick={()=>setShowFullAvatar(false)}>
          <div onClick={e=>e.stopPropagation()} style={{maxWidth:'min(90vw,420px)',width:'100%'}}>
            <img src={player.avatar} alt={player.name} style={{width:'100%',borderRadius:'16px',display:'block'}}/>
            <button onClick={()=>setShowFullAvatar(false)} style={{width:'100%',marginTop:'10px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'10px',padding:'10px',fontSize:'13px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif',color:'var(--text)'}}>Đóng</button>
          </div>
        </div>
      )}
      {cropSrc && (
        <CropModal
          src={cropSrc}
          aspect={1}
          round={true}
          onDone={dataUrl=>{ onUpdateAvatar(player.id, dataUrl); setCropSrc(null); }}
          onClose={()=>setCropSrc(null)}
        />
      )}

      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:statsMismatch?'8px':'18px'}}>
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'10px',padding:'12px',textAlign:'center'}}>
          <div style={{fontSize:'10px',color:'var(--muted)',textTransform:'uppercase'}}>Thắng</div>
          <div style={{fontFamily:'Quicksand',fontWeight:700,fontSize:'19px',color:'var(--green)'}}>{realWins}</div>
        </div>
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'10px',padding:'12px',textAlign:'center'}}>
          <div style={{fontSize:'10px',color:'var(--muted)',textTransform:'uppercase'}}>Thua</div>
          <div style={{fontFamily:'Quicksand',fontWeight:700,fontSize:'19px',color:'var(--red)'}}>{realLosses}</div>
        </div>
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'10px',padding:'12px',textAlign:'center'}}>
          <div style={{fontSize:'10px',color:'var(--muted)',textTransform:'uppercase'}}>Tỷ lệ thắng</div>
          <div style={{fontFamily:'Quicksand',fontWeight:700,fontSize:'19px'}}>{wr}%</div>
        </div>
      </div>

      {(recentForm||matchStreak)&&(
        <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'12px',alignItems:'stretch'}}>
          {recentForm&&(
            <div style={{display:'flex',alignItems:'center',gap:'8px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'10px',padding:'8px 12px',flex:'1 1 auto'}}>
              <span style={{fontSize:'11px',color:'var(--muted)',fontWeight:600,whiteSpace:'nowrap'}}>Phong độ:</span>
              <div style={{display:'flex',gap:'3px'}}>
                {recentForm.seq.map((r,i)=>(
                  <div key={i} style={{width:22,height:22,borderRadius:'50%',background:r==='W'?'var(--green)':'var(--red)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'9px',fontWeight:800,color:'#fff'}}>{r}</div>
                ))}
              </div>
              <span style={{fontSize:'10px',color:'var(--muted)',marginLeft:'2px'}}>{recentForm.recentWins}/{recentForm.count}</span>
            </div>
          )}
          {matchStreak&&(
            <div style={{background:matchStreak.type==='W'?'rgba(34,197,94,.1)':'rgba(239,68,68,.1)',border:`1px solid ${matchStreak.type==='W'?'rgba(34,197,94,.4)':'rgba(239,68,68,.4)'}`,borderRadius:'10px',padding:'8px 14px',display:'flex',alignItems:'center',gap:'6px',whiteSpace:'nowrap',flexShrink:0}}>
              <span style={{fontSize:'15px'}}>{matchStreak.type==='W'?'🔥':'🧊'}</span>
              <div>
                <div style={{fontSize:'12px',fontWeight:700,color:matchStreak.type==='W'?'var(--green)':'var(--red)'}}>Chuỗi {matchStreak.type==='W'?'thắng':'thua'} ×{matchStreak.count}</div>
                <div style={{fontSize:'9px',color:'var(--muted)'}}>trận gần nhất</div>
              </div>
            </div>
          )}
        </div>
      )}

      {statsMismatch && (
        <div style={{background:'var(--red-bg)',border:'1px solid var(--red)',borderRadius:'10px',padding:'10px 12px',marginBottom:'18px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'10px',flexWrap:'wrap'}}>
          <div style={{fontSize:'11px',color:'var(--red)',flex:'1 1 200px'}}>
            ⚠️ Số liệu thắng/thua đã lưu ({player.wins}T/{player.losses}B) đang lệch so với lịch sử trận thật ({realWins}T/{realLosses}B). Bấm để đồng bộ lại cho đúng.
          </div>
          {onResyncStats && (
            <button onClick={()=>onResyncStats(player.id,realWins,realLosses)} style={{background:'var(--red)',border:'none',borderRadius:'8px',color:'#fff',padding:'7px 14px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif',whiteSpace:'nowrap'}}>🔧 Đồng bộ lại số liệu</button>
          )}
        </div>
      )}

      {myBadges.length>0 && (
        <>
          <div className="fun-section-title" style={{fontSize:'14px'}}>🏅 Huy hiệu đang giữ</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'8px',marginBottom:'18px'}}>
            {myBadges.map(b=>(
              <span key={b.id} title={b.desc} style={{fontSize:'12px',padding:'5px 10px',borderRadius:'20px',background:b.color+'22',color:b.color,fontWeight:600}}>{b.emoji} {b.title}</span>
            ))}
          </div>
        </>
      )}

      {(nemesis||favoriteVictim)&&(
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'18px'}}>
          {nemesis&&(()=>{
            const np=players.find(pp=>pp.name===nemesis.name);
            const clickable=!!(np&&onViewHistory);
            return (
              <div onClick={()=>clickable&&onViewHistory(np)}
                style={{background:'rgba(239,68,68,.07)',border:'1px solid rgba(239,68,68,.22)',borderRadius:'12px',padding:'10px 12px',cursor:clickable?'pointer':'default'}}>
                <div style={{fontSize:'10px',color:'var(--red)',fontWeight:700,marginBottom:'6px'}}>⚔️ KÌNH ĐỊCH</div>
                <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                  {np?<PlayerAvatar player={np} size={28}/>:<div style={{width:28,height:28,borderRadius:'50%',background:'var(--surface2)',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'10px',fontWeight:700,color:'var(--muted)'}}>{initials(nemesis.name)}</div>}
                  <div style={{minWidth:0}}>
                    <div style={{fontSize:'13px',fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{nemesis.name.split(' ').slice(-2).join(' ')}</div>
                    <div style={{fontSize:'10px',color:'var(--muted)',marginTop:'1px'}}><span style={{color:'var(--green)'}}>{nemesis.wins}W</span>–<span style={{color:'var(--red)'}}>{nemesis.losses}L</span> · {nemesis.winRate}% thắng</div>
                  </div>
                </div>
              </div>
            );
          })()}
          {favoriteVictim&&favoriteVictim.name!==nemesis?.name&&(()=>{
            const fp=players.find(pp=>pp.name===favoriteVictim.name);
            const clickable=!!(fp&&onViewHistory);
            return (
              <div onClick={()=>clickable&&onViewHistory(fp)}
                style={{background:'rgba(34,197,94,.07)',border:'1px solid rgba(34,197,94,.22)',borderRadius:'12px',padding:'10px 12px',cursor:clickable?'pointer':'default'}}>
                <div style={{fontSize:'10px',color:'var(--green)',fontWeight:700,marginBottom:'6px'}}>🏆 KHẮC CHẾ</div>
                <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                  {fp?<PlayerAvatar player={fp} size={28}/>:<div style={{width:28,height:28,borderRadius:'50%',background:'var(--surface2)',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'10px',fontWeight:700,color:'var(--muted)'}}>{initials(favoriteVictim.name)}</div>}
                  <div style={{minWidth:0}}>
                    <div style={{fontSize:'13px',fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{favoriteVictim.name.split(' ').slice(-2).join(' ')}</div>
                    <div style={{fontSize:'10px',color:'var(--muted)',marginTop:'1px'}}><span style={{color:'var(--green)'}}>{favoriteVictim.wins}W</span>–<span style={{color:'var(--red)'}}>{favoriteVictim.losses}L</span> · {favoriteVictim.winRate}% thắng</div>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      )}

      {(opponentStats.length>0 || teammateStats.length>0) && (() => {
        const DUYEN_TABS=[
          {id:'opp',   emoji:'🤺', label:'Đối thủ hay gặp nhất',  list:opponentStats, empty:'Chưa đủ dữ liệu đối đầu.'},
          {id:'best',  emoji:'🧧', label:'Quý Nhân Phù Trợ',      list:teammateBest,  empty:'Chưa có đồng đội nào đánh chung ≥2 trận.'},
          {id:'worst', emoji:'🌧️', label:'Vận Rủi Đồng Hành',     list:teammateWorst, empty:'Chưa có đồng đội nào đánh chung ≥2 trận.'},
        ];
        const active=DUYEN_TABS.find(t=>t.id===duyenTab)||DUYEN_TABS[0];
        return (
          <>
            <div style={{display:'flex',gap:'4px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'10px',padding:'4px',marginBottom:'10px',overflowX:'auto'}}>
              {DUYEN_TABS.map(t=>(
                <button key={t.id} onClick={()=>setDuyenTab(t.id)}
                  style={{flex:'1 1 auto',whiteSpace:'nowrap',padding:'6px 10px',borderRadius:'7px',border:'none',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontSize:'11px',fontWeight:700,background:duyenTab===t.id?'var(--purple)':'transparent',color:duyenTab===t.id?'#fff':'var(--muted)'}}>
                  {t.emoji} {t.label}
                </button>
              ))}
            </div>
            <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',padding:active.list.length?'6px 14px':'20px',marginBottom:'20px'}}>
              {active.list.length===0 ? (
                <div style={{textAlign:'center',color:'var(--muted)',fontSize:'12px'}}>{active.empty}</div>
              ) : active.list.map((o,i)=>{
                const oppPlayer=players.find(pp=>pp.name===o.name);
                const clickable=!!(oppPlayer&&onViewHistory);
                return (
                  <div key={o.name}
                    onClick={()=>clickable&&onViewHistory(oppPlayer)}
                    title={clickable?`Xem lịch sử của ${o.name}`:''}
                    style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px 0',borderTop:i>0?'1px solid var(--border)':'none',cursor:clickable?'pointer':'default'}}>
                    {oppPlayer
                      ? <PlayerAvatar player={oppPlayer} size={32}/>
                      : <div style={{width:32,height:32,borderRadius:'50%',background:'var(--surface2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',fontWeight:700,color:'var(--muted)',flexShrink:0}}>{initials(o.name)}</div>}
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:'13px',fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',color:clickable?'var(--text)':'inherit'}}>{o.name}</div>
                      <div style={{display:'flex',alignItems:'center',gap:'6px',marginTop:'3px'}}>
                        <div style={{flex:1,height:'4px',background:'var(--bg3)',borderRadius:'2px',overflow:'hidden',maxWidth:'120px'}}>
                          <div style={{width:o.winRate+'%',height:'100%',background:o.winRate>=50?'var(--green)':'var(--red)'}}/>
                        </div>
                        <span style={{fontSize:'10px',color:'var(--muted)'}}>{o.matches} trận</span>
                      </div>
                    </div>
                    <div style={{textAlign:'right',flexShrink:0}}>
                      <div style={{fontSize:'13px',fontWeight:700}}>
                        <span style={{color:'var(--green)'}}>{o.wins}W</span>
                        <span style={{color:'var(--muted)'}}> - </span>
                        <span style={{color:'var(--red)'}}>{o.losses}L</span>
                      </div>
                      <div style={{fontSize:'10px',color:'var(--muted)'}}>{o.winRate}% thắng</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        );
      })()}

      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',padding:'16px',marginBottom:'20px'}}>
        <div className="section-title" style={{fontSize:'15px',marginBottom:'12px'}}>📈 Biểu đồ Công Đức</div>
        {history.length<=1 ? (
          <div style={{textAlign:'center',padding:'32px',color:'var(--muted)',fontSize:'13px'}}>Chưa có đủ dữ liệu trận đấu.</div>
        ) : (
          <>
            <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible'}}>
              {[0,.25,.5,.75,1].map(t=>{
                const y=PAD+(1-t)*(H-PAD*2);
                const v=Math.round(minE+(maxE-minE)*t);
                return <g key={t}>
                  <line x1={PAD} y1={y} x2={W-PAD} y2={y} stroke="var(--border)" strokeWidth="0.5" strokeDasharray="3"/>
                  <text x={PAD-4} y={y+4} textAnchor="end" fontSize="9" fill="var(--muted)">{v}</text>
                </g>;
              })}
              <path d={pathD} fill="none" stroke={player.color||'var(--green)'} strokeWidth="2" strokeLinejoin="round"/>
              <path d={pathD+` L${xScale(history.length-1)},${H-PAD} L${PAD},${H-PAD} Z`} fill={player.color||'var(--green)'} opacity="0.08"/>
              {history.map((h,i)=>(
                <circle key={i} cx={xScale(i)} cy={yScale(h.elo)} r="3" fill={h.delta>0?'var(--green)':h.delta<0?'var(--red)':(player.color||'var(--muted)')} stroke="var(--bg)" strokeWidth="1.5"/>
              ))}
            </svg>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'4px',fontSize:'11px',color:'var(--muted)',padding:`0 ${PAD}px`}}>
              <span>{history[0]?.date}</span>
              <span style={{fontFamily:'Quicksand',fontSize:'14px',fontWeight:700,color:player.elo>=1500?'var(--green)':'var(--red)'}}>Công Đức hiện tại: {player.elo}</span>
              <span>{history[history.length-1]?.date}</span>
            </div>
          </>
        )}
      </div>

      {/* Bộ lọc lịch sử trận */}
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'12px 14px',marginBottom:'14px'}}>
        <div style={{fontSize:'11px',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.6px',marginBottom:'10px'}}>🔍 Lọc trận</div>
        <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
          <div style={{flex:'1 1 130px'}}>
            <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'5px'}}>Loại trận</div>
            <select className="fi" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
              {['Tất cả','Đơn','Đôi'].map(t=><option key={t}>{t}</option>)}
            </select>
          </div>
          <div style={{flex:'1 1 130px'}}>
            <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'5px'}}>Theo tháng</div>
            <select className="fi" value={monthFilter} onChange={e=>setMonthFilter(e.target.value)}>
              {months.map(m=><option key={m}>{m}</option>)}
            </select>
          </div>
        </div>
      </div>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px',flexWrap:'wrap',gap:'6px'}}>
        <span style={{fontSize:'13px',color:'var(--muted)'}}>{filteredMatches.length} trận · {fWins}W {fLosses}L</span>
        {filteredMatches.length>0 && (
          <span style={{fontSize:'13px',fontWeight:700,color:netElo>0?'var(--green)':netElo<0?'var(--red)':'var(--muted)'}}>
            Tổng Công Đức: {netElo>0?'+':''}{netElo}
          </span>
        )}
      </div>

      {filteredMatches.length===0 ? (
        <div style={{textAlign:'center',padding:'40px',color:'var(--muted)',background:'var(--surface)',borderRadius:'14px',border:'1px solid var(--border)'}}>
          <div style={{fontSize:'32px',marginBottom:'8px'}}>🏓</div>
          <div>Chưa có trận nào phù hợp bộ lọc.</div>
        </div>
      ) : (
        <MatchList matches={filteredMatches} showDel={!!(onEditMatch&&onDeleteMatch)} onDelete={onDeleteMatch} players={players} onEdit={m=>setEditMatch(m)} perspective={player.name}/>
      )}
      {editMatch&&<EditMatchModal match={editMatch} players={players} onClose={()=>setEditMatch(null)} onSave={m=>{onEditMatch&&onEditMatch(m);setEditMatch(null);}}/>}
    </div>
  );
}

/* ─── SHARE SESSION MODAL ─────────────────────────────────── */
function ShareSessionModal({matches, players, onClose}){
  const [copied, setCopied] = useState(false);

  // Lấy ngày hôm nay dạng DD/MM/YYYY và YYYY-MM-DD
  const todayStr = useMemo(()=>{
    const d = new Date();
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  },[]);
  const todayISO = useMemo(()=>{
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  },[]);

  // Lọc trận hôm nay — hỗ trợ cả DD/MM, DD/MM/YYYY (trận thường) lẫn YYYY-MM-DD (giải đấu)
  const todayMatches = useMemo(()=>
    matches.filter(m=>m.date===todayStr||m.date===todayStr.slice(0,5)||m.date===todayISO)
  ,[matches, todayStr, todayISO]);

  // Tổng hợp ELO thay đổi hôm nay theo từng người
  const eloSummary = useMemo(()=>{
    const map = {};
    todayMatches.forEach(m=>{
      (m.eloChanges||[]).forEach(({name,delta})=>{
        if(!map[name]) map[name]={name,total:0,wins:0,losses:0};
        map[name].total += delta;
        if(delta>0) map[name].wins++;
        else map[name].losses++;
      });
    });
    return Object.values(map).sort((a,b)=>b.total-a.total);
  },[todayMatches]);

  // Top người chơi trong buổi hôm nay (chỉ lấy người đã đánh)
  const top5 = useMemo(()=>{
    const names = new Set(eloSummary.map(e=>e.name));
    return [...players].filter(p=>names.has(p.name)).sort((a,b)=>b.elo-a.elo).slice(0,5);
  },[players, eloSummary]);

  // Top 5 BXH tổng (không giới hạn hôm nay)
  const top5Overall = useMemo(()=>[...players].sort((a,b)=>b.elo-a.elo).slice(0,5),[players]);

  // Bình luận vui tự động
  const funComments = useMemo(()=>{
    if(eloSummary.length===0) return [];
    const lines=[];
    const mvp = eloSummary[0];
    const loser = eloSummary[eloSummary.length-1];
    const mvpElo = players.find(x=>x.name===mvp.name)?.elo||1500;
    const loserElo = players.find(x=>x.name===loser.name)?.elo||1500;
    const mvpPhrases=[
      `${mvp.name} hôm nay đánh như "pro gamer" vậy 🔥`,
      `${mvp.name} lại thống trị rồi, ai mà cản được! 🏆`,
      `${mvp.name} hôm nay ăn sóng không đọ được 💪`,
      `${mvp.name} vô địch buổi hôm nay, mời trà đi! ☕`,
    ];
    const loserPhrases=[
      `${loser.name} hôm nay gặp vận đen nhỉ, buổi sau gỡ thôi! 😅`,
      `Chúc ${loser.name} buổi sau đánh hay hơn nhé 🙏`,
      `${loser.name} ráng lên! Thắng lại được mà 💪`,
      `${loser.name} hôm nay xui xui xíu, ngày mai sẽ khác! 🌟`,
    ];
    if(mvp.total>0) lines.push('🌟 '+mvpPhrases[mvpElo%mvpPhrases.length]);
    if(loser.total<0&&loser.name!==mvp.name) lines.push('💙 '+loserPhrases[loserElo%loserPhrases.length]);
    // Extra fun comments based on total matches
    if(todayMatches.length>=10) lines.push(`🎉 Trận đấu nhiệt tình thế! ${todayMatches.length} trận 1 buổi, siêu chăm!`);
    if(eloSummary.length>=6) lines.push(`👥 Hôm nay ${eloSummary.length} người góp mặt, đông vui ghê!`);
    return lines;
  },[eloSummary, todayMatches, players]);

  // Tạo text chia sẻ Zalo
  const shareText = useMemo(()=>{
    if(todayMatches.length===0) return '';
    const date = todayStr;
    const lines = [
      `🏓 KẾT QUẢ PHÔNG BẠT — ${date}`,
      `━━━━━━━━━━━━━━━━━━━━`,
      `📊 ${todayMatches.length} trận | ${eloSummary.length} người tham gia`,
      ``,
      `📈 THAY ĐỔI CÔNG ĐỨC:`,
      ...eloSummary.map(p=>{
        const arrow = p.total>0?'▲':'▼';
        const sign = p.total>0?'+':'';
        const elo = players.find(x=>x.name===p.name)?.elo||1500;
        return `${arrow} ${p.name}: ${sign}${p.total} (${elo} CĐ)`;
      }),
      ``,
      `🏆 TOP 5 BẢNG CÔNG ĐỨC:`,
      ...top5Overall.map((p,i)=>`${['🥇','🥈','🥉','4️⃣','5️⃣'][i]} ${p.name}: ${p.elo} CĐ`),
    ];
    if(funComments.length>0){
      lines.push(``);
      lines.push(`💬 BÌNH LUẬN:`);
      funComments.forEach(c=>lines.push(c));
    }
    lines.push(``);
    lines.push(`🔗 Xem chi tiết: phongbat.vercel.app`);
    return lines.join('\n');
  },[todayMatches, eloSummary, top5Overall, funComments, todayStr, players]);

  const copyText = ()=>{
    navigator.clipboard.writeText(shareText).then(()=>{
      setCopied(true);
      setTimeout(()=>setCopied(false), 3000);
    }).catch(()=>{
      const el = document.createElement('textarea');
      el.value = shareText;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      setCopied(true);
      setTimeout(()=>setCopied(false), 3000);
    });
  };

  const hasData = todayMatches.length > 0;

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:480}}>
        <div className="modal-head">
          <div className="modal-title">📤 Chia sẻ kết quả hôm nay</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>

        {!hasData ? (
          <div style={{textAlign:'center',padding:'32px 0',color:'var(--muted)'}}>
            <div style={{fontSize:'32px',marginBottom:'12px'}}>📭</div>
            <div style={{fontWeight:700}}>Chưa có trận nào hôm nay</div>
            <div style={{fontSize:'13px',marginTop:'6px'}}>Ghi trận xong rồi chia sẻ nhé!</div>
          </div>
        ) : (<>
          {/* Preview card */}
          <div style={{background:'var(--surface)',borderRadius:'14px',padding:'16px',marginBottom:'16px',fontFamily:'monospace',fontSize:'13px',lineHeight:'1.7',whiteSpace:'pre-wrap',maxHeight:'280px',overflowY:'auto',color:'var(--text)'}}>
            {shareText}
          </div>

          {/* ELO changes visual */}
          <div style={{marginBottom:'16px'}}>
            <div style={{fontSize:'11px',color:'var(--muted)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.6px',marginBottom:'10px'}}>Thay đổi Công Đức</div>
            {eloSummary.map(p=>{
              const gain = p.total > 0;
              const elo = players.find(x=>x.name===p.name)?.elo||1500;
              const pct = Math.min(100, Math.abs(p.total)/32*100);
              return (
                <div key={p.name} style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'8px'}}>
                  <div style={{width:'110px',fontSize:'13px',fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{p.name}</div>
                  <div style={{flex:1,background:'var(--border)',borderRadius:'99px',height:'8px',overflow:'hidden'}}>
                    <div style={{height:'8px',borderRadius:'99px',width:`${pct}%`,background:gain?'var(--green)':'var(--red)',transition:'width .4s'}}/>
                  </div>
                  <div style={{width:'70px',textAlign:'right',fontSize:'13px',fontWeight:800,color:gain?'var(--green)':'var(--red)',fontVariantNumeric:'tabular-nums'}}>
                    {gain?'+':''}{p.total} ({elo})
                  </div>
                </div>
              );
            })}
          </div>

          <div className="form-actions">
            <button className="btn-cancel" onClick={onClose}>Đóng</button>
            <button className="btn-save" onClick={copyText} style={{background:copied?'var(--green2)':'var(--green)',minWidth:'160px'}}>
              {copied ? '✅ Đã copy! Paste vào Zalo' : '📋 Copy chia sẻ Zalo'}
            </button>
          </div>
        </>)}
      </div>
    </div>
  );
}

/* ─── MATCHES TAB ─────────────────────────────────────────── */
function MatchesTab({matches,players,myElo,onAdd,onDelete,onEditMatch}){
  const [typeFilter,setTypeFilter]=useState('Tất cả');
  const [monthFilter,setMonthFilter]=useState('Tất cả');
  const [playerFilter,setPlayerFilter]=useState('Tất cả');
  const [editMatch,setEditMatch]=useState(null);
  const [showShare,setShowShare]=useState(false);

  // extract unique months from match dates (DD/MM or DD-MM)
  const months=useMemo(()=>{
    const s=new Set();
    matches.forEach(m=>{
      const parts=m.date.split(/[\/\-]/);
      if(parts.length>=2) s.add(parts[1]);
    });
    return ['Tất cả',...[...s].sort((a,b)=>parseInt(a)-parseInt(b)).map(m=>`Tháng ${m}`)];
  },[matches]);

  const playerNames=['Tất cả',...players.map(p=>p.name)];

  const filtered=useMemo(()=>{
    return matches.filter(m=>{
      if(typeFilter!=='Tất cả'&&m.type!==typeFilter) return false;
      if(monthFilter!=='Tất cả'){
        const mon=monthFilter.replace('Tháng ','');
        const parts=m.date.split(/[\/\-]/);
        if(parts.length<2||parts[1]!==mon) return false;
      }
      if(playerFilter!=='Tất cả'){
        const all=[...(m.team1Players||[]),...(m.team2Players||[])];
        if(!all.includes(playerFilter)) return false;
      }
      return true;
    });
  },[matches,typeFilter,monthFilter,playerFilter]);

  // Khi có lọc theo người: tính W/L theo đúng góc nhìn của người đó
  // (m.result luôn theo Đội A, nên nếu người này ở Đội B thì phải đảo lại).
  const wins = playerFilter!=='Tất cả'
    ? filtered.filter(m=>{
        const inT1 = (m.team1Players||[]).includes(playerFilter);
        return inT1 ? m.result==='W' : m.result==='L';
      }).length
    : filtered.filter(m=>m.result==='W').length;
  const losses = filtered.length - wins;
  const winRate = filtered.length ? Math.round((wins/filtered.length)*100) : 0;

  return <>
    <div className="match-header">
      <div className="section-title">Lịch sử trận đấu</div>
      <div style={{display:'flex',gap:'6px'}}>
        <button onClick={()=>exportCSV(matches,players)} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--muted)',padding:'7px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>📥 Xuất CSV</button>
        <button onClick={()=>setShowShare(true)} style={{background:'rgba(99,102,241,.15)',border:'1px solid rgba(99,102,241,.4)',borderRadius:'8px',color:'#818cf8',padding:'7px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:700}}>📤 Chia sẻ</button>
        <button className="btn-ghi" onClick={onAdd}>+ Ghi trận</button>
      </div>
    </div>
    {showShare && <ShareSessionModal matches={matches} players={players} onClose={()=>setShowShare(false)}/>}
    <EloCard myElo={myElo}/>

    {/* Filters */}
    <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'12px 14px',marginBottom:'14px'}}>
      <div style={{fontSize:'11px',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.6px',marginBottom:'10px'}}>🔍 Lọc trận</div>
      <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
        <div style={{flex:'1 1 130px'}}>
          <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'5px'}}>Loại trận</div>
          <select className="fi" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
            {['Tất cả','Đơn','Đôi'].map(t=><option key={t}>{t}</option>)}
          </select>
        </div>
        <div style={{flex:'1 1 130px'}}>
          <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'5px'}}>Theo tháng</div>
          <select className="fi" value={monthFilter} onChange={e=>setMonthFilter(e.target.value)}>
            {months.map(m=><option key={m}>{m}</option>)}
          </select>
        </div>
        <div style={{flex:'1 1 130px'}}>
          <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'5px'}}>Theo người</div>
          <select className="fi" value={playerFilter} onChange={e=>setPlayerFilter(e.target.value)}>
            {playerNames.map(n=><option key={n}>{n}</option>)}
          </select>
        </div>
      </div>
    </div>

    {playerFilter!=='Tất cả' && filtered.length>0 && (
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'14px 16px',marginBottom:'14px',display:'flex',alignItems:'center',gap:'16px'}}>
        <div style={{position:'relative',width:'56px',height:'56px',flexShrink:0}}>
          <svg width="56" height="56" viewBox="0 0 56 56" style={{transform:'rotate(-90deg)'}}>
            <circle cx="28" cy="28" r="24" fill="none" stroke="var(--border)" strokeWidth="6"/>

/* ─── MEMBERS TAB ────────────────────────────────────────── */
function MembersTab({players,members,matches,sessions,isAdmin,onAddPlayer,onDeletePlayer,onRenamePlayer,onUpdateElo,onViewHistory,showToast}){

  const [addName,setAddName]=useState('');
  const [addElo,setAddElo]=useState('1500');
  const [showAdd,setShowAdd]=useState(false);

  const [renameVal,setRenameVal]=useState('');

  const [editEloVal,setEditEloVal]=useState('');
  const [confirmDelId,setConfirmDelId]=useState(null);
  const [sortBy,setSortBy]=useState('elo'); // elo | name | matches | winrate

  const sorted=useMemo(()=>{
    let list=[...players];
    const q=search.trim().toLowerCase();
    if(q) list=list.filter(p=>p.name.toLowerCase().includes(q));
    if(sortBy==='elo') list.sort((a,b)=>b.elo-a.elo);
    else if(sortBy==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'vi'));
    else if(sortBy==='matches') list.sort((a,b)=>(b.wins+b.losses)-(a.wins+a.losses));
    else if(sortBy==='winrate'){
      list.sort((a,b)=>{
        const ra=a.wins+a.losses>0?a.wins/(a.wins+a.losses):0;
        const rb=b.wins+b.losses>0?b.wins/(b.wins+b.losses):0;
        return rb-ra;
      });
    }
    return list;
  },[players,search,sortBy]);

  const totalMatches=p=>p.wins+p.losses;
  const winRate=p=>totalMatches(p)>0?Math.round(p.wins/totalMatches(p)*100):0;

    const ms=matches.filter(m=>(m.team1Players||[]).includes(p.name)||(m.team2Players||[]).includes(p.name));
