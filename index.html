            </div>
            {analysis.h2h.length>0&&<span style={{fontSize:'11px',color:'var(--purple)',fontWeight:600}}>{h2hExpanded?'▲ Thu gọn':'▼ Xem chi tiết'}</span>}
          </div>

          {/* Score summary */}
          {analysis.h2h.length>0&&mode==='don'&&(
            <div style={{display:'flex',gap:'8px',alignItems:'center',padding:'0 16px 13px'}}>
              <div style={{flex:1,textAlign:'center',background:'var(--green-bg)',borderRadius:'10px',padding:'10px'}}>
                <div style={{fontSize:'11px',color:'var(--green)',fontWeight:600,marginBottom:'2px'}}>{analysis.pa.name}</div>
                <div style={{fontFamily:'Quicksand,sans-serif',fontSize:'24px',fontWeight:800,color:'var(--green)'}}>{analysis.wA}</div>
              </div>
              <div style={{fontSize:'13px',color:'var(--muted)',fontWeight:700}}>VS</div>
              <div style={{flex:1,textAlign:'center',background:'var(--red-bg)',borderRadius:'10px',padding:'10px'}}>
                <div style={{fontSize:'11px',color:'var(--red)',fontWeight:600,marginBottom:'2px'}}>{analysis.pb.name}</div>
                <div style={{fontFamily:'Quicksand,sans-serif',fontSize:'24px',fontWeight:800,color:'var(--red)'}}>{analysis.wB}</div>
              </div>
            </div>
          )}
          {analysis.h2h.length>0&&mode==='doi'&&(
            <div style={{display:'flex',gap:'8px',alignItems:'center',padding:'0 16px 13px'}}>
              <div style={{flex:1,textAlign:'center',background:'var(--green-bg)',borderRadius:'10px',padding:'10px'}}>
                <div style={{fontSize:'11px',color:'var(--green)',fontWeight:600,marginBottom:'2px'}}>{analysis.t1.map(p=>p.name).join(' & ')}</div>
                <div style={{fontFamily:'Quicksand,sans-serif',fontSize:'24px',fontWeight:800,color:'var(--green)'}}>
                  {analysis.h2h.filter(m=>{const inT1=(m.team1Players||[]).includes(d1a);return (inT1&&m.result==='W')||(!inT1&&m.result==='L');}).length}
                </div>
              </div>
              <div style={{fontSize:'13px',color:'var(--muted)',fontWeight:700}}>VS</div>
              <div style={{flex:1,textAlign:'center',background:'var(--red-bg)',borderRadius:'10px',padding:'10px'}}>
                <div style={{fontSize:'11px',color:'var(--red)',fontWeight:600,marginBottom:'2px'}}>{analysis.t2.map(p=>p.name).join(' & ')}</div>
                <div style={{fontFamily:'Quicksand,sans-serif',fontSize:'24px',fontWeight:800,color:'var(--red)'}}>
                  {analysis.h2h.filter(m=>{const inT1=(m.team1Players||[]).includes(d1a);return (!inT1&&m.result==='W')||(inT1&&m.result==='L');}).length}
                </div>
              </div>
            </div>
          )}

          {analysis.h2h.length===0&&(
            <div style={{textAlign:'center',padding:'14px',color:'var(--muted)',fontSize:'13px',borderTop:'1px solid var(--border)'}}>
              Chưa có lịch sử đối đầu giữa hai bên
            </div>
          )}

          {/* Chi tiết từng trận */}
          {h2hExpanded&&analysis.h2h.length>0&&(
            <div style={{borderTop:'1px solid var(--border)'}}>
              {analysis.h2h.map((m,i)=>{
                const refName=mode==='don'?pA:d1a;
                const inT1=(m.team1Players||[]).includes(refName);
                const myResult=inT1?m.result:(m.result==='W'?'L':'W');
                const myTeam=inT1?(m.team1Players||[]):(m.team2Players||[]);
                const oppTeam=inT1?(m.team2Players||[]):(m.team1Players||[]);
                return (
                  <div key={m.id||i} style={{padding:'11px 16px',borderBottom:i<analysis.h2h.length-1?'1px solid var(--border)':'none',display:'flex',alignItems:'center',gap:'10px'}}>
                    {/* W/L badge */}
                    <div style={{width:32,height:32,borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:800,flexShrink:0,
                      background:myResult==='W'?'var(--green-bg)':'var(--red-bg)',
                      color:myResult==='W'?'var(--green)':'var(--red)'}}>
                      {myResult}
                    </div>
                    {/* Teams */}
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:'13px',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                        {myTeam.join(' & ')} <span style={{color:'var(--muted)',fontWeight:400}}>vs</span> {oppTeam.join(' & ')}
                      </div>
                      <div style={{fontSize:'11px',color:'var(--muted)',marginTop:'2px',display:'flex',gap:'8px'}}>
                        <span>📅 {m.date}</span>
                        {m.type&&<span>· {m.type}</span>}
                      </div>
                    </div>
                    {/* Score */}
                    <div style={{textAlign:'right',flexShrink:0}}>
                      <div style={{fontFamily:'Quicksand,sans-serif',fontSize:'17px',fontWeight:700}}>{m.score||'—'}</div>
                      {m.eloChanges&&(()=>{
                        const myChange=m.eloChanges.find(e=>e.name===refName);
                        return myChange?<div style={{fontSize:'11px',fontWeight:600,color:myChange.delta>0?'var(--green)':'var(--red)'}}>{myChange.delta>0?'+':''}{myChange.delta} Công Đức</div>:null;
                      })()}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </>
    )}
    </>}
  </>;
}

/* ─── EDIT SESSION MODAL ─────────────────────────────────── */
function EditSessionModal({session,members,onClose,onSave}){
  const [date,setDate]=useState(session.date||'');
  // Buổi cũ chưa có chi tiết khoản chi -> đưa cả số tiền vào ô "Khác" để không mất
  // dữ liệu, người dùng có thể tách lại vào sân/cầu/nước nếu muốn.
  const hasBreakdown = !!(session.courtFee||session.shuttleFee||session.waterFee||session.otherFee);
  const [courtFee,setCourtFee]=useState(String(session.courtFee||''));
  const [shuttleFee,setShuttleFee]=useState(String(session.shuttleFee||''));
  const [waterFee,setWaterFee]=useState(String(session.waterFee||''));
  const [otherFee,setOtherFee]=useState(String(hasBreakdown?(session.otherFee||''):(session.total||'')));
  const feeTotal=(parseInt(courtFee)||0)+(parseInt(shuttleFee)||0)+(parseInt(waterFee)||0)+(parseInt(otherFee)||0);
  const [note,setNote]=useState(session.note||'');
  const [xeVeCount,setXeVeCount]=useState(String(session.xeVeCount||1));
  // attendees: copy from session, default all false if missing
  const initAtt=()=>{
    const obj={};
    members.forEach(m=>{ obj[m.name]=!!(session.attendees?.[m.name]); });
    return obj;
  };
  const [attendees,setAttendees]=useState(initAtt);
  const toggle=name=>setAttendees(p=>({...p,[name]:!p[name]}));
  // Ai uống nước — mặc định tất cả người tham dự đều uống (giữ đúng hành vi buổi cũ chưa có tính năng này)
  const [waterDrinkers,setWaterDrinkers]=useState(()=>{
    const obj={};
    members.forEach(m=>{ obj[m.name]= session.waterDrinkers ? !!session.waterDrinkers[m.name] : true; });
    return obj;
  });
  const toggleWater=name=>setWaterDrinkers(p=>({...p,[name]:!p[name]}));

  const attending=Object.entries(attendees).filter(([,v])=>v).map(([k])=>k);
  const xeVeOn=attending.includes('Xé Vé');
  const xeVeCnt=xeVeOn?Math.max(1,parseInt(xeVeCount)||1):0;
  const others=attending.filter(n=>n!=='Xé Vé').length;
  const shares=others+xeVeCnt;
  const perPerson=shares>0&&feeTotal>0?Math.round(feeTotal/shares):0;

  const save=()=>{
    if(!date||feeTotal<=0) return;
    const waterFeeNum=parseInt(waterFee)||0;
    let finalWaterDrinkers;
    if(waterFeeNum>0){
      finalWaterDrinkers={};
      attending.forEach(n=>{ finalWaterDrinkers[n]=!!waterDrinkers[n]; });
    }
    onSave({
      ...session,
      date,
      courtFee:parseInt(courtFee)||0,
      shuttleFee:parseInt(shuttleFee)||0,
      waterFee:waterFeeNum,
      otherFee:parseInt(otherFee)||0,
      total:feeTotal,
      note,
      attendees,
      players:attending.length,
      xeVeCount:xeVeOn?xeVeCnt:undefined,
      waterDrinkers:finalWaterDrinkers,
    });
  };

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:480}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">✏️ Sửa buổi chơi</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>

        <div className="fg" style={{marginBottom:'12px'}}>
          <label className="fl">📅 Ngày</label><DateInput value={date} onChange={setDate}/>
        </div>

        <div className="fg" style={{marginBottom:'6px'}}>
          <label className="fl">💰 Chi tiết khoản chi (VNĐ)</label>
        </div>
        <div className="form-grid" style={{marginBottom:'6px'}}>
          <div className="fg"><label className="fl">🎾 Tiền sân</label><MoneyInput value={courtFee} onChange={setCourtFee} placeholder="200,000"/></div>
          <div className="fg"><label className="fl">🏸 Tiền cầu/bóng</label><MoneyInput value={shuttleFee} onChange={setShuttleFee} placeholder="150,000"/></div>
          <div className="fg"><label className="fl">💧 Tiền nước</label><MoneyInput value={waterFee} onChange={setWaterFee} placeholder="30,000"/></div>
          <div className="fg"><label className="fl">🔖 Khác</label><MoneyInput value={otherFee} onChange={setOtherFee} placeholder="0"/></div>
        </div>
        <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'12px'}}>
          Tổng: <b style={{color:'var(--yellow)'}}>{fmt(feeTotal)}</b>
        </div>

        {/* Xé Vé count */}
        {xeVeOn&&(
          <div style={{background:'var(--bg3)',borderRadius:'10px',padding:'10px 12px',marginBottom:'10px',border:'1px solid var(--border)'}}>
            <div style={{fontSize:'12px',color:'var(--yellow)',fontWeight:600,marginBottom:'8px'}}>🎫 Xé vé tùy biến</div>
            <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
              <label className="fl" style={{whiteSpace:'nowrap'}}>Số người xé vé:</label>
              <input className="fi" type="number" min="1" value={xeVeCount} onChange={e=>setXeVeCount(e.target.value)} placeholder="2" style={{width:'70px',padding:'5px 8px',fontSize:'13px'}}/>
            </div>
          </div>
        )}

        {/* Attendees */}
        <div style={{marginBottom:'10px'}}>
          <div className="fl" style={{marginBottom:'6px'}}>Ai đi buổi này? ({attending.length} người)</div>
          {/* Quick-select bar */}
          <div style={{display:'flex',gap:'5px',marginBottom:'8px',flexWrap:'wrap'}}>
            <button type="button" onClick={()=>{const a={};members.forEach(m=>{a[m.name]=true;});setAttendees(a);}}
              style={{padding:'3px 10px',borderRadius:'20px',border:'1px solid var(--green)',background:'var(--green-bg)',color:'var(--green)',fontSize:'11px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✅ Tất cả</button>
            <button type="button" onClick={()=>{const a={};members.forEach(m=>{a[m.name]=false;});setAttendees(a);}}
              style={{padding:'3px 10px',borderRadius:'20px',border:'1px solid var(--border)',background:'transparent',color:'var(--muted)',fontSize:'11px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>❌ Bỏ hết</button>
            <button type="button" onClick={()=>setAttendees(p=>({...p,'Xé Vé':!p['Xé Vé']}))}
              style={{padding:'3px 10px',borderRadius:'20px',border:'1px solid var(--yellow)',background:'var(--yellow-bg)',color:'#92400e',fontSize:'11px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>🎫 Xé Vé</button>
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
            {members.map(m=>{
              const on=!!attendees[m.name];
              return(
                <button key={m.name} onClick={()=>toggle(m.name)} style={{
                  padding:'5px 12px',borderRadius:'20px',border:'1px solid',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',transition:'.15s',
                  borderColor:on?m.color:'var(--border)',
                  background:on?m.color+'33':'transparent',
                  color:on?m.color:'var(--muted)',fontWeight:on?600:400
                }}>{m.name}</button>
              );
            })}
          </div>
          {feeTotal>0&&attending.length>0&&(
            <div style={{marginTop:'8px',fontSize:'12px',color:'var(--green)',fontWeight:600}}>
              Mỗi người: {fmt(perPerson)}{xeVeOn&&xeVeCnt>1?` · Nhóm Xé Vé (${xeVeCnt} người) tổng: ${fmt(perPerson*xeVeCnt)}`:''}
            </div>
          )}
        </div>

        {/* Ai uống nước — chỉ hiện khi có tiền nước; chỉ những người được chọn mới bị chia khoản này */}
        {(parseInt(waterFee)||0)>0 && attending.length>0 && (
          <div style={{marginBottom:'10px'}}>
            <div className="fl" style={{marginBottom:'8px'}}>💧 Ai uống nước? (chỉ người này chịu tiền nước)</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
              {attending.map(name=>{
                const on=!!waterDrinkers[name];
                return (
                  <button key={name} onClick={()=>toggleWater(name)} style={{
                    padding:'5px 12px',borderRadius:'20px',border:'1px solid',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',
                    borderColor:on?'var(--blue)':'var(--border)',
                    background:on?'var(--blue-bg)':'transparent',
                    color:on?'var(--blue)':'var(--muted)',fontWeight:on?600:400
                  }}>{on?'💧 ':'🚱 '}{name}</button>
                );
              })}
            </div>
          </div>
        )}

        <div className="fg" style={{marginBottom:'12px'}}>
          <label className="fl">📝 Ghi chú khác</label>
          <input className="fi" value={note} onChange={e=>setNote(e.target.value)} placeholder="VD: Sân Hoàng Anh, giờ chơi 19h..."/>
        </div>

        <div className="form-actions">
          <button className="btn-cancel" onClick={onClose}>Hủy</button>
          <button className="btn-save" onClick={save}>💾 Lưu thay đổi</button>
        </div>
      </div>
    </div>
  );
}

/* ─── FUND TAB ───────────────────────────────────────────── */
function FundTab({players,setPlayers,sessions,setSessions,members,setMembers,matches,setMatches,onRenameMember,showToast,onTrashAdd,isAdmin,bankInfo,setBankInfo,clubName}){
  const memberNames = FUND_MEMBERS.map(m=>m.name);
  // Data được load/save bởi App cha — FundTab chỉ dùng trực tiếp
  const _td=new Date();
  const _todayStr=`${String(_td.getDate()).padStart(2,'0')}/${String(_td.getMonth()+1).padStart(2,'0')}`;
  const [showAdd,setShowAdd]=useState(false);
  const [showAddMember,setShowAddMember]=useState(false);
  const [newMember,setNewMember]=useState({name:'',paid:''});
  const [addMemberError,setAddMemberError]=useState('');
  const [expandedSession,setExpandedSession]=useState(null);
  const [depositTarget,setDepositTarget]=useState(null); // {name, idx}
  const [depositAmt,setDepositAmt]=useState('');
  const [depositDate,setDepositDate]=useState('');
  const [editingDeposit,setEditingDeposit]=useState(null); // {mIdx, dIdx}
  const [editDepAmt,setEditDepAmt]=useState('');
  const [editDepDate,setEditDepDate]=useState('');
  const [f,setF]=useState({date:_todayStr,courtFee:'',shuttleFee:'',waterFee:'',otherFee:'',attendees:{},waterDrinkers:{},note:''});
  const sf=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const fFeeTotal=(parseInt(f.courtFee)||0)+(parseInt(f.shuttleFee)||0)+(parseInt(f.waterFee)||0)+(parseInt(f.otherFee)||0);
  const [renamingMember,setRenamingMember]=useState(null); // idx
  const [renameVal,setRenameVal]=useState('');
  const [renameError,setRenameError]=useState('');
  const [confirmDeleteSession,setConfirmDeleteSession]=useState(null);
  const [confirmDeleteMember,setConfirmDeleteMember]=useState(null);
  const [editingSession,setEditingSession]=useState(null);
  const [expandedMember,setExpandedMember]=useState(null); // idx đang mở chi tiết
  const [memberSearch,setMemberSearch]=useState('');
  const [onlyDebt,setOnlyDebt]=useState(false);
  const [showAllMembers,setShowAllMembers]=useState(false);
  const [showAllSessions,setShowAllSessions]=useState(false);
  // Chọn nhiều người để tạo mã QR nhắc nợ, xuất ảnh gửi từng người
  const [selectMode,setSelectMode]=useState(false);
  const [selectedMembers,setSelectedMembers]=useState([]); // mảng tên
  const [showQRModal,setShowQRModal]=useState(false);
  const [showBankConfig,setShowBankConfig]=useState(false);
  const [bankDraft,setBankDraft]=useState(bankInfo||{bankCode:'',accountNo:'',accountName:''});
  useEffect(()=>{ setBankDraft(bankInfo||{bankCode:'',accountNo:'',accountName:''}); },[bankInfo]);
  const toggleSelectMember=(name)=>{
    setSelectedMembers(p=>p.includes(name)?p.filter(n=>n!==name):[...p,name]);
  };
  const saveBankConfig=()=>{
    setBankInfo(bankDraft);
    setShowBankConfig(false);
    if(showToast) showToast('Đã lưu cấu hình ngân hàng');
  };
  const MEMBER_PAGE_SIZE=8;
  const SESSION_PAGE_SIZE=10;

  // computed per member: how much they owe from sessions
  const memberSpent = useMemo(()=>{
    const spent = {};
    members.forEach(m=>{ spent[m.name]=0; });
    sessions.forEach(s=>{
      if(s.attendees && Object.keys(s.attendees).length>0){
        const attending = Object.entries(s.attendees).filter(([,v])=>v).map(([k])=>k);
        attending.forEach(name=>{
          if(spent[name]===undefined) return;
          spent[name]+=personCost(s,name);
        });
      } else {
        // legacy: split equally
        const share = s.players>0 ? Math.round(s.total/s.players) : 0;
        members.forEach(m=>{ spent[m.name]+=share; });
      }
    });
    return spent;
  },[sessions,members]);

  const totalFund=members.reduce((a,m)=>a+m.paid,0);
  const totalSpent=sessions.reduce((a,s)=>a+s.total,0);
  const remaining=totalFund-totalSpent;
  const totalDebt=members.reduce((a,m)=>{
    const rem=m.paid-(memberSpent[m.name]||0);
    return rem<0 ? a+Math.abs(rem) : a;
  },0);
  const debtorsCount=members.filter(m=>(m.paid-(memberSpent[m.name]||0))<0).length;

  const toggleAttendee=(name)=>{
    setF(p=>({...p,attendees:{...p.attendees,[name]:!p.attendees[name]}}));
  };

  const addSession=()=>{
    if(!f.date||fFeeTotal<=0) return;
    const att = f.attendees;
    const attending = Object.entries(att).filter(([,v])=>v).map(([k])=>k);
    const waterFeeNum = parseInt(f.waterFee)||0;
    let finalWaterDrinkers;
    if(waterFeeNum>0){
      finalWaterDrinkers={};
      attending.forEach(n=>{ finalWaterDrinkers[n]=f.waterDrinkers[n]!==false; }); // mặc định ai cũng uống trừ khi bỏ chọn
    }
    const newSession={id:Date.now(),date:f.date,players:attending.length,
      courtFee:parseInt(f.courtFee)||0,shuttleFee:parseInt(f.shuttleFee)||0,waterFee:waterFeeNum,otherFee:parseInt(f.otherFee)||0,
      total:fFeeTotal,attendees:{...att},xeVeCount:att['Xé Vé']?(parseInt(f.xeVeCount)||1):0,note:f.note||'',
      waterDrinkers:finalWaterDrinkers};
    setSessions(p=>[...p,newSession]);
    const _nd=new Date(),_ns=`${String(_nd.getDate()).padStart(2,'0')}/${String(_nd.getMonth()+1).padStart(2,'0')}`;
    setF({date:_ns,courtFee:'',shuttleFee:'',waterFee:'',otherFee:'',attendees:{},waterDrinkers:{},note:''});
    setShowAdd(false);
  };

  const deleteSession=(id)=>{
    const s=sessions.find(x=>x.id===id);
    if(s && onTrashAdd) onTrashAdd('sessions', s);
    setSessions(p=>p.filter(s=>s.id!==id));
    setConfirmDeleteSession(null);
    if(showToast) showToast('Đã chuyển buổi chơi vào Thùng rác');
  };

  const addMember=()=>{
    const nm=(newMember.name||'').trim();
    if(!nm||!newMember.paid) return;
    if(isNameTaken(nm, players, members)){ setAddMemberError('Tên này đã tồn tại trong CLB, hãy chọn tên khác'); return; }
    setMembers(p=>{
      const usedColors=p.map(m=>m.color);
      const nextColor=COLORS.find(c=>!usedColors.includes(c))||COLORS[p.length%COLORS.length];
      return [...p,{name:nm,paid:parseInt(newMember.paid),color:nextColor,deposits:[{date:'Ban đầu',amount:parseInt(newMember.paid)}]}];
    });
    setNewMember({name:'',paid:''});
    setShowAddMember(false);
    setAddMemberError('');
  };

  const deleteMember=(idx)=>{
    const m=members[idx];
    if(m && onTrashAdd) onTrashAdd('members', m);
    setMembers(p=>p.filter((_,i)=>i!==idx));
    setConfirmDeleteMember(null);
    if(showToast) showToast('Đã chuyển thành viên vào Thùng rác');
  };

  // Đổi tên thành viên — dùng chung hàm đồng bộ tên với BXH (renameEverywhere ở App), có kiểm tra trùng tên
  const renameMember=(idx,newName)=>{
    const oldName=members[idx].name;
    const nn=(newName||'').trim();
    if(!nn){ setRenameError('Vui lòng nhập tên'); return; }
    if(nn===oldName){ setRenamingMember(null);setRenameVal('');setRenameError(''); return; }
    if(isNameTaken(nn, players, members, oldName)){ setRenameError('Tên này đã tồn tại, hãy chọn tên khác'); return; }
    onRenameMember(oldName, nn);
    setRenamingMember(null);setRenameVal('');setRenameError('');
  };

  const addDeposit=()=>{
    if(!depositTarget||!depositAmt) return;
    const amt=parseInt(depositAmt);
    setMembers(p=>p.map((m,i)=>i===depositTarget.idx?{...m,paid:m.paid+amt,deposits:[...(m.deposits||[]),{date:depositDate||'—',amount:amt}]}:m));
    setDepositTarget(null);setDepositAmt('');setDepositDate('');
  };

  const saveEditDeposit=()=>{
    if(!editingDeposit||!editDepAmt) return;
    const {mIdx,dIdx}=editingDeposit;
    setMembers(p=>p.map((m,i)=>{
      if(i!==mIdx) return m;
      const oldAmt=(m.deposits||[])[dIdx]?.amount||0;
      const newAmt=parseInt(editDepAmt);
      const newDeps=(m.deposits||[]).map((d,di)=>di===dIdx?{date:editDepDate||d.date,amount:newAmt}:d);
      return {...m,paid:m.paid-oldAmt+newAmt,deposits:newDeps};
    }));
    setEditingDeposit(null);setEditDepAmt('');setEditDepDate('');
  };

  const deleteDeposit=(mIdx,dIdx)=>{
    setMembers(p=>p.map((m,i)=>{
      if(i!==mIdx) return m;
      const dep=(m.deposits||[])[dIdx];
      if(!dep) return m;
      const newDeps=(m.deposits||[]).filter((_,di)=>di!==dIdx);
      return {...m,paid:m.paid-dep.amount,deposits:newDeps};
    }));
    if(showToast) showToast('Đã xóa lần nạp tiền');
  };

  // Month filter
  const [monthFund,setMonthFund]=useState('Tất cả');
  const fundMonths=useMemo(()=>{
    const s=new Set();
    sessions.forEach(s2=>{const p=s2.date.split(/[\/\-]/);if(p.length>=2)s.add(p[1]);});
    return ['Tất cả',...[...s].sort((a,b)=>parseInt(a)-parseInt(b)).map(m=>`Tháng ${m}`)];
  },[sessions]);

  // Lọc theo người — xem 1 người từng tham gia những buổi chơi nào
  const [playerFund,setPlayerFund]=useState('Tất cả');

  // Lọc theo khoản chi (sân/cầu/nước/khác) — để xem riêng từng loại chi phí
  const [feeFilter,setFeeFilter]=useState('Tất cả');
  const FEE_KEYS={'Tiền sân':'courtFee','Tiền cầu/bóng':'shuttleFee','Tiền nước':'waterFee','Khác':'otherFee'};

  // Danh sách sau khi lọc theo tháng + người (chưa áp dụng lọc khoản chi) —
  // dùng để tính tổng từng khoản, làm cơ sở cho các nút bấm lọc khoản chi bên dưới.
  const monthPlayerSessions=useMemo(()=>{
    let list=sessions;
    if(monthFund!=='Tất cả'){
      const mon=monthFund.replace('Tháng ','');
      list=list.filter(s2=>{const p=s2.date.split(/[\/\-]/);return p.length>=2&&p[1]===mon;});
    }
    if(playerFund!=='Tất cả'){
      list=list.filter(s2=>s2.attendees && s2.attendees[playerFund]);
    }
    return list;
  },[sessions,monthFund,playerFund]);

  const feeBreakdownTotals=useMemo(()=>monthPlayerSessions.reduce((acc,s2)=>{
    acc.court+=s2.courtFee||0; acc.shuttle+=s2.shuttleFee||0; acc.water+=s2.waterFee||0; acc.other+=s2.otherFee||0;
    return acc;
  },{court:0,shuttle:0,water:0,other:0}),[monthPlayerSessions]);

  const filteredSessions=useMemo(()=>{
    let list=monthPlayerSessions;
    if(feeFilter!=='Tất cả'){
      const key=FEE_KEYS[feeFilter];
      list=list.filter(s2=>(s2[key]||0)>0);
    }
    return list;
  },[monthPlayerSessions,feeFilter]);

  const monthTotal=feeFilter==='Tất cả'
    ? filteredSessions.reduce((a,s2)=>a+s2.total,0)
    : filteredSessions.reduce((a,s2)=>a+(s2[FEE_KEYS[feeFilter]]||0),0);
  // Khi đang lọc theo 1 người cụ thể, "Tổng" trên banner nên là tổng PHẦN CỦA NGƯỜI ĐÓ
  // (mỗi người x số buổi tham gia), không phải tổng chi phí toàn bộ các buổi chơi.
  const playerShareTotal=useMemo(()=>{
    if(playerFund==='Tất cả') return null;
    return filteredSessions.reduce((a,s2)=>{
      if(!s2.attendees || !s2.attendees[playerFund]) return a;
      return a+personCost(s2,playerFund);
    },0);
  },[filteredSessions,playerFund]);

  // Export fund CSV
  const exportFundCSV=()=>{
    const rows=[['Ngày','Số người','Tiền sân','Tiền cầu/bóng','Tiền nước','Khác','Tổng','Mỗi người (TB)','Người tham dự','Người uống nước']];
    [...sessions].reverse().forEach(s2=>{
      const att=s2.attendees?Object.entries(s2.attendees).filter(([,v])=>v).map(([k])=>k):[];
      const per=att.length>0?shareAmount(s2):(s2.players>0?Math.round(s2.total/s2.players):0);
      const waterList=s2.waterFee>0?(s2.waterDrinkers?att.filter(n=>s2.waterDrinkers[n]).join(' | '):'Tất cả'):'—';
      rows.push([s2.date,s2.players,s2.courtFee||0,s2.shuttleFee||0,s2.waterFee||0,s2.otherFee||0,s2.total,per,att.join(' | '),waterList]);
    });
    const mRows=[['Tên','Đã đóng','Đã chi','Còn lại']];
    members.forEach(m2=>{
      const sp=memberSpent[m2.name]||0;
      mRows.push([m2.name,m2.paid,sp,m2.paid-sp]);
    });
    const toCSV=rs=>rs.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
    const csv='=== LỊCH SỬ BUỔI CHƠI ===\n'+toCSV(rows)+'\n\n=== TÌNH TRẠNG THÀNH VIÊN ===\n'+toCSV(mRows);
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='picklepro_quy.csv';a.click();
    URL.revokeObjectURL(url);
  };

  // âm quỹ members
  const amQuy=members.filter(m2=>(m2.paid-(memberSpent[m2.name]||0))<0);

  // Người chơi ở BXH nhưng chưa có trong Quỹ (VD: được thêm từ trước khi có tính năng tự đồng bộ)
  const missingPlayers = players.filter(p=>!members.some(m=>m.name.toLowerCase()===p.name.toLowerCase()));
  const syncMissingMembers = ()=>{
    if(missingPlayers.length===0) return;
    setMembers(p=>{
      let updated=[...p];
      missingPlayers.forEach(pl=>{
        if(updated.some(m=>m.name.toLowerCase()===pl.name.toLowerCase())) return;
        const usedColors=updated.map(m=>m.color);
        const nextColor=COLORS.find(c=>!usedColors.includes(c))||pl.color;
        updated=[...updated,{name:pl.name,paid:0,color:nextColor,deposits:[]}];
      });
      return updated;
    });
    showToast(`Đã thêm ${missingPlayers.length} người vào Hòm Công Đức`);
  };

  const renderMemberRow=({m,i})=>{
    const spent = memberSpent[m.name]||0;
    const rem = m.paid-spent;
    const isDepTarget=depositTarget?.idx===i;
    const isRenaming=renamingMember===i;
    const isExpanded=expandedMember===i;
    const matchedPlayer=(players||[]).find(p=>p.name===m.name);
    const isSelected=selectedMembers.includes(m.name);
    return (
      <div key={i} style={{background:'var(--surface)',border:'1px solid var(--border)',borderLeft:`3px solid ${isSelected?'var(--yellow)':m.color}`,borderRadius:'10px',overflow:'hidden'}}>
        {/* Dòng gọn — bấm để mở/thu chi tiết (hoặc chọn nếu đang ở chế độ chọn nhiều) */}
        <div onClick={()=>selectMode?toggleSelectMember(m.name):setExpandedMember(isExpanded?null:i)} style={{display:'flex',alignItems:'center',gap:'9px',padding:'10px 12px',cursor:'pointer'}}>
          {selectMode && (
            <div onClick={e=>{e.stopPropagation();toggleSelectMember(m.name);}} style={{
              width:'18px',height:'18px',borderRadius:'5px',flexShrink:0,border:`2px solid ${isSelected?'var(--yellow)':'var(--border2)'}`,
              background:isSelected?'var(--yellow)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',color:'#000',fontWeight:900
            }}>{isSelected?'✓':''}</div>
          )}
          <div style={{width:'28px',height:'28px',borderRadius:'50%',overflow:'hidden',flexShrink:0,background:matchedPlayer?.avatar?'transparent':m.color+'22',color:m.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'10px',fontWeight:700}}>
            {matchedPlayer?.avatar?<img src={matchedPlayer.avatar} alt={m.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:initials(m.name)}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:700,fontSize:'13px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:'4px'}}>
              {m.name}{rem<0&&<span style={{fontSize:'9px'}}>🔴</span>}
            </div>
            <div style={{fontSize:'10.5px',color:'var(--muted)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>Đóng {fmt(m.paid)} · Chi {fmt(spent)}</div>
          </div>
          <div style={{textAlign:'right',flexShrink:0}}>
            <div className={rem>=0?'pos':'neg'} style={{fontWeight:800,fontSize:'13.5px'}}>{rem<0?'-':''}{fmt(roundUpFund(Math.abs(rem)))}</div>
          </div>
          <div style={{color:'var(--muted2)',fontSize:'10px',flexShrink:0,transform:isExpanded?'rotate(180deg)':'none',transition:'transform .15s'}}>▾</div>
        </div>

        {isExpanded && (
          <div style={{padding:'0 12px 12px'}}>
            {isRenaming?(
              <div style={{marginBottom:'10px'}}>
                <input className="fi" style={{padding:'7px 10px',fontSize:'13px',width:'100%',marginBottom:'8px'}} value={renameVal} onChange={e=>{setRenameVal(e.target.value);setRenameError('');}} onKeyDown={e=>{if(e.key==='Enter'&&renameVal.trim())renameMember(i,renameVal.trim());if(e.key==='Escape'){setRenamingMember(null);setRenameVal('');setRenameError('');}}} autoFocus/>
                {renameError && <div style={{fontSize:'11px',color:'var(--red)',marginBottom:'8px'}}>⚠️ {renameError}</div>}
                <div style={{display:'flex',gap:'6px'}}>
                  <button onClick={()=>{if(renameVal.trim())renameMember(i,renameVal.trim());}} style={{flex:1,background:m.color,border:'none',borderRadius:'7px',color:'#fff',padding:'7px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✓ Lưu</button>
                  <button onClick={()=>{setRenamingMember(null);setRenameVal('');setRenameError('');}} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'7px',color:'var(--muted)',padding:'7px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✕ Hủy</button>
                </div>
              </div>
            ):isAdmin&&(
              <div style={{display:'flex',gap:'6px',marginBottom:'10px',paddingTop:'10px',borderTop:'1px solid var(--border)'}}>
                <button onClick={()=>{if(isDepTarget){setDepositTarget(null);}else{const _nd=new Date();const _today=`${String(_nd.getDate()).padStart(2,'0')}/${String(_nd.getMonth()+1).padStart(2,'0')}`;setDepositTarget({name:m.name,idx:i});setDepositDate(_today);}}} style={{
                  background:isDepTarget?m.color+'22':'var(--bg3)',border:`1px solid ${isDepTarget?m.color:'var(--border)'}`,
                  borderRadius:'6px',color:isDepTarget?m.color:'var(--muted)',padding:'5px 10px',fontSize:'11px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif',whiteSpace:'nowrap'
                }}>+ Nạp tiền</button>
                <button onClick={()=>{setRenamingMember(i);setRenameVal(m.name);}} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'6px',color:'var(--muted)',padding:'5px 10px',fontSize:'11px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✏️ Sửa tên</button>
                <button onClick={()=>setConfirmDeleteMember(i)} title="Xóa thành viên" style={{background:'var(--red-bg)',border:'1px solid var(--red)',borderRadius:'6px',color:'var(--red)',padding:'5px 8px',fontSize:'11px',cursor:'pointer',fontFamily:'Nunito,sans-serif',opacity:.85}}>🗑</button>
              </div>
            )}

            {isDepTarget&&(
              <div style={{background:'var(--bg3)',borderRadius:'9px',padding:'10px',marginBottom:'10px',border:`1px solid ${m.color}44`}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px',marginBottom:'8px'}}>
                  <div className="fg"><label className="fl">📅 Ngày</label><DateInput value={depositDate} onChange={setDepositDate} style={{padding:'6px 8px',fontSize:'12px'}}/></div>
                  <div className="fg"><label className="fl">Số tiền (đ)</label><MoneyInput style={{padding:'6px 8px',fontSize:'12px'}} value={depositAmt} onChange={setDepositAmt} placeholder="500,000"/></div>
                </div>
                <div style={{display:'flex',gap:'6px'}}>
                  <button onClick={addDeposit} style={{flex:1,background:m.color,border:'none',borderRadius:'7px',color:'#fff',padding:'7px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>Xác nhận nạp</button>
                  <button onClick={()=>{setDepositTarget(null);setDepositAmt('');}} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'7px',color:'var(--muted)',padding:'7px 10px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>Hủy</button>
                </div>
              </div>
            )}

            {/* Không lặp lại "Tổng đã đóng / Đã chi" ở đây nữa vì đã hiện sẵn ở dòng
                thu gọn phía trên (Đóng X · Chi Y) — mở rộng chỉ để xem thêm lịch sử nạp + thao tác.
                Trường hợp không phải admin và cũng không có lịch sử nạp (>1 lần), hiện 1 dòng
                còn lại rõ ràng để khung mở rộng không bị trống. */}
            {!isAdmin&&(m.deposits||[]).length===0&&(
              <div className="fm-row" style={{paddingTop:'10px',borderTop:'1px solid var(--border)'}}>
                <span className="fm-lbl">Còn lại</span>
                <span className="fm-val" style={{color:rem>=0?'var(--green)':'var(--red)'}}>{rem<0?'-':''}{fmt(roundUpFund(Math.abs(rem)))}</span>
              </div>
            )}
            {(m.deposits||[]).length>0&&(
              <div style={{marginTop:'8px',paddingTop:'8px',borderTop:'1px solid var(--border)'}}>
                <div style={{fontSize:'10px',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'4px'}}>Lịch sử nạp</div>
                {(m.deposits||[]).map((d,di)=>{
                  const isEditingThis=editingDeposit?.mIdx===i&&editingDeposit?.dIdx===di;
                  return isEditingThis?(
                    <div key={di} style={{background:'var(--bg3)',borderRadius:'8px',padding:'8px',marginBottom:'4px',border:`1px solid ${m.color}44`}}>
                      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px',marginBottom:'6px'}}>
                        <div className="fg"><label className="fl" style={{fontSize:'10px'}}>📅 Ngày</label><DateInput value={editDepDate} onChange={setEditDepDate} style={{padding:'5px 7px',fontSize:'11px'}}/></div>
                        <div className="fg"><label className="fl" style={{fontSize:'10px'}}>Số tiền (đ)</label><MoneyInput style={{padding:'5px 7px',fontSize:'11px'}} value={editDepAmt} onChange={setEditDepAmt} placeholder="500,000"/></div>
                      </div>
                      <div style={{display:'flex',gap:'6px'}}>
                        <button onClick={saveEditDeposit} style={{flex:1,background:m.color,border:'none',borderRadius:'6px',color:'#fff',padding:'5px',fontSize:'11px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✓ Lưu</button>
                        <button onClick={()=>{setEditingDeposit(null);setEditDepAmt('');setEditDepDate('');}} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'6px',color:'var(--muted)',padding:'5px 10px',fontSize:'11px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✕</button>
                      </div>
                    </div>
                  ):(
                    <div key={di} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:'11px',padding:'2px 0',color:'var(--muted)'}}>
                      <span>{d.date}</span>
                      <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
                        <span style={{color:m.color,fontWeight:600}}>+{fmt(d.amount)}</span>
                        {isAdmin&&<button onClick={()=>{setEditingDeposit({mIdx:i,dIdx:di});setEditDepAmt(String(d.amount));setEditDepDate(d.date);}} style={{background:'none',border:'none',cursor:'pointer',padding:'2px 4px',fontSize:'11px',color:'var(--muted)',lineHeight:1}} title="Sửa">✏️</button>}
                        {isAdmin&&<button onClick={()=>deleteDeposit(i,di)} style={{background:'none',border:'none',cursor:'pointer',padding:'2px 4px',fontSize:'11px',color:'var(--red)',lineHeight:1,opacity:.7}} title="Xóa lần nạp này">✕</button>}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>
    );
  };

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'10px',marginBottom:'14px',flexWrap:'wrap',gap:'8px'}}>
      <div className="section-title">🙏 Hòm Công Đức</div>
      <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
        {isAdmin && <button onClick={()=>setShowBankConfig(true)} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--muted)',padding:'6px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',display:'flex',alignItems:'center',gap:'5px'}}>🏦 Cấu hình ngân hàng</button>}
        <button onClick={exportFundCSV} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--muted)',padding:'6px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',display:'flex',alignItems:'center',gap:'5px'}}>📥 Xuất Excel</button>
      </div>
    </div>

    {showBankConfig && (
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'14px',marginBottom:'16px'}}>
        <div style={{fontSize:'13px',fontWeight:700,marginBottom:'10px',color:'var(--text)'}}>🏦 Cấu hình tài khoản nhận tiền quỹ (để tạo mã QR)</div>
        <div className="form-grid" style={{marginBottom:'10px'}}>
          <div className="fg">
            <label className="fl">Ngân hàng</label>
            <select className="fi" value={bankDraft.bankCode} onChange={e=>setBankDraft(p=>({...p,bankCode:e.target.value}))} style={{padding:'8px 10px',fontSize:'13px'}}>
              <option value="">-- Chọn ngân hàng --</option>
              {VIETQR_BANKS.map(b=><option key={b.code} value={b.code}>{b.name}</option>)}
            </select>
          </div>
          <div className="fg"><label className="fl">Số tài khoản</label><input className="fi" value={bankDraft.accountNo} onChange={e=>setBankDraft(p=>({...p,accountNo:e.target.value.replace(/[^0-9A-Za-z]/g,'').toUpperCase()}))} placeholder="0123456789 hoặc mã Quỹ nhóm MoMo"/></div>
        </div>
        <div className="fg" style={{marginBottom:'12px'}}>
          <label className="fl">Tên chủ tài khoản (không dấu)</label>
          <input className="fi" value={bankDraft.accountName} onChange={e=>setBankDraft(p=>({...p,accountName:e.target.value.toUpperCase()}))} placeholder="NGUYEN VAN A"/>
        </div>
        <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'12px'}}>Mã QR sẽ được tạo tự động qua VietQR, đúng chuẩn ngân hàng — chỉ cần quét là chuyển khoản, không cần cài thêm gì.</div>
        <div className="form-actions"><button className="btn-cancel" onClick={()=>{setShowBankConfig(false);setBankDraft(bankInfo);}}>Hủy</button><button className="btn-save" onClick={saveBankConfig}>Lưu</button></div>
      </div>
    )}

    {missingPlayers.length>0 && (
      <div style={{background:'var(--yellow-bg)',border:'1px solid var(--yellow)',borderRadius:'10px',padding:'12px 14px',marginBottom:'16px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'10px'}}>
        <div style={{fontSize:'12px',color:'var(--text)'}}>
          ⚠️ Có <b>{missingPlayers.length}</b> người ở BXH chưa có trong Hòm Công Đức: {missingPlayers.map(p=>p.name).join(', ')}
        </div>
        <button onClick={syncMissingMembers} style={{background:'var(--yellow)',border:'none',borderRadius:'8px',color:'#000',padding:'7px 14px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif',whiteSpace:'nowrap'}}>➕ Đồng bộ ngay</button>
      </div>
    )}

    <div className="stats-grid" style={{marginBottom:'16px'}}>
      <div className="stat-card sc-green"><div className="sc-label">Tổng đã đóng</div><div className="sc-val" style={{fontSize:'20px'}}>{fmt(totalFund)}</div></div>
      <div className="stat-card sc-red"><div className="sc-label">Đã chi</div><div className="sc-val" style={{fontSize:'20px'}}>{fmt(totalSpent)}</div></div>
      <div className="stat-card sc-purple"><div className="sc-label">Còn lại trong Hòm Công Đức</div><div className="sc-val" style={{fontSize:'20px',color:'var(--purple)'}}>{fmt(roundUpFund(remaining))}</div></div>
      <div className="stat-card sc-red" style={{borderColor:debtorsCount>0?'var(--red)':undefined}}>
        <div className="sc-label">Tổng còn nợ toàn CLB</div>
        <div className="sc-val" style={{fontSize:'20px',color:debtorsCount>0?'var(--red)':'var(--muted)'}}>{fmt(roundUpFund(totalDebt))}</div>
        {debtorsCount>0 && <div style={{fontSize:'10.5px',color:'var(--red)',marginTop:'2px'}}>🔴 {debtorsCount} người đang nợ</div>}
      </div>
    </div>

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px',flexWrap:'wrap',gap:'8px'}}>
      <div className="section-title" style={{fontSize:'14px'}}>Tình trạng từng thành viên</div>
      <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
        <button onClick={()=>{setSelectMode(v=>!v);if(selectMode)setSelectedMembers([]);}} style={{
          background:selectMode?'var(--yellow-bg)':'var(--surface)',border:`1px solid ${selectMode?'var(--yellow)':'var(--border)'}`,borderRadius:'8px',
          color:selectMode?'var(--yellow)':'var(--muted)',padding:'5px 12px',fontSize:'12px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif'
        }}>{selectMode?`✓ Đang chọn (${selectedMembers.length})`:'☑️ Chọn nhiều'}</button>
        {selectMode && selectedMembers.length>0 && (
          <button onClick={()=>setShowQRModal(true)} style={{background:'var(--green)',border:'none',borderRadius:'8px',color:'#fff',padding:'5px 12px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif',display:'flex',alignItems:'center',gap:'5px'}}>📱 Tạo mã QR nợ</button>
        )}
        {isAdmin && <button onClick={()=>setShowAddMember(!showAddMember)} style={{background:'var(--surface)',border:'1px dashed var(--border2)',borderRadius:'8px',color:'var(--muted)',padding:'5px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>+ Thêm thành viên</button>}
      </div>
    </div>

    {showAddMember && (
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'14px',marginBottom:'12px'}}>
        <div className="form-grid">
          <div className="fg"><label className="fl">Tên</label><input className="fi" value={newMember.name} onChange={e=>setNewMember(p=>({...p,name:e.target.value}))} placeholder="Tên thành viên"/></div>
          <div className="fg"><label className="fl">Đã đóng (VNĐ)</label><MoneyInput value={newMember.paid} onChange={v=>setNewMember(p=>({...p,paid:v}))} placeholder="500,000"/></div>
        </div>
        {addMemberError && <div style={{fontSize:'12px',color:'var(--red)',marginTop:'8px'}}>⚠️ {addMemberError}</div>}
        <div className="form-actions"><button className="btn-cancel" onClick={()=>{setShowAddMember(false);setAddMemberError('');}}>Hủy</button><button className="btn-save" onClick={addMember}>Thêm</button></div>
      </div>
    )}

    {/* Tìm nhanh + lọc người còn nợ quỹ — hữu ích khi CLB đông thành viên */}
    <div className="fund-search-row">
      <input className="fi" style={{padding:'8px 12px',fontSize:'13px'}} value={memberSearch} onChange={e=>setMemberSearch(e.target.value)} placeholder="🔍 Tìm theo tên..."/>
      <button className="fund-debt-toggle" onClick={()=>setOnlyDebt(v=>!v)} style={{
        padding:'0 12px',minHeight:'38px',borderRadius:'9px',border:'1px solid',fontSize:'12px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif',whiteSpace:'nowrap',
        borderColor:onlyDebt?'var(--red)':'var(--border)',
        background:onlyDebt?'var(--red-bg)':'var(--surface)',
        color:onlyDebt?'var(--red)':'var(--muted)'
      }}>{onlyDebt?'🔴 Đang lọc: còn nợ':'Chỉ hiện người còn nợ'}</button>
    </div>

    {(()=>{
      const filteredMembers=members.map((m,i)=>({m,i})).filter(({m})=>{
        if(memberSearch.trim()&&!m.name.toLowerCase().includes(memberSearch.trim().toLowerCase()))return false;
        if(onlyDebt&&(m.paid-(memberSpent[m.name]||0))>=0)return false;
        return true;
      });
      const firstPage=filteredMembers.slice(0,MEMBER_PAGE_SIZE);
      const extra=filteredMembers.slice(MEMBER_PAGE_SIZE);
      return <>
        <div className="fund-members" style={{display:'flex',flexDirection:'column',gap:'8px'}}>
          {firstPage.map(renderMemberRow)}
          {filteredMembers.length===0 && (
            <div style={{textAlign:'center',padding:'20px',color:'var(--muted)',fontSize:'13px'}}>Không tìm thấy thành viên nào phù hợp</div>
          )}
        </div>
        {extra.length>0 && (
          <div className={`expand-region ${showAllMembers?'expanded':'collapsed'}`}>
            <div className="fund-members" style={{display:'flex',flexDirection:'column',gap:'8px',paddingTop:'8px'}}>
              {extra.map(renderMemberRow)}
            </div>
          </div>
        )}
        {extra.length>0 && (
          <button className="btn-expand" onClick={()=>setShowAllMembers(v=>!v)}>
            {showAllMembers ? '▲ Thu gọn' : `👥 Xem thêm ${extra.length} thành viên`}
          </button>
        )}
      </>;
    })()}

    <div className="section-title" style={{fontSize:'14px',marginBottom:'10px',marginTop:'4px'}}>Lịch sử buổi chơi</div>
    {/* Gộp lọc tháng + lọc người vào chung 1 hàng, cùng dùng kiểu dropdown cho nhất quán
        (trước đây tháng dùng nút chip, người dùng select — 2 kiểu khác nhau trên 2 hàng riêng) */}
    <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px',flexWrap:'wrap'}}>
      <span style={{fontSize:'12px',color:'var(--muted)',whiteSpace:'nowrap'}}>📅 Tháng:</span>
      <select className="month-sel" value={monthFund} onChange={e=>setMonthFund(e.target.value)}>
        {fundMonths.map(m2=>(<option key={m2} value={m2}>{m2}</option>))}
      </select>
      <span style={{fontSize:'12px',color:'var(--muted)',whiteSpace:'nowrap',marginLeft:'2px'}}>👤 Người:</span>
      <select className="month-sel" value={playerFund} onChange={e=>setPlayerFund(e.target.value)}>
        <option value="Tất cả">Tất cả</option>
        {members.map(m=>(<option key={m.name} value={m.name}>{m.name}</option>))}
      </select>
      {(monthFund!=='Tất cả'||playerFund!=='Tất cả') && (
        <button onClick={()=>{setMonthFund('Tất cả');setPlayerFund('Tất cả');}} style={{
          background:'var(--purple-bg)',border:'1px solid var(--purple)',borderRadius:'8px',color:'var(--purple)',
          padding:'5px 10px',fontSize:'11px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif'
        }}>✕ Bỏ lọc</button>
      )}
    </div>
    {/* Lọc theo khoản chi — bấm vào 1 khoản để chỉ xem các buổi có khoản đó,
        đồng thời hiện luôn tổng của từng khoản trong phạm vi tháng/người đang chọn */}
    <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px',flexWrap:'wrap'}}>
      <span style={{fontSize:'12px',color:'var(--muted)',whiteSpace:'nowrap'}}>💰 Lọc theo khoản chi:</span>
      {[
        {key:'Tiền sân',icon:'🎾',val:feeBreakdownTotals.court},
        {key:'Tiền cầu/bóng',icon:'🏸',val:feeBreakdownTotals.shuttle},
        {key:'Tiền nước',icon:'💧',val:feeBreakdownTotals.water},
        {key:'Khác',icon:'🔖',val:feeBreakdownTotals.other},
      ].map(({key,icon,val})=>(
        <button key={key} onClick={()=>setFeeFilter(feeFilter===key?'Tất cả':key)} style={{
          padding:'4px 12px',borderRadius:'20px',border:'1px solid',fontSize:'11px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:500,
          borderColor:feeFilter===key?'var(--green)':'var(--border)',
          background:feeFilter===key?'var(--green-bg)':'transparent',
          color:feeFilter===key?'var(--green)':'var(--muted)'
        }}>{icon} {key}: {fmt(val)}</button>
      ))}
      {feeFilter!=='Tất cả' && (
        <button onClick={()=>setFeeFilter('Tất cả')} style={{
          background:'var(--purple-bg)',border:'1px solid var(--purple)',borderRadius:'8px',color:'var(--purple)',
          padding:'5px 10px',fontSize:'11px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif'
        }}>✕ Bỏ lọc {feeFilter}</button>
      )}
    </div>
    {(monthFund!=='Tất cả'||playerFund!=='Tất cả'||feeFilter!=='Tất cả')&&(
      <div style={{background:'var(--blue-bg)',border:'1px solid var(--blue)',borderRadius:'10px',padding:'10px 14px',marginBottom:'10px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'6px'}}>
        <span style={{fontSize:'13px',color:'var(--blue)',fontWeight:600}}>
          {monthFund!=='Tất cả'?monthFund:'Tất cả tháng'}{playerFund!=='Tất cả'?` · ${playerFund}`:''}{feeFilter!=='Tất cả'?` · ${feeFilter}`:''}: {filteredSessions.length} buổi
        </span>
        <span style={{fontFamily:'Quicksand',fontSize:'16px',fontWeight:700,color:'var(--blue)'}}>
          {playerFund!=='Tất cả' && feeFilter==='Tất cả' ? `Phần của ${playerFund}: ${fmt(playerShareTotal)}` : `Tổng: ${fmt(monthTotal)}`}
        </span>
      </div>
    )}
    {isAdmin && <button className="add-session-btn" onClick={()=>setShowAdd(!showAdd)}>+ Thêm buổi chơi</button>}

    {showAdd && (
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'16px',marginBottom:'12px'}}>
        <div className="fg" style={{marginBottom:'12px'}}>
          <label className="fl">📅 Ngày</label><DateInput value={f.date} onChange={v=>setF(p=>({...p,date:v}))}/>
        </div>

        {/* Chia nhỏ chi phí theo khoản — để lọc/thống kê riêng tiền sân, cầu, nước */}
        <div className="fg" style={{marginBottom:'6px'}}>
          <label className="fl">💰 Chi tiết khoản chi (VNĐ)</label>
        </div>
        <div className="form-grid" style={{marginBottom:'6px'}}>
          <div className="fg"><label className="fl">🎾 Tiền sân</label><MoneyInput value={f.courtFee} onChange={v=>setF(p=>({...p,courtFee:v}))} placeholder="200,000"/></div>
          <div className="fg"><label className="fl">🏸 Tiền cầu/bóng</label><MoneyInput value={f.shuttleFee} onChange={v=>setF(p=>({...p,shuttleFee:v}))} placeholder="150,000"/></div>
          <div className="fg"><label className="fl">💧 Tiền nước</label><MoneyInput value={f.waterFee} onChange={v=>setF(p=>({...p,waterFee:v}))} placeholder="30,000"/></div>
          <div className="fg"><label className="fl">🔖 Khác</label><MoneyInput value={f.otherFee} onChange={v=>setF(p=>({...p,otherFee:v}))} placeholder="0"/></div>
        </div>
        <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'12px'}}>
          Không cần chia nhỏ nếu không muốn — điền hết vào ô <b>Khác</b> cũng được. Tổng: <b style={{color:'var(--yellow)'}}>{fmt(fFeeTotal)}</b>
        </div>

        <div style={{marginBottom:'10px'}}>
          <div className="fl" style={{marginBottom:'6px'}}>Ai đi buổi này? ({Object.entries(f.attendees).filter(([,v])=>v).length} người)</div>
          {/* Quick-select bar */}
          <div style={{display:'flex',gap:'5px',marginBottom:'8px',flexWrap:'wrap'}}>
            <button type="button" onClick={()=>{const a={};members.forEach(m=>{a[m.name]=true;});setF(p=>({...p,attendees:a}));}}
              style={{padding:'3px 10px',borderRadius:'20px',border:'1px solid var(--green)',background:'var(--green-bg)',color:'var(--green)',fontSize:'11px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✅ Tất cả</button>
            <button type="button" onClick={()=>{const a={};members.forEach(m=>{a[m.name]=false;});setF(p=>({...p,attendees:a}));}}
              style={{padding:'3px 10px',borderRadius:'20px',border:'1px solid var(--border)',background:'transparent',color:'var(--muted)',fontSize:'11px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>❌ Bỏ hết</button>
            {(()=>{
              const lastWithAtt=[...sessions].reverse().find(s=>s.attendees&&Object.values(s.attendees).some(Boolean));
              if(!lastWithAtt) return null;
              const cnt=Object.values(lastWithAtt.attendees||{}).filter(Boolean).length;
              return (
                <button type="button" onClick={()=>{const a={};members.forEach(m=>{a[m.name]=!!(lastWithAtt.attendees||{})[m.name];});setF(p=>({...p,attendees:a}));}}
                  style={{padding:'3px 10px',borderRadius:'20px',border:'1px solid var(--purple)',background:'var(--purple-bg)',color:'var(--purple)',fontSize:'11px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>📋 Copy {lastWithAtt.date} ({cnt})</button>
              );
            })()}
            <button type="button" onClick={()=>setF(p=>({...p,attendees:{...p.attendees,'Xé Vé':!p.attendees['Xé Vé']}}))}
              style={{padding:'3px 10px',borderRadius:'20px',border:'1px solid var(--yellow)',background:'var(--yellow-bg)',color:'#92400e',fontSize:'11px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>🎫 Xé Vé</button>
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
            {members.map(m=>{
              const on=!!f.attendees[m.name];
              return (
                <button key={m.name} onClick={()=>toggleAttendee(m.name)} style={{
                  padding:'5px 12px',borderRadius:'20px',border:'1px solid',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',transition:'.15s',
                  borderColor:on?m.color:'var(--border)',
                  background:on?m.color+'33':'transparent',
                  color:on?m.color:'var(--muted)',fontWeight:on?600:400
                }}>{m.name}</button>
              );
            })}
          </div>
          <div style={{fontSize:'11px',color:'var(--muted)',marginTop:'6px'}}>💡 Có người lạ/khách vãng lai chơi cùng? Bấm chọn <b>"Xé Vé"</b> ở trên rồi nhập số người ở khung bên dưới.</div>
        </div>

        {/* Xé vé tùy biến — dùng khi có khách lạ/người ngoài CLB tham gia, không cần thêm họ vào
            danh sách thành viên: nhập đúng số người, tiền sẽ tự chia đều để thu tại chỗ cho dễ. */}
        {!!f.attendees['Xé Vé']&&(
          <div style={{background:'var(--bg3)',borderRadius:'10px',padding:'10px 12px',marginBottom:'10px',border:'1px solid var(--yellow)'}}>
            <div style={{fontSize:'12px',color:'var(--yellow)',fontWeight:600,marginBottom:'8px'}}>🎫 Xé vé tùy biến (khách lạ/người ngoài CLB)</div>
            <div style={{display:'flex',gap:'8px',alignItems:'center',marginBottom:'8px'}}>
              <label className="fl" style={{whiteSpace:'nowrap'}}>Số người xé vé:</label>
              <input className="fi" type="number" min="1" value={f.xeVeCount||''} onChange={e=>setF(p=>({...p,xeVeCount:e.target.value}))} placeholder="2" style={{width:'70px',padding:'5px 8px',fontSize:'13px'}}/>
            </div>
            {fFeeTotal>0 && (()=>{
              const attending=Object.entries(f.attendees).filter(([,v])=>v).map(([k])=>k);
              const xeVeCnt=Math.max(1,parseInt(f.xeVeCount)||1);
              const others=attending.filter(n=>n!=='Xé Vé').length;
              const shares=others+xeVeCnt;
              const per=shares>0?Math.round(fFeeTotal/shares):0;
              return (
                <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',padding:'8px 10px',fontSize:'12px'}}>
                  Mỗi khách lạ đóng: <b style={{color:'var(--green)'}}>{fmt(per)}</b> · Tổng thu từ {xeVeCnt} khách: <b style={{color:'var(--green)'}}>{fmt(per*xeVeCnt)}</b>
                </div>
              );
            })()}
            <div style={{fontSize:'11px',color:'var(--muted)',marginTop:'8px'}}>Tiền của nhóm Xé Vé sẽ được chia đều cho đúng số người này (vẫn tính là 1 phần chung trong tổng buổi, nhưng chia nhỏ ra cho từng người xé vé) — thu đúng số tiền trên từ mỗi khách là đủ, không cần thêm họ vào danh sách thành viên CLB.</div>
          </div>
        )}

        {fFeeTotal>0 && Object.values(f.attendees).filter(Boolean).length>0 && (()=>{
          const attending=Object.entries(f.attendees).filter(([,v])=>v).map(([k])=>k);
          const xeVeOn=attending.includes('Xé Vé');
          const xeVeCnt=xeVeOn?Math.max(1,parseInt(f.xeVeCount)||1):0;
          const others=attending.filter(n=>n!=='Xé Vé').length;
          const shares=others+xeVeCnt;
          const per=shares>0?Math.round(fFeeTotal/shares):0;
          return (
            <div style={{marginBottom:'10px',fontSize:'12px',color:'var(--green)'}}>
              Mỗi thành viên CLB: {fmt(per)}
            </div>
          );
        })()}

        {/* Ai uống nước — chỉ hiện khi có tiền nước; chỉ những người được chọn mới bị chia khoản này,
            người còn lại vẫn chia đều bình thường các khoản sân/cầu/khác */}
        {(parseInt(f.waterFee)||0)>0 && Object.values(f.attendees).filter(Boolean).length>0 && (
          <div style={{marginBottom:'10px'}}>
            <div className="fl" style={{marginBottom:'8px'}}>💧 Ai uống nước? (chỉ người này chịu tiền nước)</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
              {Object.entries(f.attendees).filter(([,v])=>v).map(([name])=>{
                const on=f.waterDrinkers[name]!==false;
                return (
                  <button key={name} onClick={()=>setF(p=>({...p,waterDrinkers:{...p.waterDrinkers,[name]:!on}}))} style={{
                    padding:'5px 12px',borderRadius:'20px',border:'1px solid',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',
                    borderColor:on?'var(--blue)':'var(--border)',
                    background:on?'var(--blue-bg)':'transparent',
                    color:on?'var(--blue)':'var(--muted)',fontWeight:on?600:400
                  }}>{on?'💧 ':'🚱 '}{name}</button>
                );
              })}
            </div>
            <div style={{fontSize:'11px',color:'var(--muted)',marginTop:'6px'}}>Mặc định ai cũng uống nước — bấm vào tên để bỏ người không uống, tiền nước sẽ chỉ chia cho người còn lại.</div>
          </div>
        )}
        <div className="fg" style={{marginBottom:'12px'}}>
          <label className="fl">📝 Ghi chú khác</label>
          <input className="fi" value={f.note||''} onChange={sf('note')} placeholder="VD: Sân Hoàng Anh, giờ chơi 19h..."/>
        </div>
        <div className="form-actions"><button className="btn-cancel" onClick={()=>setShowAdd(false)}>Hủy</button><button className="btn-save" onClick={addSession}>Thêm</button></div>
      </div>
    )}

    <div className="fund-sessions">
      <div className="fs-header" style={{gridTemplateColumns:'62px 1fr 70px 70px 32px'}}>
        <div>Ngày</div><div>Số người</div><div>TB/người</div><div>Tổng</div><div></div>
      </div>
      {(()=>{
        const renderSessionRow=s=>{
          const attending = s.attendees ? Object.entries(s.attendees).filter(([,v])=>v).map(([k])=>k) : [];
          const perPerson = attending.length>0 ? shareAmount(s) : (s.players>0 ? Math.round(s.total/s.players) : 0);
          const xeVeCnt = attending.includes('Xé Vé') ? Math.max(1,parseInt(s.xeVeCount)||1) : 0;
          const isExpanded = expandedSession===s.id;
          return (
            <div key={s.id}>
              <div style={{display:'grid',gridTemplateColumns:'62px 1fr 70px 70px 32px',gap:'6px',padding:'11px 14px',borderBottom:'1px solid var(--border)',fontSize:'13px',alignItems:'center',cursor:'pointer',transition:'.1s'}}
                onClick={()=>setExpandedSession(isExpanded?null:s.id)}>
                <div style={{fontWeight:500}}>{s.date}</div>
                <div style={{color:'var(--muted)',fontSize:'13px',display:'flex',alignItems:'center',gap:'4px'}}>
                  <span style={{fontWeight:600,color:'var(--text)'}}>{attending.length>0?attending.length:s.players}</span>
                  <span>người</span>
                  <span style={{fontSize:'10px',opacity:.6}}>{isExpanded?'▲':'▼'}</span>
                </div>
                <div style={{color:'var(--yellow)',fontWeight:600,fontFamily:'Quicksand,sans-serif',textAlign:'center'}}>
                  {perPerson?fmt(perPerson):'—'}
                </div>
                <div style={{fontWeight:600,fontFamily:'Quicksand,sans-serif'}}>{fmt(s.total)}</div>
                {/* Nút sửa + xóa — e.stopPropagation() để không toggle expand */}
                {isAdmin && (
                  <div style={{display:'flex',flexDirection:'column',gap:'3px',alignItems:'center'}} onClick={e=>e.stopPropagation()}>
                    <button title="Chỉnh sửa" onClick={()=>setEditingSession(s)} style={{background:'var(--blue-bg)',border:'none',borderRadius:'6px',color:'var(--blue)',width:'28px',height:'26px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'13px',flexShrink:0}}>✏️</button>
                    <button title="Xóa" onClick={()=>setConfirmDeleteSession(s.id)} style={{background:'var(--red-bg)',border:'none',borderRadius:'6px',color:'var(--red)',width:'28px',height:'26px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'13px',flexShrink:0}}>🗑</button>
                  </div>
                )}
              </div>
              {isExpanded && (
                <div style={{background:'var(--bg3)',padding:'10px 14px',borderBottom:'1px solid var(--border)'}}>
                  {attending.length>0&&(
                    <>
                      <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'6px',textTransform:'uppercase',letterSpacing:'.5px'}}>Chi tiết người tham dự</div>
                      <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:s.note?'8px':'0'}}>
                        {attending.map(name=>{
                          const mem=members.find(m=>m.name===name);
                          const isXeVe=name==='Xé Vé';
                          // personCost trả về TỔNG của cả nhóm với Xé Vé, và số tiền đúng của riêng người đó với thành viên thường
                          // (đã tách riêng tiền nước — chỉ tính cho người có trong s.waterDrinkers, nếu buổi có bật tính năng này)
                          const entryTotal=personCost(s,name);
                          const label=isXeVe&&xeVeCnt>1?`${name} (${xeVeCnt} người)`:name;
                          const amt=isXeVe&&xeVeCnt>1?`${fmt(Math.round(entryTotal/xeVeCnt))}/người · ${fmt(entryTotal)} tổng`:fmt(entryTotal);
                          const waterTag = s.waterFee>0 ? (s.waterDrinkers ? (s.waterDrinkers[name]?' 💧':' 🚱') : ' 💧') : '';
                          return <span key={name} style={{fontSize:'12px',padding:'3px 10px',borderRadius:'20px',background:(mem?.color||'#888')+'22',color:mem?.color||'#888',fontWeight:500}}>{label} · {amt}{waterTag}</span>;
                        })}
                      </div>
                      {s.waterFee>0 && s.waterDrinkers && attending.some(n=>!s.waterDrinkers[n]) && (
                        <div style={{fontSize:'10.5px',color:'var(--muted)',marginBottom:s.note?'8px':'0'}}>💧 = có uống nước (bị chia tiền nước) · 🚱 = không uống (không chịu tiền nước)</div>
                      )}
                    </>
                  )}
                  {(s.courtFee||s.shuttleFee||s.waterFee||s.otherFee)&&(
                    <>
                      <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'6px',marginTop:'8px',textTransform:'uppercase',letterSpacing:'.5px'}}>Chi tiết khoản chi</div>
                      <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
                        {s.courtFee>0&&<span style={{fontSize:'12px',padding:'3px 10px',borderRadius:'20px',background:'var(--green-bg)',color:'var(--green)',fontWeight:500}}>🎾 Sân: {fmt(s.courtFee)}</span>}
                        {s.shuttleFee>0&&<span style={{fontSize:'12px',padding:'3px 10px',borderRadius:'20px',background:'var(--orange-bg)',color:'var(--orange)',fontWeight:500}}>🏸 Cầu: {fmt(s.shuttleFee)}</span>}
                        {s.waterFee>0&&<span style={{fontSize:'12px',padding:'3px 10px',borderRadius:'20px',background:'var(--blue-bg)',color:'var(--blue)',fontWeight:500}}>💧 Nước: {fmt(s.waterFee)}</span>}
                        {s.otherFee>0&&<span style={{fontSize:'12px',padding:'3px 10px',borderRadius:'20px',background:'var(--purple-bg)',color:'var(--purple)',fontWeight:500}}>🔖 Khác: {fmt(s.otherFee)}</span>}
                      </div>
                    </>
                  )}
                  {s.note&&(
                    <div style={{marginTop:'8px',padding:'7px 10px',background:'var(--yellow-bg)',border:'1px solid var(--yellow)',borderRadius:'8px',fontSize:'12px',color:'var(--text)'}}>
                      <span style={{fontSize:'10px',fontWeight:700,color:'var(--yellow)',textTransform:'uppercase',letterSpacing:'.5px',marginRight:'6px'}}>📝 Ghi chú:</span>{s.note}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        };
        // Sắp xếp theo ngày tháng thực tế (không phải theo thứ tự nhập liệu) —
        // buổi chơi gần đây nhất hiển thị lên đầu, buổi cũ hơn xuống dưới.
        // Nếu 2 buổi cùng ngày, buổi nhập sau hiển thị trước.
        const sortedSessions=[...filteredSessions].sort((a,b)=>{
          const diff=sessionDateKey(b.date)-sessionDateKey(a.date);
          return diff!==0 ? diff : filteredSessions.indexOf(b)-filteredSessions.indexOf(a);
        });
        const firstPage=sortedSessions.slice(0,SESSION_PAGE_SIZE);
        const extra=sortedSessions.slice(SESSION_PAGE_SIZE);
        if(sortedSessions.length===0){
          return <div style={{textAlign:'center',padding:'24px',color:'var(--muted)',fontSize:'13px'}}>
            {playerFund!=='Tất cả' ? `${playerFund} chưa tham gia buổi chơi nào${monthFund!=='Tất cả'?` trong ${monthFund}`:''}.` : 'Không có buổi chơi nào phù hợp.'}
          </div>;
        }
        return <>
          {firstPage.map(renderSessionRow)}
          {extra.length>0 && (
            <div className={`expand-region ${showAllSessions?'expanded':'collapsed'}`}>
              {extra.map(renderSessionRow)}
            </div>
          )}
          {extra.length>0 && (
            <button className="btn-expand-flat" onClick={()=>setShowAllSessions(v=>!v)}>
              {showAllSessions ? '▲ Thu gọn' : `📋 Xem thêm ${extra.length} buổi chơi`}
            </button>
          )}
        </>;
      })()}
      {/* Footer tổng cộng */}
      <div style={{display:'grid',gridTemplateColumns:'62px 1fr 70px 70px 32px',gap:'6px',padding:'11px 14px',background:'var(--bg3)',borderTop:'2px solid var(--border)',fontSize:'13px',fontWeight:700}}>
        <div style={{color:'var(--muted)',fontSize:'11px'}}>TỔNG</div>
        <div style={{color:'var(--muted)',fontSize:'11px'}}>{filteredSessions.length} buổi</div>
        <div></div>
        <div style={{color:'var(--yellow)',fontFamily:'Quicksand,sans-serif'}}>{fmt(monthTotal)}</div>
        <div></div>
      </div>
    </div>

    {/* Modal chỉnh sửa buổi chơi */}
    {editingSession&&(
      <EditSessionModal
        session={editingSession}
        members={members}
        onClose={()=>setEditingSession(null)}
        onSave={updated=>{
          setSessions(p=>p.map(s=>s.id===updated.id?updated:s));
          setEditingSession(null);
        }}
      />
    )}

    {confirmDeleteSession&&<ConfirmModal
      msg={`Xóa buổi chơi ngày ${sessions.find(s=>s.id===confirmDeleteSession)?.date||''}? Dữ liệu chi tiêu buổi này sẽ bị xóa.`}
      onConfirm={()=>deleteSession(confirmDeleteSession)}
      onClose={()=>setConfirmDeleteSession(null)}
    />}
    {confirmDeleteMember!=null&&<ConfirmModal
      msg={`Xóa thành viên "${members[confirmDeleteMember]?.name}"? Toàn bộ lịch sử nạp tiền của người này sẽ bị xóa.`}
      onConfirm={()=>deleteMember(confirmDeleteMember)}
      onClose={()=>setConfirmDeleteMember(null)}
    />}

    {showQRModal && (
      <DebtQRModal
        members={selectedMembers.map(name=>members.find(m=>m.name===name)).filter(Boolean)}
        memberSpent={memberSpent}
        players={players}
        sessions={sessions}
        bankInfo={bankInfo}
        clubName={clubName}
        onClose={()=>setShowQRModal(false)}
        onOpenBankConfig={()=>{setShowQRModal(false);setShowBankConfig(true);}}
      />
    )}
  </>;
}

/* ─── MODAL: TẠO MÃ QR NHẮC NỢ (chọn 1 hoặc nhiều người) ───
   Dùng ảnh QR từ VietQR (img.vietqr.io) — quét là ra đúng số tiền + nội dung,
   mỗi người có 1 thẻ riêng, có thể tải ảnh (html2canvas) để gửi qua Zalo/Messenger. */
function DebtQRModal({members,memberSpent,players,sessions,bankInfo,clubName,onClose,onOpenBankConfig}){
  const hasBank = !!(bankInfo && bankInfo.bankCode && bankInfo.accountNo);
  const cardRefs = React.useRef({});
  const [downloading,setDownloading]=useState(null); // tên đang tải, hoặc 'all'
  const [combineMode,setCombineMode]=useState(false); // true: gộp tất cả người đã chọn thành 1 mã QR duy nhất (dùng khi 1 người trả nợ hộ nhiều người)

  const rows = members.map(m=>{
    const spent = memberSpent[m.name]||0;
    const rem = m.paid-spent;
    const debt = rem<0 ? roundUpFund(Math.abs(rem)) : 0;
    return {...m, debt};
  });


  const downloadCard = async(name)=>{
    const node = cardRefs.current[name];
    if(!node || !window.html2canvas) return;
    setDownloading(name);
    try{
      const canvas = await window.html2canvas(node,{backgroundColor:'#1a1d24',scale:2,useCORS:false,allowTaint:true,imageTimeout:0});
      const link = document.createElement('a');
      link.download = `no-quy-${name.replace(/\s+/g,'-')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }catch(e){}
    setDownloading(null);
  };

  const downloadAll = async()=>{
    setDownloading('all');
    for(const r of rows){
      if(r.debt<=0) continue;
      await downloadCard(r.name);
      await new Promise(res=>setTimeout(res,350));
    }
    setDownloading(null);
  };

  const debtRows = rows.filter(r=>r.debt>0);
  const noDebtRows = rows.filter(r=>r.debt<=0);
  const combinedTotal = debtRows.reduce((s,r)=>s+r.debt,0);

  const downloadCombined = async()=>{
    const node = cardRefs.current['__combined__'];
    if(!node || !window.html2canvas) return;
    setDownloading('__combined__');
    try{
      const canvas = await window.html2canvas(node,{backgroundColor:'#1a1d24',scale:2,useCORS:false,allowTaint:true,imageTimeout:0});
      const link = document.createElement('a');
      link.download = `no-quy-gop-${debtRows.length}-nguoi.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }catch(e){}
    setDownloading(null);
  };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:500,display:'flex',alignItems:'flex-start',justifyContent:'center',overflowY:'auto',padding:'24px 12px'}} onClick={onClose}>

// Khoá bí mật phải khớp với rule ".write" đã publish trên Firebase Console
// (Realtime Database → Rules). Đổi cả 2 nơi cùng lúc nếu muốn thay khoá.
const FB_WRITE_KEY = 'jUS6-lVMLm1sNB3FdseBc5GOjK-EzHlM';

async function fbGet(path){
  // Trả về {ok, data}: ok=false nghĩa là KHÔNG chắc chắn lấy được dữ liệu thật
  // (lỗi mạng / server lỗi) — bên gọi phải phân biệt rõ với "server trả về rỗng thật sự"
  // để không lỡ tay ghi đè dữ liệu thật bằng dữ liệu mặc định lúc khởi tạo app.
  try{
    const r=await fetch(FB_URL+'/'+path+'.json');
    if(!r.ok) return {ok:false,data:null};
    const d=await r.json();
    // Nếu data được wrap với _ts thì unwrap
    const data=(d&&typeof d==='object'&&'_data' in d) ? d._data : d;
    return {ok:true,data};
  }catch{ return {ok:false,data:null}; }
}

// Timestamp lần cuối mình ghi lên Firebase cho từng path
const _fbLastWrite={};
// Flag đang trong quá trình fetch PUT
const _fbSaving={};

async function fbSet(path,val){
  _fbSaving[path]=true;
  const ts=Date.now();
  _fbLastWrite[path]=ts;
  try{
    await fetch(FB_URL+'/'+path+'.json',{method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({_data:val,_ts:ts,_key:FB_WRITE_KEY})
    });
  }catch{}finally{
    setTimeout(()=>{ _fbSaving[path]=false; },2000);
  }
}

// Poll an toàn: chỉ apply data nếu server _ts MỚI HƠN lần cuối mình write + 5s
// → tránh poll kéo data cũ về ghi đè thay đổi local vừa làm
async function fbPoll(path){
  if(_fbSaving[path]) return {ok:false,data:null};
  try{
    const r=await fetch(FB_URL+'/'+path+'.json');
    if(!r.ok) return {ok:false,data:null};
    const d=await r.json();
    if(!d||typeof d!=='object') return {ok:false,data:null};
    const serverTs=d._ts||0;
    const myLastWrite=_fbLastWrite[path]||0;
    // Bỏ qua nếu server timestamp chưa vượt quá lần cuối mình ghi + 5s buffer
    if(serverTs < myLastWrite + 5000) return {ok:false,data:null};
    return {ok:true, data:('_data' in d) ? d._data : d};
  }catch{ return {ok:false,data:null}; }
}
