                    <div style={{fontSize:'11px',color:'var(--muted2)',marginTop:'1px'}}>{item.sub}</div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Giải hài hước */}
          {funItems.length>0&&(
            <div style={{padding:'12px 14px'}}>
              <div style={{fontSize:'11px',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'10px'}}>🎭 Giải thưởng đặc biệt</div>
              <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
                {funItems.map((item,i)=>(
                  <div key={i} style={{display:'flex',gap:'10px',alignItems:'flex-start',padding:'9px 11px',borderRadius:'10px',background:'var(--surface)',border:`1px dashed ${item.color}55`}}>
                    <div style={{fontSize:'18px',lineHeight:1,flexShrink:0,marginTop:'1px'}}>{item.icon}</div>
                    <div>
                      <div style={{fontSize:'10px',color:item.color,fontWeight:700,marginBottom:'2px',textTransform:'uppercase',letterSpacing:'.5px'}}>{item.label}</div>
                      <div style={{fontSize:'13px',fontWeight:700,color:'var(--text)',fontFamily:'Quicksand,sans-serif'}}>{item.main}</div>
                      <div style={{fontSize:'11px',color:'var(--muted2)',marginTop:'1px'}}>{item.sub}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>
      )}
    </div>
  );
}

/* ─── Modal sửa đội sau khi đã tạo giải (chỉ admin) ─── */
function EditTeamsModal({tournament, players, onSave, onClose}){
  const [teams,setTeams]=useState(tournament.teams.map(t=>({...t,players:[...t.players]})));
  const [editingSlot,setEditingSlot]=useState(null); // {ti,pi}
  const [search,setSearch]=useState('');
  const replacePlayer=(ti,pi,newName)=>{
    setTeams(prev=>{
      const next=prev.map(t=>({...t,players:[...t.players]}));
      const oldName=next[ti].players[pi];
      // Nếu người mới đang ở đội khác thì swap
      let swapped=false;
      for(let i=0;i<next.length&&!swapped;i++){
        for(let j=0;j<next[i].players.length&&!swapped;j++){
          if(next[i].players[j]===newName&&!(i===ti&&j===pi)){
            next[i].players[j]=oldName; swapped=true;
          }
        }
      }
      next[ti].players[pi]=newName;
      // Cập nhật avgElo
      next.forEach(t=>{
        const elos=t.players.map(n=>{const p=players.find(x=>x.name===n);return p?p.elo:1500;});
        t.avgElo=Math.round(elos.reduce((s,e)=>s+e,0)/elos.length);
      });
      return next;
    });
    setEditingSlot(null); setSearch('');
  };
  const currentNames=new Set(teams.flatMap(t=>t.players));
  const filteredPlayers=players.filter(p=>!search||p.name.toLowerCase().includes(search.toLowerCase()));
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">✏️ Sửa thành viên đội</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div style={{maxHeight:'62vh',overflowY:'auto'}}>
          <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'12px',lineHeight:1.55}}>
            Bấm vào tên để chọn vị trí cần sửa, rồi chọn người thay thế bên dưới. Người có dấu <b style={{color:'var(--orange)'}}>⇄</b> đang ở đội khác — chọn sẽ tự hoán đổi.
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(148px,1fr))',gap:'8px',marginBottom:'12px'}}>
            {teams.map((t,ti)=>(
              <div key={t.id} style={{border:'1px solid '+(editingSlot?.ti===ti?'var(--purple)':'var(--border)'),borderRadius:'10px',padding:'9px',background:'var(--surface)',transition:'border-color .15s'}}>
                <div style={{fontSize:'10px',color:'var(--muted)',marginBottom:'6px',display:'flex',justifyContent:'space-between'}}>
                  <span style={{fontWeight:700}}>Đội {ti+1}</span><span>{t.avgElo} CĐ</span>
                </div>
                {t.players.map((pname,pi)=>{
                  const isEd=editingSlot&&editingSlot.ti===ti&&editingSlot.pi===pi;
                  return (
                    <button key={pi}
                      onClick={()=>{if(isEd){setEditingSlot(null);setSearch('');}else{setEditingSlot({ti,pi});setSearch('');}}}
                      style={{display:'block',width:'100%',marginBottom:pi<t.players.length-1?'4px':0,padding:'5px 8px',borderRadius:'7px',fontSize:'11px',cursor:'pointer',textAlign:'left',fontFamily:'Nunito,sans-serif',fontWeight:600,background:isEd?'var(--purple)':'var(--bg3)',color:isEd?'#fff':'var(--text)',border:'none',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                      {pname.split(' ').slice(-2).join(' ')} ✎
                    </button>
                  );
                })}
              </div>
            ))}
          </div>
          {editingSlot&&(
            <div style={{background:'var(--surface)',border:'1px solid var(--purple)',borderRadius:'10px',padding:'12px',marginBottom:'8px'}}>
              <div style={{fontSize:'12px',fontWeight:700,color:'var(--purple)',marginBottom:'8px'}}>
                Đang sửa: <span style={{color:'var(--text)'}}>{teams[editingSlot.ti].players[editingSlot.pi]}</span> (Đội {editingSlot.ti+1})
              </div>
              <input className="fi" value={search} onChange={e=>setSearch(e.target.value)}
                placeholder="🔍 Tìm người chơi…" style={{marginBottom:'8px',fontSize:'13px'}} autoFocus/>
              <div style={{display:'flex',flexWrap:'wrap',gap:'5px',maxHeight:'130px',overflowY:'auto'}}>
                {filteredPlayers.map(p=>{
                  const isCur=p.name===teams[editingSlot.ti].players[editingSlot.pi];
                  const inOther=!isCur&&currentNames.has(p.name);
                  return (
                    <button key={p.id} onClick={()=>replacePlayer(editingSlot.ti,editingSlot.pi,p.name)}
                      style={{padding:'4px 10px',borderRadius:'14px',fontSize:'11px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:isCur?700:500,border:'1px solid '+(isCur?'var(--purple)':inOther?'var(--orange)':'var(--border)'),background:isCur?'var(--purple)':'transparent',color:isCur?'#fff':inOther?'var(--orange)':'var(--text)'}}>
                      {p.name.split(' ').slice(-2).join(' ')} ({p.elo}){inOther?' ⇄':''}
                    </button>
                  );
                })}
                {!filteredPlayers.length&&<div style={{fontSize:'12px',color:'var(--muted)',padding:'8px 0'}}>Không tìm thấy</div>}
              </div>
            </div>
          )}
        </div>
        <div className="form-actions">
          <button className="btn-cancel" onClick={onClose}>Huỷ</button>
          <button className="btn-save" onClick={()=>onSave(teams)}>💾 Lưu thay đổi</button>
        </div>
      </div>
    </div>
  );
}

/* ─── GIẢI ĐẤU: Tab tạo & quản lý giải đấu loại trực tiếp ─── */
function TournamentTab({players, tournament, setTournament, isAdmin, showToast, addMatch, matches, sessions}){
  const [creating,setCreating]=useState(false);
  const [tourType,setTourType]=useState('knockout'); // 'knockout' | 'roundrobin'
  const [participantCount,setParticipantCount]=useState(8);
  const [selectedNames,setSelectedNames]=useState([]);
  const [tourName,setTourName]=useState('');
  const [draftTeams,setDraftTeams]=useState(null);
  const [swapPick,setSwapPick]=useState(null);
  const [playerSearch,setPlayerSearch]=useState('');
  const [editingSlot,setEditingSlot]=useState(null); // {ti,pi} — sửa người trong draft
  const [slotSearch,setSlotSearch]=useState(''); // search trong panel thay người
  const [editingMatch,setEditingMatch]=useState(null); // {ri,mi} | 'third'
  const [showEditRound1,setShowEditRound1]=useState(false);
  const [confirmReset,setConfirmReset]=useState(false);
  const [showEditTeams,setShowEditTeams]=useState(false);

  const recentCourtSessions=useMemo(()=>
    [...(sessions||[])].filter(s=>s.attendees&&Object.values(s.attendees).some(Boolean))
      .sort((a,b)=>{
        const pa=a.date.split(/[\/\-]/),pb=b.date.split(/[\/\-]/);
        const da=pa.length>=3?new Date(pa[2],pa[1]-1,pa[0]):new Date(2024,pa[1]-1,pa[0]);
        const db=pb.length>=3?new Date(pb[2],pb[1]-1,pb[0]):new Date(2024,pb[1]-1,pb[0]);
        return db-da;
      }).slice(0,5)
  ,[sessions]);

  const togglePlayer=name=>{
    setSelectedNames(prev=>{
      if(prev.includes(name)) return prev.filter(n=>n!==name);
      if(prev.length>=participantCount) return prev;
      return [...prev,name];
    });
  };

  const doFormTeams=()=>{
    const sel=players.filter(p=>selectedNames.includes(p.name));
    if(sel.length!==participantCount) return;
    setDraftTeams(formBalancedTeams(sel));
  };

  const swapDraftPlayers=(ti,pi)=>{
    if(!swapPick){ setSwapPick({ti,pi}); return; }
    if(swapPick.ti===ti&&swapPick.pi===pi){ setSwapPick(null); return; }
    setDraftTeams(prev=>{
      const next=prev.map(t=>({...t,players:[...t.players]}));
      const a=next[swapPick.ti].players[swapPick.pi];
      const b=next[ti].players[pi];
      next[swapPick.ti].players[swapPick.pi]=b;
      next[ti].players[pi]=a;
      next.forEach(t=>{
        const es=t.players.map(n=>players.find(p=>p.name===n)?.elo||1500);
        t.avgElo=Math.round((es[0]+es[1])/2);
      });
      return next;
    });
    setSwapPick(null);
  };

  const confirmCreateTournament=()=>{
    if(!draftTeams) return;
    try{
      if(tourType==='roundrobin'){
        const rrMatches=buildRoundRobinSchedule(draftTeams);
        setTournament({
          id:'tour_'+Date.now(),
          name:tourName.trim()||'Giải đấu Vòng Tròn',
          createdAt:Date.now(),
          type:'roundrobin',
          teams:draftTeams,
          rrMatches,
        });
      } else {
        const rounds=buildBracketRounds(draftTeams);
        setTournament({
          id:'tour_'+Date.now(),
          name:tourName.trim()||'Giải đấu CLB',
          createdAt:Date.now(),
          type:'knockout',
          teams:draftTeams,
          rounds,
          thirdPlace: rounds.length>=2? computeThirdPlace(rounds,null): null,
        });
      }
      setCreating(false); setDraftTeams(null); setSelectedNames([]); setTourName(''); setPlayerSearch(''); setEditingSlot(null); setSlotSearch('');
      showToast&&showToast('Đã tạo sơ đồ giải đấu!');
    } catch(e){
      showToast&&showToast('❌ Lỗi tạo giải: '+e.message);
    }
  };

  const teamsById=useMemo(()=>{
    const map={};
    (tournament?.teams||[]).forEach(t=>{map[t.id]=t;});
    return map;
  },[tournament]);

  // Phát hiện vô địch
  const champion=useMemo(()=>{
    if(!tournament) return null;
    if(tournament.type==='roundrobin'){
      if(!tournament.rrMatches?.length) return null;
      const allDone=tournament.rrMatches.every(m=>m.scoreA!==''&&m.scoreB!=='');
      if(!allDone) return null;
      const st=computeRRStandings(tournament.teams,tournament.rrMatches);
      return st[0]?{team:(tournament.teams||[]).find(t=>t.id===st[0].id)||null,pts:st[0].pts,wins:st[0].wins}:null;
    } else {
      const lastRound=tournament.rounds?.[tournament.rounds.length-1];
      const finalMatch=lastRound?.matches?.[0];
      if(!finalMatch?.winnerId) return null;
      const map={}; (tournament.teams||[]).forEach(t=>{map[t.id]=t;});
      return {team:map[finalMatch.winnerId]||null};
    }
  },[tournament]);

  // Ghi trận đấu vào lịch sử + tính ELO
  const recordToHistory=(tA, tB, scoreA, scoreB, label)=>{
    if(!addMatch||!tA||!tB) return;
    const sa=parseInt(scoreA), sb=parseInt(scoreB);
    if(isNaN(sa)||isNaN(sb)||sa===sb) return;
    const today=new Date().toISOString().slice(0,10);
    const eloChanges=[];
    const aWin=sa>sb;
    // Tính ELO cho từng người trong đội
    const avgA=Math.round(tA.players.reduce((s,n)=>(s+(players.find(p=>p.name===n)?.elo||1500)),0)/tA.players.length);
    const avgB=Math.round(tB.players.reduce((s,n)=>(s+(players.find(p=>p.name===n)?.elo||1500)),0)/tB.players.length);
    tA.players.forEach(n=>{
      const d=calcEloChangePair(players.find(p=>p.name===n)?.elo||1500,avgB,aWin,'Đôi');
      eloChanges.push({name:n,delta:d});
    });
    tB.players.forEach(n=>{
      const d=calcEloChangePair(players.find(p=>p.name===n)?.elo||1500,avgA,!aWin,'Đôi');
      eloChanges.push({name:n,delta:d});
    });
    addMatch({
      id:Date.now()+'_'+Math.random().toString(36).slice(2,6),
      type:'Đôi', date:today,
      score1:sa, score2:sb,
      result:aWin?'W':'L',
      myTeam:tA.players.join(' & '), oppTeam:tB.players.join(' & '),
      team1Players:tA.players, team2Players:tB.players,
      eloChanges,
      note:label?`[Giải: ${label}]`:'',
    });
  };

  const saveMatchResult=(ri,mi,scoreA,scoreB)=>{
    setTournament(prev=>{
      if(!prev) return prev;
      const rounds=prev.rounds.map(r=>({...r,matches:r.matches.map(m=>({...m}))}));
      const m=rounds[ri].matches[mi];
      const sa=parseInt(scoreA), sb=parseInt(scoreB);
      m.scoreA=scoreA; m.scoreB=scoreB;
      m.winnerId=(!isNaN(sa)&&!isNaN(sb)&&sa!==sb)?(sa>sb?m.teamA:m.teamB):null;
      const newRounds=recomputeBracketRounds(rounds);
      return {...prev, rounds:newRounds, thirdPlace:newRounds.length>=2?computeThirdPlace(newRounds,prev.thirdPlace):null};
    });
    // Ghi lịch sử nếu có tỉ số hợp lệ
    const tA=teamsById[tournament.rounds[ri].matches[mi].teamA];
    const tB=teamsById[tournament.rounds[ri].matches[mi].teamB];
    recordToHistory(tA,tB,scoreA,scoreB,tournament.name+' · '+tournament.rounds[ri].name);
    setEditingMatch(null);
  };

  const saveThirdPlace=(scoreA,scoreB)=>{
    const tA=teamsById[tournament.thirdPlace.teamA], tB=teamsById[tournament.thirdPlace.teamB];
    setTournament(prev=>{
      if(!prev||!prev.thirdPlace) return prev;
      const sa=parseInt(scoreA), sb=parseInt(scoreB);
      const winnerId=(!isNaN(sa)&&!isNaN(sb)&&sa!==sb)?(sa>sb?prev.thirdPlace.teamA:prev.thirdPlace.teamB):null;
      return {...prev, thirdPlace:{...prev.thirdPlace, scoreA, scoreB, winnerId}};
    });
    recordToHistory(tA,tB,scoreA,scoreB,tournament.name+' · Hạng 3');
    setEditingMatch(null);
  };

  const saveRRMatch=(matchId,scoreA,scoreB)=>{
    const m=tournament.rrMatches.find(x=>x.id===matchId);
    if(!m) return;
    const tA=teamsById[m.teamA], tB=teamsById[m.teamB];
    setTournament(prev=>{
      if(!prev) return prev;
      const rrMatches=prev.rrMatches.map(x=>{
        if(x.id!==matchId) return x;
        const sa=parseInt(scoreA), sb=parseInt(scoreB);
        const winnerId=(!isNaN(sa)&&!isNaN(sb)&&sa!==sb)?(sa>sb?x.teamA:x.teamB):null;
        return {...x,scoreA,scoreB,winnerId};
      });
      return {...prev,rrMatches};
    });
    recordToHistory(tA,tB,scoreA,scoreB,tournament.name+' · Vòng tròn');
    setEditingMatch(null);
  };

  const saveRound1Order=newSlots=>{
    setTournament(prev=>{
      if(!prev) return prev;
      const rounds=prev.rounds.map(r=>({...r,matches:r.matches.map(m=>({...m}))}));
      const r0=rounds[0].matches;
      for(let i=0;i<r0.length;i++){
        r0[i].teamA=newSlots[i*2]||null; r0[i].teamB=newSlots[i*2+1]||null;
        r0[i].scoreA=''; r0[i].scoreB=''; r0[i].winnerId=null;
      }
      const newRounds=recomputeBracketRounds(rounds);
      return {...prev, rounds:newRounds, thirdPlace:newRounds.length>=2?computeThirdPlace(newRounds,null):null};
    });
    setShowEditRound1(false);
    showToast&&showToast('Đã cập nhật cặp đấu Vòng 1.');
  };

  const saveEditedTeams=(newTeams)=>{
    setTournament(prev=>prev?{...prev,teams:newTeams}:prev);
    setShowEditTeams(false);
    showToast&&showToast('✅ Đã cập nhật thành viên đội!');
  };

  const resetTournament=()=>{
    setTournament(null);
    fbSet('tournament',null);
    setConfirmReset(false);
    showToast&&showToast('Đã xoá giải đấu.');
  };

  // Phòng trường hợp dữ liệu giải đấu bị thiếu/hỏng (vd. Firebase trả về object
  // rỗng cho "rounds") — coi như chưa có giải đấu thay vì crash cả app.
  const tournamentBroken = tournament && (
    tournament.type==='roundrobin'
      ? !Array.isArray(tournament.rrMatches)||tournament.rrMatches.length===0
      : !Array.isArray(tournament.rounds)||tournament.rounds.length===0
  );

  if(!tournament || tournamentBroken){
    return <>
      {tournamentBroken && (
        <div style={{textAlign:'center',padding:'14px',marginBottom:'14px',color:'var(--red)',background:'var(--red-bg)',borderRadius:'10px',border:'1px solid var(--red)',fontSize:'12.5px'}}>
          ⚠️ Dữ liệu sơ đồ giải đấu bị lỗi/thiếu, không hiển thị được. {isAdmin?'Bấm "Xoá giải" bên dưới rồi tạo lại giúp mình nhé.':'Nhờ admin kiểm tra lại giúp nhé.'}
          {isAdmin && <div style={{marginTop:'8px'}}><button onClick={()=>{setTournament(null);fbSet('tournament',null);showToast&&showToast('Đã xoá giải đấu lỗi.');}} style={{background:'var(--red)',border:'none',borderRadius:'8px',color:'#fff',padding:'6px 14px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>🗑 Xoá giải đấu lỗi</button></div>}
        </div>
      )}
      {!creating && (
        <div style={{textAlign:'center',padding:'40px 20px',color:'var(--muted)',background:'var(--surface)',borderRadius:'14px',border:'1px solid var(--border)'}}>
          <div style={{fontSize:'36px',marginBottom:'10px'}}>🏆</div>
          <div style={{marginBottom:'14px'}}>Chưa có giải đấu nào đang diễn ra.</div>
          {isAdmin ? (
            <button className="btn-save" style={{display:'inline-block',padding:'10px 20px'}} onClick={()=>{setCreating(true);setDraftTeams(null);}}>+ Tạo giải đấu mới</button>
          ):(
            <div style={{fontSize:'12px'}}>Chỉ admin mới có thể tạo giải đấu.</div>
          )}
        </div>
      )}

      {creating && !draftTeams && (
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',padding:'16px'}}>
          <div className="fg" style={{marginBottom:'12px'}}>
            <label className="fl">Loại giải đấu</label>
            <div style={{display:'flex',gap:'8px'}}>
              {[['knockout','⚡ Loại trực tiếp'],['roundrobin','🔄 Tính điểm (Vòng tròn)']].map(([v,lb])=>(
                <button key={v} onClick={()=>{setTourType(v);setSelectedNames([]);setParticipantCount(v==='roundrobin'?8:8);}} style={{
                  flex:1,padding:'8px',borderRadius:'8px',border:'1px solid',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:600,
                  borderColor:tourType===v?'var(--purple)':'var(--border)',
                  background:tourType===v?'var(--purple-bg)':'transparent',
                  color:tourType===v?'var(--purple)':'var(--muted)'}}>
                  {lb}
                </button>
              ))}
            </div>
            {tourType==='roundrobin'&&<div style={{fontSize:'11px',color:'var(--muted)',marginTop:'4px'}}>Mỗi đội đấu với tất cả. Thắng = 2đ. Xếp hạng theo điểm + hiệu số.</div>}
          </div>
          <div className="fg" style={{marginBottom:'12px'}}>
            <label className="fl">Tên giải đấu (tuỳ chọn)</label>
            <input className="fi" value={tourName} onChange={e=>setTourName(e.target.value)} placeholder={tourType==='roundrobin'?'VD: Giải giao lưu tháng 10':'VD: Giải giao lưu cuối năm'}/>
          </div>
          <div className="fg" style={{marginBottom:'12px'}}>
            <label className="fl">Số người tham gia</label>
            <select className="fi" value={participantCount} onChange={e=>{setParticipantCount(parseInt(e.target.value));setSelectedNames([]);}}>
              {(tourType==='roundrobin'?[4,6,8]:[4,8,16,32]).map(n=><option key={n} value={n}>{n} người ({n/2} đội){tourType==='roundrobin'?` — ${(n/2)*((n/2)-1)/2} trận`:''}</option>)}
            </select>
          </div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px',flexWrap:'wrap',gap:'6px'}}>
            <div className="fl">Chọn người chơi ({selectedNames.length}/{participantCount})</div>
            <div style={{display:'flex',gap:'5px',flexWrap:'wrap'}}>
              {/* Nút lấy từ buổi chơi */}
              {recentCourtSessions.length>0&&(
                <div style={{position:'relative'}}>
                  <select onChange={e=>{
                    if(!e.target.value) return;
                    const s=recentCourtSessions.find(x=>String(x.id)===e.target.value);
                    if(!s?.attendees) return;
                    const att=Object.entries(s.attendees).filter(([,v])=>v).map(([k])=>k)
                      .filter(n=>players.some(p=>p.name===n));
                    // Lấy tối đa participantCount người, ưu tiên ELO cao nhất
                    const sorted=[...players].filter(p=>att.includes(p.name)).sort((a,b)=>b.elo-a.elo).map(p=>p.name);
                    setSelectedNames(sorted.slice(0,participantCount));
                    e.target.value='';
                  }} style={{padding:'3px 8px',borderRadius:'6px',border:'1px solid var(--purple)',background:'var(--purple-bg)',color:'var(--purple)',fontSize:'11px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:600,maxWidth:'150px'}}>
                    <option value=''>📅 Lấy từ buổi...</option>
                    {recentCourtSessions.map(s=>{
                      const cnt=Object.values(s.attendees||{}).filter(Boolean).length;
                      return <option key={s.id} value={s.id}>{s.date} · {cnt} người</option>;
                    })}
                  </select>
                </div>
              )}
              {selectedNames.length>0&&<button onClick={()=>setSelectedNames([])} style={{fontSize:'11px',color:'var(--red)',background:'var(--red-bg)',border:'1px solid var(--red)',borderRadius:'6px',padding:'3px 8px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✕ Xoá</button>}
            </div>
          </div>
          <div style={{position:'relative',marginBottom:'8px'}}>
            <span style={{position:'absolute',left:'10px',top:'50%',transform:'translateY(-50%)',fontSize:'13px',color:'var(--muted)',pointerEvents:'none'}}>🔍</span>
            <input className="fi" value={playerSearch} onChange={e=>setPlayerSearch(e.target.value)}
              placeholder="Tìm kiếm tên người chơi…"
              style={{paddingLeft:'30px',background:'var(--surface2)'}}/>
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'14px',maxHeight:'220px',overflowY:'auto'}}>
            {[...players].sort((a,b)=>b.elo-a.elo)
              .filter(p=>!playerSearch||p.name.toLowerCase().includes(playerSearch.toLowerCase()))
              .map(p=>{
                const on=selectedNames.includes(p.name);
                const disabled=!on&&selectedNames.length>=participantCount;
                return (
                  <button key={p.id} disabled={disabled} onClick={()=>togglePlayer(p.name)} style={{
                    padding:'6px 12px',borderRadius:'20px',border:'1px solid',fontSize:'12px',cursor:disabled?'not-allowed':'pointer',
                    fontFamily:'Nunito,sans-serif',opacity:disabled?.4:1,
                    borderColor:on?'var(--purple)':'var(--border)',
                    background:on?'var(--purple-bg)':'transparent',
                    color:on?'var(--purple)':'var(--muted)',fontWeight:on?700:500,
                    display:'flex',alignItems:'center',gap:'4px'}}>
                    {on&&<span style={{fontSize:'10px'}}>✓</span>}
                    {p.name.split(' ').slice(-2).join(' ')} <span style={{opacity:.7}}>({p.elo})</span>
                  </button>
                );
              })}
            {players.filter(p=>!playerSearch||p.name.toLowerCase().includes(playerSearch.toLowerCase())).length===0&&(
              <div style={{color:'var(--muted)',fontSize:'12px',padding:'10px 0'}}>Không tìm thấy "{playerSearch}"</div>
            )}
          </div>
          <div style={{display:'flex',gap:'8px'}}>
            <button className="btn-cancel" onClick={()=>{setCreating(false);setSelectedNames([]);setPlayerSearch('');}}>Huỷ</button>
            <button className="btn-save" style={{flex:1}} disabled={selectedNames.length!==participantCount} onClick={doFormTeams}>
              🎲 Ghép đội theo Công Đức
            </button>
          </div>
        </div>
      )}

      {creating && draftTeams && (
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',padding:'16px'}}>
          <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'12px'}}>
            💡 Đã ghép người mạnh với người yếu để các đội cân sức nhau. <b style={{color:'var(--text)'}}>Bấm đổi↕</b> để hoán vị 2 người giữa các đội. <b style={{color:'var(--text)'}}>Bấm ✎</b> để thay thế bằng người khác tuỳ ý.
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:'10px',marginBottom:'14px'}}>
            {draftTeams.map((t,ti)=>(
              <div key={t.id} style={{border:'1px solid var(--border)',borderRadius:'10px',padding:'10px'}}>
                <div style={{fontSize:'10px',color:'var(--muted)',marginBottom:'6px',display:'flex',justifyContent:'space-between'}}>
                  <span>Đội {ti+1}</span><span>TB: {t.avgElo} CĐ</span>
                </div>
                {t.players.map((pname,pi)=>{
                  const picked=swapPick&&swapPick.ti===ti&&swapPick.pi===pi;
                  const isEditing=editingSlot&&editingSlot.ti===ti&&editingSlot.pi===pi;
                  return (
                    <div key={pi} style={{display:'flex',gap:'4px',marginBottom:pi===0?'4px':0,alignItems:'center'}}>
                      <div onClick={()=>{if(editingSlot)return;swapDraftPlayers(ti,pi);}} style={{
                        flex:1,padding:'5px 8px',borderRadius:'7px',fontSize:'12px',cursor:'pointer',
                        background:picked?'var(--purple)':'var(--surface2)',
                        color:picked?'#fff':'var(--text)',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                        {pname.split(' ').slice(-2).join(' ')}
                      </div>
                      <button onClick={()=>{if(isEditing){setEditingSlot(null);setSlotSearch('');}else{setEditingSlot({ti,pi});setSlotSearch('');setSwapPick(null);}}} title="Thay bằng người khác" style={{
                        flexShrink:0,width:'24px',height:'24px',borderRadius:'6px',border:'1px solid',fontSize:'11px',cursor:'pointer',fontFamily:'Nunito,sans-serif',
                        borderColor:isEditing?'var(--purple)':'var(--border2)',
                        background:isEditing?'var(--purple-bg)':'transparent',
                        color:isEditing?'var(--purple)':'var(--muted)',padding:0,display:'flex',alignItems:'center',justifyContent:'center'}}>✎</button>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>

          {editingSlot && (()=>{
            const curName=draftTeams[editingSlot.ti].players[editingSlot.pi];
            // Chỉ cho chọn trong số người đã tham gia giải — xoay vòng giữa các vị trí
            const allDraftNames=draftTeams.flatMap(t=>t.players);
            const avail=players.filter(p=>allDraftNames.includes(p.name));
            const filtered=avail.filter(p=>!slotSearch||p.name.toLowerCase().includes(slotSearch.toLowerCase()));
            return (
              <div style={{background:'var(--bg3)',border:'1px solid var(--purple)',borderRadius:'10px',padding:'12px',marginBottom:'12px'}}>
                <div style={{fontSize:'12px',fontWeight:600,marginBottom:'8px',color:'var(--purple)'}}>
                  🔄 Đổi chỗ — Đội {editingSlot.ti+1} · vị trí {editingSlot.pi+1} · đang là: <b>{curName.split(' ').slice(-2).join(' ')}</b>
                </div>
                <div style={{position:'relative',marginBottom:'8px'}}>
                  <span style={{position:'absolute',left:'10px',top:'50%',transform:'translateY(-50%)',fontSize:'12px',color:'var(--muted)',pointerEvents:'none'}}>🔍</span>
                  <input className="fi" value={slotSearch} onChange={e=>setSlotSearch(e.target.value)}
                    placeholder="Tìm người thay thế…" style={{paddingLeft:'30px',background:'var(--surface)'}}/>
                </div>
                <div style={{display:'flex',flexWrap:'wrap',gap:'5px',maxHeight:'140px',overflowY:'auto'}}>
                  {filtered.map(p=>{
                    const isCur=p.name===curName;
                    return (
                      <button key={p.id} onClick={()=>{
                        if(!isCur){
                          setDraftTeams(prev=>{
                            const next=prev.map(t=>({...t,players:[...t.players]}));
                            for(let i=0;i<next.length;i++) for(let j=0;j<next[i].players.length;j++){
                              if(next[i].players[j]===p.name&&!(i===editingSlot.ti&&j===editingSlot.pi)){
                                next[i].players[j]=curName;
                              }
                            }
                            next[editingSlot.ti].players[editingSlot.pi]=p.name;
                            next.forEach(t=>{const es=t.players.map(n=>players.find(x=>x.name===n)?.elo||1500);t.avgElo=Math.round((es[0]+es[1])/2);});
                            return next;
                          });
                        }
                        setEditingSlot(null); setSlotSearch('');
                      }} style={{
                        padding:'5px 10px',borderRadius:'16px',border:'1px solid',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',
                        borderColor:isCur?'var(--purple)':'var(--border)',
                        background:isCur?'var(--purple)':'transparent',
                        color:isCur?'#fff':'var(--text)',fontWeight:isCur?700:500}}>
                        {p.name.split(' ').slice(-2).join(' ')} ({p.elo})
                      </button>
                    );
                  })}
                  {filtered.length===0&&<span style={{fontSize:'12px',color:'var(--muted)'}}>Không tìm thấy</span>}
                </div>
                <button onClick={()=>{setEditingSlot(null);setSlotSearch('');}} style={{marginTop:'8px',fontSize:'11px',color:'var(--muted)',background:'transparent',border:'none',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✕ Đóng</button>
              </div>
            );
          })()}

          <div style={{display:'flex',gap:'8px'}}>
            <button className="btn-cancel" onClick={()=>{setDraftTeams(null);setEditingSlot(null);setSlotSearch('');}}>← Chọn lại người chơi</button>
            <button className="btn-save" style={{flex:1}} onClick={confirmCreateTournament}>✅ Tạo sơ đồ giải đấu</button>
          </div>
        </div>
      )}
    </>;
  }

  const isRR = tournament.type==='roundrobin';

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'8px',marginBottom:'12px'}}>
      <div>
        <div className="section-title">{isRR?'🔄':'🏆'} {tournament.name}</div>
        <div style={{fontSize:'11px',color:'var(--muted)',marginTop:'2px'}}>{isRR?'Vòng tròn tính điểm':'Loại trực tiếp'} · {tournament.teams.length} đội</div>
      </div>
      {isAdmin && (
        <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
          <button onClick={()=>setShowEditTeams(true)} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--text)',padding:'6px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✏️ Sửa đội</button>
          {!isRR&&<button onClick={()=>setShowEditRound1(true)} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--text)',padding:'6px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>🔀 Sửa cặp Vòng 1</button>}
          <button onClick={()=>setConfirmReset(true)} style={{background:'var(--red-bg)',border:'1px solid var(--red)',borderRadius:'8px',color:'var(--red)',padding:'6px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>🗑 Xoá giải</button>
        </div>
      )}
    </div>

    {/* ── VINH DANH VÔ ĐỊCH ── */}
    {champion && champion.team && (
      <div style={{
        background:'linear-gradient(135deg,#78350f,#92400e,#b45309)',
        border:'2px solid #fbbf24',borderRadius:'14px',padding:'18px 20px',
        textAlign:'center',marginBottom:'14px',
        boxShadow:'0 4px 20px rgba(251,191,36,.35)'
      }}>
        <div style={{fontSize:'32px',marginBottom:'4px'}}>🏆</div>
        <div style={{fontFamily:'Quicksand,sans-serif',fontWeight:800,fontSize:'15px',color:'#fef3c7',letterSpacing:'.3px',marginBottom:'4px'}}>
          VÔ ĐỊCH · {tournament.name}
        </div>
        <div style={{fontSize:'22px',fontWeight:900,color:'#fbbf24',fontFamily:'Quicksand,sans-serif',marginBottom:'6px'}}>
          {champion.team.players.map(n=>n.split(' ').slice(-2).join(' ')).join(' & ')}
        </div>
        {champion.pts!=null && (
          <div style={{fontSize:'12px',color:'#fde68a',opacity:.85}}>
            {champion.wins} thắng · {champion.pts} điểm
          </div>
        )}
        <div style={{marginTop:'8px',display:'flex',justifyContent:'center',gap:'6px',flexWrap:'wrap'}}>
          {champion.team.players.map(n=>(
            <span key={n} style={{background:'rgba(251,191,36,.2)',border:'1px solid rgba(251,191,36,.5)',borderRadius:'20px',padding:'3px 10px',fontSize:'12px',color:'#fde68a',fontWeight:700}}>
              👑 {n.split(' ').slice(-2).join(' ')}
            </span>
          ))}
        </div>
      </div>
    )}

    {/* ── PHÂN TÍCH SAU GIẢI ── */}
    {champion && <TournamentAnalysis tournament={tournament} teamsById={teamsById}/>}

    {/* ── LOẠI TRỰC TIẾP ── */}
    {!isRR && <>
      <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'12px'}}>💡 Bấm vào 1 trận để nhập tỉ số — kết quả tự ghi vào lịch sử &amp; cập nhật Công Đức.</div>
      <BracketView rounds={tournament.rounds} thirdPlace={tournament.thirdPlace} teamsById={teamsById} isAdmin={isAdmin}
        onEditMatch={(ri,mi)=>setEditingMatch({ri,mi})}
        onEditThirdPlace={()=>setEditingMatch('third')}
      />
      {editingMatch && editingMatch!=='third' && (()=>{
        const m=tournament.rounds[editingMatch.ri].matches[editingMatch.mi];
        const tA=teamsById[m.teamA], tB=teamsById[m.teamB];
        if(!tA||!tB) return null;
        return <MatchScoreModal label={tournament.rounds[editingMatch.ri].name}
          teamAName={tA.players.join(' & ')} teamBName={tB.players.join(' & ')}
          initialA={m.scoreA} initialB={m.scoreB}
          onClose={()=>setEditingMatch(null)}
          onSave={(a,b)=>saveMatchResult(editingMatch.ri,editingMatch.mi,a,b)}/>;
      })()}
      {editingMatch==='third' && tournament.thirdPlace && (()=>{
        const tA=teamsById[tournament.thirdPlace.teamA], tB=teamsById[tournament.thirdPlace.teamB];
        if(!tA||!tB) return null;
        return <MatchScoreModal label="🥉 Tranh Hạng 3"
          teamAName={tA.players.join(' & ')} teamBName={tB.players.join(' & ')}
          initialA={tournament.thirdPlace.scoreA} initialB={tournament.thirdPlace.scoreB}
          onClose={()=>setEditingMatch(null)}
          onSave={(a,b)=>saveThirdPlace(a,b)}/>;
      })()}
      {showEditRound1 && <EditRound1Modal teams={tournament.teams} round0={tournament.rounds[0].matches}
        onClose={()=>setShowEditRound1(false)} onSave={saveRound1Order}/>}
    </>}

    {/* ── VÒNG TRÒN ── */}
    {isRR && <RoundRobinView
      rrMatches={tournament.rrMatches} teams={tournament.teams} teamsById={teamsById}
      isAdmin={isAdmin}
      onEditMatch={mid=>setEditingMatch(mid)}
    />}
    {isRR && editingMatch && (()=>{
      const m=tournament.rrMatches.find(x=>x.id===editingMatch);
      const tA=teamsById[m?.teamA], tB=teamsById[m?.teamB];
      if(!tA||!tB) return null;
      return <MatchScoreModal label="🔄 Nhập tỉ số"
        teamAName={tA.players.join(' & ')} teamBName={tB.players.join(' & ')}
        initialA={m.scoreA} initialB={m.scoreB}
        onClose={()=>setEditingMatch(null)}
        onSave={(a,b)=>saveRRMatch(editingMatch,a,b)}/>;
    })()}

    {showEditTeams && <EditTeamsModal tournament={tournament} players={players} onSave={saveEditedTeams} onClose={()=>setShowEditTeams(false)}/>}
    {confirmReset && (
      <ConfirmModal msg="Xoá giải đấu hiện tại? Toàn bộ kết quả sẽ mất." onConfirm={resetTournament} onClose={()=>setConfirmReset(false)}/>
    )}
  </>;
}

/* ─── PlayerPicker: chọn người có tìm kiếm ─── */
function PlayerPicker({value, onChange, exclude=[], players, label, accentColor}){
  const [open,setOpen]=useState(false);
  const [search,setSearch]=useState('');
  const selected=players.find(p=>p.name===value);
  const opts=players.filter(p=>!exclude.filter(Boolean).includes(p.name)&&(!search||p.name.toLowerCase().includes(search.toLowerCase())));
  const color=accentColor||'var(--purple)';
  const close=()=>{setOpen(false);setSearch('');};
  return (
    <div style={{position:'relative'}}>
      {label&&<div className="fl" style={{marginBottom:'6px',color}}>{label}</div>}
      <button onClick={()=>{setOpen(o=>!o);setSearch('');}}
        style={{width:'100%',padding:'9px 11px',borderRadius:'10px',border:'1px solid',cursor:'pointer',
          textAlign:'left',fontFamily:'Nunito,sans-serif',background:'var(--surface)',
          borderColor:open?color:'var(--border)',
          display:'flex',alignItems:'center',gap:'8px',transition:'border-color .15s'}}>
        {selected?(
          <>
            <div style={{width:28,height:28,borderRadius:'50%',background:selected.avatar?'transparent':(selected.color||'#888')+'22',color:selected.color||'#888',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',fontWeight:700,flexShrink:0,overflow:'hidden'}}>
              {selected.avatar?<img src={selected.avatar} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:selected.name.split(' ').slice(-1)[0].slice(0,2).toUpperCase()}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:'13px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{selected.name.split(' ').slice(-2).join(' ')}</div>
              <div style={{fontSize:'11px',color:'var(--muted)'}}>{selected.elo} CĐ</div>
            </div>
          </>
        ):(
          <div style={{flex:1,color:'var(--muted)',fontSize:'13px'}}>— Chọn người —</div>
        )}
        <span style={{fontSize:'10px',color:'var(--muted)',flexShrink:0}}>{open?'▲':'▼'}</span>
      </button>
      {open&&(
        <div style={{position:'absolute',left:0,right:0,top:'100%',marginTop:'4px',zIndex:200,
          background:'var(--surface)',border:'1px solid '+color,borderRadius:'10px',
          overflow:'hidden',boxShadow:'0 6px 20px rgba(0,0,0,.25)'}}>
          <div style={{padding:'8px'}}>
            <input className="fi" value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="🔍 Tìm tên…" style={{fontSize:'13px',margin:0}} autoFocus/>
          </div>
          <div style={{maxHeight:'220px',overflowY:'auto',borderTop:'1px solid var(--border)'}}>
            {!opts.length&&<div style={{textAlign:'center',padding:'16px',color:'var(--muted)',fontSize:'13px'}}>Không tìm thấy</div>}
            {opts.map(p=>{
              const isSel=p.name===value;
              return (
                <div key={p.name} onClick={()=>{onChange(p.name);close();}}
                  style={{padding:'9px 12px',cursor:'pointer',display:'flex',alignItems:'center',gap:'10px',
                    background:isSel?'var(--purple-bg)':'transparent',
                    borderBottom:'1px solid var(--border)',transition:'background .1s'}}>
                  <div style={{width:32,height:32,borderRadius:'50%',background:p.avatar?'transparent':(p.color||'#888')+'22',color:p.color||'#888',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:700,flexShrink:0,overflow:'hidden'}}>
                    {p.avatar?<img src={p.avatar} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:p.name.split(' ').slice(-1)[0].slice(0,2).toUpperCase()}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:'13px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:isSel?'var(--purple)':'var(--text)'}}>{p.name}</div>
                    <div style={{fontSize:'11px',color:'var(--muted)'}}>{p.elo} Công Đức</div>
                  </div>
                  {isSel&&<div style={{color:'var(--purple)',fontSize:'16px',fontWeight:800}}>✓</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function SoKeoTab({players, matches, sessions, tournament, setTournament, isAdmin, showToast, addMatch}){
  const [mode,setMode]=useState('doi'); // 'don' | 'doi'
  const [mainTab,setMainTab]=useState('phantich'); // 'phantich' | 'spin' | 'giaidau'
  const [analyzeTab,setAnalyzeTab]=useState('sokeo'); // 'sokeo' | 'partner'
  // Đơn
  const [pA,setPa]=useState('');
  const [pB,setPb]=useState('');
  // Đôi
  const [d1a,setD1a]=useState('');
  const [d1b,setD1b]=useState('');
  const [d2a,setD2a]=useState('');
  const [d2b,setD2b]=useState('');
  // Partner analysis
  const [partnerFor,setPartnerFor]=useState('');
  const [partnerLimit,setPartnerLimit]=useState(5);
  // H2H expanded
  const [h2hExpanded,setH2hExpanded]=useState(false);
  // Spin / chia đội
  const recentCourtSessions=useMemo(()=>
    [...(sessions||[])].filter(s=>s.attendees&&Object.values(s.attendees).some(Boolean))
      .sort((a,b)=>{
        const pa=a.date.split(/[\/\-]/),pb=b.date.split(/[\/\-]/);
        const da=pa.length>=3?new Date(pa[2],pa[1]-1,pa[0]):new Date(2024,pa[1]-1,pa[0]);
        const db=pb.length>=3?new Date(pb[2],pb[1]-1,pb[0]):new Date(2024,pb[1]-1,pb[0]);
        return db-da||(b.id-a.id);
      }).slice(0,10)
  ,[sessions]);
  // Chỉ hiện người có buổi chơi gần đây trong So Kèo / Ăn Ý
  const recentPlayerNames=useMemo(()=>{const s=new Set();recentCourtSessions.forEach(x=>Object.entries(x.attendees||{}).filter(([,v])=>v).forEach(([k])=>s.add(k)));return s;},[recentCourtSessions]);
  const recentPlayers=useMemo(()=>players.filter(p=>recentPlayerNames.has(p.name)||!recentCourtSessions.length),[players,recentPlayerNames,recentCourtSessions.length]);
  const [spinSessionId,setSpinSessionId]=useState('');
  const [spinPlayers,setSpinPlayers]=useState([]);
  const [spinMode,setSpinMode]=useState('random'); // 'random' | 'elo'
  const [spinResult,setSpinResult]=useState(null);
  const [spinning,setSpinning]=useState(false);

  // Khi chọn buổi → auto điền spinPlayers từ attendees
  const pickSpinSession=(id)=>{
    setSpinSessionId(id);
    setSpinResult(null);
    if(!id){setSpinPlayers([]);return;}
    const s=recentCourtSessions.find(x=>String(x.id)===String(id));
    if(s?.attendees){
      const att=Object.entries(s.attendees).filter(([,v])=>v).map(([k])=>k);
      setSpinPlayers(att);
    }
  };

  const analysis = useMemo(()=>{
    if(mode==='don'){
      const pa=players.find(p=>p.name===pA), pb=players.find(p=>p.name===pB);
      if(!pa||!pb||pa===pb) return null;
      const diff=pa.elo-pb.elo;
      const winPctA=Math.round(1/(1+Math.pow(10,-diff/400))*100);
      // handicap: số quả chấp (mỗi 50 ELO ~ 1 quả chấp trong pickleball)
      const handicap=Math.round(Math.abs(diff)/60);
      const stronger=diff>0?pa:pb;
      const weaker=diff>0?pb:pa;
      // h2h
      const h2h=matches.filter(m=>{
        return (m.team1Players||[]).includes(pa.name)&&(m.team2Players||[]).includes(pb.name)||
               (m.team1Players||[]).includes(pb.name)&&(m.team2Players||[]).includes(pa.name);
      });
      let wA=0,wB=0;
      h2h.forEach(m=>{
        const aInT1=(m.team1Players||[]).includes(pa.name);
        if(aInT1&&m.result==='W') wA++;
        else if(!aInT1&&m.result==='L') wA++;
        else wB++;
      });
      return {type:'don',pa,pb,diff:Math.abs(diff),winPctA,winPctB:100-winPctA,handicap,stronger,weaker,h2h,wA,wB,
        quality:Math.max(0,100-Math.round(Math.abs(diff)/8))};
    } else {
      const pa=players.find(p=>p.name===d1a),pb=players.find(p=>p.name===d1b);
      const pc=players.find(p=>p.name===d2a),pd=players.find(p=>p.name===d2b);
      if(!pa||!pc) return null;
      const elo1=Math.round((pa.elo+(pb?.elo||pa.elo))/2);
      const elo2=Math.round((pc.elo+(pd?.elo||pc.elo))/2);
      const diff=elo1-elo2;
      const winPct1=Math.round(1/(1+Math.pow(10,-diff/400))*100);
      const handicap=Math.round(Math.abs(diff)/60);
      const t1=[pa,pb].filter(Boolean), t2=[pc,pd].filter(Boolean);
      const stronger=diff>0?t1.map(p=>p.name).join(' & '):t2.map(p=>p.name).join(' & ');
      const weaker=diff>0?t2.map(p=>p.name).join(' & '):t1.map(p=>p.name).join(' & ');
      // h2h for team
      const h2h=matches.filter(m=>{
        const t1p=m.team1Players||[], t2p=m.team2Players||[];
        return (t1p.includes(d1a)||t1p.includes(d1b||'__'))&&(t2p.includes(d2a)||t2p.includes(d2b||'__'))||
               (t2p.includes(d1a)||t2p.includes(d1b||'__'))&&(t1p.includes(d2a)||t1p.includes(d2b||'__'));
      });
      return {type:'doi',t1,t2,elo1,elo2,diff:Math.abs(diff),winPct1,winPct2:100-winPct1,handicap,stronger,weaker,h2h,
        quality:Math.max(0,100-Math.round(Math.abs(diff)/8))};
    }
  },[mode,pA,pB,d1a,d1b,d2a,d2b,players,matches]);

  const qColor=q=>q>=75?'var(--green)':q>=50?'var(--yellow)':'var(--red)';

  // ── SPIN / chia đội logic ──
  const toggleSpinPlayer=(name)=>{
    setSpinPlayers(prev=>prev.includes(name)?prev.filter(n=>n!==name):[...prev,name]);
    setSpinResult(null);
  };
  const doSpin=()=>{
    if(spinPlayers.length<2){return;}
    setSpinning(true);
    setSpinResult(null);
    setTimeout(()=>{
      const getElo=n=>players.find(p=>p.name===n)?.elo||1500;
      let list=[...spinPlayers];
      let teamA=[],teamB=[];

      if(spinMode==='elo'){
        // Snake draft theo ELO: 1→A,2→B,3→B,4→A,...
        list.sort((a,b)=>getElo(b)-getElo(a));
        list.forEach((n,i)=>([0,1,1,0][i%4]===0?teamA:teamB).push(n));
      } else {
        // Fisher-Yates shuffle rồi chia xen kẽ
        for(let i=list.length-1;i>0;i--){
          const j=Math.floor(Math.random()*(i+1));
          [list[i],list[j]]=[list[j],list[i]];
        }
        list.forEach((n,i)=>(i%2===0?teamA:teamB).push(n));
      }

      // Tạo cặp đôi trong mỗi đội
      // ELO mode: ghép mạnh nhất + yếu nhất trong đội (balanced pairs)
      // Random mode: ghép theo thứ tự
      const makePairs=(team)=>{
        const pairs=[];
        if(spinMode==='elo'){
          const sorted=[...team].sort((a,b)=>getElo(b)-getElo(a));
          for(let i=0;i<Math.floor(sorted.length/2);i++){
            pairs.push([sorted[i],sorted[sorted.length-1-i]]);
          }
          if(sorted.length%2===1) pairs.push([sorted[Math.floor(sorted.length/2)]]);
        } else {
          for(let i=0;i<team.length;i+=2){
            if(i+1<team.length) pairs.push([team[i],team[i+1]]);
            else pairs.push([team[i]]);
          }
        }
        return pairs;
      };

      const pairsA=makePairs(teamA), pairsB=makePairs(teamB);

      const avgElo=team=>team.length?Math.round(team.reduce((s,n)=>s+getElo(n),0)/team.length):0;
      const eA=avgElo(teamA),eB=avgElo(teamB);
      const diff=eA-eB;
      const winPctA=Math.round(1/(1+Math.pow(10,-diff/400))*100);
      const handicap=Math.round(Math.abs(diff)/60);
      const quality=Math.max(0,100-Math.round(Math.abs(diff)/8));
      setSpinResult({teamA,teamB,pairsA,pairsB,eA,eB,diff:Math.abs(diff),winPctA,winPctB:100-winPctA,handicap,stronger:diff>0?'A':'B',quality});
      setSpinning(false);
    },900);
  };

  // Partner analysis: tính tỷ lệ thắng khi ghép đôi với từng người
  const partnerStats = useMemo(()=>{
    if(!partnerFor) return [];
    return players.filter(p=>p.name!==partnerFor).map(partner=>{
      const paired = matches.filter(m=>{
        if(m.type!=='Đôi') return false;
        const t1=m.team1Players||[], t2=m.team2Players||[];
        return (t1.includes(partnerFor)&&t1.includes(partner.name))||
               (t2.includes(partnerFor)&&t2.includes(partner.name));
      });
      let wins=0;
      paired.forEach(m=>{
        const inT1=(m.team1Players||[]).includes(partnerFor);
        if((inT1&&m.result==='W')||(!inT1&&m.result==='L')) wins++;
      });
      const total=paired.length;
      const wr=total>0?Math.round(wins/total*100):null;
      return {name:partner.name, color:partner.color, avatar:partner.avatar, elo:partner.elo, wins, total, wr, matches:paired};
    }).sort((a,b)=>{
      // Ưu tiên: có trận nhiều nhất trước, sau đó tỷ lệ thắng
      if(b.total!==a.total) return b.total-a.total;
      return (b.wr||0)-(a.wr||0);
    });
  },[partnerFor,players,matches]);

  return <>
    <div className="section-title" style={{marginBottom:'16px'}}>🎮 Công Cụ CLB</div>

    {/* Main tab toggle */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'5px',marginBottom:'16px'}}>
      {[['phantich','📊 Phân Tích'],['spin','🎰 Chia Đội'],['giaidau','🏆 Giải Đấu']].map(([id,lb])=>(
        <button key={id} onClick={()=>setMainTab(id)} style={{padding:'10px 4px',borderRadius:'10px',border:'1px solid',fontSize:'13px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:600,transition:'.15s',textAlign:'center',
          borderColor:mainTab===id?'var(--purple)':'var(--border)',
          background:mainTab===id?'var(--purple-bg)':'var(--surface)',
          color:mainTab===id?'var(--purple)':'var(--muted)'}}>
          {lb}
        </button>
      ))}
    </div>

    {/* ── GIẢI ĐẤU TAB ── */}
    {mainTab==='giaidau' && (
      <TournamentTab players={players} tournament={tournament} setTournament={setTournament} isAdmin={isAdmin} showToast={showToast} addMatch={addMatch} matches={matches} sessions={sessions}/>
    )}

    {/* ── PHÂN TÍCH TAB (So Kèo + Ăn Ý gộp) ── */}
    {mainTab==='phantich' && <>
      {/* Local toggle: So Kèo vs Ăn Ý */}
      <div style={{display:'flex',gap:'6px',marginBottom:'16px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'4px'}}>
        {[['sokeo','⚔️ So Kèo'],['partner','🤝 Ăn Ý']].map(([id,lb])=>(
          <button key={id} onClick={()=>setAnalyzeTab(id)} style={{flex:1,padding:'9px',borderRadius:'9px',border:'none',fontSize:'13px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:600,transition:'.15s',
            background:analyzeTab===id?'var(--purple)':'transparent',
            color:analyzeTab===id?'#fff':'var(--muted)'}}>
            {lb}
          </button>
        ))}
      </div>

      {/* ── Ăn Ý section ── */}
      {analyzeTab==='partner' && <>
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',padding:'16px',marginBottom:'16px'}}>
        <PlayerPicker value={partnerFor} onChange={setPartnerFor} exclude={[]} players={recentPlayers} label="🎯 Chọn người muốn xem" accentColor="var(--purple)"/>
      </div>

      {partnerFor && partnerStats.length>0 && (
        <>
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',overflow:'hidden',marginBottom:'12px'}}>
          <div style={{padding:'12px 16px',background:'var(--bg3)',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{fontSize:'12px',color:'var(--muted)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.6px'}}>
              🤝 Khi {partnerFor.split(' ').slice(-2).join(' ')} đánh đôi cùng...
            </div>
            <div style={{fontSize:'12px',color:'var(--muted)'}}>{Math.min(partnerLimit,partnerStats.length)}/{partnerStats.length} người</div>
          </div>
          {partnerStats.slice(0,partnerLimit).map((p,i)=>{
            const hasData=p.total>0;
            const wrColor=!hasData?'var(--muted)':p.wr>=60?'var(--green)':p.wr>=40?'var(--yellow)':'var(--red)';
            return (
              <div key={p.name} style={{padding:'13px 16px',borderBottom:i<Math.min(partnerLimit,partnerStats.length)-1?'1px solid var(--border)':'none',display:'flex',alignItems:'center',gap:'12px'}}>
                <div style={{width:38,height:38,borderRadius:'50%',background:p.avatar?'transparent':p.color+'22',color:p.color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:'13px',flexShrink:0,overflow:'hidden'}}>
                  {p.avatar?<img src={p.avatar} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:p.name.split(' ').slice(-2).map(w=>w[0]).join('').toUpperCase()}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:'14px',marginBottom:'5px'}}>{p.name}</div>
                  {hasData ? (
                    <>
                      <div style={{height:'5px',background:'var(--bg3)',borderRadius:'3px',overflow:'hidden',marginBottom:'3px'}}>
                        <div style={{height:'100%',width:p.wr+'%',background:wrColor,borderRadius:'3px',transition:'width .4s ease'}}/>
                      </div>
                      <div style={{fontSize:'11px',color:'var(--muted)'}}>{p.wins} thắng / {p.total} trận</div>
                    </>
                  ) : (
                    <div style={{fontSize:'12px',color:'var(--muted)'}}>Chưa đánh đôi cùng nhau</div>
                  )}
                </div>
                <div style={{textAlign:'right',flexShrink:0}}>
                  {hasData ? (
                    <>
                      <div style={{fontFamily:'Quicksand,sans-serif',fontSize:'22px',fontWeight:800,color:wrColor,lineHeight:1}}>{p.wr}%</div>
                      <div style={{fontSize:'10px',color:'var(--muted)',marginTop:'2px'}}>thắng</div>
                    </>
                  ) : (
                    <div style={{fontSize:'20px'}}>—</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
        {/* Phân trang */}
        <div style={{display:'flex',gap:'6px',justifyContent:'center',marginBottom:'16px'}}>
          {[5,10,15,20,25].map(n=>(
            <button key={n} onClick={()=>setPartnerLimit(n)}
              style={{padding:'6px 14px',borderRadius:'8px',border:'1px solid',cursor:'pointer',fontSize:'12px',fontWeight:600,fontFamily:'Nunito,sans-serif',transition:'.15s',
                borderColor:partnerLimit===n?'var(--purple)':'var(--border)',
                background:partnerLimit===n?'var(--purple-bg)':'var(--surface)',
                color:partnerLimit===n?'var(--purple)':'var(--muted)',
                opacity:n>partnerStats.length?.4:1}}>
              {n}
            </button>
          ))}
        </div>
        </>
      )}

      {partnerFor && partnerStats.every(p=>p.total===0) && (
        <div style={{textAlign:'center',padding:'32px',color:'var(--muted)',background:'var(--surface)',borderRadius:'14px',border:'1px solid var(--border)'}}>
          <div style={{fontSize:'32px',marginBottom:'8px'}}>🏓</div>
          <div>Chưa có trận đôi nào được ghi lại cho {partnerFor}</div>
        </div>
      )}
      </>}
    </>}

    {/* ── SPIN / CHIA ĐỘI TAB ── */}
    {mainTab==='spin' && <>
      {/* Mode toggle */}
      <div style={{display:'flex',gap:'6px',marginBottom:'16px'}}>
        {[['random','🎲 Quay Ngẫu Nhiên'],['elo','📊 Sắp Theo ELO']].map(([id,lb])=>(
          <button key={id} onClick={()=>{setSpinMode(id);setSpinResult(null);}} style={{flex:1,padding:'10px',borderRadius:'10px',border:'1px solid',fontSize:'13px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:600,transition:'.15s',
            borderColor:spinMode===id?'var(--orange)':'var(--border)',
            background:spinMode===id?'var(--orange-bg)':'var(--surface)',
            color:spinMode===id?'var(--orange)':'var(--muted)'}}>
            {lb}
          </button>
        ))}
      </div>

      {/* Chọn buổi chơi */}
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',padding:'16px',marginBottom:'16px'}}>
        <div className="fl" style={{marginBottom:'10px'}}>📅 Chọn buổi chơi</div>
        {recentCourtSessions.length===0?(
          <div style={{color:'var(--muted)',fontSize:'13px',textAlign:'center',padding:'12px 0'}}>Chưa có buổi chơi nào có danh sách người tham gia</div>
        ):(
          <select value={spinSessionId} onChange={e=>pickSpinSession(e.target.value)}
            style={{width:'100%',padding:'10px 12px',borderRadius:'10px',border:'1px solid var(--border)',background:'var(--bg3)',color:'var(--text)',fontSize:'14px',fontFamily:'Nunito,sans-serif',cursor:'pointer',outline:'none'}}>
            <option value=''>— Chọn buổi —</option>
            {recentCourtSessions.map(s=>{
              const cnt=Object.values(s.attendees||{}).filter(Boolean).length;
              return <option key={s.id} value={s.id}>📅 {s.date} · {cnt} người</option>;
            })}
          </select>
        )}
        {spinPlayers.length>0&&(
          <div style={{marginTop:'12px'}}>
            <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'8px'}}>👥 {spinPlayers.length} người có mặt:</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
              {spinPlayers.map(name=>{
                const p=players.find(x=>x.name===name);
                return (
                  <div key={name} style={{display:'flex',alignItems:'center',gap:'5px',padding:'5px 9px',borderRadius:'20px',background:'var(--orange-bg)',border:'1px solid var(--orange)',fontSize:'12px',fontWeight:600,color:'var(--orange)'}}>
                    <div style={{width:20,height:20,borderRadius:'50%',background:p?.avatar?'transparent':(p?.color||'#888')+'33',color:p?.color||'#888',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'9px',fontWeight:700,overflow:'hidden',flexShrink:0}}>
                      {p?.avatar?<img src={p.avatar} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:(name.split(' ').slice(-1)[0]||'?').slice(0,2).toUpperCase()}
                    </div>
                    {name.split(' ').slice(-2).join(' ')}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>

      {/* Nút quay */}
      <button onClick={doSpin} disabled={spinPlayers.length<2||spinning}
        style={{width:'100%',padding:'14px',borderRadius:'12px',border:'none',cursor:spinPlayers.length<2?'not-allowed':'pointer',
          background:spinPlayers.length<2?'var(--bg3)':'linear-gradient(135deg,var(--orange),#f59e0b)',
          color:spinPlayers.length<2?'var(--muted)':'#fff',fontWeight:700,fontSize:'16px',fontFamily:'Nunito,sans-serif',
          transition:'.2s',marginBottom:'16px',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'}}>
        {spinning?<><span style={{animation:'spin 0.6s linear infinite',display:'inline-block'}}>🎰</span> Đang chia...</>
          :spinPlayers.length<2?'Chọn ít nhất 2 người để chia đội'
          :`🎰 ${spinMode==='random'?'Quay Ngẫu Nhiên':'Chia Theo ELO'} (${spinPlayers.length} người)`}
      </button>

      {/* Kết quả */}
      {spinResult && (
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',overflow:'hidden',marginBottom:'16px'}}>
          {/* Header quality */}
          <div style={{background:'linear-gradient(135deg,#1a1040,#2d1b69)',padding:'14px 18px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{color:'#c4b5fd',fontWeight:700,fontSize:'13px'}}>🎯 KẾT QUẢ CHIA ĐỘI</div>
            <div style={{background:'rgba(0,0,0,.3)',borderRadius:'20px',padding:'3px 12px',fontSize:'11px',fontWeight:700,
              color:spinResult.quality>=75?'var(--green)':spinResult.quality>=50?'var(--yellow)':'var(--red)'}}>
              MATCH QUALITY: {spinResult.quality}/100
            </div>
          </div>

          {/* Cặp đôi từng đội */}
          {(()=>{
            const PairCard=({pair,teamColor,teamBg})=>{
              const avgE=Math.round(pair.reduce((s,n)=>s+(players.find(p=>p.name===n)?.elo||1500),0)/pair.length);
              return (
                <div style={{background:teamBg,border:'1px solid',borderColor:teamColor+'44',borderRadius:'10px',padding:'10px',marginBottom:'8px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:pair.length>1?'6px':'0'}}>
                    {pair.map((name,ni)=>{
                      const p=players.find(x=>x.name===name);
                      return (
                        <React.Fragment key={name}>
                          {ni>0&&<div style={{color:'var(--muted)',fontSize:'11px',fontWeight:700}}>+</div>}
                          <div style={{display:'flex',alignItems:'center',gap:'5px',flex:1,minWidth:0}}>
                            <div style={{width:26,height:26,borderRadius:'50%',background:p?.avatar?'transparent':(p?.color||'#888')+'22',color:p?.color||'#888',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'9px',fontWeight:700,overflow:'hidden',flexShrink:0}}>
                              {p?.avatar?<img src={p.avatar} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:(name.split(' ').slice(-1)[0]||'').slice(0,2).toUpperCase()}
                            </div>
                            <div style={{minWidth:0}}>
                              <div style={{fontSize:'11px',fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{name.split(' ').slice(-2).join(' ')}</div>
                              <div style={{fontSize:'9px',color:'var(--muted)'}}>{p?.elo||1500}</div>
                            </div>
                          </div>
                        </React.Fragment>
                      );
                    })}
                  </div>
                  {pair.length>1&&<div style={{fontSize:'10px',color:teamColor,fontWeight:600,textAlign:'right'}}>TB {avgE} CĐ</div>}
                </div>
              );
            };

            const maxPairs=Math.max(spinResult.pairsA.length,spinResult.pairsB.length);
            return (
              <div style={{padding:'16px'}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr 36px 1fr',gap:'8px',alignItems:'start'}}>
                  {/* Đội A */}
                  <div>
                    <div style={{fontWeight:700,fontSize:'12px',color:'var(--green)',marginBottom:'8px',textAlign:'center',display:'flex',alignItems:'center',justifyContent:'center',gap:'4px'}}>
                      ⚡ Đội A <span style={{fontSize:'10px',background:'var(--green-bg)',borderRadius:'10px',padding:'1px 7px'}}>{spinResult.eA} CĐ</span>
                    </div>
                    {spinResult.pairsA.map((pair,i)=><PairCard key={i} pair={pair} teamColor='var(--green)' teamBg='var(--green-bg)'/>)}
                  </div>
                  {/* VS */}
                  <div style={{paddingTop:'30px',textAlign:'center'}}>
                    <div style={{fontFamily:'Quicksand',fontWeight:800,color:'var(--muted)',fontSize:'11px'}}>VS</div>
                    {Array.from({length:maxPairs}).map((_,i)=>(
                      <div key={i} style={{height:'62px',display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <div style={{width:'1px',background:'var(--border)',height:'100%'}}/>
                      </div>
                    ))}
                  </div>
                  {/* Đội B */}
                  <div>
                    <div style={{fontWeight:700,fontSize:'12px',color:'var(--red)',marginBottom:'8px',textAlign:'center',display:'flex',alignItems:'center',justifyContent:'center',gap:'4px'}}>
                      🔥 Đội B <span style={{fontSize:'10px',background:'var(--red-bg)',borderRadius:'10px',padding:'1px 7px'}}>{spinResult.eB} CĐ</span>
                    </div>
                    {spinResult.pairsB.map((pair,i)=><PairCard key={i} pair={pair} teamColor='var(--red)' teamBg='var(--red-bg)'/>)}
                  </div>
                </div>

                {/* Win % bar */}
                <div style={{marginTop:'12px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:'12px',fontWeight:700,marginBottom:'5px'}}>
                    <span style={{color:'var(--green)'}}>{spinResult.winPctA}%</span>
                    <span style={{color:'var(--muted)',fontSize:'11px'}}>Tỉ lệ thắng</span>
                    <span style={{color:'var(--red)'}}>{spinResult.winPctB}%</span>
                  </div>
                  <div style={{height:'8px',borderRadius:'4px',overflow:'hidden',background:'var(--red-bg)'}}>
                    <div style={{height:'100%',width:spinResult.winPctA+'%',background:'var(--green)',borderRadius:'4px',transition:'width .6s ease'}}/>
                  </div>
                  {spinResult.diff>0&&(
                    <div style={{textAlign:'center',marginTop:'8px',fontSize:'12px',color:'var(--muted)'}}>
                      Đội <b style={{color:spinResult.stronger==='A'?'var(--green)':'var(--red)'}}>{spinResult.stronger==='A'?'A':'B'}</b> mạnh hơn {spinResult.diff} CĐ
                      {spinResult.handicap>0&&<> · chấp <b style={{color:'var(--purple)'}}>{spinResult.handicap} quả</b>/game</>}
                    </div>

                {/* Nút quay lại */}
                <button onClick={doSpin} style={{width:'100%',marginTop:'12px',padding:'10px',borderRadius:'10px',border:'1px solid var(--orange)',background:'transparent',color:'var(--orange)',fontWeight:600,fontSize:'13px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>
                  🔄 Quay lại
                </button>
              </div>
            );
          })()}
        </div>
      )}
    </>}

    {/* ── SO KÈO (trong Phân Tích) ── */}
    {mainTab==='phantich' && analyzeTab==='sokeo' && <>
    {/* Mode */}
    <div style={{display:'flex',gap:'6px',marginBottom:'16px'}}>
      {[['don','🧍 Đơn'],['doi','👥 Đôi']].map(([id,lb])=>(
        <button key={id} onClick={()=>setMode(id)} style={{flex:1,padding:'10px',borderRadius:'10px',border:'1px solid',fontSize:'13px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:600,transition:'.15s',

            <div><PlayerPicker value={d1b} onChange={setD1b} exclude={[d1a,d2a,d2b]} players={recentPlayers} label="Người 2"/></div>

    </div>

    {players.length===0&&(
      <div style={{textAlign:'center',padding:'40px',color:'var(--muted)',background:'var(--surface)',borderRadius:'14px',border:'1px solid var(--border)'}}>

      </div>

    {/* Analysis card */}
    {analysis && (
      <>
        {/* Match quality */}
        <div style={{background:'linear-gradient(135deg,#1a1040,#2d1b69)',border:'1px solid var(--purple)',borderRadius:'14px',padding:'18px',marginBottom:'12px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
            <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
              <span style={{fontSize:'20px'}}>🤖</span>
              <span style={{fontWeight:700,fontSize:'14px',color:'#c4b5fd'}}>NHẬN ĐỊNH TRẬN ĐẤU</span>
            </div>
            <span style={{background:'rgba(0,0,0,.3)',borderRadius:'20px',padding:'3px 10px',fontSize:'11px',fontWeight:700,color:qColor(analysis.quality)}}>
              MATCH QUALITY: {analysis.quality}/100
            </span>
          </div>

          {/* Handicap box */}
          <div style={{background:'rgba(0,0,0,.35)',borderRadius:'10px',padding:'14px',marginBottom:'12px'}}>

            ):(
              <>
                <div style={{color:'#a78bfa',fontWeight:600,fontSize:'13px',marginBottom:'8px'}}>🛡️ Kèo Chấp Đề Xuất</div>
                <div style={{fontSize:'16px',fontWeight:800,color:'#fff',fontFamily:'Quicksand,sans-serif'}}>
                  {analysis.stronger} chấp {analysis.weaker} {analysis.handicap} quả
                </div>
                <div style={{fontSize:'12px',color:'#a78bfa',marginTop:'6px'}}>
                  Chênh lệch Công Đức: {analysis.diff} điểm (~{analysis.handicap} quả mỗi game)
                </div>
              </>
            )}
          </div>

          {/* Win probability bar */}
          <div style={{marginBottom:'8px'}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:'12px',color:'#a78bfa',marginBottom:'6px'}}>
              <span>{mode==='don'?analysis.pa?.name:analysis.t1?.map(p=>p.name).join(' & ')}</span>
              <span>{mode==='don'?analysis.pb?.name:analysis.t2?.map(p=>p.name).join(' & ')}</span>
            </div>
            <div style={{background:'rgba(0,0,0,.3)',borderRadius:'20px',height:'10px',overflow:'hidden'}}>
              <div style={{height:'100%',background:'linear-gradient(90deg,#22c55e,#3b82f6)',borderRadius:'20px',

            <div style={{display:'flex',justifyContent:'space-between',fontSize:'13px',fontWeight:700,marginTop:'5px'}}>

              <span style={{color:'var(--red)'}}>{mode==='don'?analysis.winPctB:analysis.winPct2}%</span>
            </div>
          </div>

          {/* Tips */}
          <div style={{borderTop:'1px solid rgba(167,139,250,.2)',paddingTop:'10px',fontSize:'12px',color:'#a78bfa',lineHeight:'1.6'}}>
            {analysis.diff===0&&'💡 Trận này cực kỳ căng — ai thắng đều xứng đáng.'}
            {analysis.diff>0&&analysis.diff<=80&&'💡 Chênh lệch nhỏ, trận đấu khó đoán. Không cần chấp nhiều.'}
            {analysis.diff>80&&analysis.diff<=200&&'💡 Chênh lệch vừa. Người mạnh hơn nên chấp để trận thêm hấp dẫn.'}
            {analysis.diff>200&&'⚠️ Chênh lệch lớn. Nên chấp hoặc ghép đội cân bằng hơn.'}

        {/* Head-to-head — expandable */}

          {/* Header — click để toggle */}
