<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Pích Cờ Bôn Phông Bạt</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#22c55e"/>
<link rel="icon" href="/icon-192.png"/>

<!-- iOS: cho phép "Thêm vào MH chính" chạy full màn hình -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PickleCLB"/>

<!-- Android/Chrome -->
<meta name="mobile-web-app-capable" content="yes"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f5f7;--bg2:#ffffff;--bg3:#eef0f3;
  --surface:#ffffff;--surface2:#f7f8fa;
  --border:#e3e6ea;--border2:#d3d8de;
  --text:#1a1d24;--muted:#8a909c;--muted2:#aeb3bc;
  --green:#22c55e;--green2:#16a34a;--green-bg:rgba(34,197,94,.12);
  --purple:#a855f7;--purple2:#9333ea;--purple-bg:rgba(168,85,247,.12);
  --orange:#f97316;--orange-bg:rgba(249,115,22,.10);
  --red:#ef4444;--red-bg:rgba(239,68,68,.10);
  --blue:#3b82f6;--blue-bg:rgba(59,130,246,.10);
  --yellow:#eab308;--yellow-bg:rgba(234,179,8,.10);
  --navy:#11151f;
}
html{overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;max-width:100%;padding-top:52px}
@media(max-width:768px){body{padding-top:0}}

/* NAV */
.topbar{background:#0d111c;border-bottom:1px solid #1f2433;display:flex;align-items:center;gap:0;height:52px;padding:0 16px;position:fixed;top:0;left:0;right:0;z-index:200;overflow-x:auto}
.logo{display:flex;align-items:center;gap:8px;margin-right:16px;flex-shrink:0}
.logo-icon{background:var(--green);border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;font-family:'Quicksand',sans-serif}
.logo-text{font-family:'Quicksand',sans-serif;font-weight:700;font-size:15px;letter-spacing:-.3px;color:#fff}
.logo-sub{font-size:9px;color:#7a8295;letter-spacing:1px;text-transform:uppercase;display:block;line-height:1;margin-top:1px}
.nav-tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.nav-tab{padding:8px 14px;border-radius:8px;border:none;background:transparent;color:#8a90a0;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;font-family:'Nunito',sans-serif}
.nav-tab:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-tab.active{background:var(--green);color:#fff}
.nav-right{display:flex;gap:8px;margin-left:12px;flex-shrink:0}
.btn-ghi{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Nunito',sans-serif;display:flex;align-items:center;gap:5px}
.btn-ghi:hover{filter:brightness(1.1)}

/* BANNER */
.banner{width:100%;aspect-ratio:820/312;max-height:340px;background:linear-gradient(135deg,#1a2a1a 0%,#0d1f2d 50%,#1a1a2e 100%);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.banner-text{text-align:center;position:relative;z-index:2}
.banner-title{font-family:'Quicksand',sans-serif;font-size:28px;font-weight:700;letter-spacing:-1px}
.banner-title span{color:var(--green)}
.banner-sub{color:var(--muted);font-size:13px;margin-top:4px}
.banner-balls{position:absolute;inset:0;pointer-events:none}
.ball{position:absolute;border-radius:50%;opacity:.15}

/* TABS SEGMENT */
.seg-wrap{padding:16px 20px 0;max-width:960px;margin:0 auto}
.seg{display:flex;background:var(--surface);border-radius:10px;padding:4px;gap:4px;width:fit-content;margin-bottom:16px}
.seg-btn{padding:7px 20px;border-radius:7px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;font-family:'Nunito',sans-serif;display:flex;align-items:center;gap:6px;transition:.15s}
.seg-btn.active{background:var(--purple);color:#fff}

/* MAIN */
.main{padding:0 20px 32px;max-width:960px;margin:0 auto}

/* HIGHLIGHTS */
.highlights{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
@media(max-width:640px){.highlights{grid-template-columns:1fr}}
.hl-card{border-radius:14px;padding:18px 20px;position:relative;overflow:hidden;cursor:default}
.hl-card.dark{background:#1c2436;border:1px solid var(--border)}
.hl-card.purple{background:linear-gradient(135deg,#7c3aed,#a855f7)}
.hl-card.green{background:linear-gradient(135deg,#15803d,#22c55e)}
.hl-icon{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;opacity:.8;display:flex;align-items:center;gap:5px;margin-bottom:10px}
.hl-name{font-size:22px;font-weight:800;font-family:'Quicksand',sans-serif}
.hl-pts{font-size:30px;font-weight:900;font-family:'Quicksand',sans-serif;line-height:1}
.hl-pts.neg{color:#f87171}
.hl-pts.pos{color:#fff}
.hl-label{font-size:13px;opacity:.7}
.hl-bg-icon{position:absolute;right:12px;bottom:8px;font-size:56px;opacity:.1}

/* FILTER ROW */
.filter-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.month-sel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-size:13px;font-family:'Nunito',sans-serif;cursor:pointer;outline:none}

/* BXH */
.bxh-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:20px;overflow-x:auto;max-width:100%}
.bxh-header-row{display:grid;grid-template-columns:40px 1fr 60px 64px 28px;gap:6px;padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;min-width:320px}
.bxh-row{display:grid;grid-template-columns:40px 1fr 60px 64px 28px;gap:6px;padding:13px 14px;border-bottom:1px solid var(--border);align-items:center;transition:.1s;min-width:320px}
.bxh-row:hover{background:var(--surface2)}
.bxh-row:last-child{border-bottom:none}
.rank-num{font-family:'Quicksand',sans-serif;font-size:16px;font-weight:700;color:var(--muted)}
.rank-num.r1{color:#fbbf24}
.rank-num.r2{color:#94a3b8}
.rank-num.r3{color:#cd7c32}
.player-cell{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.player-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.player-sub{font-size:11px;color:var(--muted);margin-top:1px}
.elo-bar-wrap{width:70px;height:4px;background:var(--bg3);border-radius:2px;margin-top:3px}
.elo-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--green2),var(--green))}
.cell-center{text-align:center;font-size:13px}
.elo-val{font-family:'Quicksand',sans-serif;font-size:15px;font-weight:700;color:var(--green);text-align:center}
.wr-val{font-size:13px;text-align:center}

/* MATCHES */
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-title{font-family:'Quicksand',sans-serif;font-size:17px;font-weight:700}
.match-list{display:flex;flex-direction:column;gap:8px}
.match-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;display:grid;grid-template-columns:36px 1fr 60px 36px;gap:8px;align-items:center;max-width:100%;overflow:hidden}
.result-badge{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.rb-W{background:var(--green-bg);color:var(--green)}
.rb-L{background:var(--red-bg);color:var(--red)}
.m-vs{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px}
.m-score{font-family:'Quicksand',sans-serif;font-size:18px;font-weight:700;text-align:right}
.m-elo{font-size:11px;font-weight:600;text-align:right;margin-top:2px}
.m-elo.pos{color:var(--green)}
.m-elo.neg{color:var(--red)}
.del-btn{background:var(--red-bg);border:none;border-radius:8px;color:var(--red);width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.6;transition:.15s}
.del-btn:hover{opacity:1}

/* STATS CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
@media(min-width:600px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:3px 3px 0 0}
.sc-green::after{background:var(--green)}
.sc-purple::after{background:var(--purple)}
.sc-orange::after{background:var(--orange)}
.sc-red::after{background:var(--red)}
.sc-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.sc-val{font-family:'Quicksand',sans-serif;font-size:28px;font-weight:700;line-height:1;margin-bottom:3px}
.sc-green .sc-val{color:var(--green)}
.sc-purple .sc-val{color:var(--purple)}
.sc-orange .sc-val{color:var(--orange)}
.sc-red .sc-val{color:#f87171}
.sc-sub{font-size:11px;color:var(--muted)}

/* ELO INFO */
.elo-info{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:20px}
.elo-title{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.elo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:500px){.elo-grid{grid-template-columns:repeat(4,1fr)}}
.elo-case{background:var(--bg3);border-radius:9px;padding:12px;text-align:center}
.elo-case-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.elo-case-val{font-family:'Quicksand',sans-serif;font-size:18px;font-weight:700}
.elo-case-val.pos{color:var(--green)}
.elo-case-val.neg{color:var(--red)}
.elo-case-sub{font-size:10px;color:var(--muted);margin-top:2px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:24px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-family:'Quicksand',sans-serif;font-size:19px;font-weight:700}
.modal-close{background:var(--surface2);border:none;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
.fl{font-size:12px;color:var(--muted);font-weight:500}
.fi{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-size:14px;font-family:'Nunito',sans-serif;outline:none;transition:.15s;width:100%}
.fi:focus{border-color:var(--green)}
.fi select,.fi option{background:var(--bg3);color:var(--text)}

/* SCORE INPUT */
.score-row{display:grid;grid-template-columns:1fr 40px 1fr;gap:12px;align-items:center;margin:16px 0}
.score-team{text-align:center}
.score-lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
.score-num{background:var(--bg3);border:2px solid var(--border);border-radius:10px;padding:8px;color:var(--text);font-size:30px;font-family:'Quicksand',sans-serif;font-weight:700;width:80px;text-align:center;outline:none}
.score-num:focus{border-color:var(--green)}
.score-vs{font-family:'Quicksand',sans-serif;font-size:18px;font-weight:700;color:var(--muted);text-align:center}

/* ELO PREVIEW */
.elo-preview{background:var(--bg3);border-radius:10px;padding:12px;text-align:center;margin-top:12px;border:1px solid var(--border)}
.ep-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.ep-val{font-family:'Quicksand',sans-serif;font-size:22px;font-weight:700}

/* FORM ACTIONS */
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.btn-cancel{background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--muted);padding:9px 18px;font-size:14px;cursor:pointer;font-family:'Nunito',sans-serif}
.btn-save{background:var(--green);border:none;border-radius:9px;color:#fff;padding:9px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Nunito',sans-serif}
.btn-save:hover{background:var(--green2)}

/* FUND TAB */
.fund-members{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;max-width:100%}
.fund-members>*{min-width:0;overflow:hidden}
@media(min-width:600px){.fund-members{grid-template-columns:repeat(3,1fr)}}
@media(max-width:380px){.fund-members{grid-template-columns:1fr}}
.fund-member{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.fm-name{font-weight:600;font-size:14px;margin-bottom:6px}
.fm-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)}
.fm-row:last-child{border:none}
.fm-lbl{color:var(--muted)}
.fm-val{font-weight:600}
.fm-val.pos{color:var(--green)}
.fm-val.neg{color:var(--red)}
.fund-sessions{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.fs-header{display:grid;grid-template-columns:90px 50px 1fr 90px;gap:8px;padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.fs-row{display:grid;grid-template-columns:90px 50px 1fr 90px;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;align-items:center}
.fs-row:last-child{border:none}
.fs-row:hover{background:var(--surface2)}
.tag-open{background:var(--green-bg);color:var(--green);padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.tag-full{background:var(--red-bg);color:var(--red);padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}

/* ADD SESSION */
.add-session-btn{background:var(--surface);border:1px dashed var(--border2);border-radius:12px;color:var(--muted);padding:14px;width:100%;font-size:14px;cursor:pointer;margin-bottom:16px;font-family:'Nunito',sans-serif;transition:.15s}
.add-session-btn:hover{border-color:var(--green);color:var(--green)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 20px;font-size:14px;z-index:3000;box-shadow:0 4px 24px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px;animation:slideup .25s ease}
@keyframes slideup{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* CONFIRM */
.confirm-msg{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.btn-danger{background:var(--red);border:none;border-radius:9px;color:#fff;padding:9px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Nunito',sans-serif}

/* BADGE POPUP */
.badge-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.badge-popup-overlay{align-items:center}}
.badge-popup{background:var(--bg2);border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:480px;animation:slideup .25s ease}
@media(min-width:600px){.badge-popup{border-radius:18px;padding:24px}}
.badge-popup-emoji{font-size:48px;margin-bottom:10px;display:block;text-align:center}
.badge-popup-title{font-family:'Quicksand',sans-serif;font-size:20px;font-weight:700;text-align:center;margin-bottom:6px}
.badge-popup-desc{font-size:14px;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:16px}
.badge-popup-holder{background:var(--bg3);border-radius:12px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.badge-popup-cond{background:var(--bg3);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.6}
.badge-popup-cond b{color:var(--text)}

/* MATCH HISTORY DRAWER */
.history-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1100;display:flex;align-items:flex-end}
.history-drawer{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-height:85vh;display:flex;flex-direction:column;animation:slideup .25s ease}
.history-drawer-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0}
.history-drawer-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px}
.history-drawer-body{overflow-y:auto;padding:0 14px 24px;flex:1}

/* FUN TAB - BADGES */
.badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
@media(min-width:640px){.badge-grid{grid-template-columns:repeat(3,1fr)}}
.badge-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden;transition:.15s}
.badge-card.won{background:linear-gradient(160deg,var(--surface2),var(--surface));border-color:var(--border2)}
.badge-card.empty{opacity:.4}
.badge-emoji{font-size:30px;margin-bottom:8px;display:block}
.badge-title{font-family:'Quicksand',sans-serif;font-weight:700;font-size:14px;margin-bottom:3px}
.badge-desc{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:8px}
.badge-holder{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding-top:8px;border-top:1px solid var(--border)}
.badge-holder .av{width:22px;height:22px;font-size:9px}
.badge-glow{position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;filter:blur(20px);opacity:.25;pointer-events:none}

/* HALL OF FAME / CAPTION CARD */
.hof-card{background:linear-gradient(135deg,#1a1040,#2d1b69);border:1px solid var(--purple);border-radius:16px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.hof-month{font-size:11px;color:#c4b5fd;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hof-caption{font-size:15px;line-height:1.6;color:#fff;font-weight:500;margin-bottom:4px}
.hof-caption b{color:#fbbf24}
.hof-sub{font-size:12px;color:#a78bfa;margin-top:10px;padding-top:10px;border-top:1px solid rgba(167,139,250,.2)}
.fun-section-title{font-family:'Quicksand',sans-serif;font-size:16px;font-weight:700;margin:24px 0 14px;display:flex;align-items:center;gap:8px}
.fun-section-title:first-child{margin-top:0}

@media(max-width:768px){
  /* BXH mobile: #, tên+huy hiệu, ELO, W/L - bỏ cột xóa */
  .bxh-header-row,.bxh-row{grid-template-columns:26px 1fr 44px 50px 0px;min-width:0;padding:10px 10px;gap:5px}
  .bxh-header-row>*:last-child,.bxh-row>*:last-child{display:none}
  .bxh-card{overflow-x:visible}
  .fs-header,.fs-row{grid-template-columns:60px 1fr 70px 70px 28px}
  .topbar{display:none}
  .mobile-nav{display:flex!important}
  body{padding-bottom:70px}
  .main{padding:0 12px 32px}
  .seg-wrap{padding:12px 12px 0}
}
/* MOBILE BOTTOM NAV */

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ─── ELO CONFIG ─────────────────────────────────────────── */
const ELO_CONFIG = {
  K_SINGLE: 32,   // hệ số K đơn
  K_DOUBLE: 24,   // hệ số K đôi (thấp hơn vì ít control hơn)
  BASE: 1500,
};

function calcEloChange(myElo, oppElo, win, type) {
  const K = type === 'Đơn' ? ELO_CONFIG.K_SINGLE : ELO_CONFIG.K_DOUBLE;
  const expected = 1 / (1 + Math.pow(10, (oppElo - myElo) / 400));
  const actual = win ? 1 : 0;
  return Math.round(K * (actual - expected));
}

// Bảng tham chiếu nhanh (cùng rating)
function quickEloTable(myElo = 1500) {
  const cases = [
    { label: 'Đơn thắng', win: true, type: 'Đơn' },
    { label: 'Đơn thua', win: false, type: 'Đơn' },
    { label: 'Đôi thắng', win: true, type: 'Đôi' },
    { label: 'Đôi thua', win: false, type: 'Đôi' },
  ];
  return cases.map(c => ({ ...c, delta: calcEloChange(myElo, myElo, c.win, c.type) }));
}

/* ─── COLORS / DATA ──────────────────────────────────────── */
const COLORS = ['#22c55e','#3b82f6','#f97316','#a855f7','#ef4444','#06b6d4','#eab308','#ec4899'];
function initials(n){ return n.split(' ').slice(-2).map(w=>w[0]).join('').toUpperCase(); }

/* ─── RESIZE ẢNH TRƯỚC KHI LƯU (tránh phình dữ liệu) ───────── */
function resizeImageFile(file, maxSize=200){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let {width,height}=img;
        if(width>height){ if(width>maxSize){ height=Math.round(height*maxSize/width); width=maxSize; } }
        else { if(height>maxSize){ width=Math.round(width*maxSize/height); height=maxSize; } }
        const canvas=document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg',0.85));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

/* ─── AVATAR NGƯỜI CHƠI — có crop tròn ──────────────────── */
function PlayerAvatar({player, onUpdateAvatar, size=34}){
  const inputRef = React.useRef(null);
  const [cropSrc, setCropSrc] = React.useState(null);

  const handleFile = async (e)=>{
    const file = e.target.files?.[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => setCropSrc(ev.target.result);
    reader.readAsDataURL(file);
    e.target.value='';
  };

  return (
    <>
      <div
        className="av"
        onClick={()=>onUpdateAvatar && inputRef.current?.click()}
        style={{
          width:size, height:size, flexShrink:0,
          background:player.avatar?'transparent':player.color+'22',
          color:player.color, overflow:'hidden', position:'relative',

      >
        {player.avatar
          ? <img src={player.avatar} alt={player.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
          : initials(player.name)}
        {onUpdateAvatar && (
          <>
            <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0)',transition:'.2s',display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*0.35+'px',opacity:0}}
              onMouseEnter={e=>{e.currentTarget.style.background='rgba(0,0,0,.4)';e.currentTarget.style.opacity=1;}}
              onMouseLeave={e=>{e.currentTarget.style.background='rgba(0,0,0,0)';e.currentTarget.style.opacity=0;}}
            >📷</div>
            <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} style={{display:'none'}}/>
          </>
        )}
      </div>
      {cropSrc && (
        <CropModal

}

/* ─── RANK TIERS ──────────────────────────────────────────── */
const TIERS = [

];
function getTier(elo){ return TIERS.find(t=>elo>=t.min)||TIERS[TIERS.length-1]; }

/* ─── HUY HIỆU VUI (FUN BADGES) ──────────────────────────────
   Tất cả tính trực tiếp từ players + matches, không cần lưu state riêng. */
function computeStreaks(players, matches){
  // streak hiện tại (win/loss liên tiếp) cho mỗi người, dựa trên matches[0]=mới nhất
  const map = {};
  players.forEach(p=>{
    const mine = matches.filter(m=>(m.team1Players||[]).includes(p.name)||(m.team2Players||[]).includes(p.name));
    let count=0, kind=null;
    for(const m of mine){
      const inT1 = (m.team1Players||[]).includes(p.name);
      const won = inT1 ? m.result==='W' : m.result==='L';
      const thisKind = won?'W':'L';
      if(kind===null){ kind=thisKind; count=1; }
      else if(thisKind===kind){ count++; }
      else break;
    }
    map[p.name] = {count, kind, total: mine.length};
  });
  return map;
}

function computeBadges(players, matches){
  if(!players.length) return [];
  const streaks = computeStreaks(players, matches);
  const withStats = players.map(p=>{
    const total = p.wins + p.losses;
    const wr = total ? p.wins/total : 0;
    return {...p, total, wr, streak: streaks[p.name]||{count:0,kind:null}};
  });

  const badges = [];

  // 👑 Vua ELO
  const topElo = [...withStats].sort((a,b)=>b.elo-a.elo)[0];
  badges.push({id:'king', emoji:'👑', title:'Vua ELO', desc:'Người có điểm ELO cao nhất hiện tại', color:'#f59e0b',
    holder: topElo?.elo>0 ? topElo : null});

  // 🔥 Máy Chém — chuỗi thắng dài nhất hiện tại (>=2)
  const onFire = [...withStats].filter(p=>p.streak.kind==='W'&&p.streak.count>=2).sort((a,b)=>b.streak.count-a.streak.count)[0];
  badges.push({id:'fire', emoji:'🔥', title:'Máy Chém', desc:'Đang thắng chuỗi dài nhất hiện tại', color:'#ef4444',
    holder: onFire||null, extra: onFire?`${onFire.streak.count} trận liên tiếp`:null});

  // 💀 Số Nhọ — chuỗi thua dài nhất hiện tại (>=2)
  const coldStreak = [...withStats].filter(p=>p.streak.kind==='L'&&p.streak.count>=2).sort((a,b)=>b.streak.count-a.streak.count)[0];
  badges.push({id:'cold', emoji:'💀', title:'Số Nhọ Tháng Này', desc:'Đang thua chuỗi dài nhất hiện tại — đừng bỏ cuộc!', color:'#6b7280',
    holder: coldStreak||null, extra: coldStreak?`${coldStreak.streak.count} trận liên tiếp`:null});

  // 🧱 Tường Thành — tỷ lệ thắng cao nhất, tối thiểu 3 trận
  const wall = [...withStats].filter(p=>p.total>=3).sort((a,b)=>b.wr-a.wr)[0];
  badges.push({id:'wall', emoji:'🧱', title:'Tường Thành', desc:'Tỷ lệ thắng cao nhất (tối thiểu 3 trận)', color:'#3b82f6',
    holder: wall||null, extra: wall?`${Math.round(wall.wr*100)}% thắng`:null});

  // 🎲 Định Mệnh — đánh nhiều trận nhất
  const grinder = [...withStats].filter(p=>p.total>0).sort((a,b)=>b.total-a.total)[0];
  badges.push({id:'grind', emoji:'🎲', title:'Cày Cuốc Nhất CLB', desc:'Người ra sân đánh nhiều trận nhất', color:'#a855f7',
    holder: grinder||null, extra: grinder?`${grinder.total} trận`:null});

  // ⚔️ Khắc Tinh — người có tỷ số đối đầu áp đảo nhất với 1 đối thủ cụ thể (tối thiểu 2 trận chung)
  let nemesis = null, nemesisDiff = 0, nemesisOpp = '';
  withStats.forEach(p=>{
    const oppCount = {};
    matches.forEach(m=>{
      const inT1 = (m.team1Players||[]).includes(p.name);
      const inT2 = (m.team2Players||[]).includes(p.name);
      if(!inT1 && !inT2) return;
      const opps = inT1 ? (m.team2Players||[]) : (m.team1Players||[]);
      const won = inT1 ? m.result==='W' : m.result==='L';
      opps.forEach(o=>{
        if(!oppCount[o]) oppCount[o]={w:0,l:0};
        won ? oppCount[o].w++ : oppCount[o].l++;
      });
    });
    Object.entries(oppCount).forEach(([opp,rec])=>{
      const tot = rec.w+rec.l;
      if(tot>=2 && rec.w>rec.l){
        const diff = rec.w-rec.l;
        if(diff>nemesisDiff){ nemesisDiff=diff; nemesis=p; nemesisOpp=opp; }
      }
    });
  });
  badges.push({id:'nemesis', emoji:'⚔️', title:'Khắc Tinh', desc:'Áp đảo một đối thủ cụ thể nhiều nhất', color:'#22c55e',
    holder: nemesis, extra: nemesis?`Khắc ${nemesisOpp.split(' ').slice(-1)[0]}`:null});

  // 🎯 Sát Thủ Kèo Lệch — thắng nhiều nhất khi là kẻ yếu hơn ELO (dùng eloChanges, delta dương nhưng đối thủ ELO cao hơn)
  const upsetCount = {};
  matches.forEach(m=>{
    (m.eloChanges||[]).forEach(({name,delta})=>{
      if(delta>0){
        const p = players.find(x=>x.name===name);
        // ước lượng: nếu delta lớn (>K/2 quy đổi) tức thắng kèo lệch — đơn giản hoá: delta cao là thắng đối thủ mạnh hơn
        if(p && delta >= 14){ upsetCount[name]=(upsetCount[name]||0)+1; }
      }
    });
  });
  const upsetName = Object.entries(upsetCount).sort((a,b)=>b[1]-a[1])[0];
  const upsetPlayer = upsetName ? players.find(p=>p.name===upsetName[0]) : null;
  badges.push({id:'upset', emoji:'🎯', title:'Sát Thủ Kèo Lệch', desc:'Hay tạo bất ngờ khi thắng đối thủ mạnh hơn', color:'#06b6d4',
    holder: upsetPlayer, extra: upsetPlayer?`${upsetName[1]} lần lật kèo`:null});

  // 🐣 Tân Binh Bứt Phá — ELO tăng nhiều nhất so với mốc khởi điểm 1500
  const breakout = [...withStats].filter(p=>p.elo>1500).sort((a,b)=>(b.elo-1500)-(a.elo-1500))[0];
  badges.push({id:'breakout', emoji:'🐣', title:'Bứt Phá Nhất', desc:'Tăng ELO nhiều nhất so với mốc khởi điểm 1500', color:'#ec4899',
    holder: breakout||null, extra: breakout?`+${breakout.elo-1500} ELO`:null});

  return badges;
}

/* ─── BẢNG PHONG THẦN THÁNG (tự sinh caption) ────────────── */
function parseMatchMonth(dateStr){
  // dateStr dạng "DD/MM" (đôi khi có thể thiếu năm) — lấy phần MM
  const parts = (dateStr||'').split('/');
  return parts.length>=2 ? parts[1] : null;
}

function computeHallOfFame(players, matches){
  const now = new Date();
  const curMonth = String(now.getMonth()+1).padStart(2,'0');
  const monthMatches = matches.filter(m=>parseMatchMonth(m.date)===curMonth);

  if(!monthMatches.length){
    return {hasData:false, monthMatches:[]};
  }

  // Top thắng trong tháng
  const winCount = {}, loseCount = {};
  monthMatches.forEach(m=>{
    (m.eloChanges||[]).forEach(({name,delta})=>{
      if(delta>0) winCount[name]=(winCount[name]||0)+1;
      else if(delta<0) loseCount[name]=(loseCount[name]||0)+1;
    });
  });
  const topWinner = Object.entries(winCount).sort((a,b)=>b[1]-a[1])[0];
  const topLoser = Object.entries(loseCount).sort((a,b)=>b[1]-a[1])[0];

  // Cặp đôi ăn ý nhất (đánh đôi cùng team, tỷ lệ thắng cao, tối thiểu 2 trận chung)
  const pairStats = {};
  monthMatches.filter(m=>m.type==='Đôi').forEach(m=>{
    [m.team1Players, m.team2Players].forEach((team,idx)=>{
      if((team||[]).length===2){
        const key = [...team].sort().join(' & ');
        const won = idx===0 ? m.result==='W' : m.result==='L';
        if(!pairStats[key]) pairStats[key]={w:0,total:0};
        pairStats[key].total++;
        if(won) pairStats[key].w++;
      }
    });
  });
  const bestPair = Object.entries(pairStats).filter(([,s])=>s.total>=2).sort((a,b)=>(b[1].w/b[1].total)-(a[1].w/a[1].total))[0];

  // ELO tăng nhiều nhất trong tháng
  const eloGain = {};
  monthMatches.forEach(m=>{
    (m.eloChanges||[]).forEach(({name,delta})=>{
      eloGain[name]=(eloGain[name]||0)+delta;
    });
  });
  const topGainer = Object.entries(eloGain).sort((a,b)=>b[1]-a[1])[0];

  return {
    hasData:true,
    monthMatches,
    monthLabel: now.toLocaleDateString('vi-VN',{month:'long',year:'numeric'}),
    topWinner: topWinner ? {name:topWinner[0], wins:topWinner[1]} : null,
    topLoser: topLoser ? {name:topLoser[0], losses:topLoser[1]} : null,
    bestPair: bestPair ? {names:bestPair[0], w:bestPair[1].w, total:bestPair[1].total} : null,
    topGainer: topGainer ? {name:topGainer[0], gain:topGainer[1]} : null,
  };
}

// Tính số "phần chia" thực tế của 1 buổi chơi: người Xé Vé tính theo số người xé vé thực tế (xeVeCount), không phải 1
function effectiveShares(s){
  const attending = s.attendees ? Object.entries(s.attendees).filter(([,v])=>v).map(([k])=>k) : [];
  const xeVeIsIn = attending.includes('Xé Vé');
  const xeVeCount = xeVeIsIn ? Math.max(1, parseInt(s.xeVeCount)||1) : 0;

  return others + xeVeCount;
}

}

/* ─── CROP MODAL (dùng cho cả banner và avatar) ─────────── */
function CropModal({src, aspect, onDone, onClose, round=false}){
  const canvasRef = React.useRef(null);
  const [drag, setDrag] = React.useState(false);
  const [img, setImg] = React.useState(null);
  const [offset, setOffset] = React.useState({x:0, y:0});
  const [scale, setScale] = React.useState(1);
  const [last, setLast] = React.useState(null);

  // Canvas display size
  const CW = Math.min(window.innerWidth - 48, 480);
  const CH = round ? CW : Math.round(CW / aspect);

  useEffect(()=>{
    const i = new Image();
    i.onload = ()=>{
      setImg(i);
      // fit image to canvas initially
      const sc = Math.max(CW/i.width, CH/i.height);
      setScale(sc);
      setOffset({x:(CW - i.width*sc)/2, y:(CH - i.height*sc)/2});
    };
    i.src = src;
  }, [src]);

  useEffect(()=>{
    if(!img || !canvasRef.current) return;
    const ctx = canvasRef.current.getContext('2d');
    ctx.clearRect(0,0,CW,CH);
    if(round){
      ctx.save();
      ctx.beginPath();
      ctx.arc(CW/2, CH/2, CW/2, 0, Math.PI*2);
      ctx.clip();
    }
    ctx.drawImage(img, offset.x, offset.y, img.width*scale, img.height*scale);
    if(round) ctx.restore();
    // overlay guide
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 2;
    if(round){
      ctx.beginPath(); ctx.arc(CW/2,CH/2,CW/2-1,0,Math.PI*2); ctx.stroke();
    } else {
      ctx.strokeRect(1,1,CW-2,CH-2);
    }
  }, [img, offset, scale, CW, CH]);

  const getPos = e => {
    const r = canvasRef.current.getBoundingClientRect();
    if(e.touches) return {x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top};
    return {x: e.clientX - r.left, y: e.clientY - r.top};
  };

  const onDown = e => { e.preventDefault(); setDrag(true); setLast(getPos(e)); };
  const onMove = e => {
    if(!drag) return; e.preventDefault();
    const p = getPos(e);
    setOffset(o => ({x: o.x + p.x - last.x, y: o.y + p.y - last.y}));
    setLast(p);
  };
  const onUp = () => setDrag(false);
  const onWheel = e => { e.preventDefault(); setScale(s => Math.max(0.2, s - e.deltaY*0.001)); };

  const done = () => {
    // Xuất ảnh ở độ phân giải cao hơn canvas hiển thị (canvas hiển thị chỉ để kéo/zoom cho mượt),
    // tránh ảnh bị banner full-width kéo giãn ra gây vỡ nét.
    // TARGET_W tính theo chiều rộng màn hình thực tế * devicePixelRatio (Retina/HiDPI cần nhiều pixel hơn),
    // để banner luôn nét dù hiển thị full-width trên desktop rộng hoặc màn hình Retina.
    const dpr = window.devicePixelRatio || 1;
    const TARGET_W = round
      ? Math.min(1000, Math.round(500 * dpr))
      : Math.min(2600, Math.round(Math.max(1600, window.innerWidth * dpr)));
    const outScale = Math.min(6, Math.max(1, TARGET_W / CW)); // không phóng quá to nếu CW đã lớn
    const out = document.createElement('canvas');
    out.width = CW*outScale; out.height = CH*outScale;
    const ctx = out.getContext('2d');
    ctx.scale(outScale, outScale);
    if(round){ ctx.beginPath(); ctx.arc(CW/2,CH/2,CW/2,0,Math.PI*2); ctx.clip(); }
    ctx.drawImage(img, offset.x, offset.y, img.width*scale, img.height*scale);
    onDone(out.toDataURL('image/jpeg', 0.95));
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth: CW+48, padding:'20px'}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">{round ? '✂️ Cắt ảnh tròn' : '✂️ Cắt ảnh banner'}</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'10px'}}>
          🖱 Kéo để di chuyển · Cuộn chuột / pinch để zoom
        </div>
        <canvas
          ref={canvasRef} width={CW} height={CH}
          style={{display:'block', borderRadius: round?'50%':'10px', cursor: drag?'grabbing':'grab',
            width:'100%', height:'auto', touchAction:'none', border:'2px solid var(--border)', background:'#111'}}
          onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
          onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}
          onWheel={onWheel}
        />
        <div style={{display:'flex',gap:'10px',marginTop:'14px',alignItems:'center'}}>
          <label style={{fontSize:'12px',color:'var(--muted)',flexShrink:0}}>Thu phóng</label>
          <input type="range" min="0.1" max="4" step="0.01" value={scale}
            onChange={e=>setScale(parseFloat(e.target.value))}
            style={{flex:1, accentColor:'var(--green)'}}/>
          <span style={{fontSize:'12px',color:'var(--muted)',flexShrink:0}}>{Math.round(scale*100)}%</span>
        </div>
        <div className="form-actions" style={{marginTop:'14px'}}>
          <button className="btn-cancel" onClick={onClose}>Hủy</button>
          <button className="btn-save" onClick={done}>✅ Dùng ảnh này</button>
        </div>
      </div>
    </div>
  );
}

  const [localSub, setLocalSub] = React.useState(bannerSub||'Stats & Quỹ CLB · Phông Bạt 🏓');

  useEffect(()=>{ setLocalSub(bannerSub||'Stats & Quỹ CLB · Phông Bạt 🏓'); },[bannerSub]);

    const f = e.target.files?.[0]; if(!f) return;

            <input value={localSub} onChange={e=>setLocalSub(e.target.value)}

/* ─── DASHBOARD ─────────────────────────────────────────── */
function Dashboard({matches,myElo,onAdd,sessions,members,players}){
  const [showAll, setShowAll] = React.useState(false);
  const wins=matches.filter(m=>m.result==='W').length;
  const losses=matches.length-wins;

  const now=new Date();
  const curMonth=String(now.getMonth()+1).padStart(2,'0');

  const monthSessions=(sessions||[]).filter(s=>{
    const p=s.date.split(/[\/\-]/);
    return p.length>=2&&String(p[1]).padStart(2,'0')===curMonth;
  });
  const monthSpent=monthSessions.reduce((a,s)=>a+s.total,0);
  const monthSessionCount=monthSessions.length;

  // Tính tổng đã đóng trong tháng: cộng các deposit có date tháng hiện tại
  const monthPaid=(members||[]).reduce((acc,m)=>{
    const deps=(m.deposits||[]).filter(d=>{
      if(!d.date||d.date==='Ban đầu') return false;
      const p=d.date.split(/[\/\-]/);
      return p.length>=2&&String(p[1]).padStart(2,'0')===curMonth;
    });
    return acc+deps.reduce((s,d)=>s+d.amount,0);
  },0);

  const hof = useMemo(()=>computeHallOfFame(players||[], matches), [players, matches]);
  const last = n => n;

  return <>
    <div className="stats-grid">
      <div className="stat-card sc-green">
        <div className="sc-label">Đã đóng tháng {parseInt(curMonth)}</div>
        <div className="sc-val" style={{fontSize:'18px'}}>{fmt(monthPaid)}</div>
        <div className="sc-sub">trong tháng này</div>
      </div>
      <div className="stat-card sc-red">
        <div className="sc-label">Đã chi tháng {parseInt(curMonth)}</div>
        <div className="sc-val" style={{fontSize:'18px'}}>{fmt(monthSpent)}</div>
        <div className="sc-sub">{monthSessionCount} buổi</div>
      </div>
      <div className="stat-card sc-purple">
        <div className="sc-label">Số buổi tháng {parseInt(curMonth)}</div>
        <div className="sc-val">{monthSessionCount}</div>
        <div className="sc-sub">buổi đã đi</div>
      </div>
      <div className="stat-card sc-orange">
        <div className="sc-label">Tổng trận đã đánh</div>
        <div className="sc-val">{matches.length}</div>
        <div className="sc-sub">{wins}W · {losses}L</div>
      </div>
    </div>

    <div className="fun-section-title">📜 Bảng Phong Thần {hof.monthLabel ? `· ${hof.monthLabel}` : ''}</div>
    {!hof.hasData ? (
      <div style={{textAlign:'center',padding:'40px',color:'var(--muted)',background:'var(--surface)',borderRadius:'14px',border:'1px solid var(--border)',marginBottom:'20px'}}>
        <div style={{fontSize:'32px',marginBottom:'8px'}}>📜</div>
        <div>Chưa có trận nào trong tháng này.</div>
        <div style={{fontSize:'12px',marginTop:'4px'}}>Ghi trận để bảng phong thần tháng này có dữ liệu nhé!</div>
      </div>
    ) : (
      <div className="hof-card" style={{marginBottom:'20px'}}>
        <div className="hof-month">📅 {hof.monthLabel} · {hof.monthMatches.length} trận đã đấu</div>
        {hof.topWinner && (
          <div className="hof-caption">
            🔥 <b>{last(hof.topWinner.name)}</b> đang thống trị tháng này với <b>{hof.topWinner.wins} trận thắng</b> — không ai cản được!
          </div>
        )}
        {hof.topGainer && hof.topGainer.gain>0 && (
          <div className="hof-caption">
            📈 <b>{last(hof.topGainer.name)}</b> leo hạng nhanh nhất, ELO tăng <b>+{hof.topGainer.gain}</b> chỉ trong tháng này.
          </div>
        )}
        {hof.bestPair && (
          <div className="hof-caption">
            🤝 Cặp đôi ăn ý nhất: <b>{hof.bestPair.names.split(' & ').map(n=>last(n)).join(' & ')}</b> thắng {hof.bestPair.w}/{hof.bestPair.total} trận đánh đôi cùng nhau.
          </div>
        )}
        {hof.topLoser && (
          <div className="hof-caption" style={{opacity:.85}}>
            💀 <b>{last(hof.topLoser.name)}</b> đang có tháng hơi "đen", thua {hof.topLoser.losses} trận — cố lên, gỡ kèo tháng sau!
          </div>
        )}
        <div className="hof-sub">💡 Bảng này tự cập nhật theo trận đấu thật trong tháng — không cần nhập tay.</div>
      </div>
    )}

    <div className="match-header">
      <div className="section-title">Trận gần đây</div>
      <button className="btn-ghi" onClick={onAdd}>+ Ghi trận</button>
    </div>
    {/* Danh sách trận — hiện 5 hoặc tất cả */}
    <div className="match-list">
      {(showAll ? matches : matches.slice(0,5)).map(m=>(
        <MatchItem key={m.id} m={m} showDel={false}/>
      ))}
      {matches.length===0 && <div style={{textAlign:'center',padding:'32px',color:'var(--muted)'}}>Chưa có trận nào. Ghi trận đầu tiên nào!</div>}
    </div>
    {matches.length>5 && (
      <button onClick={()=>setShowAll(v=>!v)} style={{width:'100%',marginTop:'10px',background:'var(--surface)',border:'1px dashed var(--border2)',borderRadius:'10px',padding:'11px',fontSize:'13px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif',color:'var(--muted)',display:'flex',alignItems:'center',justifyContent:'center',gap:'6px'}}>
        {showAll ? '▲ Thu gọn' : `📋 Xem thêm ${matches.length - 5} trận còn lại`}
      </button>
    )}
  </>;
}

/* ─── EDIT MATCH MODAL ───────────────────────────────────── */
function EditMatchModal({match,players,onClose,onSave}){
  const [type,setType]=useState(match.type||'Đôi');
  const [date,setDate]=useState(match.date||'');
  const [score1,setScore1]=useState(String(match.score1??''));
  const [score2,setScore2]=useState(String(match.score2??''));
  const t1p=match.team1Players||[];
  const t2p=match.team2Players||[];
  const [p1,setP1]=useState(t1p[0]||'');
  const [p2,setP2]=useState(t2p[0]||'');
  const [t1a,setT1a]=useState(t1p[0]||'');
  const [t1b,setT1b]=useState(t1p[1]||'');
  const [t2a,setT2a]=useState(t2p[0]||'');
  const [t2b,setT2b]=useState(t2p[1]||'');
  const s1=parseInt(score1)||0,s2=parseInt(score2)||0;
  const win=s1>s2;
  const pOpts=players.map(p=>p.name);
  const sel=(val,fn,others=[])=>(
    <select className="fi" value={val} onChange={e=>fn(e.target.value)}>
      <option value="">-- Chọn --</option>
      {pOpts.filter(n=>n===val||!others.filter(Boolean).includes(n)).map(n=><option key={n}>{n}</option>)}
    </select>
  );
  const eloPreview=useMemo(()=>{
    if(!score1||!score2) return null;
    if(type==='Đơn'){
      const pa=players.find(p=>p.name===p1),pb=players.find(p=>p.name===p2);
      if(!pa||!pb) return null;
      const d=calcEloChangePair(pa.elo,pb.elo,win,'Đơn');
      return [{name:pa.name,delta:d},{name:pb.name,delta:-d}];
    } else {
      const pa=players.find(p=>p.name===t1a),pb=players.find(p=>p.name===t1b);
      const pc=players.find(p=>p.name===t2a),pd=players.find(p=>p.name===t2b);
      if(!pa||!pc) return null;
      const elo1=pa&&pb?Math.round((pa.elo+(pb?.elo||pa.elo))/2):pa?.elo||1500;
      const elo2=pc&&pd?Math.round((pc.elo+(pd?.elo||pc.elo))/2):pc?.elo||1500;
      const d=calcEloChangePair(elo1,elo2,win,'Đôi');
      const res=[];
      if(pa)res.push({name:pa.name,delta:d});
      if(pb)res.push({name:pb.name,delta:d});
      if(pc)res.push({name:pc.name,delta:-d});
      if(pd)res.push({name:pd.name,delta:-d});
      return res;
    }
  },[score1,score2,type,p1,p2,t1a,t1b,t2a,t2b,players]);

  const save=()=>{
    if(!score1||!score2) return;
    let team1,team2,team1P,team2P;
    if(type==='Đơn'){if(!p1||!p2)return;team1=p1;team2=p2;team1P=[p1];team2P=[p2];}
    else{if(!t1a||!t2a)return;team1=t1b?`${t1a} & ${t1b}`:t1a;team2=t2b?`${t2a} & ${t2b}`:t2a;team1P=[t1a,t1b].filter(Boolean);team2P=[t2a,t2b].filter(Boolean);}
    onSave({...match,type,date,score1:s1,score2:s2,result:win?'W':'L',myTeam:team1,oppTeam:team2,team1Players:team1P,team2Players:team2P,eloChanges:eloPreview||[]});
    onClose();
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">✏️ Sửa trận đấu</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div style={{display:'flex',gap:'6px',marginBottom:'14px'}}>
          {['Đơn','Đôi'].map(t=>(
            <button key={t} onClick={()=>setType(t)} style={{flex:1,padding:'8px',borderRadius:'8px',border:'1px solid',fontSize:'13px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:600,
              borderColor:type===t?'var(--green)':'var(--border)',background:type===t?'var(--green-bg)':'var(--surface)',color:type===t?'var(--green)':'var(--muted)'}}>
              {t==='Đơn'?'🧍 Đánh Đơn':'👥 Đánh Đôi'}
            </button>
          ))}
        </div>
        {type==='Đơn'?(
          <div className="form-grid" style={{marginBottom:'12px'}}>
            <div className="fg"><label className="fl">Người 1 (Đội A)</label>{sel(p1,setP1,[p2])}</div>
            <div className="fg"><label className="fl">Người 2 (Đội B)</label>{sel(p2,setP2,[p1])}</div>
          </div>
        ):(
          <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:'8px',alignItems:'center',marginBottom:'12px'}}>
            <div>
              <div className="fl" style={{marginBottom:'6px',textAlign:'center',color:'var(--green)'}}>⚡ Đội A</div>
              <div className="fg" style={{marginBottom:'6px'}}><label className="fl">Người 1</label>{sel(t1a,setT1a,[t1b,t2a,t2b])}</div>
              <div className="fg"><label className="fl">Người 2</label>{sel(t1b,setT1b,[t1a,t2a,t2b])}</div>
            </div>
            <div style={{textAlign:'center',fontFamily:'Quicksand',fontWeight:700,color:'var(--muted)',fontSize:'14px',paddingTop:'16px'}}>VS</div>
            <div>
              <div className="fl" style={{marginBottom:'6px',textAlign:'center',color:'var(--red)'}}>🔥 Đội B</div>
              <div className="fg" style={{marginBottom:'6px'}}><label className="fl">Người 1</label>{sel(t2a,setT2a,[t1a,t1b,t2b])}</div>

function MatchItem({m, showDel, onDelete, onEdit, perspective}){
  const [expanded, setExpanded] = React.useState(false);
  const team1 = m.team1Players || (m.myTeam ? [m.myTeam] : []);
  const team2 = m.team2Players || (m.oppTeam ? [m.oppTeam] : []);
  const eloChanges = m.eloChanges || [];

  // m.result luôn theo góc nhìn Đội A. Nếu đang lọc/xem theo 1 người cụ thể
  // và người đó ở Đội B thì phải đảo lại kết quả cho đúng góc nhìn của họ.
  const inT1 = perspective ? team1.includes(perspective) : true;
  const displayResult = perspective ? (inT1 ? m.result : (m.result==='W'?'L':'W')) : m.result;

  return (
    <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',marginBottom:'8px',overflow:'hidden'}}>

          <div className="m-vs">{m.myTeam} vs {m.oppTeam}</div>
          <div className="m-meta"><span>{m.date}</span><span>{m.type}</span></div>
        </div>
        <div>
          <div className="m-score" style={{color:displayResult==='W'?'var(--green)':'var(--red)'}}>{m.score1}–{m.score2}</div>
        </div>
        {showDel && <button className="del-btn" title="Sửa" onClick={e=>{e.stopPropagation();onEdit&&onEdit(m);}} style={{background:'var(--blue-bg)',color:'var(--blue)'}}>✏️</button>}
        {showDel && <button className="del-btn" onClick={e=>{e.stopPropagation();onDelete(m.id);}}>🗑</button>}
        {!showDel && <div style={{textAlign:'center',fontSize:'11px',color:'var(--muted)',opacity:.5}}>{expanded?'▲':'▼'}</div>}
      </div>

      {expanded && (
        <div style={{borderTop:'1px solid var(--border)',background:'var(--bg3)',padding:'12px 15px',fontSize:'13px'}}>
          {/* Đội A */}
          <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:'8px',alignItems:'start',marginBottom:'10px'}}>
            <div>
              <div style={{fontSize:'10px',color:'var(--green)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'5px'}}>Đội A {m.result==='W'?'🏆':''}</div>
              {team1.map(name=>{
                const ch=eloChanges.find(e=>e.name===name);
                return (
                  <div key={name} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'4px 8px',background:'var(--surface)',borderRadius:'7px',marginBottom:'3px',border:'1px solid var(--border)'}}>
                    <span style={{fontWeight:600,fontSize:'12px'}}>{name}</span>
                    {ch && <span style={{fontSize:'11px',fontWeight:700,color:ch.delta>0?'var(--green)':'var(--red)'}}>{ch.delta>0?'+':''}{ch.delta}</span>}

              <div style={{fontSize:'10px',color:'var(--red)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'5px'}}>Đội B {m.result==='L'?'🏆':''}</div>

/* ─── DATE PICKER HELPER ─────────────────────────────────── */
// Convert DD/MM string <-> YYYY-MM-DD for input[type=date]
function toInputDate(ddmm){
  if(!ddmm) return '';
  const [d,m]=ddmm.split('/');
  if(!d||!m) return '';
  const y=new Date().getFullYear();
  return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
}
function fromInputDate(val){
  if(!val) return '';
  const [,m,d]=val.split('-');
  return `${d}/${m}`;
}
function DateInput({value,onChange,style}){
  return (
    <input
      type="date"
      className="fi"
      style={{...style,colorScheme:'dark'}}
      value={toInputDate(value)}
      onChange={e=>onChange(fromInputDate(e.target.value))}
    />
  );
}

      const d=calcEloChangePair(elo1,elo2,win,'Đôi');

      if(pa) res.push({name:pa.name,delta:d});

      if(pc) res.push({name:pc.name,delta:-d});
      if(pd) res.push({name:pd.name,delta:-d});

/* ─── EXPORT CSV ─────────────────────────────────────────── */
function exportCSV(matches,players){
  // Matches sheet
  const mRows=[['Ngày','Loại','Đội A','Đội B','Tỉ số','Kết quả','ELO thay đổi']];
  matches.forEach(m=>{
    const eloStr=(m.eloChanges||[]).map(e=>`${e.name}:${e.delta>0?'+':''}${e.delta}`).join(' | ');
    mRows.push([m.date,m.type,m.myTeam,m.oppTeam,`${m.score1}-${m.score2}`,m.result,eloStr]);
  });
  // Players sheet
  const pRows=[['Tên','ELO','Thắng','Thua','Tỉ lệ thắng']];
  [...players].sort((a,b)=>b.elo-a.elo).forEach(p=>{
    const total=p.wins+p.losses;
    pRows.push([p.name,p.elo,p.wins,p.losses,total?Math.round(p.wins/total*100)+'%':'—']);
  });
  const toCSV=rows=>rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const csv='=== LỊCH SỬ TRẬN ===\n'+toCSV(mRows)+'\n\n=== BXH NGƯỜI CHƠI ===\n'+toCSV(pRows);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='picklepro_export.csv';a.click();
  URL.revokeObjectURL(url);
}

/* ─── ELO HISTORY CHART ──────────────────────────────────── */
function EloChart({players,matches}){
  const [selected,setSelected]=useState('');
  const player=players.find(p=>p.name===selected);

  const history=useMemo(()=>{
    if(!player) return [];
    // build elo timeline from matches (oldest first)
    let elo=1500;
    const sorted=[...matches].reverse();
    const pts=[{date:'Bắt đầu',elo:1500}];
    sorted.forEach(m=>{
      const change=(m.eloChanges||[]).find(e=>e.name===player.name);
      if(change){elo+=change.delta;pts.push({date:m.date,elo,delta:change.delta});}
    });
    return pts;
  },[player,matches]);

  const minE=history.length?Math.min(...history.map(h=>h.elo))-30:1470;
  const maxE=history.length?Math.max(...history.map(h=>h.elo))+30:1530;
  const W=560,H=180,PAD=40;
  const xScale=i=>history.length>1?PAD+(i/(history.length-1))*(W-PAD*2):W/2;
  const yScale=e=>H-PAD-((e-minE)/(maxE-minE))*(H-PAD*2);

  const pathD=history.map((h,i)=>`${i===0?'M':'L'}${xScale(i)},${yScale(h.elo)}`).join(' ');

  return (
    <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',padding:'16px',marginBottom:'20px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
        <div className="section-title" style={{fontSize:'15px'}}>📈 Biểu đồ ELO</div>
        <select className="month-sel" value={selected} onChange={e=>setSelected(e.target.value)} style={{fontSize:'12px',padding:'5px 10px'}}>
          <option value="">-- Chọn người chơi --</option>
          {players.map(p=><option key={p.id}>{p.name}</option>)}
        </select>
      </div>
      {!selected && <div style={{textAlign:'center',padding:'32px',color:'var(--muted)',fontSize:'13px'}}>Chọn người chơi để xem biểu đồ ELO</div>}
      {selected && history.length<=1 && <div style={{textAlign:'center',padding:'32px',color:'var(--muted)',fontSize:'13px'}}>Chưa có đủ dữ liệu trận đấu</div>}
      {selected && history.length>1 && (
        <>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible'}}>
            {/* Grid lines */}
            {[0,.25,.5,.75,1].map(t=>{
              const y=PAD+(1-t)*(H-PAD*2);
              const v=Math.round(minE+(maxE-minE)*t);
              return <g key={t}>
                <line x1={PAD} y1={y} x2={W-PAD} y2={y} stroke="var(--border)" strokeWidth="0.5" strokeDasharray="3"/>
                <text x={PAD-4} y={y+4} textAnchor="end" fontSize="9" fill="var(--muted)">{v}</text>
              </g>;
            })}
            {/* Path */}
            <path d={pathD} fill="none" stroke="var(--green)" strokeWidth="2" strokeLinejoin="round"/>
            {/* Fill */}
            <path d={pathD+` L${xScale(history.length-1)},${H-PAD} L${PAD},${H-PAD} Z`} fill="var(--green)" opacity="0.08"/>
            {/* Points */}
            {history.map((h,i)=>(
              <g key={i}>
                <circle cx={xScale(i)} cy={yScale(h.elo)} r="3" fill={h.delta>0?'var(--green)':h.delta<0?'var(--red)':'var(--muted)'} stroke="var(--bg)" strokeWidth="1.5"/>
              </g>
            ))}
          </svg>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'4px',fontSize:'11px',color:'var(--muted)',padding:`0 ${PAD}px`}}>
            <span>{history[0]?.date}</span>
            <span style={{fontFamily:'Quicksand',fontSize:'14px',fontWeight:700,color:player.elo>=1500?'var(--green)':'var(--red)'}}>
              ELO hiện tại: {player.elo}
            </span>
            <span>{history[history.length-1]?.date}</span>
          </div>
        </>
      )}
    </div>
  );
}

/* ─── MATCHES TAB ───────────────────────────────────────── */
function MatchesTab({matches,players,myElo,onAdd,onDelete,onEditMatch}){
  const [typeFilter,setTypeFilter]=useState('Tất cả');
  const [monthFilter,setMonthFilter]=useState('Tất cả');
  const [playerFilter,setPlayerFilter]=useState('Tất cả');
  const [editMatch,setEditMatch]=useState(null);

  // extract unique months from match dates (DD/MM or DD-MM)
  const months=useMemo(()=>{
    const s=new Set();
    matches.forEach(m=>{
      const parts=m.date.split(/[\/\-]/);
      if(parts.length>=2) s.add(parts[1]);
    });
    return ['Tất cả',...[...s].sort((a,b)=>parseInt(a)-parseInt(b)).map(m=>`Tháng ${m}`)];
  },[matches]);

  const playerNames=['Tất cả',...players.map(p=>p.name)];

  const filtered=useMemo(()=>{
    return matches.filter(m=>{
      if(typeFilter!=='Tất cả'&&m.type!==typeFilter) return false;
      if(monthFilter!=='Tất cả'){
        const mon=monthFilter.replace('Tháng ','');
        const parts=m.date.split(/[\/\-]/);
        if(parts.length<2||parts[1]!==mon) return false;
      }
      if(playerFilter!=='Tất cả'){
        const all=[...(m.team1Players||[]),...(m.team2Players||[])];
        if(!all.includes(playerFilter)) return false;
      }
      return true;
    });
  },[matches,typeFilter,monthFilter,playerFilter]);

  // Khi có lọc theo người: tính W/L theo đúng góc nhìn của người đó
  // (m.result luôn theo Đội A, nên nếu người này ở Đội B thì phải đảo lại).
  const wins = playerFilter!=='Tất cả'
    ? filtered.filter(m=>{
        const inT1 = (m.team1Players||[]).includes(playerFilter);
        return inT1 ? m.result==='W' : m.result==='L';
      }).length
    : filtered.filter(m=>m.result==='W').length;
  const losses = filtered.length - wins;
  const winRate = filtered.length ? Math.round((wins/filtered.length)*100) : 0;

  return <>
    <div className="match-header">
      <div className="section-title">Lịch sử trận đấu</div>
      <div style={{display:'flex',gap:'6px'}}>
        <button onClick={()=>exportCSV(matches,players)} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--muted)',padding:'7px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>📥 Xuất CSV</button>
        <button className="btn-ghi" onClick={onAdd}>+ Ghi trận</button>
      </div>
    </div>
    <EloCard myElo={myElo}/>
    <EloChart players={players} matches={matches}/>

    {/* Filters */}
    <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'12px 14px',marginBottom:'14px'}}>
      <div style={{fontSize:'11px',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.6px',marginBottom:'10px'}}>🔍 Lọc trận</div>
      <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
        <div style={{flex:'1 1 130px'}}>
          <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'5px'}}>Loại trận</div>
          <select className="fi" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
            {['Tất cả','Đơn','Đôi'].map(t=><option key={t}>{t}</option>)}
          </select>
        </div>
        <div style={{flex:'1 1 130px'}}>
          <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'5px'}}>Theo tháng</div>
          <select className="fi" value={monthFilter} onChange={e=>setMonthFilter(e.target.value)}>
            {months.map(m=><option key={m}>{m}</option>)}
          </select>
        </div>
        <div style={{flex:'1 1 130px'}}>
          <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'5px'}}>Theo người</div>
          <select className="fi" value={playerFilter} onChange={e=>setPlayerFilter(e.target.value)}>
            {playerNames.map(n=><option key={n}>{n}</option>)}
          </select>
        </div>
      </div>
    </div>

    {playerFilter!=='Tất cả' && filtered.length>0 && (
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'14px 16px',marginBottom:'14px',display:'flex',alignItems:'center',gap:'16px'}}>
        <div style={{position:'relative',width:'56px',height:'56px',flexShrink:0}}>
          <svg width="56" height="56" viewBox="0 0 56 56" style={{transform:'rotate(-90deg)'}}>
            <circle cx="28" cy="28" r="24" fill="none" stroke="var(--border)" strokeWidth="6"/>
            <circle cx="28" cy="28" r="24" fill="none" stroke={winRate>=50?'var(--green)':'var(--red)'} strokeWidth="6"
              strokeDasharray={`${2*Math.PI*24}`} strokeDashoffset={`${2*Math.PI*24*(1-winRate/100)}`} strokeLinecap="round"/>
          </svg>
          <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Quicksand,sans-serif',fontWeight:700,fontSize:'13px'}}>{winRate}%</div>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'2px'}}>Thống kê của <b style={{color:'var(--text)'}}>{playerFilter}</b></div>
          <div style={{display:'flex',gap:'14px',fontSize:'13px'}}>
            <span style={{color:'var(--green)',fontWeight:700}}>{wins} thắng</span>
            <span style={{color:'var(--red)',fontWeight:700}}>{losses} thua</span>
            <span style={{color:'var(--muted)'}}>{filtered.length} trận</span>
          </div>
        </div>
      </div>
    )}

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
      <span style={{fontSize:'13px',color:'var(--muted)'}}>{filtered.length} trận · {wins}W {losses}L</span>
    </div>
    <MatchList matches={filtered} showDel={true} onDelete={onDelete} players={players} onEdit={m=>setEditMatch(m)} perspective={playerFilter!=='Tất cả'?playerFilter:null}/>
    {editMatch&&<EditMatchModal match={editMatch} players={players} onClose={()=>setEditMatch(null)} onSave={m=>{onEditMatch(m);setEditMatch(null);}}/>}
  </>;
}

/* ─── LEADERBOARD ───────────────────────────────────────── */
function LeaderboardTab({players,matches,onAddPlayer,onDeletePlayer,onUpdateAvatar}){
  const [bxhSeg,setBxhSeg]=useState('bxh');
  const [h2hA,setH2hA]=useState('');
  const [h2hB,setH2hB]=useState('');
  const [showAddPlayer,setShowAddPlayer]=useState(false);
  const [newName,setNewName]=useState('');
  const [newElo,setNewElo]=useState('1500');
  const [search,setSearch]=useState('');
  const [monthFilter,setMonthFilter]=useState('all');
  const [confirmDeletePlayer,setConfirmDeletePlayer]=useState(null);

  // Danh sách các tháng có dữ liệu trận đấu (để hiện trong dropdown lọc)
  const availableMonths=useMemo(()=>{
    const set=new Set();
    matches.forEach(m=>{
      const mm=parseMatchMonth(m.date);
      if(mm) set.add(mm);
    });
    return [...set].sort();
  },[matches]);

  const monthMatches=useMemo(()=>{
    if(monthFilter==='all') return matches;
    return matches.filter(m=>parseMatchMonth(m.date)===monthFilter);
  },[matches,monthFilter]);

  // Tính lại thắng/thua/tổng trận theo phạm vi lọc (tất cả hoặc theo tháng) — không dùng trực tiếp p.wins/p.losses lũy kế
  const statsForRange=useMemo(()=>{
    const map={};
    players.forEach(p=>{ map[p.name]={wins:0,losses:0}; });
    monthMatches.forEach(m=>{
      (m.eloChanges||[]).forEach(({name,delta})=>{
        if(!map[name]) map[name]={wins:0,losses:0};
        if(delta>0) map[name].wins++;
        else if(delta<0) map[name].losses++;
      });
    });
    return map;
  },[players,monthMatches]);

  const filteredSorted=useMemo(()=>{
    let list=[...players].sort((a,b)=>b.elo-a.elo);
    if(search.trim()){
      const q=search.trim().toLowerCase();
      list=list.filter(p=>p.name.toLowerCase().includes(q));
    }
    return list;
  },[players,search]);

  // Tổng kết toàn CLB cho phạm vi đang lọc
  const clubSummary=useMemo(()=>{
    let totalWins=0,totalLosses=0;
    Object.values(statsForRange).forEach(s=>{ totalWins+=s.wins; totalLosses+=s.losses; });
    return {totalMatches:monthMatches.length, totalWins, totalLosses};
  },[statsForRange,monthMatches]);

  const sorted=filteredSorted;
  const maxElo=sorted.length?sorted[0].elo:1600;
  const minElo=1400;

  // head-to-head
  const h2hData=useMemo(()=>{
    if(!h2hA||!h2hB) return null;
    const relevant=matches.filter(m=>{
      const allP=[...(m.team1Players||[]),(m.team2Players||[])];
      return (m.team1Players||[]).includes(h2hA)&&(m.team2Players||[]).includes(h2hB)||
             (m.team1Players||[]).includes(h2hB)&&(m.team2Players||[]).includes(h2hA);
    });
    let wA=0,wB=0;
    relevant.forEach(m=>{
      const aInT1=(m.team1Players||[]).includes(h2hA);
      if(aInT1&&m.result==='W') wA++;
      else if(!aInT1&&m.result==='L') wA++;
      else wB++;
    });
    return {matches:relevant,wA,wB};
  },[h2hA,h2hB,matches]);

  return <>
    {/* Segment */}
    <div style={{display:'flex',background:'var(--surface)',borderRadius:'10px',padding:'4px',gap:'4px',marginBottom:'16px',width:'fit-content'}}>
      {[['bxh','🏆 Bảng Xếp Hạng'],['h2h','⚔️ Đối Đầu']].map(([id,lb])=>(
        <button key={id} onClick={()=>setBxhSeg(id)} className={`seg-btn${bxhSeg===id?' active':''}`}>{lb}</button>
      ))}
    </div>

    {bxhSeg==='bxh' && <>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px',flexWrap:'wrap',gap:'8px'}}>
        <div className="section-title">🏆 BXH Điểm Kỹ Năng (Rating)</div>
        <button onClick={()=>setShowAddPlayer(!showAddPlayer)} style={{background:'var(--green-bg)',border:'1px solid var(--green)',borderRadius:'8px',color:'var(--green)',padding:'6px 14px',fontSize:'12px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>+ Thêm người chơi</button>
      </div>

      {showAddPlayer && (
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'14px',marginBottom:'14px'}}>
          <div style={{display:'flex',gap:'10px',alignItems:'flex-end',marginBottom:'0'}}>
            <div className="fg" style={{flex:2}}><label className="fl">Tên người chơi</label><input className="fi" value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Nguyễn Văn A"/></div>
            <div className="fg" style={{flex:1}}>
              <label className="fl">ELO ban đầu</label>
              <input className="fi" type="number" value={newElo} onChange={e=>setNewElo(e.target.value)} placeholder="1500" min="0" max="3000"/>
            </div>
          </div>
          <div style={{fontSize:'11px',color:'var(--muted)',margin:'6px 0 10px'}}>
            Chuyên ≥1700 · Nâng cao ≥1580 · Trung bình ≥1450 · Mới bắt đầu &lt;1450
          </div>
          <div style={{display:'flex',gap:'8px'}}>
            <button className="btn-save" style={{flex:1}} onClick={()=>{if(newName.trim()){onAddPlayer(newName.trim(),newElo);setNewName('');setNewElo('1500');setShowAddPlayer(false);}}}>Thêm</button>
            <button className="btn-cancel" onClick={()=>{setShowAddPlayer(false);setNewElo('1500');}}>Hủy</button>
          </div>
        </div>
      )}

      {/* Tìm kiếm + lọc tháng */}
      <div style={{display:'flex',gap:'8px',marginBottom:'12px',flexWrap:'wrap'}}>
        <div style={{position:'relative',flex:'1 1 200px'}}>
          <span style={{position:'absolute',left:'12px',top:'50%',transform:'translateY(-50%)',fontSize:'13px',color:'var(--muted)',pointerEvents:'none'}}>🔍</span>
          <input
            className="fi"
            style={{paddingLeft:'32px'}}
            value={search}
            onChange={e=>setSearch(e.target.value)}
            placeholder="Tìm tên người chơi..."
          />
        </div>
        <select className="month-sel" value={monthFilter} onChange={e=>setMonthFilter(e.target.value)} style={{flex:'0 0 auto'}}>
          <option value="all">📅 Tất cả thời gian</option>
          {availableMonths.map(mm=><option key={mm} value={mm}>Tháng {mm}</option>)}
        </select>
      </div>

      {/* Tổng kết */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:'14px'}}>
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'10px',padding:'10px',textAlign:'center'}}>
          <div style={{fontSize:'10px',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'3px'}}>Tổng trận</div>
          <div style={{fontFamily:'Quicksand,sans-serif',fontWeight:700,fontSize:'18px'}}>{clubSummary.totalMatches}</div>
        </div>
        <div style={{background:'var(--green-bg)',border:'1px solid var(--green)',borderRadius:'10px',padding:'10px',textAlign:'center'}}>
          <div style={{fontSize:'10px',color:'var(--green)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'3px'}}>Tổng thắng</div>
          <div style={{fontFamily:'Quicksand,sans-serif',fontWeight:700,fontSize:'18px',color:'var(--green)'}}>{clubSummary.totalWins}</div>
        </div>
        <div style={{background:'var(--red-bg)',border:'1px solid var(--red)',borderRadius:'10px',padding:'10px',textAlign:'center'}}>
          <div style={{fontSize:'10px',color:'var(--red)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'3px'}}>Tổng thua</div>
          <div style={{fontFamily:'Quicksand,sans-serif',fontWeight:700,fontSize:'18px',color:'var(--red)'}}>{clubSummary.totalLosses}</div>
        </div>
      </div>

      {/* Tier legend */}
      <div style={{display:'flex',gap:'6px',marginBottom:'12px',flexWrap:'wrap'}}>

            {t.icon} {t.label} {t.min>0?`≥${t.min}`:''}
          </span>
        ))}
      </div>

      {sorted.length===0 && (
        <div style={{textAlign:'center',padding:'40px',color:'var(--muted)'}}>
          <div style={{fontSize:'32px',marginBottom:'8px'}}>👥</div>
          <div>{search.trim()?'Không tìm thấy người chơi nào.':'Chưa có người chơi nào. Thêm người chơi để bắt đầu!'}</div>
        </div>
      )}

      <div className="bxh-card">
        <div className="bxh-header-row">
          <div>#</div><div>Người chơi</div>
          <div style={{textAlign:'center'}}>ELO</div>
          <div style={{textAlign:'center'}}>W/L</div>
          <div></div>
        </div>
        {sorted.map((p,i)=>{
          const rangeStats=statsForRange[p.name]||{wins:0,losses:0};

          const myBadges=allBadges.filter(b=>b.holder&&b.holder.id===p.id);
          return (

              <div className={`rank-num${i===0?' r1':i===1?' r2':i===2?' r3':''}`}>
                {i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}
              </div>
              <div className="player-cell">
                <PlayerAvatar player={p} onUpdateAvatar={onUpdateAvatar} size={34}/>

                  <div style={{display:'flex',alignItems:'center',gap:'3px',flexWrap:'wrap'}}>

        {players.length===0 ? (
          <div style={{textAlign:'center',padding:'32px',color:'var(--muted)',background:'var(--surface)',borderRadius:'14px',border:'1px solid var(--border)'}}>
            <div style={{fontSize:'32px',marginBottom:'8px'}}>🏅</div>
            <div>Thêm người chơi và ghi trận để xét huy hiệu.</div>
          </div>
        ) : (
          <BadgeSection players={sorted} matches={matches}/>
        )}
      </div>
    </>}

    {bxhSeg==='h2h' && <>
      <div className="section-title" style={{marginBottom:'14px'}}>⚔️ Đối Đầu Trực Tiếp</div>

            <select className="fi" value={h2hA} onChange={e=>setH2hA(e.target.value)}>
              <option value="">-- Chọn --</option>
              {players.map(p=><option key={p.id}>{p.name}</option>)}
            </select>
          </div>
          <div style={{textAlign:'center',fontFamily:'Quicksand',fontWeight:700,color:'var(--orange)',fontSize:'18px'}}>VS</div>
