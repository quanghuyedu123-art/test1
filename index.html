    return ()=>{ document.removeEventListener('mousedown', onDocClick); };
  },[]);
  const itemStyle={display:'flex',alignItems:'center',gap:'9px',width:'100%',padding:'10px 14px',background:'none',border:'none',color:'#e5e7ec',fontSize:'13px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif',textAlign:'left',whiteSpace:'nowrap'};
  const handleTrigger=()=>{
    if(!isAdmin){ onToggleLock(); return; } // chưa mở khoá -> hỏi PIN luôn, khỏi cần mở menu
    if(!open && btnRef.current){
      const r=btnRef.current.getBoundingClientRect();
      setPos({top:r.bottom+6, right:window.innerWidth-r.right});
    }
    setOpen(o=>!o);
  };
  return (
    <>
      <button ref={btnRef} onClick={handleTrigger} title={isAdmin?'Khu vực quản trị':'Mở khoá quản trị'} style={{background: open?'rgba(255,255,255,.14)':(isAdmin?'var(--green-bg)':'rgba(255,255,255,.08)'),border:`1px solid ${isAdmin?'var(--green)':'rgba(255,255,255,.2)'}`,borderRadius:'8px',color:isAdmin?'var(--green)':'#9aa1b3',padding: dark? '7px 10px':'6px 9px',fontSize:'13px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif',position:'relative',lineHeight:1}}>
        {isAdmin?'🔓':'🔒'}
        {(isAdmin && trashCount>0) && <span style={{position:'absolute',top:'-5px',right:'-5px',background:'var(--red)',color:'#fff',fontSize:'9px',borderRadius:'20px',padding:'1px 5px',fontWeight:700}}>{trashCount}</span>}
      </button>
      {open && isAdmin && ReactDOM.createPortal(
        <div ref={menuRef} style={{position:'fixed',top:pos.top,right:pos.right,background:'#0d1422',border:'1px solid #1e2d45',borderRadius:'10px',minWidth:'190px',boxShadow:'0 8px 32px rgba(0,0,0,.6)',overflow:'hidden',zIndex:9999}}>
          <button style={itemStyle} onClick={()=>{setOpen(false);onOpenTrash();}}>
            🗑 Thùng rác{trashCount>0?` (${trashCount})`:''}
          </button>
          <div style={{height:'1px',background:'#1e2d45',margin:'4px 0'}}/>
          <button style={itemStyle} onClick={()=>{setOpen(false);onBackup&&onBackup();}}>
            💾 Sao lưu / Khôi phục dữ liệu
          </button>
          <div style={{height:'1px',background:'#1e2d45',margin:'4px 0'}}/>
          <button style={itemStyle} onClick={()=>{setOpen(false);onMergePerson&&onMergePerson();}}>
            🔗 Ghép người trùng (BXH ↔ Quỹ)
          </button>
          <div style={{height:'1px',background:'#1e2d45',margin:'4px 0'}}/>
          <button style={{...itemStyle,color:'var(--red)'}} onClick={()=>{setOpen(false);onResetElo&&onResetElo();}}>
            🔄 Reset mùa giải (Công Đức + xoá lịch sử trận)
          </button>
          <div style={{height:'1px',background:'#1e2d45',margin:'4px 0'}}/>
          <button style={{...itemStyle,color:'var(--green)'}} onClick={()=>{setOpen(false);onToggleLock();}}>
            🔓 Khoá lại quyền chỉnh sửa
          </button>
        </div>,
        document.body
      )}
    </>
  );
}

/* ─── APP ────────────────────────────────────────────────── */
function App(){
  const [tab,setTab]=useState('dashboard');
  const [prevTab,setPrevTab]=useState('bxh');
  const [historyPlayerId,setHistoryPlayerId]=useState(null);
  const goToPlayerHistory=p=>{ setHistoryPlayerId(p.id); setPrevTab(tab==='playerHistory'?prevTab:tab); setTab('playerHistory'); window.scrollTo({top:0,behavior:'smooth'}); };
  const [players,setPlayers]=useState(INIT_PLAYERS);
  const [matches,setMatches]=useState(INIT_MATCHES);
  const [sessions,setSessions]=useState(INIT_SESSIONS);
  const [members,setMembers]=useState([
    {name:'Huy Xinh',        paid:1500000,color:COLORS[0],deposits:[{date:'Ban đầu',amount:500000},{date:'11/04',amount:500000},{date:'05/05',amount:500000}]},
    {name:'Nhi Xinh',        paid:1332000,color:COLORS[1],deposits:[{date:'Ban đầu',amount:332000},{date:'11/04',amount:500000},{date:'05/05',amount:500000}]},
    {name:'Chị Thương Xinh', paid:1500000,color:COLORS[2],deposits:[{date:'Ban đầu',amount:500000},{date:'21/04',amount:500000},{date:'05/05',amount:500000}]},
    {name:'Em Thương Xinh',  paid:1000000,color:COLORS[3],deposits:[{date:'Ban đầu',amount:500000},{date:'23/03',amount:500000}]},
    {name:'Tuấn Xinh',       paid:1500000,color:COLORS[4],deposits:[{date:'Ban đầu',amount:500000},{date:'23/03',amount:500000},{date:'05/05',amount:500000}]},
    {name:'Xé Vé',           paid:435000, color:COLORS[5],deposits:[{date:'Ban đầu',amount:75000},{date:'Ban đầu',amount:70000},{date:'Ban đầu',amount:140000},{date:'06/03',amount:150000}]},
  ]);
  const [dbReady,setDbReady]=useState(false);
  const [syncing,setSyncing]=useState(false);
  const [bannerImg,setBannerImg]=useState(null);
  const [bannerTitle,setBannerTitle]=useState('Pích Cờ Bôn Phông Bạt');
  const [bannerSub,setBannerSub]=useState('Stats & Hòm Công Đức · Phông Bạt 🏓');
  const [bannerOverlay,setBannerOverlay]=useState(45);
  const [bannerBrightness,setBannerBrightness]=useState(100);
  // Vị trí lấy nét (%) + độ zoom của ảnh bìa — dùng chung 1 giá trị cho cả mobile & desktop
  // Cấu hình ngân hàng nhận quỹ CLB — dùng để tạo mã QR nhắc nợ (VietQR)
  const [bankInfo,setBankInfo]=useState({bankCode:'',accountNo:'',accountName:''});
  // Thùng rác: lưu tạm các mục đã xóa (thành viên/trận đấu/buổi chơi/người chơi) để có thể khôi phục, tự dọn sau 30 ngày
  const [trash,setTrash]=useState({members:[],sessions:[],matches:[],players:[]});
  const TRASH_RETENTION_DAYS=30;
  // Giải đấu loại trực tiếp (sơ đồ bốc thăm) — chỉ lưu 1 giải đang diễn ra tại 1 thời điểm
  const [tournament,setTournament]=useState(null);

  // Chuẩn hoá dữ liệu trash: Firebase tự xoá các mảng rỗng [] khi lưu,
  // nên khi đọc lại có thể THIẾU hẳn key members/sessions/matches/players.
  // Luôn điền mảng rỗng cho key thiếu để không bao giờ bị undefined.length ở nơi khác.
  const normalizeTrash=React.useCallback(t=>{
    const cutoff=Date.now()-TRASH_RETENTION_DAYS*24*60*60*1000;
    const safeArr=v=>Array.isArray(v)?v:[];
    return {
      members:safeArr(t&&t.members).filter(x=>x&&x.deletedAt>cutoff),
      sessions:safeArr(t&&t.sessions).filter(x=>x&&x.deletedAt>cutoff),
      matches:safeArr(t&&t.matches).filter(x=>x&&x.deletedAt>cutoff),
      players:safeArr(t&&t.players).filter(x=>x&&x.deletedAt>cutoff),
    };
  },[]);

  // Load tất cả data từ Firebase khi khởi động
  // dbReady chỉ bật khi TẤT CẢ các path cốt lõi (players/matches/sessions/members)
  // đã xác nhận tải thành công — tránh trường hợp mạng lỗi lúc mở app khiến app
  // âm thầm dùng dữ liệu mặc định, rồi lỡ tay ghi đè lên dữ liệu thật trên server
  // ngay khi có thao tác đầu tiên (đây là nguyên nhân gây mất dữ liệu trước đây).
  const [loadError,setLoadError]=useState(false);
  const loadAll=React.useCallback(async()=>{
    setSyncing(true);
    setLoadError(false);
    const [p,m,s,mb,bn,tr,bi,tn]=await Promise.all([fbGet('players'),fbGet('matches'),fbGet('sessions'),fbGet('members'),fbGet('banner'),fbGet('trash'),fbGet('bankInfo'),fbGet('tournament')]);
    // Mảng rỗng thật ([]) VẪN được áp dụng miễn là fetch thành công (p.ok) —
    // chỉ khi fetch THẤT BẠI (lỗi mạng/server) mới giữ nguyên state hiện tại,
    // để không hiểu nhầm "chưa tải được" thành "dữ liệu rỗng thật".
    if(p.ok&&Array.isArray(p.data)) setPlayers(p.data);
    if(m.ok&&Array.isArray(m.data)) setMatches(m.data);
    if(s.ok&&Array.isArray(s.data)) setSessions(s.data);
    if(mb.ok&&Array.isArray(mb.data)) setMembers(mb.data);
    if(bn.ok&&bn.data&&typeof bn.data==='object'){
      if(bn.data.bannerImg!==undefined) setBannerImg(bn.data.bannerImg);
      if(bn.data.bannerTitle) setBannerTitle(bn.data.bannerTitle);
      if(bn.data.bannerSub) setBannerSub(bn.data.bannerSub);
      if(bn.data.bannerOverlay!==undefined) setBannerOverlay(bn.data.bannerOverlay);
      if(bn.data.bannerBrightness!==undefined) setBannerBrightness(bn.data.bannerBrightness);
    }
    if(tr.ok&&tr.data&&typeof tr.data==='object'){
      setTrash(normalizeTrash(tr.data));
    }
    if(bi.ok&&bi.data&&typeof bi.data==='object') setBankInfo(prev=>({...prev,...bi.data}));
    if(tn.ok) setTournament(tn.data&&typeof tn.data==='object'?tn.data:null);
    // Chỉ mở khoá ghi (dbReady) khi 4 nguồn dữ liệu cốt lõi đều tải thành công.
    const coreOk = p.ok && m.ok && s.ok && mb.ok;
    if(coreOk){ setDbReady(true); setLoadError(false); }
    else { setLoadError(true); }
    setSyncing(false);
    return coreOk;
  },[normalizeTrash]);

  useEffect(()=>{
    loadAll();
    // Poll mỗi 30s — dùng fbPoll để bỏ qua khi đang ghi (tăng lên 30s tránh ghi đè khi đang chỉnh)
    const id=setInterval(async()=>{
      const [p,m,s,mb,bn,tr,bi,tn]=await Promise.all([fbPoll('players'),fbPoll('matches'),fbPoll('sessions'),fbPoll('members'),fbPoll('banner'),fbPoll('trash'),fbPoll('bankInfo'),fbPoll('tournament')]);
      if(p.ok&&Array.isArray(p.data)) setPlayers(p.data);
      if(m.ok&&Array.isArray(m.data)) setMatches(m.data);
      if(s.ok&&Array.isArray(s.data)) setSessions(s.data);
      if(mb.ok&&Array.isArray(mb.data)) setMembers(mb.data);
      if(bn.ok&&bn.data&&typeof bn.data==='object'&&!_fbSaving['banner']){
        if(bn.data.bannerImg!==undefined) setBannerImg(bn.data.bannerImg);
        if(bn.data.bannerTitle) setBannerTitle(bn.data.bannerTitle);
        if(bn.data.bannerSub) setBannerSub(bn.data.bannerSub);
        if(bn.data.bannerOverlay!==undefined) setBannerOverlay(bn.data.bannerOverlay);
        if(bn.data.bannerBrightness!==undefined) setBannerBrightness(bn.data.bannerBrightness);
      }
      if(tr.ok&&tr.data&&typeof tr.data==='object'&&!_fbSaving['trash']) setTrash(normalizeTrash(tr.data));
      if(bi.ok&&bi.data&&typeof bi.data==='object'&&!_fbSaving['bankInfo']) setBankInfo(prev=>({...prev,...bi.data}));
      if(tn.ok&&!_fbSaving['tournament']) setTournament(tn.data&&typeof tn.data==='object'?tn.data:null);
    },30000);
    return ()=>clearInterval(id);
  },[loadAll,normalizeTrash]);

  // Sync lên Firebase khi data thay đổi
  // Dùng useRef để skip N lần render đầu (trước khi Firebase load xong)
  const _skipPlayers=React.useRef(1);
  const _skipMatches=React.useRef(1);
  const _skipSessions=React.useRef(1);
  const _skipMembers=React.useRef(1);
  const _skipBanner=React.useRef(1);
  const _skipTrash=React.useRef(1);
  const _skipBankInfo=React.useRef(1);
  const _skipTournament=React.useRef(1);
  useEffect(()=>{
    if(_skipPlayers.current>0){_skipPlayers.current--;return;}
    if(dbReady)fbSet('players',players);
  },[players]);
  useEffect(()=>{
    if(_skipMatches.current>0){_skipMatches.current--;return;}
    if(dbReady)fbSet('matches',matches);
  },[matches]);
  useEffect(()=>{
    if(_skipSessions.current>0){_skipSessions.current--;return;}
    if(dbReady)fbSet('sessions',sessions);
  },[sessions]);
  useEffect(()=>{
    if(_skipMembers.current>0){_skipMembers.current--;return;}
    if(dbReady)fbSet('members',members);
  },[members]);
  useEffect(()=>{
    if(_skipBanner.current>0){_skipBanner.current--;return;}
    if(dbReady)fbSet('banner',{bannerImg,bannerTitle,bannerSub,bannerOverlay,bannerBrightness});
  },[bannerImg,bannerTitle,bannerSub,bannerOverlay,bannerBrightness]);
  useEffect(()=>{
    if(_skipTrash.current>0){_skipTrash.current--;return;}
    if(dbReady)fbSet('trash',trash);
  },[trash]);
  useEffect(()=>{
    if(_skipBankInfo.current>0){_skipBankInfo.current--;return;}
    if(dbReady)fbSet('bankInfo',bankInfo);
  },[bankInfo]);
  useEffect(()=>{
    if(_skipTournament.current>0){_skipTournament.current--;return;}
    if(dbReady)fbSet('tournament',tournament);
  },[tournament]);
  const [showAdd,setShowAdd]=useState(false);
  const [showTrash,setShowTrash]=useState(false);
  const [showBackup,setShowBackup]=useState(false);
  const [showMerge,setShowMerge]=useState(false);
  const [confirmId,setConfirmId]=useState(null);
  const [toast,setToast]=useState(null);
  // Dùng sessionStorage (không phải localStorage) để trạng thái mở khoá admin chỉ tồn tại
  // trong phiên trình duyệt hiện tại — đóng tab/trình duyệt lại thì lần truy cập web sau
  // sẽ phải nhập mã PIN lại từ đầu, thay vì mở mãi mãi như trước.
  const [isAdmin,setIsAdmin]=useState(()=>{ try{ return sessionStorage.getItem('pcb_admin')==='1'; }catch(e){ return false; } });
  const [showPin,setShowPin]=useState(false);
  const pendingAction=React.useRef(null);

  const requireAdmin=fn=>(...args)=>{
    if(isAdmin){ fn(...args); return; }
    pendingAction.current=()=>fn(...args);
    setShowPin(true);
  };
  const handlePinConfirm=()=>{
    setIsAdmin(true);
    try{ sessionStorage.setItem('pcb_admin','1'); }catch(e){}
    setShowPin(false);
    if(pendingAction.current){ const fn=pendingAction.current; pendingAction.current=null; fn(); }
  };
  const toggleLock=()=>{
    if(isAdmin){
      setIsAdmin(false);
      try{ sessionStorage.removeItem('pcb_admin'); }catch(e){}
      showToast('Đã khoá quyền chỉnh sửa');
    } else {
      setShowPin(true);
    }
  };
  const showToast=msg=>setToast(msg);
  const openAdd=()=>setShowAdd(true);
  const openFund=()=>setTab('fund');

  // Derive "myElo" as the first player's ELO, or 1500
  const myElo=players.length?players[0].elo:1500;

  const addPlayer=(name,elo=1500)=>{
    const nm=(name||'').trim();
    if(!nm) return;
    if(isNameTaken(nm, players, members)){ showToast('⚠️ Tên này đã tồn tại trong CLB'); return; }
    const id=Date.now();
    const color=COLORS[players.length%COLORS.length];
    const eloVal=parseInt(elo)||1500;
    setPlayers(p=>[...p,{id,name:nm,elo:eloVal,wins:0,losses:0,color,avatar:null}]);
    // Đồng bộ: tự tạo thành viên quỹ tương ứng nếu chưa có
    setMembers(p=>{
      if(p.some(m=>m.name.toLowerCase()===nm.toLowerCase())) return p;
      const usedColors=p.map(m=>m.color);
      const nextColor=COLORS.find(c=>!usedColors.includes(c))||color;
      return [...p,{name:nm,paid:0,color:nextColor,deposits:[]}];
    });
    showToast(`Đã thêm ${nm} (Công Đức ${eloVal}) & tạo thành viên Hòm Công Đức tương ứng`);
  };

  const deletePlayer=(id)=>{
    const p=players.find(x=>x.id===id);
    if(p) trashAdd('players', p);
    setPlayers(p=>p.filter(x=>x.id!==id));
    showToast('Đã chuyển người chơi vào Thùng rác');
  };

  // Đổi tên đồng bộ giữa BXH (players), Quỹ (members), lịch sử buổi chơi (sessions) và lịch sử trận đấu (matches)
  // id (tùy chọn): nếu có, chỉ đổi tên đúng người chơi có id này trong danh sách players.
  // Nếu sau khi đổi vẫn còn người khác dùng tên cũ (trường hợp trùng tên), KHÔNG tự động
  // sửa lịch sử trận đấu/buổi chơi cũ (vì không thể biết trận nào là của ai) — người dùng
  // cần tự vào "Sửa trận đấu" để gán lại đúng người cho từng trận cũ.
  const renameEverywhere=(oldName,newName,id=null)=>{
    const stillDuplicate = id!=null && players.some(pl=>pl.id!==id && pl.name===oldName);
    if(id!=null){
      setPlayers(p=>p.map(pl=>pl.id===id?{...pl,name:newName}:pl));
    } else {
      setPlayers(p=>p.map(pl=>pl.name===oldName?{...pl,name:newName}:pl));
    }
    if(stillDuplicate) return;
    setMembers(p=>p.map(m=>m.name===oldName?{...m,name:newName}:m));
    setSessions(p=>p.map(s=>{
      if(!s.attendees || !(oldName in s.attendees)) return s;
      const {[oldName]:val, ...rest}=s.attendees;
      return {...s, attendees:{...rest, [newName]:val}};
    }));
    setMatches(p=>p.map(mt=>{
      const swapTeamStr=str=>!str?str:str.split(' & ').map(n=>n===oldName?newName:n).join(' & ');
      const swapArr=arr=>(arr||[]).map(n=>n===oldName?newName:n);
      const swapElo=arr=>(arr||[]).map(e=>e.name===oldName?{...e,name:newName}:e);
      const usesOldName=mt.myTeam===oldName||mt.oppTeam===oldName||
        (mt.myTeam||'').split(' & ').includes(oldName)||(mt.oppTeam||'').split(' & ').includes(oldName)||
        (mt.team1Players||[]).includes(oldName)||(mt.team2Players||[]).includes(oldName)||
        (mt.eloChanges||[]).some(e=>e.name===oldName);
      if(!usesOldName) return mt;
      return {...mt,
        myTeam:swapTeamStr(mt.myTeam),
        oppTeam:swapTeamStr(mt.oppTeam),
        team1Players:swapArr(mt.team1Players),
        team2Players:swapArr(mt.team2Players),
        eloChanges:swapElo(mt.eloChanges)
      };
    }));
  };

  const doRenameEverywhere=(oldName,newName,id=null)=>{
    const nn=(newName||'').trim();
    if(!nn||nn===oldName) return;
    if(isNameTaken(nn, players, members, oldName)){ showToast('⚠️ Tên đã tồn tại, chọn tên khác nhé'); return; }
    const stillDuplicate = id!=null && players.some(pl=>pl.id!==id && pl.name===oldName);
    renameEverywhere(oldName, nn, id);
    showToast(stillDuplicate
      ? `✅ Đã đổi tên hiển thị thành "${nn}". Vì vẫn còn người khác tên "${oldName}", lịch sử trận đấu CHƯA tự cập nhật — vào từng trận cũ (✏️ Sửa trận đấu) để gán lại đúng người nhé.`
      : `Đã đổi tên "${oldName}" → "${nn}"`);
  };

  /* ─── THÙNG RÁC: khôi phục dữ liệu khi lỡ xóa ─────────────
     Xóa sẽ không mất ngay — mục bị xóa chuyển vào Thùng rác, giữ 30 ngày, admin có thể khôi phục lại. */
  const trashAdd=(type,item)=>{
    setTrash(t=>({...t,[type]:[{...item,deletedAt:Date.now()},...(t[type]||[])]}));
  };

  const trashRestorePlayer=(idx)=>{
    const item=trash.players[idx]; if(!item) return;
    const {deletedAt,...clean}=item;
    if(isNameTaken(clean.name, players, members)){ showToast('⚠️ Không thể khôi phục — tên đã bị dùng lại'); return; }
    setPlayers(p=>[...p,clean]);
    setTrash(t=>({...t,players:t.players.filter((_,i)=>i!==idx)}));
    showToast(`Đã khôi phục người chơi "${clean.name}"`);
  };
  const trashRestoreMember=(idx)=>{
    const item=trash.members[idx]; if(!item) return;
    const {deletedAt,...clean}=item;
    if(isNameTaken(clean.name, players, members)){ showToast('⚠️ Không thể khôi phục — tên đã bị dùng lại'); return; }
    setMembers(p=>[...p,clean]);
    setTrash(t=>({...t,members:t.members.filter((_,i)=>i!==idx)}));
    showToast(`Đã khôi phục thành viên "${clean.name}"`);
  };
  const trashRestoreSession=(idx)=>{
    const item=trash.sessions[idx]; if(!item) return;
    const {deletedAt,...clean}=item;
    setSessions(p=>[...p,clean]);
    setTrash(t=>({...t,sessions:t.sessions.filter((_,i)=>i!==idx)}));
    showToast('Đã khôi phục buổi chơi');
  };
  const trashRestoreMatch=(idx)=>{
    const item=trash.matches[idx]; if(!item) return;
    const {deletedAt,...clean}=item;
    // áp lại ELO như khi ghi trận mới
    setPlayers(prev=>{
      const updated=[...prev];
      (clean.eloChanges||[]).forEach(({name,delta})=>{
        const i=updated.findIndex(p=>p.name===name);
        if(i>=0){
          const win=delta>0;
          updated[i]={...updated[i],elo:updated[i].elo+delta,wins:updated[i].wins+(win?1:0),losses:updated[i].losses+(win?0:1)};
        }
      });
      return updated;
    });
    setMatches(p=>[clean,...p]);
    setTrash(t=>({...t,matches:t.matches.filter((_,i)=>i!==idx)}));
    showToast('Đã khôi phục trận đấu & cập nhật lại Công Đức');
  };
  const trashPurgeForever=(type,idx)=>{
    setTrash(t=>({...t,[type]:t[type].filter((_,i)=>i!==idx)}));
  };
  const trashCount=(trash.members||[]).length+(trash.sessions||[]).length+(trash.matches||[]).length+(trash.players||[]).length;

  // Đặt lại Công Đức (Elo) của TẤT CẢ người chơi về mốc khởi điểm 1500,
  // đưa thắng/thua về 0, và XOÁ SẠCH lịch sử trận đấu (matches).
  // Buổi chơi (sessions) và thành viên Hòm Công Đức KHÔNG bị ảnh hưởng.
  const resetAllElo=()=>{
    if(!players.length){ showToast('Chưa có người chơi nào'); return; }
    const ok=window.confirm(`⚠️ RESET TOÀN BỘ MÙA GIẢI\n\n- Công Đức của TẤT CẢ ${players.length} người chơi → về 1500\n- Thắng/thua → về 0\n- XOÁ SẠCH toàn bộ ${matches.length} trận đấu trong lịch sử\n\nHành động này KHÔNG THỂ HOÀN TÁC (trừ khi bạn khôi phục từ file sao lưu). Tiếp tục?`);
    if(!ok) return;
    const ok2=window.confirm('Xác nhận lần cuối: xoá vĩnh viễn toàn bộ lịch sử trận đấu và đặt lại Công Đức?');
    if(!ok2) return;
    setPlayers(p=>p.map(x=>({...x, elo:1500, wins:0, losses:0})));
    setMatches([]);
    showToast('🔄 Đã reset Công Đức về 1500 & xoá sạch lịch sử trận đấu');
  };

  // Ghép 2 bản ghi (1 ở BXH, 1 ở Quỹ) vốn là CÙNG MỘT NGƯỜI nhưng lỡ mang 2 tên khác nhau.
  // Khác với đổi tên thường (bị chặn nếu tên đã tồn tại), hàm này CHỦ ĐỘNG cho phép
  // trùng tên vì đó chính là mục đích — gộp về chung 1 tên để Elo/quỹ liên kết lại với nhau.
  const mergeDuplicatePerson=(playerName, memberName, keepName)=>{
    if(!playerName||!memberName||playerName===memberName) return;
    const dropName = keepName===playerName ? memberName : playerName;
    renameEverywhere(dropName, keepName);
    showToast(`🔗 Đã ghép "${dropName}" vào "${keepName}" — Công Đức, thắng/thua & lịch sử trận đấu được giữ nguyên`);
  };

  const updatePlayerAvatar=(id, dataUrl)=>{
    setPlayers(p=>p.map(x=>x.id===id?{...x, avatar:dataUrl}:x));
    showToast('Đã cập nhật ảnh đại diện');
  };

  // Sửa lỗi lệch số liệu thắng/thua: ghi đè bộ đếm player.wins/losses bằng
  // đúng số đếm được từ danh sách trận đấu thật (nguồn dữ liệu gốc, luôn đáng tin).
  const resyncPlayerStats=(id, wins, losses)=>{
    setPlayers(p=>p.map(x=>x.id===id?{...x, wins, losses}:x));
    showToast('✅ Đã đồng bộ lại số liệu thắng/thua');
  };

  const addMatch=m=>{
    // Apply ELO changes to all involved players
    setPlayers(prev=>{
      const updated=[...prev];
      (m.eloChanges||[]).forEach(({name,delta})=>{
        const idx=updated.findIndex(p=>p.name===name);
        if(idx>=0){
          const win=delta>0;
          updated[idx]={...updated[idx],
            elo:updated[idx].elo+delta,
            wins:updated[idx].wins+(win?1:0),
            losses:updated[idx].losses+(win?0:1)
          };
        }
      });
      return updated;
    });
    setMatches(p=>[m,...p]);
    showToast('Đã lưu trận & cập nhật Công Đức!');
  };

  const editMatch=m=>{
    // Reverse old ELO, apply new ELO
    const old=matches.find(x=>x.id===m.id);
    setPlayers(prev=>{
      let updated=[...prev];
      // hoàn ELO cũ
      (old?.eloChanges||[]).forEach(({name,delta})=>{
        const idx=updated.findIndex(p=>p.name===name);
        if(idx>=0){const wasWin=delta>0;updated[idx]={...updated[idx],elo:updated[idx].elo-delta,wins:updated[idx].wins-(wasWin?1:0),losses:updated[idx].losses-(wasWin?0:1)};}
      });
      // áp ELO mới
      (m.eloChanges||[]).forEach(({name,delta})=>{
        const idx=updated.findIndex(p=>p.name===name);
        if(idx>=0){const win=delta>0;updated[idx]={...updated[idx],elo:updated[idx].elo+delta,wins:updated[idx].wins+(win?1:0),losses:updated[idx].losses+(win?0:1)};}
      });
      return updated;
    });
    setMatches(p=>p.map(x=>x.id===m.id?m:x));
    showToast('Đã cập nhật trận & Công Đức!');
  };

  const deleteMatch=id=>{
    const m=matches.find(x=>x.id===id);
    if(!m) return;
    trashAdd('matches', m);
    // Reverse ELO changes
    setPlayers(prev=>{
      const updated=[...prev];
      (m.eloChanges||[]).forEach(({name,delta})=>{
        const idx=updated.findIndex(p=>p.name===name);
        if(idx>=0){
          const wasWin=delta>0;
          updated[idx]={...updated[idx],
            elo:updated[idx].elo-delta,
            wins:updated[idx].wins-(wasWin?1:0),
            losses:updated[idx].losses-(wasWin?0:1)
          };
        }
      });
      return updated;
    });
    setMatches(p=>p.filter(x=>x.id!==id));
    setConfirmId(null);
    showToast('Đã chuyển trận vào Thùng rác & hoàn Công Đức!');
  };

  const guardedDeleteMatch=requireAdmin(id=>setConfirmId(id));
  const guardedEditMatch=requireAdmin(editMatch);
  const guardedAddPlayer=requireAdmin(addPlayer);
  const guardedDeletePlayer=requireAdmin(deletePlayer);
  const guardedUpdateAvatar=requireAdmin(updatePlayerAvatar);
  const guardedResyncStats=requireAdmin(resyncPlayerStats);
  const guardedRenameEverywhere=requireAdmin(doRenameEverywhere);
  const updatePlayerElo=(id,newElo)=>{
    const val=parseInt(newElo);
    if(isNaN(val)||val<0||val>9999) return;
    setPlayers(p=>p.map(x=>x.id===id?{...x,elo:val}:x));
    showToast('✅ Đã cập nhật Công Đức');
  };
  const guardedUpdateElo=requireAdmin(updatePlayerElo);
  const guardedMergeDuplicatePerson=requireAdmin(mergeDuplicatePerson);
  const guardedBannerUpdate=requireAdmin(({bannerImg:img, bannerTitle:t, bannerSub:s, bannerOverlay:ov, bannerBrightness:br})=>{
    setBannerImg(img);
    setBannerTitle(t);
    setBannerSub(s);
    if(ov!==undefined) setBannerOverlay(ov);
    if(br!==undefined) setBannerBrightness(br);
  });
  const guardedTrashRestorePlayer=requireAdmin(trashRestorePlayer);
  const guardedTrashRestoreMember=requireAdmin(trashRestoreMember);
  const guardedTrashRestoreSession=requireAdmin(trashRestoreSession);
  const guardedTrashRestoreMatch=requireAdmin(trashRestoreMatch);
  const guardedTrashPurgeForever=requireAdmin(trashPurgeForever);

  // Thông báo real-time khi có huy hiệu đổi chủ (VD: vừa cướp ngôi Vua ELO sau khi ghi trận)
  const prevBadgeHolders=React.useRef(null);
  useEffect(()=>{
    if(!dbReady) return;
    const badges=computeBadges(players, matches);
    const current={};
    badges.forEach(b=>{ current[b.id]=b.holder?b.holder.id:null; });
    if(prevBadgeHolders.current){
      const changed=badges.find(b=>{
        const newHolder=current[b.id], prevHolder=prevBadgeHolders.current[b.id];
        return newHolder && newHolder!==prevHolder;
      });
      if(changed){
        const p=players.find(x=>x.id===current[changed.id]);
        if(p) showToast(`🎉 ${p.name} vừa đoạt huy hiệu ${changed.emoji} ${changed.title}!`);
      }
    }
    prevBadgeHolders.current=current;
  },[players,matches,dbReady]);

  const TABS=[
    {id:'dashboard',label:'Tổng Quan',icon:'📊'},
    {id:'bxh',      label:'BXH',icon:'🏆'},
    {id:'sokeo',    label:'Công Cụ',icon:'🎮'},
    {id:'fund',     label:'Hòm Công Đức',icon:'🙏'},
  ];

  return <>
    {loadError && (
      <div style={{position:'fixed',top:0,left:0,right:0,zIndex:500,background:'var(--red)',color:'#fff',padding:'10px 16px',fontSize:'13px',fontWeight:600,display:'flex',alignItems:'center',justifyContent:'center',gap:'12px',flexWrap:'wrap',textAlign:'center'}}>
        <span>⚠️ Không tải được dữ liệu từ máy chủ. Để tránh mất dữ liệu, mọi thao tác thêm/sửa/xóa đang bị tạm khoá cho đến khi tải lại thành công.</span>
        <button onClick={loadAll} style={{background:'#fff',color:'var(--red)',border:'none',borderRadius:'8px',padding:'5px 12px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>🔄 Thử tải lại</button>
      </div>
    )}
    <div className="topbar">
      <div className="logo">
        <div className="logo-icon" style={{padding:0,overflow:'hidden'}}><img src={LOGO_ICON_SRC} alt="logo" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'6px'}}/></div>
        <div>
          <div className="logo-text">PÍCH CỜ BÔN</div>
          <span className="logo-sub">Phông Bạt</span>
        </div>
      </div>
      <div className="nav-tabs">
        {TABS.map(t=>(
          <button key={t.id} className={`nav-tab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </div>
      <div className="nav-right" style={{display:'flex',alignItems:'center',gap:'8px'}}>
        {syncing&&<span title="Đang đồng bộ..." style={{fontSize:'11px',color:'var(--muted)',background:'var(--surface)',borderRadius:'20px',padding:'3px 8px',border:'1px solid var(--border)'}}>⏳</span>}
        {FB_URL.includes('YOUR_PROJECT')&&<span style={{fontSize:'10px',color:'var(--orange)',background:'var(--orange-bg)',borderRadius:'20px',padding:'3px 8px',cursor:'pointer'}} title="Chưa cấu hình Firebase">⚠️</span>}
        <AdminMenu isAdmin={isAdmin} trashCount={trashCount} onOpenTrash={()=>setShowTrash(true)} onToggleLock={toggleLock} dark onBackup={()=>setShowBackup(true)} onResetElo={resetAllElo} onMergePerson={()=>setShowMerge(true)}/>
        <button className="btn-ghi" onClick={openAdd} disabled={!dbReady} style={!dbReady?{opacity:.5,cursor:'not-allowed'}:undefined}>+ Ghi Trận</button>
      </div>
    </div>

    {/* Mobile header */}
    <div className="mobile-header">
      <div className="logo">
        <div className="logo-icon" style={{padding:0,overflow:'hidden'}}><img src={LOGO_ICON_SRC} alt="logo" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'6px'}}/></div>
        <div>
          <div className="logo-text">PÍCH CỜ BÔN</div>
          <span className="logo-sub">Phông Bạt</span>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
        <AdminMenu isAdmin={isAdmin} trashCount={trashCount} onOpenTrash={()=>setShowTrash(true)} onToggleLock={toggleLock} onBackup={()=>setShowBackup(true)} onResetElo={resetAllElo} onMergePerson={()=>setShowMerge(true)}/>
        <button className="btn-ghi" onClick={openAdd} disabled={!dbReady} style={!dbReady?{opacity:.5,cursor:'not-allowed'}:undefined}>+ Ghi Trận</button>
      </div>
    </div>

    <Banner
      bannerImg={bannerImg}
      bannerTitle={bannerTitle}
      bannerSub={bannerSub}
      bannerOverlay={bannerOverlay}
      bannerBrightness={bannerBrightness}
      editable={isAdmin}
      onUpdate={guardedBannerUpdate}
    />

    <div className="main">
      {tab==='dashboard' && <Dashboard matches={matches} myElo={myElo} onAdd={openAdd} sessions={sessions} members={members} players={players} onGoBadges={()=>setTab('bxh')} tournament={tournament} onGoTournament={()=>setTab('sokeo')} onDelete={guardedDeleteMatch} onEditMatch={guardedEditMatch}/>}
      {tab==='bxh'       && <LeaderboardTab players={players} matches={matches} members={members} sessions={sessions} onAddPlayer={guardedAddPlayer} onDeletePlayer={guardedDeletePlayer} onRenamePlayer={guardedRenameEverywhere} onViewHistory={goToPlayerHistory} isAdmin={isAdmin} onUpdateElo={guardedUpdateElo} showToast={showToast}/>}
      {tab==='playerHistory' && (
        players.find(p=>p.id===historyPlayerId)
          ? <PlayerHistoryPage player={players.find(p=>p.id===historyPlayerId)} players={players} matches={matches} sessions={sessions} onBack={()=>setTab(prevTab||'bxh')} onEditMatch={guardedEditMatch} onDeleteMatch={guardedDeleteMatch} onUpdateAvatar={guardedUpdateAvatar} onResyncStats={guardedResyncStats} onViewHistory={goToPlayerHistory}/>
          : <div style={{textAlign:'center',padding:'40px',color:'var(--muted)'}}>Không tìm thấy người chơi. <button onClick={()=>setTab('bxh')} style={{marginLeft:'8px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--text)',padding:'6px 12px',fontSize:'12px',cursor:'pointer'}}>Về BXH</button></div>
      )}
      {tab==='sokeo'     && <SoKeoTab players={players} matches={matches} sessions={sessions} tournament={tournament} setTournament={setTournament} isAdmin={isAdmin} showToast={showToast} addMatch={addMatch}/>}
      {tab==='fund'      && <FundTab players={players} setPlayers={setPlayers} sessions={sessions} setSessions={setSessions} members={members} setMembers={setMembers} matches={matches} setMatches={setMatches} onRenameMember={guardedRenameEverywhere} showToast={showToast} onTrashAdd={trashAdd} isAdmin={isAdmin} bankInfo={bankInfo} setBankInfo={setBankInfo} clubName={bannerTitle}/>}
    </div>

    {showAdd && <AddMatchModal players={players} sessions={sessions} onClose={()=>setShowAdd(false)} onSave={addMatch}/>}
    {confirmId && <ConfirmModal
      msg="Bạn có chắc muốn xóa trận này không? Công Đức sẽ được hoàn lại."
      onConfirm={()=>deleteMatch(confirmId)}
      onClose={()=>setConfirmId(null)}
    />}
    {toast && <Toast msg={toast} onClose={()=>setToast(null)}/>}
    {showPin && <PinModal onConfirm={handlePinConfirm} onClose={()=>{setShowPin(false); pendingAction.current=null;}}/>}
    {showTrash && <TrashModal
      trash={trash}
      onClose={()=>setShowTrash(false)}
      onRestorePlayer={guardedTrashRestorePlayer}
      onRestoreMember={guardedTrashRestoreMember}
      onRestoreSession={guardedTrashRestoreSession}
      onRestoreMatch={guardedTrashRestoreMatch}
      onPurge={guardedTrashPurgeForever}
    />}
    {showMerge && <MergePersonModal
      players={players}
      members={members}
      onClose={()=>setShowMerge(false)}
      onMerge={guardedMergeDuplicatePerson}
    />}
    {showBackup && <BackupModal
      data={{players,matches,sessions,members,trash,bankInfo,tournament,banner:{bannerImg,bannerTitle,bannerSub,bannerOverlay,bannerBrightness}}}
      onClose={()=>setShowBackup(false)}
      onRestore={(d)=>{
        // Khôi phục từ file là thao tác admin chủ động xác nhận rõ ràng —
        // nên ghi thẳng lên Firebase ngay cả khi dbReady đang false (vd. do lỗi tải trước đó),
        // đồng thời mở lại dbReady vì giờ đã có dữ liệu đáng tin cậy trong tay.
        const nextPlayers=Array.isArray(d.players)?d.players:players;
        const nextMatches=Array.isArray(d.matches)?d.matches:matches;
        const nextSessions=Array.isArray(d.sessions)?d.sessions:sessions;
        const nextMembers=Array.isArray(d.members)?d.members:members;
        const nextTrash=(d.trash&&typeof d.trash==='object')?normalizeTrash(d.trash):trash;
        const nextBankInfo=(d.bankInfo&&typeof d.bankInfo==='object')?{...bankInfo,...d.bankInfo}:bankInfo;
        const nextTournament=('tournament' in d)?(d.tournament&&typeof d.tournament==='object'?d.tournament:null):tournament;
        const nextBanner=(d.banner&&typeof d.banner==='object')?d.banner:{bannerImg,bannerTitle,bannerSub,bannerOverlay,bannerBrightness};

        setPlayers(nextPlayers);
        setMatches(nextMatches);
        setSessions(nextSessions);
        setMembers(nextMembers);
        setTrash(nextTrash);
        setBankInfo(nextBankInfo);
        setTournament(nextTournament);
        if(nextBanner.bannerImg!==undefined) setBannerImg(nextBanner.bannerImg);
        if(nextBanner.bannerTitle) setBannerTitle(nextBanner.bannerTitle);
        if(nextBanner.bannerSub) setBannerSub(nextBanner.bannerSub);
        if(nextBanner.bannerOverlay!==undefined) setBannerOverlay(nextBanner.bannerOverlay);
        if(nextBanner.bannerBrightness!==undefined) setBannerBrightness(nextBanner.bannerBrightness);

        fbSet('players',nextPlayers);
        fbSet('matches',nextMatches);
        fbSet('sessions',nextSessions);
        fbSet('members',nextMembers);
        fbSet('trash',nextTrash);
        fbSet('bankInfo',nextBankInfo);
        fbSet('tournament',nextTournament);
        fbSet('banner',nextBanner);

        setDbReady(true);
        setLoadError(false);
        showToast('Đã khôi phục dữ liệu từ file sao lưu và đồng bộ lên máy chủ');
      }}
    />}

    {/* Mobile bottom nav — 2 tabs · FAB · 2 tabs (chỉ 4 tab thường dùng nhất) */}
    {(()=>{
      const MOBILE_TABS=[
        {id:'dashboard',label:'Tổng Quan',icon:'📊'},
        {id:'bxh',      label:'BXH',icon:'🏆'},
        {id:'sokeo',    label:'Công Cụ',icon:'🎮'},
        {id:'fund',     label:'Hòm Công Đức',icon:'🙏'},
      ];
      return (
        <nav className="mobile-nav">
          {MOBILE_TABS.slice(0,2).map(t=>(
            <button key={t.id} className={`mobile-nav-tab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>
              <span className="mni">{t.icon}</span>
              <span>{t.label}</span>
            </button>
          ))}
          <button className="mobile-nav-fab" onClick={openAdd} title="Ghi trận đấu" disabled={!dbReady} style={!dbReady?{opacity:.5}:undefined}>
            <span>+</span>
          </button>
          {MOBILE_TABS.slice(2).map(t=>(
            <button key={t.id} className={`mobile-nav-tab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>
              <span className="mni">{t.icon}</span>
              <span>{t.label}</span>
            </button>
          ))}
        </nav>
      );
    })()}
  </>;
}

class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false,msg:''};}
  static getDerivedStateFromError(err){return {hasError:true,msg:(err&&err.message)||'Đã có lỗi xảy ra.'};}
  componentDidCatch(err,info){ try{console.error('App crash:',err,info);}catch(e){} }
  render(){
    if(this.state.hasError){
      return (
        <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'12px',padding:'24px',textAlign:'center',fontFamily:'Nunito,sans-serif',background:'#f4f5f7'}}>
          <div style={{fontSize:'40px'}}>⚠️</div>
          <div style={{fontSize:'16px',fontWeight:700,color:'#1a1d24'}}>Ứng dụng gặp lỗi khi hiển thị</div>
          <div style={{fontSize:'13px',color:'#8a909c',maxWidth:'420px'}}>{this.state.msg}</div>
          <button onClick={()=>window.location.reload()} style={{marginTop:'8px',background:'#22c55e',color:'#fff',border:'none',borderRadius:'8px',padding:'10px 20px',fontSize:'14px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>Tải lại trang</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.render(<ErrorBoundary><App/></ErrorBoundary>, document.getElementById('root'));
</script>

<script>
// Đăng ký Service Worker để app chạy như PWA (cài lên màn hình chính, mở nhanh, đỡ trắng màn hình khi mạng chập chờn)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
