function FundTab({players,setPlayers,sessions,setSessions,members,setMembers,matches,setMatches,onRenameMember,showToast,onTrashAdd,isAdmin,bankInfo,setBankInfo,clubName}){
  const memberNames = FUND_MEMBERS.map(m=>m.name);
  // Data được load/save bởi App cha — FundTab chỉ dùng trực tiếp
  const [showAdd,setShowAdd]=useState(false);
  const [showAddMember,setShowAddMember]=useState(false);
  const [newMember,setNewMember]=useState({name:'',paid:''});
  const [addMemberError,setAddMemberError]=useState('');
  const [expandedSession,setExpandedSession]=useState(null);
  const [depositTarget,setDepositTarget]=useState(null); // {name, idx}
  const [depositAmt,setDepositAmt]=useState('');
  const [depositDate,setDepositDate]=useState('');
  const [f,setF]=useState({date:'',total:'',attendees:{},note:''});
  const sf=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const [renamingMember,setRenamingMember]=useState(null); // idx
  const [renameVal,setRenameVal]=useState('');
  const [renameError,setRenameError]=useState('');
  const [confirmDeleteSession,setConfirmDeleteSession]=useState(null);
  const [confirmDeleteMember,setConfirmDeleteMember]=useState(null);
  const [editingSession,setEditingSession]=useState(null);
  const [expandedMember,setExpandedMember]=useState(null); // idx đang mở chi tiết
  const [memberSearch,setMemberSearch]=useState('');
  const [onlyDebt,setOnlyDebt]=useState(false);
  const [showAllMembers,setShowAllMembers]=useState(false);
  const [showAllSessions,setShowAllSessions]=useState(false);
  // Chọn nhiều người để tạo mã QR nhắc nợ, xuất ảnh gửi từng người
  const [selectMode,setSelectMode]=useState(false);
  const [selectedMembers,setSelectedMembers]=useState([]); // mảng tên
  const [showQRModal,setShowQRModal]=useState(false);
  const [showBankConfig,setShowBankConfig]=useState(false);
  const [bankDraft,setBankDraft]=useState(bankInfo||{bankCode:'',accountNo:'',accountName:''});
  useEffect(()=>{ setBankDraft(bankInfo||{bankCode:'',accountNo:'',accountName:''}); },[bankInfo]);
  const toggleSelectMember=(name)=>{
    setSelectedMembers(p=>p.includes(name)?p.filter(n=>n!==name):[...p,name]);
  };
  const saveBankConfig=()=>{
    setBankInfo(bankDraft);
    setShowBankConfig(false);
    if(showToast) showToast('Đã lưu cấu hình ngân hàng');
  };
  const MEMBER_PAGE_SIZE=8;
  const SESSION_PAGE_SIZE=10;

  // computed per member: how much they owe from sessions
  const memberSpent = useMemo(()=>{
    const spent = {};
    members.forEach(m=>{ spent[m.name]=0; });
    sessions.forEach(s=>{
      if(s.attendees && Object.keys(s.attendees).length>0){
        const attending = Object.entries(s.attendees).filter(([,v])=>v).map(([k])=>k);
        const share = shareAmount(s);
        attending.forEach(name=>{
          if(spent[name]===undefined) return;
          if(name==='Xé Vé'){
            const cnt=Math.max(1, parseInt(s.xeVeCount)||1);
            spent[name]+=share*cnt;
          } else {
            spent[name]+=share;
          }
        });
      } else {
        // legacy: split equally
        const share = s.players>0 ? Math.round(s.total/s.players) : 0;
        members.forEach(m=>{ spent[m.name]+=share; });
      }
    });
    return spent;
  },[sessions,members]);

  const totalFund=members.reduce((a,m)=>a+m.paid,0);
  const totalSpent=sessions.reduce((a,s)=>a+s.total,0);
  const remaining=totalFund-totalSpent;
  const totalDebt=members.reduce((a,m)=>{
    const rem=m.paid-(memberSpent[m.name]||0);
    return rem<0 ? a+Math.abs(rem) : a;
  },0);
  const debtorsCount=members.filter(m=>(m.paid-(memberSpent[m.name]||0))<0).length;

  const toggleAttendee=(name)=>{
    setF(p=>({...p,attendees:{...p.attendees,[name]:!p.attendees[name]}}));
  };

  const addSession=()=>{
    if(!f.date||!f.total) return;
    const att = f.attendees;
    const attending = Object.entries(att).filter(([,v])=>v).map(([k])=>k);
    setSessions(p=>[...p,{id:Date.now(),date:f.date,players:attending.length,total:parseInt(f.total),attendees:{...att},xeVeCount:att['Xé Vé']?(parseInt(f.xeVeCount)||1):0,note:f.note||''}]);
    setF({date:'',total:'',attendees:{},note:''});
    setShowAdd(false);
  };

  const deleteSession=(id)=>{
    const s=sessions.find(x=>x.id===id);
    if(s && onTrashAdd) onTrashAdd('sessions', s);
    setSessions(p=>p.filter(s=>s.id!==id));
    setConfirmDeleteSession(null);
    if(showToast) showToast('Đã chuyển buổi chơi vào Thùng rác');
  };

  const addMember=()=>{
    const nm=(newMember.name||'').trim();
    if(!nm||!newMember.paid) return;
    if(isNameTaken(nm, players, members)){ setAddMemberError('Tên này đã tồn tại trong CLB, hãy chọn tên khác'); return; }
    setMembers(p=>{
      const usedColors=p.map(m=>m.color);
      const nextColor=COLORS.find(c=>!usedColors.includes(c))||COLORS[p.length%COLORS.length];
      return [...p,{name:nm,paid:parseInt(newMember.paid),color:nextColor,deposits:[{date:'Ban đầu',amount:parseInt(newMember.paid)}]}];
    });
    setNewMember({name:'',paid:''});
    setShowAddMember(false);
    setAddMemberError('');
  };

  const deleteMember=(idx)=>{
    const m=members[idx];
    if(m && onTrashAdd) onTrashAdd('members', m);
    setMembers(p=>p.filter((_,i)=>i!==idx));
    setConfirmDeleteMember(null);
    if(showToast) showToast('Đã chuyển thành viên vào Thùng rác');
  };

  // Đổi tên thành viên — dùng chung hàm đồng bộ tên với BXH (renameEverywhere ở App), có kiểm tra trùng tên
  const renameMember=(idx,newName)=>{
    const oldName=members[idx].name;
    const nn=(newName||'').trim();
    if(!nn){ setRenameError('Vui lòng nhập tên'); return; }
    if(nn===oldName){ setRenamingMember(null);setRenameVal('');setRenameError(''); return; }
    if(isNameTaken(nn, players, members, oldName)){ setRenameError('Tên này đã tồn tại, hãy chọn tên khác'); return; }
    onRenameMember(oldName, nn);
    setRenamingMember(null);setRenameVal('');setRenameError('');
  };

  const addDeposit=()=>{
    if(!depositTarget||!depositAmt) return;
    const amt=parseInt(depositAmt);
    setMembers(p=>p.map((m,i)=>i===depositTarget.idx?{...m,paid:m.paid+amt,deposits:[...(m.deposits||[]),{date:depositDate||'—',amount:amt}]}:m));
    setDepositTarget(null);setDepositAmt('');setDepositDate('');
  };

  // Month filter
  const [monthFund,setMonthFund]=useState('Tất cả');
  const fundMonths=useMemo(()=>{
    const s=new Set();
    sessions.forEach(s2=>{const p=s2.date.split(/[\/\-]/);if(p.length>=2)s.add(p[1]);});
    return ['Tất cả',...[...s].sort((a,b)=>parseInt(a)-parseInt(b)).map(m=>`Tháng ${m}`)];
  },[sessions]);

  const filteredSessions=useMemo(()=>{
    if(monthFund==='Tất cả') return sessions;
    const mon=monthFund.replace('Tháng ','');
    return sessions.filter(s2=>{const p=s2.date.split(/[\/\-]/);return p.length>=2&&p[1]===mon;});
  },[sessions,monthFund]);

  const monthTotal=filteredSessions.reduce((a,s2)=>a+s2.total,0);

  // Export fund CSV
  const exportFundCSV=()=>{
    const rows=[['Ngày','Số người','Tổng','Mỗi người','Người tham dự']];
    [...sessions].reverse().forEach(s2=>{
      const att=s2.attendees?Object.entries(s2.attendees).filter(([,v])=>v).map(([k])=>k):[];
      const per=att.length>0?shareAmount(s2):(s2.players>0?Math.round(s2.total/s2.players):0);
      rows.push([s2.date,s2.players,s2.total,per,att.join(' | ')]);
    });
    const mRows=[['Tên','Đã đóng','Đã chi','Còn lại']];
    members.forEach(m2=>{
      const sp=memberSpent[m2.name]||0;
      mRows.push([m2.name,m2.paid,sp,m2.paid-sp]);
    });
    const toCSV=rs=>rs.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
    const csv='=== LỊCH SỬ BUỔI CHƠI ===\n'+toCSV(rows)+'\n\n=== TÌNH TRẠNG THÀNH VIÊN ===\n'+toCSV(mRows);
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='picklepro_quy.csv';a.click();
    URL.revokeObjectURL(url);
  };

  // âm quỹ members
  const amQuy=members.filter(m2=>(m2.paid-(memberSpent[m2.name]||0))<0);

  // Người chơi ở BXH nhưng chưa có trong Quỹ (VD: được thêm từ trước khi có tính năng tự đồng bộ)
  const missingPlayers = players.filter(p=>!members.some(m=>m.name.toLowerCase()===p.name.toLowerCase()));
  const syncMissingMembers = ()=>{
    if(missingPlayers.length===0) return;
    setMembers(p=>{
      let updated=[...p];
      missingPlayers.forEach(pl=>{
        if(updated.some(m=>m.name.toLowerCase()===pl.name.toLowerCase())) return;
        const usedColors=updated.map(m=>m.color);
        const nextColor=COLORS.find(c=>!usedColors.includes(c))||pl.color;
        updated=[...updated,{name:pl.name,paid:0,color:nextColor,deposits:[]}];
      });
      return updated;
    });
    showToast(`Đã thêm ${missingPlayers.length} người vào Hòm Công Đức`);
  };

  const renderMemberRow=({m,i})=>{
    const spent = memberSpent[m.name]||0;
    const rem = m.paid-spent;
    const isDepTarget=depositTarget?.idx===i;
    const isRenaming=renamingMember===i;
    const isExpanded=expandedMember===i;
    const matchedPlayer=(players||[]).find(p=>p.name===m.name);
    const isSelected=selectedMembers.includes(m.name);
    return (
      <div key={i} style={{background:'var(--surface)',border:'1px solid var(--border)',borderLeft:`3px solid ${isSelected?'var(--yellow)':m.color}`,borderRadius:'10px',overflow:'hidden'}}>
        {/* Dòng gọn — bấm để mở/thu chi tiết (hoặc chọn nếu đang ở chế độ chọn nhiều) */}
        <div onClick={()=>selectMode?toggleSelectMember(m.name):setExpandedMember(isExpanded?null:i)} style={{display:'flex',alignItems:'center',gap:'9px',padding:'10px 12px',cursor:'pointer'}}>
          {selectMode && (
            <div onClick={e=>{e.stopPropagation();toggleSelectMember(m.name);}} style={{
              width:'18px',height:'18px',borderRadius:'5px',flexShrink:0,border:`2px solid ${isSelected?'var(--yellow)':'var(--border2)'}`,
              background:isSelected?'var(--yellow)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',color:'#000',fontWeight:900
            }}>{isSelected?'✓':''}</div>
          )}
          <div style={{width:'28px',height:'28px',borderRadius:'50%',overflow:'hidden',flexShrink:0,background:matchedPlayer?.avatar?'transparent':m.color+'22',color:m.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'10px',fontWeight:700}}>
            {matchedPlayer?.avatar?<img src={matchedPlayer.avatar} alt={m.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:initials(m.name)}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:700,fontSize:'13px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:'4px'}}>
              {m.name}{rem<0&&<span style={{fontSize:'9px'}}>🔴</span>}
            </div>
            <div style={{fontSize:'10.5px',color:'var(--muted)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>Đóng {fmt(m.paid)} · Chi {fmt(spent)}</div>
          </div>
          <div style={{textAlign:'right',flexShrink:0}}>
            <div className={rem>=0?'pos':'neg'} style={{fontWeight:800,fontSize:'13.5px'}}>{rem<0?'-':''}{fmt(Math.abs(rem))}</div>
          </div>
          <div style={{color:'var(--muted2)',fontSize:'10px',flexShrink:0,transform:isExpanded?'rotate(180deg)':'none',transition:'transform .15s'}}>▾</div>
        </div>

        {isExpanded && (
          <div style={{padding:'0 12px 12px'}}>
            {isRenaming?(
              <div style={{marginBottom:'10px'}}>
                <input className="fi" style={{padding:'7px 10px',fontSize:'13px',width:'100%',marginBottom:'8px'}} value={renameVal} onChange={e=>{setRenameVal(e.target.value);setRenameError('');}} onKeyDown={e=>{if(e.key==='Enter'&&renameVal.trim())renameMember(i,renameVal.trim());if(e.key==='Escape'){setRenamingMember(null);setRenameVal('');setRenameError('');}}} autoFocus/>
                {renameError && <div style={{fontSize:'11px',color:'var(--red)',marginBottom:'8px'}}>⚠️ {renameError}</div>}
                <div style={{display:'flex',gap:'6px'}}>
                  <button onClick={()=>{if(renameVal.trim())renameMember(i,renameVal.trim());}} style={{flex:1,background:m.color,border:'none',borderRadius:'7px',color:'#fff',padding:'7px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✓ Lưu</button>
                  <button onClick={()=>{setRenamingMember(null);setRenameVal('');setRenameError('');}} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'7px',color:'var(--muted)',padding:'7px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✕ Hủy</button>
                </div>
              </div>
            ):(
              <div style={{display:'flex',gap:'6px',marginBottom:'10px',paddingTop:'10px',borderTop:'1px solid var(--border)'}}>
                {isAdmin && <button onClick={()=>setDepositTarget(isDepTarget?null:{name:m.name,idx:i})} style={{
                  background:isDepTarget?m.color+'22':'var(--bg3)',border:`1px solid ${isDepTarget?m.color:'var(--border)'}`,
                  borderRadius:'6px',color:isDepTarget?m.color:'var(--muted)',padding:'5px 10px',fontSize:'11px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif',whiteSpace:'nowrap'
                }}>+ Nạp tiền</button>}
                {isAdmin && <button onClick={()=>{setRenamingMember(i);setRenameVal(m.name);}} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'6px',color:'var(--muted)',padding:'5px 10px',fontSize:'11px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✏️ Sửa tên</button>}
                {isAdmin && <button onClick={()=>setConfirmDeleteMember(i)} title="Xóa thành viên" style={{background:'var(--red-bg)',border:'1px solid var(--red)',borderRadius:'6px',color:'var(--red)',padding:'5px 8px',fontSize:'11px',cursor:'pointer',fontFamily:'Nunito,sans-serif',opacity:.85}}>🗑</button>}
              </div>
            )}

            {isDepTarget&&(
              <div style={{background:'var(--bg3)',borderRadius:'9px',padding:'10px',marginBottom:'10px',border:`1px solid ${m.color}44`}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px',marginBottom:'8px'}}>
                  <div className="fg"><label className="fl">📅 Ngày</label><DateInput value={depositDate} onChange={setDepositDate} style={{padding:'6px 8px',fontSize:'12px'}}/></div>
                  <div className="fg"><label className="fl">Số tiền (đ)</label><MoneyInput style={{padding:'6px 8px',fontSize:'12px'}} value={depositAmt} onChange={setDepositAmt} placeholder="500,000"/></div>
                </div>
                <div style={{display:'flex',gap:'6px'}}>
                  <button onClick={addDeposit} style={{flex:1,background:m.color,border:'none',borderRadius:'7px',color:'#fff',padding:'7px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>Xác nhận nạp</button>
                  <button onClick={()=>{setDepositTarget(null);setDepositAmt('');}} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'7px',color:'var(--muted)',padding:'7px 10px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>Hủy</button>
                </div>
              </div>
            )}

            <div className="fm-row"><span className="fm-lbl">Tổng đã đóng</span><span className="fm-val" style={{color:m.color}}>{fmt(m.paid)}</span></div>
            <div className="fm-row"><span className="fm-lbl">Đã chi (tính buổi)</span><span className="fm-val">{fmt(spent)}</span></div>

            {(m.deposits||[]).length>1&&(
              <div style={{marginTop:'8px',paddingTop:'8px',borderTop:'1px solid var(--border)'}}>
                <div style={{fontSize:'10px',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'4px'}}>Lịch sử nạp</div>
                {(m.deposits||[]).map((d,di)=>(
                  <div key={di} style={{display:'flex',justifyContent:'space-between',fontSize:'11px',padding:'2px 0',color:'var(--muted)'}}>
                    <span>{d.date}</span>
                    <span style={{color:m.color,fontWeight:600}}>+{fmt(d.amount)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    );
  };

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'10px',marginBottom:'14px',flexWrap:'wrap',gap:'8px'}}>
      <div className="section-title">🙏 Hòm Công Đức</div>
      <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
        {isAdmin && <button onClick={()=>setShowBankConfig(true)} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--muted)',padding:'6px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',display:'flex',alignItems:'center',gap:'5px'}}>🏦 Cấu hình ngân hàng</button>}
        <button onClick={exportFundCSV} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--muted)',padding:'6px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',display:'flex',alignItems:'center',gap:'5px'}}>📥 Xuất Excel</button>
      </div>
    </div>

    {showBankConfig && (
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'14px',marginBottom:'16px'}}>
        <div style={{fontSize:'13px',fontWeight:700,marginBottom:'10px',color:'var(--text)'}}>🏦 Cấu hình tài khoản nhận tiền quỹ (để tạo mã QR)</div>
        <div className="form-grid" style={{marginBottom:'10px'}}>
          <div className="fg">
            <label className="fl">Ngân hàng</label>
            <select className="fi" value={bankDraft.bankCode} onChange={e=>setBankDraft(p=>({...p,bankCode:e.target.value}))} style={{padding:'8px 10px',fontSize:'13px'}}>
              <option value="">-- Chọn ngân hàng --</option>
              {VIETQR_BANKS.map(b=><option key={b.code} value={b.code}>{b.name}</option>)}
            </select>
          </div>
          <div className="fg"><label className="fl">Số tài khoản</label><input className="fi" value={bankDraft.accountNo} onChange={e=>setBankDraft(p=>({...p,accountNo:e.target.value.replace(/[^0-9A-Za-z]/g,'').toUpperCase()}))} placeholder="0123456789 hoặc mã Quỹ nhóm MoMo"/></div>
        </div>
        <div className="fg" style={{marginBottom:'12px'}}>
          <label className="fl">Tên chủ tài khoản (không dấu)</label>
          <input className="fi" value={bankDraft.accountName} onChange={e=>setBankDraft(p=>({...p,accountName:e.target.value.toUpperCase()}))} placeholder="NGUYEN VAN A"/>
        </div>
        <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'12px'}}>Mã QR sẽ được tạo tự động qua VietQR, đúng chuẩn ngân hàng — chỉ cần quét là chuyển khoản, không cần cài thêm gì.</div>
        <div className="form-actions"><button className="btn-cancel" onClick={()=>{setShowBankConfig(false);setBankDraft(bankInfo);}}>Hủy</button><button className="btn-save" onClick={saveBankConfig}>Lưu</button></div>
      </div>
    )}

    {missingPlayers.length>0 && (
      <div style={{background:'var(--yellow-bg)',border:'1px solid var(--yellow)',borderRadius:'10px',padding:'12px 14px',marginBottom:'16px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'10px'}}>
        <div style={{fontSize:'12px',color:'var(--text)'}}>
          ⚠️ Có <b>{missingPlayers.length}</b> người ở BXH chưa có trong Hòm Công Đức: {missingPlayers.map(p=>p.name).join(', ')}
        </div>
        <button onClick={syncMissingMembers} style={{background:'var(--yellow)',border:'none',borderRadius:'8px',color:'#000',padding:'7px 14px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif',whiteSpace:'nowrap'}}>➕ Đồng bộ ngay</button>
      </div>
    )}

    <div className="stats-grid" style={{marginBottom:'16px'}}>
      <div className="stat-card sc-green"><div className="sc-label">Tổng đã đóng</div><div className="sc-val" style={{fontSize:'20px'}}>{fmt(totalFund)}</div></div>
      <div className="stat-card sc-red"><div className="sc-label">Đã chi</div><div className="sc-val" style={{fontSize:'20px'}}>{fmt(totalSpent)}</div></div>
      <div className="stat-card sc-purple"><div className="sc-label">Còn lại trong Hòm Công Đức</div><div className="sc-val" style={{fontSize:'20px',color:'var(--purple)'}}>{fmt(remaining)}</div></div>
      <div className="stat-card sc-red" style={{borderColor:debtorsCount>0?'var(--red)':undefined}}>
        <div className="sc-label">Tổng còn nợ toàn CLB</div>
        <div className="sc-val" style={{fontSize:'20px',color:debtorsCount>0?'var(--red)':'var(--muted)'}}>{fmt(totalDebt)}</div>
        {debtorsCount>0 && <div style={{fontSize:'10.5px',color:'var(--red)',marginTop:'2px'}}>🔴 {debtorsCount} người đang nợ</div>}
      </div>
    </div>

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px',flexWrap:'wrap',gap:'8px'}}>
      <div className="section-title" style={{fontSize:'14px'}}>Tình trạng từng thành viên</div>
      <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
        <button onClick={()=>{setSelectMode(v=>!v);if(selectMode)setSelectedMembers([]);}} style={{
          background:selectMode?'var(--yellow-bg)':'var(--surface)',border:`1px solid ${selectMode?'var(--yellow)':'var(--border)'}`,borderRadius:'8px',
          color:selectMode?'var(--yellow)':'var(--muted)',padding:'5px 12px',fontSize:'12px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif'
        }}>{selectMode?`✓ Đang chọn (${selectedMembers.length})`:'☑️ Chọn nhiều'}</button>
        {selectMode && selectedMembers.length>0 && (
          <button onClick={()=>setShowQRModal(true)} style={{background:'var(--green)',border:'none',borderRadius:'8px',color:'#fff',padding:'5px 12px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif',display:'flex',alignItems:'center',gap:'5px'}}>📱 Tạo mã QR nợ</button>
        )}
        {isAdmin && <button onClick={()=>setShowAddMember(!showAddMember)} style={{background:'var(--surface)',border:'1px dashed var(--border2)',borderRadius:'8px',color:'var(--muted)',padding:'5px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>+ Thêm thành viên</button>}
      </div>
    </div>

    {showAddMember && (
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'14px',marginBottom:'12px'}}>
        <div className="form-grid">
          <div className="fg"><label className="fl">Tên</label><input className="fi" value={newMember.name} onChange={e=>setNewMember(p=>({...p,name:e.target.value}))} placeholder="Tên thành viên"/></div>
          <div className="fg"><label className="fl">Đã đóng (VNĐ)</label><MoneyInput value={newMember.paid} onChange={v=>setNewMember(p=>({...p,paid:v}))} placeholder="500,000"/></div>
        </div>
        {addMemberError && <div style={{fontSize:'12px',color:'var(--red)',marginTop:'8px'}}>⚠️ {addMemberError}</div>}
        <div className="form-actions"><button className="btn-cancel" onClick={()=>{setShowAddMember(false);setAddMemberError('');}}>Hủy</button><button className="btn-save" onClick={addMember}>Thêm</button></div>
      </div>
    )}

    {/* Tìm nhanh + lọc người còn nợ quỹ — hữu ích khi CLB đông thành viên */}
    <div className="fund-search-row">
      <input className="fi" style={{padding:'8px 12px',fontSize:'13px'}} value={memberSearch} onChange={e=>setMemberSearch(e.target.value)} placeholder="🔍 Tìm theo tên..."/>
      <button className="fund-debt-toggle" onClick={()=>setOnlyDebt(v=>!v)} style={{
        padding:'0 12px',minHeight:'38px',borderRadius:'9px',border:'1px solid',fontSize:'12px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif',whiteSpace:'nowrap',
        borderColor:onlyDebt?'var(--red)':'var(--border)',
        background:onlyDebt?'var(--red-bg)':'var(--surface)',
        color:onlyDebt?'var(--red)':'var(--muted)'
      }}>{onlyDebt?'🔴 Đang lọc: còn nợ':'Chỉ hiện người còn nợ'}</button>
    </div>

    {(()=>{
      const filteredMembers=members.map((m,i)=>({m,i})).filter(({m})=>{
        if(memberSearch.trim()&&!m.name.toLowerCase().includes(memberSearch.trim().toLowerCase()))return false;
        if(onlyDebt&&(m.paid-(memberSpent[m.name]||0))>=0)return false;
        return true;
      });
      const firstPage=filteredMembers.slice(0,MEMBER_PAGE_SIZE);
      const extra=filteredMembers.slice(MEMBER_PAGE_SIZE);
      return <>
        <div className="fund-members" style={{display:'flex',flexDirection:'column',gap:'8px'}}>
          {firstPage.map(renderMemberRow)}
          {filteredMembers.length===0 && (
            <div style={{textAlign:'center',padding:'20px',color:'var(--muted)',fontSize:'13px'}}>Không tìm thấy thành viên nào phù hợp</div>
          )}
        </div>
        {extra.length>0 && (
          <div className={`expand-region ${showAllMembers?'expanded':'collapsed'}`}>
            <div className="fund-members" style={{display:'flex',flexDirection:'column',gap:'8px',paddingTop:'8px'}}>
              {extra.map(renderMemberRow)}
            </div>
          </div>
        )}
        {extra.length>0 && (
          <button className="btn-expand" onClick={()=>setShowAllMembers(v=>!v)}>
            {showAllMembers ? '▲ Thu gọn' : `👥 Xem thêm ${extra.length} thành viên`}
          </button>
        )}
      </>;
    })()}

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px',marginTop:'4px'}}>
      <div className="section-title" style={{fontSize:'14px'}}>Lịch sử buổi chơi</div>
      <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
        {fundMonths.map(m2=>(
          <button key={m2} onClick={()=>setMonthFund(m2)} style={{
            padding:'4px 12px',borderRadius:'20px',border:'1px solid',fontSize:'11px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:500,
            borderColor:monthFund===m2?'var(--blue)':'var(--border)',
            background:monthFund===m2?'var(--blue-bg)':'transparent',
            color:monthFund===m2?'var(--blue)':'var(--muted)'
          }}>{m2}</button>
        ))}
      </div>
    </div>
    {monthFund!=='Tất cả'&&(
      <div style={{background:'var(--blue-bg)',border:'1px solid var(--blue)',borderRadius:'10px',padding:'10px 14px',marginBottom:'10px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontSize:'13px',color:'var(--blue)',fontWeight:600}}>{monthFund}: {filteredSessions.length} buổi</span>
        <span style={{fontFamily:'Quicksand',fontSize:'16px',fontWeight:700,color:'var(--blue)'}}>Tổng: {fmt(monthTotal)}</span>
      </div>
    )}
    {isAdmin && <button className="add-session-btn" onClick={()=>setShowAdd(!showAdd)}>+ Thêm buổi chơi</button>}

    {showAdd && (
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'16px',marginBottom:'12px'}}>
        <div className="form-grid" style={{marginBottom:'12px'}}>
          <div className="fg"><label className="fl">📅 Ngày</label><DateInput value={f.date} onChange={v=>setF(p=>({...p,date:v}))}/></div>
          <div className="fg"><label className="fl">Tổng tiền (VNĐ)</label><MoneyInput value={f.total} onChange={v=>setF(p=>({...p,total:v}))} placeholder="380,000"/></div>
        </div>

        {/* Xé vé tùy biến */}
        {!!f.attendees['Xé Vé']&&(
          <div style={{background:'var(--bg3)',borderRadius:'10px',padding:'10px 12px',marginBottom:'10px',border:'1px solid var(--border)'}}>
            <div style={{fontSize:'12px',color:'var(--yellow)',fontWeight:600,marginBottom:'8px'}}>🎫 Xé vé tùy biến</div>
            <div style={{display:'flex',gap:'8px',alignItems:'center',marginBottom:'6px'}}>
              <label className="fl" style={{whiteSpace:'nowrap'}}>Số người xé vé:</label>
              <input className="fi" type="number" min="1" value={f.xeVeCount||''} onChange={e=>setF(p=>({...p,xeVeCount:e.target.value}))} placeholder="2" style={{width:'70px',padding:'5px 8px',fontSize:'13px'}}/>
            </div>
            <div style={{fontSize:'11px',color:'var(--muted)'}}>Tiền của nhóm Xé Vé sẽ được chia đều cho đúng số người này (vẫn tính là 1 phần chung trong tổng buổi, nhưng chia nhỏ ra cho từng người xé vé).</div>
          </div>
        )}

        <div style={{marginBottom:'10px'}}>
          <div className="fl" style={{marginBottom:'8px'}}>Ai đi buổi này? ({Object.entries(f.attendees).filter(([,v])=>v).length} người)</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
            {members.map(m=>{
              const on=!!f.attendees[m.name];
              return (
                <button key={m.name} onClick={()=>toggleAttendee(m.name)} style={{
                  padding:'5px 12px',borderRadius:'20px',border:'1px solid',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',transition:'.15s',
                  borderColor:on?m.color:'var(--border)',
                  background:on?m.color+'33':'transparent',
                  color:on?m.color:'var(--muted)',fontWeight:on?600:400
                }}>{m.name}</button>
              );
            })}
          </div>
          {f.total && Object.values(f.attendees).filter(Boolean).length>0 && (()=>{
            const attending=Object.entries(f.attendees).filter(([,v])=>v).map(([k])=>k);
            const xeVeOn=attending.includes('Xé Vé');
            const xeVeCnt=xeVeOn?Math.max(1,parseInt(f.xeVeCount)||1):0;
            const others=attending.filter(n=>n!=='Xé Vé').length;
            const shares=others+xeVeCnt;
            const per=shares>0?Math.round(parseInt(f.total)/shares):0;
            return (
              <div style={{marginTop:'8px',fontSize:'12px',color:'var(--green)'}}>
                Mỗi người: {fmt(per)}{xeVeOn&&xeVeCnt>1?` · Nhóm Xé Vé (${xeVeCnt} người) tổng: ${fmt(per*xeVeCnt)}`:''}
              </div>
            );
          })()}
        </div>
        <div className="fg" style={{marginBottom:'12px'}}>
          <label className="fl">📝 Ghi chú chi tiêu (sân, cầu, nước...)</label>
          <input className="fi" value={f.note||''} onChange={sf('note')} placeholder="VD: Sân Hoàng Anh 200k, cầu 150k, nước 30k"/>
        </div>
        <div className="form-actions"><button className="btn-cancel" onClick={()=>setShowAdd(false)}>Hủy</button><button className="btn-save" onClick={addSession}>Thêm</button></div>
      </div>
    )}

    <div className="fund-sessions">
      <div className="fs-header" style={{gridTemplateColumns:'62px 1fr 70px 70px 32px'}}>
        <div>Ngày</div><div>Số người</div><div>Mỗi người</div><div>Tổng</div><div></div>
      </div>
      {(()=>{
        const renderSessionRow=s=>{
          const attending = s.attendees ? Object.entries(s.attendees).filter(([,v])=>v).map(([k])=>k) : [];
          const perPerson = attending.length>0 ? shareAmount(s) : (s.players>0 ? Math.round(s.total/s.players) : 0);
          const xeVeCnt = attending.includes('Xé Vé') ? Math.max(1,parseInt(s.xeVeCount)||1) : 0;
          const isExpanded = expandedSession===s.id;
          return (
            <div key={s.id}>
              <div style={{display:'grid',gridTemplateColumns:'62px 1fr 70px 70px 32px',gap:'6px',padding:'11px 14px',borderBottom:'1px solid var(--border)',fontSize:'13px',alignItems:'center',cursor:'pointer',transition:'.1s'}}
                onClick={()=>setExpandedSession(isExpanded?null:s.id)}>
                <div style={{fontWeight:500}}>{s.date}</div>
                <div style={{color:'var(--muted)',fontSize:'13px',display:'flex',alignItems:'center',gap:'4px'}}>
                  <span style={{fontWeight:600,color:'var(--text)'}}>{attending.length>0?attending.length:s.players}</span>
                  <span>người</span>
                  <span style={{fontSize:'10px',opacity:.6}}>{isExpanded?'▲':'▼'}</span>
                </div>
                <div style={{color:'var(--yellow)',fontWeight:600,fontFamily:'Quicksand,sans-serif',textAlign:'center'}}>
                  {perPerson?fmt(perPerson):'—'}
                </div>
                <div style={{fontWeight:600,fontFamily:'Quicksand,sans-serif'}}>{fmt(s.total)}</div>
                {/* Nút sửa + xóa — e.stopPropagation() để không toggle expand */}
                {isAdmin && (
                  <div style={{display:'flex',flexDirection:'column',gap:'3px',alignItems:'center'}} onClick={e=>e.stopPropagation()}>
                    <button title="Chỉnh sửa" onClick={()=>setEditingSession(s)} style={{background:'var(--blue-bg)',border:'none',borderRadius:'6px',color:'var(--blue)',width:'28px',height:'26px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'13px',flexShrink:0}}>✏️</button>
                    <button title="Xóa" onClick={()=>setConfirmDeleteSession(s.id)} style={{background:'var(--red-bg)',border:'none',borderRadius:'6px',color:'var(--red)',width:'28px',height:'26px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'13px',flexShrink:0}}>🗑</button>
                  </div>
                )}
              </div>
              {isExpanded && (
                <div style={{background:'var(--bg3)',padding:'10px 14px',borderBottom:'1px solid var(--border)'}}>
                  {attending.length>0&&(
                    <>
                      <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'6px',textTransform:'uppercase',letterSpacing:'.5px'}}>Chi tiết người tham dự</div>
                      <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:s.note?'8px':'0'}}>
                        {attending.map(name=>{
                          const mem=members.find(m=>m.name===name);
                          const isXeVe=name==='Xé Vé';
                          const label=isXeVe&&xeVeCnt>1?`${name} (${xeVeCnt} người)`:name;
                          const amt=isXeVe&&xeVeCnt>1?`${fmt(perPerson)}/người · ${fmt(perPerson*xeVeCnt)} tổng`:fmt(perPerson);
                          return <span key={name} style={{fontSize:'12px',padding:'3px 10px',borderRadius:'20px',background:(mem?.color||'#888')+'22',color:mem?.color||'#888',fontWeight:500}}>{label} · {amt}</span>;
                        })}
                      </div>
                    </>
                  )}
                  {s.note&&(
                    <div style={{marginTop:'6px',padding:'7px 10px',background:'var(--yellow-bg)',border:'1px solid var(--yellow)',borderRadius:'8px',fontSize:'12px',color:'var(--text)'}}>
                      <span style={{fontSize:'10px',fontWeight:700,color:'var(--yellow)',textTransform:'uppercase',letterSpacing:'.5px',marginRight:'6px'}}>📝 Ghi chú:</span>{s.note}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        };
        const reversedSessions=[...filteredSessions].reverse();
        const firstPage=reversedSessions.slice(0,SESSION_PAGE_SIZE);
        const extra=reversedSessions.slice(SESSION_PAGE_SIZE);
        return <>
          {firstPage.map(renderSessionRow)}
          {extra.length>0 && (
            <div className={`expand-region ${showAllSessions?'expanded':'collapsed'}`}>
              {extra.map(renderSessionRow)}
            </div>
          )}
          {extra.length>0 && (
            <button className="btn-expand-flat" onClick={()=>setShowAllSessions(v=>!v)}>
              {showAllSessions ? '▲ Thu gọn' : `📋 Xem thêm ${extra.length} buổi chơi`}
            </button>
          )}
        </>;
      })()}
      {/* Footer tổng cộng */}
      <div style={{display:'grid',gridTemplateColumns:'62px 1fr 70px 70px 32px',gap:'6px',padding:'11px 14px',background:'var(--bg3)',borderTop:'2px solid var(--border)',fontSize:'13px',fontWeight:700}}>
        <div style={{color:'var(--muted)',fontSize:'11px'}}>TỔNG</div>
        <div style={{color:'var(--muted)',fontSize:'11px'}}>{filteredSessions.length} buổi</div>
        <div></div>
        <div style={{color:'var(--yellow)',fontFamily:'Quicksand,sans-serif'}}>{fmt(monthTotal)}</div>
        <div></div>
      </div>
    </div>

    {/* Modal chỉnh sửa buổi chơi */}
    {editingSession&&(
      <EditSessionModal
        session={editingSession}
        members={members}
        onClose={()=>setEditingSession(null)}
        onSave={updated=>{
          setSessions(p=>p.map(s=>s.id===updated.id?updated:s));
          setEditingSession(null);
        }}
      />
    )}

    {confirmDeleteSession&&<ConfirmModal
      msg={`Xóa buổi chơi ngày ${sessions.find(s=>s.id===confirmDeleteSession)?.date||''}? Dữ liệu chi tiêu buổi này sẽ bị xóa.`}
      onConfirm={()=>deleteSession(confirmDeleteSession)}
      onClose={()=>setConfirmDeleteSession(null)}
    />}
    {confirmDeleteMember!=null&&<ConfirmModal
      msg={`Xóa thành viên "${members[confirmDeleteMember]?.name}"? Toàn bộ lịch sử nạp tiền của người này sẽ bị xóa.`}
      onConfirm={()=>deleteMember(confirmDeleteMember)}
      onClose={()=>setConfirmDeleteMember(null)}
    />}

    {showQRModal && (
      <DebtQRModal
        members={selectedMembers.map(name=>members.find(m=>m.name===name)).filter(Boolean)}
        memberSpent={memberSpent}
        players={players}
        bankInfo={bankInfo}
        clubName={clubName}
        onClose={()=>setShowQRModal(false)}
        onOpenBankConfig={()=>{setShowQRModal(false);setShowBankConfig(true);}}
      />
    )}
  </>;
}

/* ─── MODAL: TẠO MÃ QR NHẮC NỢ (chọn 1 hoặc nhiều người) ───
   Dùng ảnh QR từ VietQR (img.vietqr.io) — quét là ra đúng số tiền + nội dung,
   mỗi người có 1 thẻ riêng, có thể tải ảnh (html2canvas) để gửi qua Zalo/Messenger. */
function DebtQRModal({members,memberSpent,players,bankInfo,clubName,onClose,onOpenBankConfig}){
  const hasBank = !!(bankInfo && bankInfo.bankCode && bankInfo.accountNo);
  const cardRefs = React.useRef({});
  const [downloading,setDownloading]=useState(null); // tên đang tải, hoặc 'all'
  const [combineMode,setCombineMode]=useState(false); // true: gộp tất cả người đã chọn thành 1 mã QR duy nhất (dùng khi 1 người trả nợ hộ nhiều người)

  const rows = members.map(m=>{
    const spent = memberSpent[m.name]||0;
    const rem = m.paid-spent;
    const debt = rem<0 ? Math.abs(rem) : 0;
    return {...m, debt};
  });

  const downloadCard = async(name)=>{
    const node = cardRefs.current[name];
    if(!node || !window.html2canvas) return;
    setDownloading(name);
    try{
      const canvas = await window.html2canvas(node,{backgroundColor:'#ffffff',scale:2,useCORS:true,allowTaint:false});
      const link = document.createElement('a');
      link.download = `no-quy-${name.replace(/\s+/g,'-')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }catch(e){}
    setDownloading(null);
  };

  const downloadAll = async()=>{
    setDownloading('all');
    for(const r of rows){
      if(r.debt<=0) continue;
      await downloadCard(r.name);
      await new Promise(res=>setTimeout(res,350));
    }
    setDownloading(null);
  };

  const debtRows = rows.filter(r=>r.debt>0);
  const noDebtRows = rows.filter(r=>r.debt<=0);
  const combinedTotal = debtRows.reduce((s,r)=>s+r.debt,0);

  const downloadCombined = async()=>{
    const node = cardRefs.current['__combined__'];
    if(!node || !window.html2canvas) return;
    setDownloading('__combined__');
    try{
      const canvas = await window.html2canvas(node,{backgroundColor:'#ffffff',scale:2,useCORS:true,allowTaint:false});
      const link = document.createElement('a');
      link.download = `no-quy-gop-${debtRows.length}-nguoi.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }catch(e){}
    setDownloading(null);
  };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:500,display:'flex',alignItems:'flex-start',justifyContent:'center',overflowY:'auto',padding:'24px 12px'}} onClick={onClose}>
      <div style={{background:'var(--bg)',borderRadius:'16px',maxWidth:'480px',width:'100%',padding:'18px',position:'relative'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}}>
          <div style={{fontSize:'16px',fontWeight:800,fontFamily:'Quicksand,sans-serif'}}>📱 Mã QR nhắc nợ ({debtRows.length} người)</div>
          <button onClick={onClose} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'50%',width:'30px',height:'30px',cursor:'pointer',fontSize:'14px',color:'var(--muted)'}}>✕</button>
        </div>

        {!hasBank && (
          <div style={{background:'var(--yellow-bg)',border:'1px solid var(--yellow)',borderRadius:'10px',padding:'12px 14px',marginBottom:'14px',fontSize:'12.5px',color:'var(--text)'}}>
            ⚠️ Chưa cấu hình tài khoản ngân hàng của CLB nên chưa tạo được mã QR chuyển khoản.
            <div style={{marginTop:'8px'}}>
              <button onClick={onOpenBankConfig} style={{background:'var(--yellow)',border:'none',borderRadius:'8px',color:'#000',padding:'6px 12px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>🏦 Cấu hình ngay</button>
            </div>
          </div>
        )}

        {hasBank && debtRows.length>1 && (
          <div style={{display:'flex',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'10px',padding:'3px',marginBottom:'14px',gap:'3px'}}>
            <button onClick={()=>setCombineMode(false)} style={{flex:1,background:!combineMode?'var(--green)':'transparent',color:!combineMode?'#fff':'var(--muted)',border:'none',borderRadius:'8px',padding:'8px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>👤 Mỗi người 1 mã</button>
            <button onClick={()=>setCombineMode(true)} style={{flex:1,background:combineMode?'var(--green)':'transparent',color:combineMode?'#fff':'var(--muted)',border:'none',borderRadius:'8px',padding:'8px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>🔗 Gộp 1 mã chung</button>
          </div>
        )}

        {hasBank && !combineMode && debtRows.length>1 && (
          <button onClick={downloadAll} disabled={downloading!==null} style={{width:'100%',marginBottom:'14px',background:'var(--purple)',border:'none',borderRadius:'10px',color:'#fff',padding:'10px',fontSize:'13px',fontWeight:700,cursor:downloading?'default':'pointer',fontFamily:'Nunito,sans-serif',opacity:downloading?.7:1}}>
            {downloading==='all'?'⏳ Đang tải ảnh...':`⬇️ Tải ảnh tất cả (${debtRows.length})`}
          </button>
        )}

        {hasBank && debtRows.length===0 && (
          <div style={{textAlign:'center',padding:'24px',color:'var(--muted)',fontSize:'13px'}}>🎉 Những người bạn chọn không ai còn nợ quỹ cả!</div>
        )}

        {hasBank && combineMode && debtRows.length>0 && (()=>{
          const note = `${clubName||'CLB'} - tra no quy ${debtRows.length} nguoi`.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d');
          const qrUrl = vietQRImageUrl({bankCode:bankInfo.bankCode,accountNo:bankInfo.accountNo,accountName:bankInfo.accountName,amount:combinedTotal,note});
          const bankName = (VIETQR_BANKS.find(b=>b.code===bankInfo.bankCode)||{}).name||'';
          return (
            <div ref={el=>cardRefs.current['__combined__']=el} style={{background:'#fff',border:'1px solid var(--border)',borderRadius:'14px',padding:'16px',textAlign:'center',marginBottom:'14px'}}>
              <div style={{fontSize:'12px',color:'#8a909c',marginBottom:'4px'}}>Trả gộp nợ cho {debtRows.length} người</div>
              <div style={{fontSize:'13px',color:'#1a1d24',marginBottom:'10px',lineHeight:1.7}}>
                {debtRows.map(r=><div key={r.name}>{r.name}: <b>{fmt(r.debt)}</b></div>)}
              </div>
              <div style={{fontSize:'12px',color:'#8a909c',marginBottom:'2px'}}>Tổng cần chuyển</div>
              <div style={{fontSize:'26px',fontWeight:900,color:'#ef4444',fontFamily:'Quicksand,sans-serif',marginBottom:'12px'}}>{fmt(combinedTotal)}</div>
              {qrUrl && <img src={qrUrl} alt="QR gộp" crossOrigin="anonymous" style={{width:'220px',maxWidth:'100%',borderRadius:'10px',border:'1px solid #e3e6ea'}}/>}
              <div style={{marginTop:'10px',fontSize:'12px',color:'#1a1d24',lineHeight:1.6}}>
                <div><b>{bankName}</b></div>
                <div>STK: <b>{bankInfo.accountNo}</b> — {bankInfo.accountName}</div>
              </div>
              <div style={{marginTop:'8px',fontSize:'11px',color:'var(--muted)'}}>⚠️ Sau khi người trả chuyển khoản, bạn tự tay đánh dấu đã đóng tiền cho từng người tương ứng trong danh sách thành viên nhé — hệ thống không tự tách khoản gộp này ra từng người.</div>
              <button onClick={downloadCombined} disabled={downloading!==null} style={{marginTop:'12px',background:'var(--green)',border:'none',borderRadius:'8px',color:'#fff',padding:'7px 16px',fontSize:'12px',fontWeight:700,cursor:downloading?'default':'pointer',fontFamily:'Nunito,sans-serif',opacity:downloading?.7:1}}>
                {downloading==='__combined__'?'⏳ Đang tải...':'⬇️ Tải ảnh mã gộp'}
              </button>
            </div>
          );
        })()}

        <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
          {hasBank && !combineMode && debtRows.map(r=>{
            const matchedPlayer=(players||[]).find(p=>p.name===r.name);
            const note = `${clubName||'CLB'} - ${r.name} - tra no quy`.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d');
            const qrUrl = vietQRImageUrl({bankCode:bankInfo.bankCode,accountNo:bankInfo.accountNo,accountName:bankInfo.accountName,amount:r.debt,note});
            const bankName = (VIETQR_BANKS.find(b=>b.code===bankInfo.bankCode)||{}).name||'';
            return (
              <div key={r.name} ref={el=>cardRefs.current[r.name]=el} style={{background:'#fff',border:'1px solid var(--border)',borderRadius:'14px',padding:'16px',textAlign:'center'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',marginBottom:'8px'}}>
                  <div style={{width:'26px',height:'26px',borderRadius:'50%',overflow:'hidden',flexShrink:0,background:r.color+'22',color:r.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'10px',fontWeight:700}}>
                    {matchedPlayer?.avatar?<img src={matchedPlayer.avatar} alt={r.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:initials(r.name)}
                  </div>
                  <div style={{fontSize:'15px',fontWeight:800,color:'#1a1d24',fontFamily:'Quicksand,sans-serif'}}>{r.name}</div>
                </div>

const FB_URL = 'https://test-7df23-default-rtdb.firebaseio.com';
// Khoá bí mật phải khớp với rule ".write" đã publish trên Firebase Console
// (Realtime Database → Rules). Đổi cả 2 nơi cùng lúc nếu muốn thay khoá.
const FB_WRITE_KEY = 'jUS6-lVMLm1sNB3FdseBc5GOjK-EzHlM';

async function fbGet(path){
  try{const r=await fetch(FB_URL+'/'+path+'.json');if(!r.ok)return null;const d=await r.json();
  // Nếu data được wrap với _ts thì unwrap
  if(d&&typeof d==='object'&&'_data' in d) return d._data;
  return d;}catch{return null;}
}

// Timestamp lần cuối mình ghi lên Firebase cho từng path
const _fbLastWrite={};
// Flag đang trong quá trình fetch PUT
const _fbSaving={};

async function fbSet(path,val){
  _fbSaving[path]=true;
  const ts=Date.now();
  _fbLastWrite[path]=ts;
  try{
    await fetch(FB_URL+'/'+path+'.json',{method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({_data:val,_ts:ts,_key:FB_WRITE_KEY})
    });
  }catch{}finally{
    setTimeout(()=>{ _fbSaving[path]=false; },2000);
  }
}

// Poll an toàn: chỉ apply data nếu server _ts MỚI HƠN lần cuối mình write + 5s
// → tránh poll kéo data cũ về ghi đè thay đổi local vừa làm
async function fbPoll(path){
  if(_fbSaving[path]) return null;
  try{
    const r=await fetch(FB_URL+'/'+path+'.json');
    if(!r.ok) return null;
    const d=await r.json();
    if(!d||typeof d!=='object') return null;
    const serverTs=d._ts||0;
    const myLastWrite=_fbLastWrite[path]||0;
    // Bỏ qua nếu server timestamp chưa vượt quá lần cuối mình ghi + 5s buffer
    if(serverTs < myLastWrite + 5000) return null;
    return ('_data' in d) ? d._data : d;
  }catch{ return null; }
}

  const [dbReady,setDbReady]=useState(false);
  const [syncing,setSyncing]=useState(false);

  const [bankInfo,setBankInfo]=useState({bankCode:'',accountNo:'',accountName:''});
  // Thùng rác: lưu tạm các mục đã xóa (thành viên/trận đấu/buổi chơi/người chơi) để có thể khôi phục, tự dọn sau 30 ngày
  const [trash,setTrash]=useState({members:[],sessions:[],matches:[],players:[]});
  const TRASH_RETENTION_DAYS=30;

  // Chuẩn hoá dữ liệu trash: Firebase tự xoá các mảng rỗng [] khi lưu,
  // nên khi đọc lại có thể THIẾU hẳn key members/sessions/matches/players.
  // Luôn điền mảng rỗng cho key thiếu để không bao giờ bị undefined.length ở nơi khác.
  const normalizeTrash=React.useCallback(t=>{
    const cutoff=Date.now()-TRASH_RETENTION_DAYS*24*60*60*1000;
    const safeArr=v=>Array.isArray(v)?v:[];
    return {
      members:safeArr(t&&t.members).filter(x=>x&&x.deletedAt>cutoff),
      sessions:safeArr(t&&t.sessions).filter(x=>x&&x.deletedAt>cutoff),
      matches:safeArr(t&&t.matches).filter(x=>x&&x.deletedAt>cutoff),
      players:safeArr(t&&t.players).filter(x=>x&&x.deletedAt>cutoff),
    };
  },[]);

  // Load tất cả data từ Firebase khi khởi động
  useEffect(()=>{
    (async()=>{
      setSyncing(true);
      const [p,m,s,mb,bn,tr,bi]=await Promise.all([fbGet('players'),fbGet('matches'),fbGet('sessions'),fbGet('members'),fbGet('banner'),fbGet('trash'),fbGet('bankInfo')]);
      if(Array.isArray(p)&&p.length) setPlayers(p);
      if(Array.isArray(m)&&m.length) setMatches(m);
      if(Array.isArray(s)&&s.length) setSessions(s);
      if(Array.isArray(mb)&&mb.length) setMembers(mb);
      if(bn&&typeof bn==='object'){
        if(bn.bannerImg!==undefined) setBannerImg(bn.bannerImg);
        if(bn.bannerTitle) setBannerTitle(bn.bannerTitle);
        if(bn.bannerSub) setBannerSub(bn.bannerSub);
        if(bn.bannerOverlay!==undefined) setBannerOverlay(bn.bannerOverlay);
        if(bn.bannerBrightness!==undefined) setBannerBrightness(bn.bannerBrightness);
      }
      if(tr&&typeof tr==='object'){
        setTrash(normalizeTrash(tr));
      }
      if(bi&&typeof bi==='object') setBankInfo(p=>({...p,...bi}));
      setDbReady(true);
      setSyncing(false);
    })();
    // Poll mỗi 30s — dùng fbPoll để bỏ qua khi đang ghi (tăng lên 30s tránh ghi đè khi đang chỉnh)
    const id=setInterval(async()=>{
      const [p,m,s,mb,bn,tr,bi]=await Promise.all([fbPoll('players'),fbPoll('matches'),fbPoll('sessions'),fbPoll('members'),fbPoll('banner'),fbPoll('trash'),fbPoll('bankInfo')]);
      if(Array.isArray(p)&&p.length) setPlayers(p);
      if(Array.isArray(m)&&m.length) setMatches(m);
      if(Array.isArray(s)&&s.length) setSessions(s);
      if(Array.isArray(mb)&&mb.length) setMembers(mb);
      if(bn&&typeof bn==='object'&&!_fbSaving['banner']){
        if(bn.bannerImg!==undefined) setBannerImg(bn.bannerImg);
        if(bn.bannerTitle) setBannerTitle(bn.bannerTitle);
        if(bn.bannerSub) setBannerSub(bn.bannerSub);
        if(bn.bannerOverlay!==undefined) setBannerOverlay(bn.bannerOverlay);
        if(bn.bannerBrightness!==undefined) setBannerBrightness(bn.bannerBrightness);
      }
      if(tr&&typeof tr==='object'&&!_fbSaving['trash']) setTrash(normalizeTrash(tr));
      if(bi&&typeof bi==='object'&&!_fbSaving['bankInfo']) setBankInfo(p=>({...p,...bi}));
    },30000);
    return ()=>clearInterval(id);
  },[]);

  // Sync lên Firebase khi data thay đổi
  // Dùng useRef để skip N lần render đầu (trước khi Firebase load xong)
  const _skipPlayers=React.useRef(1);
  const _skipMatches=React.useRef(1);
  const _skipSessions=React.useRef(1);
  const _skipMembers=React.useRef(1);
  const _skipBanner=React.useRef(1);
  const _skipTrash=React.useRef(1);
  const _skipBankInfo=React.useRef(1);
  useEffect(()=>{
    if(_skipPlayers.current>0){_skipPlayers.current--;return;}
    if(dbReady)fbSet('players',players);
  },[players]);
  useEffect(()=>{
    if(_skipMatches.current>0){_skipMatches.current--;return;}
    if(dbReady)fbSet('matches',matches);
  },[matches]);
  useEffect(()=>{
    if(_skipSessions.current>0){_skipSessions.current--;return;}
    if(dbReady)fbSet('sessions',sessions);
  },[sessions]);
  useEffect(()=>{
    if(_skipMembers.current>0){_skipMembers.current--;return;}
    if(dbReady)fbSet('members',members);
  },[members]);
  useEffect(()=>{
    if(_skipBanner.current>0){_skipBanner.current--;return;}
    if(dbReady)fbSet('banner',{bannerImg,bannerTitle,bannerSub,bannerOverlay,bannerBrightness});
  },[bannerImg,bannerTitle,bannerSub,bannerOverlay,bannerBrightness]);
  useEffect(()=>{
    if(_skipTrash.current>0){_skipTrash.current--;return;}
    if(dbReady)fbSet('trash',trash);
  },[trash]);
  useEffect(()=>{
    if(_skipBankInfo.current>0){_skipBankInfo.current--;return;}
    if(dbReady)fbSet('bankInfo',bankInfo);
  },[bankInfo]);
  const [showAdd,setShowAdd]=useState(false);
  const [showTrash,setShowTrash]=useState(false);
  const [confirmId,setConfirmId]=useState(null);
  const [toast,setToast]=useState(null);
  const [isAdmin,setIsAdmin]=useState(()=>{ try{ return localStorage.getItem('pcb_admin')==='1'; }catch(e){ return false; } });
  const [showPin,setShowPin]=useState(false);
  const pendingAction=React.useRef(null);

  const requireAdmin=fn=>(...args)=>{
    if(isAdmin){ fn(...args); return; }
    pendingAction.current=()=>fn(...args);
    setShowPin(true);
  };
  const handlePinConfirm=()=>{
    setIsAdmin(true);
    try{ localStorage.setItem('pcb_admin','1'); }catch(e){}
    setShowPin(false);
    if(pendingAction.current){ const fn=pendingAction.current; pendingAction.current=null; fn(); }
  };
  const toggleLock=()=>{
    if(isAdmin){
      setIsAdmin(false);
      try{ localStorage.removeItem('pcb_admin'); }catch(e){}
      showToast('Đã khoá quyền chỉnh sửa');
    } else {
      setShowPin(true);
    }
  };
  const [matchSeg,setMatchSeg]=useState('Đôi');

  const showToast=msg=>setToast(msg);
  const openAdd=()=>setShowAdd(true);
  const openFund=()=>setTab('fund');

  // Derive "myElo" as the first player's ELO, or 1500
  const myElo=players.length?players[0].elo:1500;

  const addPlayer=(name,elo=1500)=>{
    const nm=(name||'').trim();
    if(!nm) return;
    if(isNameTaken(nm, players, members)){ showToast('⚠️ Tên này đã tồn tại trong CLB'); return; }
    const id=Date.now();
    const color=COLORS[players.length%COLORS.length];
    const eloVal=parseInt(elo)||1500;
    setPlayers(p=>[...p,{id,name:nm,elo:eloVal,wins:0,losses:0,color,avatar:null}]);
    // Đồng bộ: tự tạo thành viên quỹ tương ứng nếu chưa có
    setMembers(p=>{
      if(p.some(m=>m.name.toLowerCase()===nm.toLowerCase())) return p;
      const usedColors=p.map(m=>m.color);
      const nextColor=COLORS.find(c=>!usedColors.includes(c))||color;
      return [...p,{name:nm,paid:0,color:nextColor,deposits:[]}];
    });
    showToast(`Đã thêm ${nm} (Công Đức ${eloVal}) & tạo thành viên Hòm Công Đức tương ứng`);
  };

  const deletePlayer=(id)=>{
    const p=players.find(x=>x.id===id);
    if(p) trashAdd('players', p);
    setPlayers(p=>p.filter(x=>x.id!==id));
    showToast('Đã chuyển người chơi vào Thùng rác');
  };

  // Đổi tên đồng bộ giữa BXH (players), Quỹ (members), lịch sử buổi chơi (sessions) và lịch sử trận đấu (matches)
  // id (tùy chọn): nếu có, chỉ đổi tên đúng người chơi có id này trong danh sách players.
  // Nếu sau khi đổi vẫn còn người khác dùng tên cũ (trường hợp trùng tên), KHÔNG tự động
  // sửa lịch sử trận đấu/buổi chơi cũ (vì không thể biết trận nào là của ai) — người dùng
  // cần tự vào "Sửa trận đấu" để gán lại đúng người cho từng trận cũ.
  const renameEverywhere=(oldName,newName,id=null)=>{
    const stillDuplicate = id!=null && players.some(pl=>pl.id!==id && pl.name===oldName);
    if(id!=null){
      setPlayers(p=>p.map(pl=>pl.id===id?{...pl,name:newName}:pl));
    } else {
      setPlayers(p=>p.map(pl=>pl.name===oldName?{...pl,name:newName}:pl));
    }
    if(stillDuplicate) return;
    setMembers(p=>p.map(m=>m.name===oldName?{...m,name:newName}:m));
    setSessions(p=>p.map(s=>{
      if(!s.attendees || !(oldName in s.attendees)) return s;
      const {[oldName]:val, ...rest}=s.attendees;
      return {...s, attendees:{...rest, [newName]:val}};
    }));
    setMatches(p=>p.map(mt=>{
      const swapTeamStr=str=>!str?str:str.split(' & ').map(n=>n===oldName?newName:n).join(' & ');
      const swapArr=arr=>(arr||[]).map(n=>n===oldName?newName:n);
      const swapElo=arr=>(arr||[]).map(e=>e.name===oldName?{...e,name:newName}:e);
      const usesOldName=mt.myTeam===oldName||mt.oppTeam===oldName||
        (mt.myTeam||'').split(' & ').includes(oldName)||(mt.oppTeam||'').split(' & ').includes(oldName)||
        (mt.team1Players||[]).includes(oldName)||(mt.team2Players||[]).includes(oldName)||
        (mt.eloChanges||[]).some(e=>e.name===oldName);
      if(!usesOldName) return mt;
      return {...mt,
        myTeam:swapTeamStr(mt.myTeam),
        oppTeam:swapTeamStr(mt.oppTeam),
        team1Players:swapArr(mt.team1Players),
        team2Players:swapArr(mt.team2Players),
        eloChanges:swapElo(mt.eloChanges)
      };
    }));
  };

  const doRenameEverywhere=(oldName,newName,id=null)=>{
    const nn=(newName||'').trim();
    if(!nn||nn===oldName) return;
    if(isNameTaken(nn, players, members, oldName)){ showToast('⚠️ Tên đã tồn tại, chọn tên khác nhé'); return; }
    const stillDuplicate = id!=null && players.some(pl=>pl.id!==id && pl.name===oldName);
    renameEverywhere(oldName, nn, id);
    showToast(stillDuplicate
      ? `✅ Đã đổi tên hiển thị thành "${nn}". Vì vẫn còn người khác tên "${oldName}", lịch sử trận đấu CHƯA tự cập nhật — vào từng trận cũ (✏️ Sửa trận đấu) để gán lại đúng người nhé.`
      : `Đã đổi tên "${oldName}" → "${nn}"`);
  };

  /* ─── THÙNG RÁC: khôi phục dữ liệu khi lỡ xóa ─────────────
     Xóa sẽ không mất ngay — mục bị xóa chuyển vào Thùng rác, giữ 30 ngày, admin có thể khôi phục lại. */
  const trashAdd=(type,item)=>{
    setTrash(t=>({...t,[type]:[{...item,deletedAt:Date.now()},...(t[type]||[])]}));
  };

  const trashRestorePlayer=(idx)=>{
    const item=trash.players[idx]; if(!item) return;
    const {deletedAt,...clean}=item;
    if(isNameTaken(clean.name, players, members)){ showToast('⚠️ Không thể khôi phục — tên đã bị dùng lại'); return; }
    setPlayers(p=>[...p,clean]);
    setTrash(t=>({...t,players:t.players.filter((_,i)=>i!==idx)}));
    showToast(`Đã khôi phục người chơi "${clean.name}"`);
  };
  const trashRestoreMember=(idx)=>{
    const item=trash.members[idx]; if(!item) return;
    const {deletedAt,...clean}=item;
    if(isNameTaken(clean.name, players, members)){ showToast('⚠️ Không thể khôi phục — tên đã bị dùng lại'); return; }
    setMembers(p=>[...p,clean]);
    setTrash(t=>({...t,members:t.members.filter((_,i)=>i!==idx)}));
    showToast(`Đã khôi phục thành viên "${clean.name}"`);
  };
  const trashRestoreSession=(idx)=>{
    const item=trash.sessions[idx]; if(!item) return;
    const {deletedAt,...clean}=item;
    setSessions(p=>[...p,clean]);
    setTrash(t=>({...t,sessions:t.sessions.filter((_,i)=>i!==idx)}));
    showToast('Đã khôi phục buổi chơi');
  };
  const trashRestoreMatch=(idx)=>{
    const item=trash.matches[idx]; if(!item) return;
    const {deletedAt,...clean}=item;
    // áp lại ELO như khi ghi trận mới
    setPlayers(prev=>{
      const updated=[...prev];
      (clean.eloChanges||[]).forEach(({name,delta})=>{
        const i=updated.findIndex(p=>p.name===name);
        if(i>=0){
          const win=delta>0;
          updated[i]={...updated[i],elo:updated[i].elo+delta,wins:updated[i].wins+(win?1:0),losses:updated[i].losses+(win?0:1)};
        }
      });
      return updated;
    });
    setMatches(p=>[clean,...p]);
    setTrash(t=>({...t,matches:t.matches.filter((_,i)=>i!==idx)}));
    showToast('Đã khôi phục trận đấu & cập nhật lại Công Đức');
  };
  const trashPurgeForever=(type,idx)=>{
    setTrash(t=>({...t,[type]:t[type].filter((_,i)=>i!==idx)}));
  };
  const trashCount=(trash.members||[]).length+(trash.sessions||[]).length+(trash.matches||[]).length+(trash.players||[]).length;

  const updatePlayerAvatar=(id, dataUrl)=>{
    setPlayers(p=>p.map(x=>x.id===id?{...x, avatar:dataUrl}:x));
    showToast('Đã cập nhật ảnh đại diện');
  };

  // Sửa lỗi lệch số liệu thắng/thua: ghi đè bộ đếm player.wins/losses bằng
  // đúng số đếm được từ danh sách trận đấu thật (nguồn dữ liệu gốc, luôn đáng tin).
  const resyncPlayerStats=(id, wins, losses)=>{
    setPlayers(p=>p.map(x=>x.id===id?{...x, wins, losses}:x));
    showToast('✅ Đã đồng bộ lại số liệu thắng/thua');
  };

  const addMatch=m=>{
    // Apply ELO changes to all involved players
    setPlayers(prev=>{
      const updated=[...prev];
      (m.eloChanges||[]).forEach(({name,delta})=>{
        const idx=updated.findIndex(p=>p.name===name);
        if(idx>=0){
          const win=delta>0;
          updated[idx]={...updated[idx],
            elo:updated[idx].elo+delta,
            wins:updated[idx].wins+(win?1:0),
            losses:updated[idx].losses+(win?0:1)
          };
        }
      });
      return updated;
    });
    setMatches(p=>[m,...p]);
    showToast('Đã lưu trận & cập nhật Công Đức!');
  };

  const editMatch=m=>{
    // Reverse old ELO, apply new ELO
    const old=matches.find(x=>x.id===m.id);
    setPlayers(prev=>{
      let updated=[...prev];
      // hoàn ELO cũ
      (old?.eloChanges||[]).forEach(({name,delta})=>{
        const idx=updated.findIndex(p=>p.name===name);
        if(idx>=0){const wasWin=delta>0;updated[idx]={...updated[idx],elo:updated[idx].elo-delta,wins:updated[idx].wins-(wasWin?1:0),losses:updated[idx].losses-(wasWin?0:1)};}
      });
      // áp ELO mới
      (m.eloChanges||[]).forEach(({name,delta})=>{
        const idx=updated.findIndex(p=>p.name===name);
        if(idx>=0){const win=delta>0;updated[idx]={...updated[idx],elo:updated[idx].elo+delta,wins:updated[idx].wins+(win?1:0),losses:updated[idx].losses+(win?0:1)};}
      });
      return updated;
    });
    setMatches(p=>p.map(x=>x.id===m.id?m:x));
    showToast('Đã cập nhật trận & Công Đức!');
  };

  const deleteMatch=id=>{
    const m=matches.find(x=>x.id===id);
    if(!m) return;
    trashAdd('matches', m);
    // Reverse ELO changes
    setPlayers(prev=>{
      const updated=[...prev];
      (m.eloChanges||[]).forEach(({name,delta})=>{
        const idx=updated.findIndex(p=>p.name===name);
        if(idx>=0){
          const wasWin=delta>0;
          updated[idx]={...updated[idx],
            elo:updated[idx].elo-delta,
            wins:updated[idx].wins-(wasWin?1:0),
            losses:updated[idx].losses-(wasWin?0:1)
          };
        }
      });
      return updated;
    });
    setMatches(p=>p.filter(x=>x.id!==id));
    setConfirmId(null);
    showToast('Đã chuyển trận vào Thùng rác & hoàn Công Đức!');
  };

  const guardedDeleteMatch=requireAdmin(id=>setConfirmId(id));
  const guardedEditMatch=requireAdmin(editMatch);
  const guardedAddPlayer=requireAdmin(addPlayer);
  const guardedDeletePlayer=requireAdmin(deletePlayer);
  const guardedUpdateAvatar=requireAdmin(updatePlayerAvatar);
  const guardedResyncStats=requireAdmin(resyncPlayerStats);
  const guardedRenameEverywhere=requireAdmin(doRenameEverywhere);
  const guardedBannerUpdate=requireAdmin(({bannerImg:img, bannerTitle:t, bannerSub:s, bannerOverlay:ov, bannerBrightness:br})=>{
    setBannerImg(img);
    setBannerTitle(t);
    setBannerSub(s);
    if(ov!==undefined) setBannerOverlay(ov);
    if(br!==undefined) setBannerBrightness(br);
  });
  const guardedTrashRestorePlayer=requireAdmin(trashRestorePlayer);
  const guardedTrashRestoreMember=requireAdmin(trashRestoreMember);
  const guardedTrashRestoreSession=requireAdmin(trashRestoreSession);
  const guardedTrashRestoreMatch=requireAdmin(trashRestoreMatch);
  const guardedTrashPurgeForever=requireAdmin(trashPurgeForever);

  // Thông báo real-time khi có huy hiệu đổi chủ (VD: vừa cướp ngôi Vua ELO sau khi ghi trận)
  const prevBadgeHolders=React.useRef(null);
  useEffect(()=>{
    if(!dbReady) return;
    const badges=computeBadges(players, matches);
    const current={};
    badges.forEach(b=>{ current[b.id]=b.holder?b.holder.id:null; });
    if(prevBadgeHolders.current){
      const changed=badges.find(b=>{
        const newHolder=current[b.id], prevHolder=prevBadgeHolders.current[b.id];
        return newHolder && newHolder!==prevHolder;
      });
      if(changed){
        const p=players.find(x=>x.id===current[changed.id]);
        if(p) showToast(`🎉 ${p.name} vừa đoạt huy hiệu ${changed.emoji} ${changed.title}!`);
      }
    }
    prevBadgeHolders.current=current;
  },[players,matches,dbReady]);

  const TABS=[
    {id:'dashboard',label:'Tổng Quan',icon:'📊'},
    {id:'matches',  label:'Lịch Sử',icon:'🏓'},
    {id:'bxh',      label:'BXH',icon:'🏆'},
    {id:'sokeo',    label:'So Kèo',icon:'⚔️'},
  ];

  return <>
    <div className="topbar">
      <div className="logo">
        <div className="logo-icon" style={{padding:0,overflow:'hidden'}}><img src={LOGO_ICON_SRC} alt="logo" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'6px'}}/></div>
        <div>
          <div className="logo-text">PÍCH CỜ BÔN</div>
          <span className="logo-sub">Phông Bạt</span>
        </div>
      </div>
      <div className="nav-tabs">
        {TABS.map(t=>(
          <button key={t.id} className={`nav-tab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </div>
      <div className="nav-right" style={{display:'flex',alignItems:'center',gap:'8px'}}>
        {syncing&&<span title="Đang đồng bộ..." style={{fontSize:'11px',color:'var(--muted)',background:'var(--surface)',borderRadius:'20px',padding:'3px 8px',border:'1px solid var(--border)'}}>⏳</span>}
        {FB_URL.includes('YOUR_PROJECT')&&<span style={{fontSize:'10px',color:'var(--orange)',background:'var(--orange-bg)',borderRadius:'20px',padding:'3px 8px',cursor:'pointer'}} title="Chưa cấu hình Firebase">⚠️</span>}
        <button onClick={openFund} style={{background:tab==='fund'?'var(--yellow)':'rgba(234,179,8,.15)',border:'1px solid var(--yellow)',borderRadius:'8px',color:tab==='fund'?'#000':'var(--yellow)',padding:'7px 13px',fontSize:'12px',fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',fontFamily:'Nunito,sans-serif',display:'flex',alignItems:'center',gap:'5px'}}>🙏 Hòm Công Đức</button>
        <AdminMenu isAdmin={isAdmin} trashCount={trashCount} onOpenTrash={()=>setShowTrash(true)} onToggleLock={toggleLock} dark/>
        <button className="btn-ghi" onClick={openAdd}>+ Ghi Trận</button>
      </div>
    </div>

    {/* Mobile header */}
    <div className="mobile-header">
      <div className="logo">
        <div className="logo-icon" style={{padding:0,overflow:'hidden'}}><img src={LOGO_ICON_SRC} alt="logo" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'6px'}}/></div>
        <div>
          <div className="logo-text">PÍCH CỜ BÔN</div>
          <span className="logo-sub">Phông Bạt</span>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
        <button onClick={openFund} style={{background:tab==='fund'?'var(--yellow)':'rgba(234,179,8,.15)',border:'1px solid var(--yellow)',borderRadius:'8px',color:tab==='fund'?'#000':'var(--yellow)',padding:'6px 12px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif',display:'flex',alignItems:'center',gap:'4px'}}>🙏 Hòm Công Đức</button>
        <AdminMenu isAdmin={isAdmin} trashCount={trashCount} onOpenTrash={()=>setShowTrash(true)} onToggleLock={toggleLock}/>
      </div>
    </div>

    <Banner
      bannerImg={bannerImg}
      bannerTitle={bannerTitle}
      bannerSub={bannerSub}
      bannerOverlay={bannerOverlay}
      bannerBrightness={bannerBrightness}
      editable={isAdmin}
      onUpdate={guardedBannerUpdate}
    />

    {tab!=='bxh' && tab!=='fund' && (
      <div className="seg-wrap">
        <div className="seg">
          <button className={`seg-btn${matchSeg==='Đôi'?' active':''}`} onClick={()=>setMatchSeg('Đôi')}>👥 Chỉ Số Đánh Đôi</button>
          <button className={`seg-btn${matchSeg==='Đơn'?' active':''}`} onClick={()=>setMatchSeg('Đơn')}>🧍 Chỉ Số Đánh Đơn</button>
        </div>
      </div>
    )}

    <div className="main">
      {tab==='dashboard' && <Dashboard matches={matches.filter(m=>matchSeg==='Tất cả'||m.type===matchSeg)} myElo={myElo} onAdd={openAdd} sessions={sessions} members={members} players={players} onGoBadges={()=>setTab('bxh')}/>}
      {tab==='matches'   && <MatchesTab matches={matches} players={players} myElo={myElo} onAdd={openAdd} onDelete={guardedDeleteMatch} onEditMatch={guardedEditMatch}/>}
      {tab==='bxh'       && <LeaderboardTab players={players} matches={matches} members={members} onAddPlayer={guardedAddPlayer} onDeletePlayer={guardedDeletePlayer} onRenamePlayer={guardedRenameEverywhere} onViewHistory={goToPlayerHistory} isAdmin={isAdmin}/>}
      {tab==='playerHistory' && (
        players.find(p=>p.id===historyPlayerId)
          ? <PlayerHistoryPage player={players.find(p=>p.id===historyPlayerId)} players={players} matches={matches} onBack={()=>setTab(prevTab||'bxh')} onEditMatch={guardedEditMatch} onDeleteMatch={guardedDeleteMatch} onUpdateAvatar={guardedUpdateAvatar} onResyncStats={guardedResyncStats} onViewHistory={goToPlayerHistory}/>
          : <div style={{textAlign:'center',padding:'40px',color:'var(--muted)'}}>Không tìm thấy người chơi. <button onClick={()=>setTab('bxh')} style={{marginLeft:'8px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--text)',padding:'6px 12px',fontSize:'12px',cursor:'pointer'}}>Về BXH</button></div>
      )}
      {tab==='sokeo'     && <SoKeoTab players={players} matches={matches}/>}
      {tab==='fund'      && <FundTab players={players} setPlayers={setPlayers} sessions={sessions} setSessions={setSessions} members={members} setMembers={setMembers} matches={matches} setMatches={setMatches} onRenameMember={guardedRenameEverywhere} showToast={showToast} onTrashAdd={trashAdd} isAdmin={isAdmin} bankInfo={bankInfo} setBankInfo={setBankInfo} clubName={bannerTitle}/>}
    </div>

    {showAdd && <AddMatchModal players={players} sessions={sessions} onClose={()=>setShowAdd(false)} onSave={addMatch}/>}
    {confirmId && <ConfirmModal
      msg="Bạn có chắc muốn xóa trận này không? Công Đức sẽ được hoàn lại."
      onConfirm={()=>deleteMatch(confirmId)}
      onClose={()=>setConfirmId(null)}
    />}
    {toast && <Toast msg={toast} onClose={()=>setToast(null)}/>}
    {showPin && <PinModal onConfirm={handlePinConfirm} onClose={()=>{setShowPin(false); pendingAction.current=null;}}/>}
    {showTrash && <TrashModal
      trash={trash}
      onClose={()=>setShowTrash(false)}
      onRestorePlayer={guardedTrashRestorePlayer}
      onRestoreMember={guardedTrashRestoreMember}
      onRestoreSession={guardedTrashRestoreSession}
      onRestoreMatch={guardedTrashRestoreMatch}
      onPurge={guardedTrashPurgeForever}
    />}

    {/* Mobile bottom nav — 2 tabs · FAB · 2 tabs */}
    <nav className="mobile-nav">
      {TABS.slice(0,2).map(t=>(
        <button key={t.id} className={`mobile-nav-tab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>
          <span className="mni">{t.icon}</span>
          <span>{t.label}</span>
        </button>
      ))}
      <button className="mobile-nav-fab" onClick={openAdd} title="Ghi trận đấu">
        <span>+</span>
      </button>
      {TABS.slice(2).map(t=>(
        <button key={t.id} className={`mobile-nav-tab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>
          <span className="mni">{t.icon}</span>
          <span>{t.label}</span>
        </button>
      ))}
    </nav>
  </>;
}

class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false,msg:''};}
  static getDerivedStateFromError(err){return {hasError:true,msg:(err&&err.message)||'Đã có lỗi xảy ra.'};}
  componentDidCatch(err,info){ try{console.error('App crash:',err,info);}catch(e){} }
  render(){
    if(this.state.hasError){
      return (
        <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'12px',padding:'24px',textAlign:'center',fontFamily:'Nunito,sans-serif',background:'#f4f5f7'}}>
          <div style={{fontSize:'40px'}}>⚠️</div>
          <div style={{fontSize:'16px',fontWeight:700,color:'#1a1d24'}}>Ứng dụng gặp lỗi khi hiển thị</div>
          <div style={{fontSize:'13px',color:'#8a909c',maxWidth:'420px'}}>{this.state.msg}</div>
          <button onClick={()=>window.location.reload()} style={{marginTop:'8px',background:'#22c55e',color:'#fff',border:'none',borderRadius:'8px',padding:'10px 20px',fontSize:'14px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>Tải lại trang</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.render(<ErrorBoundary><App/></ErrorBoundary>, document.getElementById('root'));
</script>

<script>
// Đăng ký Service Worker để app chạy như PWA (cài lên màn hình chính, mở nhanh, đỡ trắng màn hình khi mạng chập chờn)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
