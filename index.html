            <select className="fi" value={h2hB} onChange={e=>setH2hB(e.target.value)}>
              <option value="">-- Chọn --</option>
              {players.map(p=><option key={p.id}>{p.name}</option>)}
            </select>
          </div>
        </div>
      </div>

      {h2hData && h2hA && h2hB && h2hA!==h2hB && (
        <>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'16px'}}>
            <div style={{background:'var(--green-bg)',border:'1px solid var(--green)',borderRadius:'12px',padding:'16px',textAlign:'center'}}>
              <div style={{fontSize:'11px',color:'var(--green)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.7px',marginBottom:'6px'}}>{h2hA}</div>
              <div style={{fontFamily:'Quicksand',fontSize:'36px',fontWeight:800,color:'var(--green)'}}>{h2hData.wA}</div>
              <div style={{fontSize:'11px',color:'var(--muted)'}}>trận thắng</div>
            </div>
            <div style={{background:'var(--red-bg)',border:'1px solid var(--red)',borderRadius:'12px',padding:'16px',textAlign:'center'}}>
              <div style={{fontSize:'11px',color:'var(--red)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.7px',marginBottom:'6px'}}>{h2hB}</div>
              <div style={{fontFamily:'Quicksand',fontSize:'36px',fontWeight:800,color:'var(--red)'}}>{h2hData.wB}</div>
              <div style={{fontSize:'11px',color:'var(--muted)'}}>trận thắng</div>
            </div>
          </div>
          <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'12px',marginBottom:'8px',textAlign:'center'}}>
            <span style={{fontSize:'13px',color:'var(--muted)'}}>Tổng {h2hData.matches.length} trận đã gặp nhau</span>
            {h2hData.matches.length>0 && <span style={{marginLeft:'12px',fontWeight:700,color:h2hData.wA>h2hData.wB?'var(--green)':h2hData.wA<h2hData.wB?'var(--red)':'var(--yellow)'}}>
              {h2hData.wA>h2hData.wB?`${h2hA} đang dẫn`:h2hData.wA<h2hData.wB?`${h2hB} đang dẫn`:'Hoà bằng nhau'}
            </span>}
          </div>
          {h2hData.matches.length===0&&<div style={{textAlign:'center',padding:'20px',color:'var(--muted)'}}>Chưa có trận nào giữa 2 người này</div>}
          <div className="match-list">
            {h2hData.matches.map(m=>(
              <div className="match-item" key={m.id}>
                <div className={`result-badge rb-${(m.team1Players||[]).includes(h2hA)?m.result:m.result==='W'?'L':'W'}`}>
                  {(m.team1Players||[]).includes(h2hA)?m.result:m.result==='W'?'L':'W'}
                </div>
                <div>
                  <div className="m-vs">{m.myTeam} vs {m.oppTeam}</div>
                  <div className="m-meta"><span>{m.date}</span><span>{m.type}</span></div>
                </div>
                <div>
                  <div className="m-score" style={{color:m.result==='W'?'var(--green)':'var(--red)'}}>{m.score1}–{m.score2}</div>
                </div>
                <div/>
              </div>
            ))}
          </div>
        </>
      )}
      {(!h2hA||!h2hB||h2hA===h2hB)&&<div style={{textAlign:'center',padding:'32px',color:'var(--muted)'}}>Chọn 2 người chơi khác nhau để xem lịch sử đối đầu</div>}
    </>}
  </>;
}

/* ─── SO KEO TAB ─────────────────────────────────────────── */

function SoKeoTab({players, matches}){
  const [mode,setMode]=useState('doi'); // 'don' | 'doi'
  const [mainTab,setMainTab]=useState('sokeo'); // 'sokeo' | 'partner' 
  // Đơn
  const [pA,setPa]=useState('');
  const [pB,setPb]=useState('');
  // Đôi
  const [d1a,setD1a]=useState('');
  const [d1b,setD1b]=useState('');
  const [d2a,setD2a]=useState('');
  const [d2b,setD2b]=useState('');
  // Partner analysis
  const [partnerFor,setPartnerFor]=useState('');
  // H2H expanded
  const [h2hExpanded,setH2hExpanded]=useState(false);

  const pOpts=players.map(p=>p.name);
  const sel=(val,fn,exclude=[])=>(
    <select className="fi" value={val} onChange={e=>fn(e.target.value)}>
      <option value="">-- Chọn --</option>
      {pOpts.filter(n=>!exclude.includes(n)).map(n=><option key={n}>{n}</option>)}
    </select>
  );

  const analysis = useMemo(()=>{
    if(mode==='don'){
      const pa=players.find(p=>p.name===pA), pb=players.find(p=>p.name===pB);
      if(!pa||!pb||pa===pb) return null;
      const diff=pa.elo-pb.elo;
      const winPctA=Math.round(1/(1+Math.pow(10,-diff/400))*100);
      // handicap: số quả chấp (mỗi 50 ELO ~ 1 quả chấp trong pickleball)
      const handicap=Math.round(Math.abs(diff)/60);
      const stronger=diff>0?pa:pb;
      const weaker=diff>0?pb:pa;
      // h2h
      const h2h=matches.filter(m=>{
        return (m.team1Players||[]).includes(pa.name)&&(m.team2Players||[]).includes(pb.name)||
               (m.team1Players||[]).includes(pb.name)&&(m.team2Players||[]).includes(pa.name);
      });
      let wA=0,wB=0;
      h2h.forEach(m=>{
        const aInT1=(m.team1Players||[]).includes(pa.name);
        if(aInT1&&m.result==='W') wA++;
        else if(!aInT1&&m.result==='L') wA++;
        else wB++;
      });
      return {type:'don',pa,pb,diff:Math.abs(diff),winPctA,winPctB:100-winPctA,handicap,stronger,weaker,h2h,wA,wB,
        quality:Math.max(0,100-Math.round(Math.abs(diff)/8))};
    } else {
      const pa=players.find(p=>p.name===d1a),pb=players.find(p=>p.name===d1b);
      const pc=players.find(p=>p.name===d2a),pd=players.find(p=>p.name===d2b);
      if(!pa||!pc) return null;
      const elo1=Math.round((pa.elo+(pb?.elo||pa.elo))/2);
      const elo2=Math.round((pc.elo+(pd?.elo||pc.elo))/2);
      const diff=elo1-elo2;
      const winPct1=Math.round(1/(1+Math.pow(10,-diff/400))*100);
      const handicap=Math.round(Math.abs(diff)/60);
      const t1=[pa,pb].filter(Boolean), t2=[pc,pd].filter(Boolean);
      const stronger=diff>0?t1.map(p=>p.name).join(' & '):t2.map(p=>p.name).join(' & ');
      const weaker=diff>0?t2.map(p=>p.name).join(' & '):t1.map(p=>p.name).join(' & ');
      // h2h for team
      const h2h=matches.filter(m=>{
        const t1p=m.team1Players||[], t2p=m.team2Players||[];
        return (t1p.includes(d1a)||t1p.includes(d1b||'__'))&&(t2p.includes(d2a)||t2p.includes(d2b||'__'))||
               (t2p.includes(d1a)||t2p.includes(d1b||'__'))&&(t1p.includes(d2a)||t1p.includes(d2b||'__'));
      });
      return {type:'doi',t1,t2,elo1,elo2,diff:Math.abs(diff),winPct1,winPct2:100-winPct1,handicap,stronger,weaker,h2h,
        quality:Math.max(0,100-Math.round(Math.abs(diff)/8))};
    }
  },[mode,pA,pB,d1a,d1b,d2a,d2b,players,matches]);

  const qColor=q=>q>=75?'var(--green)':q>=50?'var(--yellow)':'var(--red)';

  // Partner analysis: tính tỷ lệ thắng khi ghép đôi với từng người
  const partnerStats = useMemo(()=>{
    if(!partnerFor) return [];
    return players.filter(p=>p.name!==partnerFor).map(partner=>{
      const paired = matches.filter(m=>{
        if(m.type!=='Đôi') return false;
        const t1=m.team1Players||[], t2=m.team2Players||[];
        return (t1.includes(partnerFor)&&t1.includes(partner.name))||
               (t2.includes(partnerFor)&&t2.includes(partner.name));
      });
      let wins=0;
      paired.forEach(m=>{
        const inT1=(m.team1Players||[]).includes(partnerFor);
        if((inT1&&m.result==='W')||(!inT1&&m.result==='L')) wins++;
      });
      const total=paired.length;
      const wr=total>0?Math.round(wins/total*100):null;
      return {name:partner.name, color:partner.color, avatar:partner.avatar, elo:partner.elo, wins, total, wr, matches:paired};
    }).sort((a,b)=>{
      // Ưu tiên: có trận nhiều nhất trước, sau đó tỷ lệ thắng
      if(b.total!==a.total) return b.total-a.total;
      return (b.wr||0)-(a.wr||0);
    });
  },[partnerFor,players,matches]);

  return <>
    <div className="section-title" style={{marginBottom:'16px'}}>⚔️ So Kèo & Đánh Giá Chấp</div>

    {/* Main tab toggle */}
    <div style={{display:'flex',gap:'6px',marginBottom:'16px'}}>
      {[['sokeo','⚔️ So Kèo'],['partner','🤝 Người Ăn Ý']].map(([id,lb])=>(
        <button key={id} onClick={()=>setMainTab(id)} style={{flex:1,padding:'10px',borderRadius:'10px',border:'1px solid',fontSize:'13px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:600,transition:'.15s',
          borderColor:mainTab===id?'var(--purple)':'var(--border)',
          background:mainTab===id?'var(--purple-bg)':'var(--surface)',
          color:mainTab===id?'var(--purple)':'var(--muted)'}}>
          {lb}
        </button>
      ))}
    </div>

    {/* ── PARTNER TAB ── */}
    {mainTab==='partner' && <>
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',padding:'16px',marginBottom:'16px'}}>
        <div className="fl" style={{marginBottom:'8px'}}>🎯 Chọn người muốn xem</div>
        <select className="fi" value={partnerFor} onChange={e=>setPartnerFor(e.target.value)}>
          <option value="">-- Chọn người chơi --</option>
          {players.map(p=><option key={p.name} value={p.name}>{p.name}</option>)}
        </select>
      </div>

      {partnerFor && partnerStats.length>0 && (
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',overflow:'hidden',marginBottom:'16px'}}>
          <div style={{padding:'12px 16px',background:'var(--bg3)',borderBottom:'1px solid var(--border)',fontSize:'12px',color:'var(--muted)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.6px'}}>
            🤝 Khi {partnerFor.split(' ').slice(-2).join(' ')} đánh đôi cùng...
          </div>
          {partnerStats.map((p,i)=>{
            const hasData=p.total>0;
            const wrColor=!hasData?'var(--muted)':p.wr>=60?'var(--green)':p.wr>=40?'var(--yellow)':'var(--red)';
            return (
              <div key={p.name} style={{padding:'13px 16px',borderBottom:i<partnerStats.length-1?'1px solid var(--border)':'none',display:'flex',alignItems:'center',gap:'12px'}}>
                {/* Avatar */}
                <div style={{width:38,height:38,borderRadius:'50%',background:p.avatar?'transparent':p.color+'22',color:p.color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:'13px',flexShrink:0,overflow:'hidden'}}>
                  {p.avatar?<img src={p.avatar} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:p.name.split(' ').slice(-2).map(w=>w[0]).join('').toUpperCase()}
                </div>
                {/* Name + bar */}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:'14px',marginBottom:'5px'}}>{p.name}</div>
                  {hasData ? (
                    <>
                      <div style={{height:'5px',background:'var(--bg3)',borderRadius:'3px',overflow:'hidden',marginBottom:'3px'}}>
                        <div style={{height:'100%',width:p.wr+'%',background:wrColor,borderRadius:'3px',transition:'width .4s ease'}}/>
                      </div>
                      <div style={{fontSize:'11px',color:'var(--muted)'}}>{p.wins} thắng / {p.total} trận</div>
                    </>
                  ) : (
                    <div style={{fontSize:'12px',color:'var(--muted)'}}>Chưa đánh đôi cùng nhau</div>
                  )}
                </div>
                {/* WR badge */}
                <div style={{textAlign:'right',flexShrink:0}}>
                  {hasData ? (
                    <>
                      <div style={{fontFamily:'Quicksand,sans-serif',fontSize:'22px',fontWeight:800,color:wrColor,lineHeight:1}}>{p.wr}%</div>
                      <div style={{fontSize:'10px',color:'var(--muted)',marginTop:'2px'}}>thắng</div>
                    </>
                  ) : (
                    <div style={{fontSize:'20px'}}>—</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {partnerFor && partnerStats.every(p=>p.total===0) && (
        <div style={{textAlign:'center',padding:'32px',color:'var(--muted)',background:'var(--surface)',borderRadius:'14px',border:'1px solid var(--border)'}}>
          <div style={{fontSize:'32px',marginBottom:'8px'}}>🏓</div>
          <div>Chưa có trận đôi nào được ghi lại cho {partnerFor}</div>
        </div>
      )}
    </>}

    {/* ── SO KÈO TAB ── */}
    {mainTab==='sokeo' && <>
    {/* Mode */}
    <div style={{display:'flex',gap:'6px',marginBottom:'16px'}}>
      {[['don','🧍 Đơn'],['doi','👥 Đôi']].map(([id,lb])=>(
        <button key={id} onClick={()=>setMode(id)} style={{flex:1,padding:'10px',borderRadius:'10px',border:'1px solid',fontSize:'13px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:600,transition:'.15s',
          borderColor:mode===id?'var(--purple)':'var(--border)',
          background:mode===id?'var(--purple-bg)':'var(--surface)',
          color:mode===id?'var(--purple)':'var(--muted)'}}>
          {lb}
        </button>
      ))}
    </div>

    {/* Player selection */}
    <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',padding:'16px',marginBottom:'16px'}}>
      {mode==='don'?(
        <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:'12px',alignItems:'center'}}>
          <div>
            <div className="fl" style={{marginBottom:'6px',color:'var(--green)'}}>⚡ Người A</div>
            {sel(pA,setPa,[pB])}
            {pA&&<div style={{textAlign:'center',marginTop:'6px',fontFamily:'Quicksand,sans-serif',fontWeight:700,color:'var(--green)',fontSize:'15px'}}>{players.find(p=>p.name===pA)?.elo||''} ELO</div>}
          </div>
          <div style={{textAlign:'center',fontFamily:'Quicksand',fontWeight:800,color:'var(--muted)',fontSize:'16px'}}>VS</div>
          <div>
            <div className="fl" style={{marginBottom:'6px',color:'var(--red)'}}>🔥 Người B</div>
            {sel(pB,setPb,[pA])}
            {pB&&<div style={{textAlign:'center',marginTop:'6px',fontFamily:'Quicksand,sans-serif',fontWeight:700,color:'var(--red)',fontSize:'15px'}}>{players.find(p=>p.name===pB)?.elo||''} ELO</div>}
          </div>
        </div>
      ):(
        <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:'12px',alignItems:'start'}}>
          <div>
            <div className="fl" style={{marginBottom:'8px',textAlign:'center',color:'var(--green)'}}>⚡ Cặp 1</div>
            <div style={{marginBottom:'8px'}}><div className="fl" style={{marginBottom:'4px'}}>Người 1</div>{sel(d1a,setD1a,[d1b,d2a,d2b])}</div>
            <div><div className="fl" style={{marginBottom:'4px'}}>Người 2</div>{sel(d1b,setD1b,[d1a,d2a,d2b])}</div>
            {(d1a||d1b)&&<div style={{textAlign:'center',marginTop:'8px',fontFamily:'Quicksand,sans-serif',fontWeight:700,color:'var(--green)',fontSize:'13px'}}>
              TB: {analysis?.elo1||'—'} ELO
            </div>}
          </div>
          <div style={{textAlign:'center',fontFamily:'Quicksand',fontWeight:800,color:'var(--muted)',fontSize:'16px',paddingTop:'28px'}}>VS</div>
          <div>
            <div className="fl" style={{marginBottom:'8px',textAlign:'center',color:'var(--red)'}}>🔥 Cặp 2</div>
            <div style={{marginBottom:'8px'}}><div className="fl" style={{marginBottom:'4px'}}>Người 1</div>{sel(d2a,setD2a,[d1a,d1b,d2b])}</div>
            <div><div className="fl" style={{marginBottom:'4px'}}>Người 2</div>{sel(d2b,setD2b,[d1a,d1b,d2a])}</div>
            {(d2a||d2b)&&<div style={{textAlign:'center',marginTop:'8px',fontFamily:'Quicksand,sans-serif',fontWeight:700,color:'var(--red)',fontSize:'13px'}}>
              TB: {analysis?.elo2||'—'} ELO
            </div>}
          </div>
        </div>
      )}
    </div>

    {players.length===0&&(
      <div style={{textAlign:'center',padding:'40px',color:'var(--muted)',background:'var(--surface)',borderRadius:'14px',border:'1px solid var(--border)'}}>
        <div style={{fontSize:'32px',marginBottom:'8px'}}>👥</div>
        <div>Chưa có người chơi nào trong hệ thống.</div>
        <div style={{fontSize:'12px',marginTop:'4px'}}>Vào tab BXH để thêm người chơi trước.</div>
      </div>
    )}

    {/* Analysis card */}
    {analysis && (
      <>
        {/* Match quality */}
        <div style={{background:'linear-gradient(135deg,#1a1040,#2d1b69)',border:'1px solid var(--purple)',borderRadius:'14px',padding:'18px',marginBottom:'12px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
            <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
              <span style={{fontSize:'20px'}}>🤖</span>
              <span style={{fontWeight:700,fontSize:'14px',color:'#c4b5fd'}}>NHẬN ĐỊNH TRẬN ĐẤU</span>
            </div>
            <span style={{background:'rgba(0,0,0,.3)',borderRadius:'20px',padding:'3px 10px',fontSize:'11px',fontWeight:700,color:qColor(analysis.quality)}}>
              MATCH QUALITY: {analysis.quality}/100
            </span>
          </div>

          {/* Handicap box */}
          <div style={{background:'rgba(0,0,0,.35)',borderRadius:'10px',padding:'14px',marginBottom:'12px'}}>
            {analysis.diff===0?(
              <div style={{textAlign:'center',color:'var(--green)',fontWeight:700,fontSize:'15px'}}>⚖️ Hai bên cân bằng — Trận thẳng không cần chấp</div>
            ):(
              <>
                <div style={{color:'#a78bfa',fontWeight:600,fontSize:'13px',marginBottom:'8px'}}>🛡️ Kèo Chấp Đề Xuất</div>
                <div style={{fontSize:'16px',fontWeight:800,color:'#fff',fontFamily:'Quicksand,sans-serif'}}>
                  {analysis.stronger} chấp {analysis.weaker} {analysis.handicap} quả
                </div>
                <div style={{fontSize:'12px',color:'#a78bfa',marginTop:'6px'}}>
                  Chênh lệch ELO: {analysis.diff} điểm (~{analysis.handicap} quả mỗi game)
                </div>
              </>
            )}
          </div>

          {/* Win probability bar */}
          <div style={{marginBottom:'8px'}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:'12px',color:'#a78bfa',marginBottom:'6px'}}>
              <span>{mode==='don'?analysis.pa?.name:analysis.t1?.map(p=>p.name).join(' & ')}</span>
              <span>{mode==='don'?analysis.pb?.name:analysis.t2?.map(p=>p.name).join(' & ')}</span>
            </div>
            <div style={{background:'rgba(0,0,0,.3)',borderRadius:'20px',height:'10px',overflow:'hidden'}}>
              <div style={{height:'100%',background:'linear-gradient(90deg,#22c55e,#3b82f6)',borderRadius:'20px',
                width:`${mode==='don'?analysis.winPctA:analysis.winPct1}%`,transition:'width .5s ease'}}/>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:'13px',fontWeight:700,marginTop:'5px'}}>
              <span style={{color:'var(--green)'}}>{mode==='don'?analysis.winPctA:analysis.winPct1}%</span>
              <span style={{color:'var(--red)'}}>{mode==='don'?analysis.winPctB:analysis.winPct2}%</span>
            </div>
          </div>

          {/* Tips */}
          <div style={{borderTop:'1px solid rgba(167,139,250,.2)',paddingTop:'10px',fontSize:'12px',color:'#a78bfa',lineHeight:'1.6'}}>
            {analysis.diff===0&&'💡 Trận này cực kỳ căng — ai thắng đều xứng đáng.'}
            {analysis.diff>0&&analysis.diff<=80&&'💡 Chênh lệch nhỏ, trận đấu khó đoán. Không cần chấp nhiều.'}
            {analysis.diff>80&&analysis.diff<=200&&'💡 Chênh lệch vừa. Người mạnh hơn nên chấp để trận thêm hấp dẫn.'}
            {analysis.diff>200&&'⚠️ Chênh lệch lớn. Nên chấp hoặc ghép đội cân bằng hơn.'}
          </div>
        </div>

        {/* Head-to-head — expandable */}
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',overflow:'hidden',marginBottom:'12px'}}>
          {/* Header — click để toggle */}
          <div style={{padding:'13px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',cursor:analysis.h2h.length>0?'pointer':'default'}}
            onClick={()=>analysis.h2h.length>0&&setH2hExpanded(e=>!e)}>
            <div style={{fontSize:'12px',color:'var(--muted)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.6px'}}>
              ⏱ Lịch sử đối đầu ({analysis.h2h.length} trận)
            </div>
            {analysis.h2h.length>0&&<span style={{fontSize:'11px',color:'var(--purple)',fontWeight:600}}>{h2hExpanded?'▲ Thu gọn':'▼ Xem chi tiết'}</span>}
          </div>

          {/* Score summary */}
          {analysis.h2h.length>0&&mode==='don'&&(
            <div style={{display:'flex',gap:'8px',alignItems:'center',padding:'0 16px 13px'}}>
              <div style={{flex:1,textAlign:'center',background:'var(--green-bg)',borderRadius:'10px',padding:'10px'}}>
                <div style={{fontSize:'11px',color:'var(--green)',fontWeight:600,marginBottom:'2px'}}>{analysis.pa.name}</div>
                <div style={{fontFamily:'Quicksand,sans-serif',fontSize:'24px',fontWeight:800,color:'var(--green)'}}>{analysis.wA}</div>
              </div>
              <div style={{fontSize:'13px',color:'var(--muted)',fontWeight:700}}>VS</div>
              <div style={{flex:1,textAlign:'center',background:'var(--red-bg)',borderRadius:'10px',padding:'10px'}}>
                <div style={{fontSize:'11px',color:'var(--red)',fontWeight:600,marginBottom:'2px'}}>{analysis.pb.name}</div>
                <div style={{fontFamily:'Quicksand,sans-serif',fontSize:'24px',fontWeight:800,color:'var(--red)'}}>{analysis.wB}</div>
              </div>
            </div>
          )}
          {analysis.h2h.length>0&&mode==='doi'&&(
            <div style={{display:'flex',gap:'8px',alignItems:'center',padding:'0 16px 13px'}}>
              <div style={{flex:1,textAlign:'center',background:'var(--green-bg)',borderRadius:'10px',padding:'10px'}}>
                <div style={{fontSize:'11px',color:'var(--green)',fontWeight:600,marginBottom:'2px'}}>{analysis.t1.map(p=>p.name).join(' & ')}</div>
                <div style={{fontFamily:'Quicksand,sans-serif',fontSize:'24px',fontWeight:800,color:'var(--green)'}}>
                  {analysis.h2h.filter(m=>{const inT1=(m.team1Players||[]).includes(d1a);return (inT1&&m.result==='W')||(!inT1&&m.result==='L');}).length}
                </div>
              </div>
              <div style={{fontSize:'13px',color:'var(--muted)',fontWeight:700}}>VS</div>
              <div style={{flex:1,textAlign:'center',background:'var(--red-bg)',borderRadius:'10px',padding:'10px'}}>
                <div style={{fontSize:'11px',color:'var(--red)',fontWeight:600,marginBottom:'2px'}}>{analysis.t2.map(p=>p.name).join(' & ')}</div>
                <div style={{fontFamily:'Quicksand,sans-serif',fontSize:'24px',fontWeight:800,color:'var(--red)'}}>
                  {analysis.h2h.filter(m=>{const inT1=(m.team1Players||[]).includes(d1a);return (!inT1&&m.result==='W')||(inT1&&m.result==='L');}).length}
                </div>
              </div>
            </div>
          )}

          {analysis.h2h.length===0&&(
            <div style={{textAlign:'center',padding:'14px',color:'var(--muted)',fontSize:'13px',borderTop:'1px solid var(--border)'}}>
              Chưa có lịch sử đối đầu giữa hai bên
            </div>
          )}

          {/* Chi tiết từng trận */}
          {h2hExpanded&&analysis.h2h.length>0&&(
            <div style={{borderTop:'1px solid var(--border)'}}>
              {analysis.h2h.map((m,i)=>{
                const refName=mode==='don'?pA:d1a;
                const inT1=(m.team1Players||[]).includes(refName);
                const myResult=inT1?m.result:(m.result==='W'?'L':'W');
                const myTeam=inT1?(m.team1Players||[]):(m.team2Players||[]);
                const oppTeam=inT1?(m.team2Players||[]):(m.team1Players||[]);
                return (
                  <div key={m.id||i} style={{padding:'11px 16px',borderBottom:i<analysis.h2h.length-1?'1px solid var(--border)':'none',display:'flex',alignItems:'center',gap:'10px'}}>
                    {/* W/L badge */}
                    <div style={{width:32,height:32,borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:800,flexShrink:0,
                      background:myResult==='W'?'var(--green-bg)':'var(--red-bg)',
                      color:myResult==='W'?'var(--green)':'var(--red)'}}>
                      {myResult}
                    </div>
                    {/* Teams */}
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:'13px',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                        {myTeam.join(' & ')} <span style={{color:'var(--muted)',fontWeight:400}}>vs</span> {oppTeam.join(' & ')}
                      </div>
                      <div style={{fontSize:'11px',color:'var(--muted)',marginTop:'2px',display:'flex',gap:'8px'}}>
                        <span>📅 {m.date}</span>
                        {m.type&&<span>· {m.type}</span>}
                      </div>
                    </div>
                    {/* Score */}
                    <div style={{textAlign:'right',flexShrink:0}}>
                      <div style={{fontFamily:'Quicksand,sans-serif',fontSize:'17px',fontWeight:700}}>{m.score||'—'}</div>
                      {m.eloChanges&&(()=>{
                        const myChange=m.eloChanges.find(e=>e.name===refName);
                        return myChange?<div style={{fontSize:'11px',fontWeight:600,color:myChange.delta>0?'var(--green)':'var(--red)'}}>{myChange.delta>0?'+':''}{myChange.delta} ELO</div>:null;
                      })()}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </>
    )}
    </>}
  </>;
}

/* ─── EDIT SESSION MODAL ─────────────────────────────────── */
function EditSessionModal({session,members,onClose,onSave}){
  const [date,setDate]=useState(session.date||'');
  const [total,setTotal]=useState(String(session.total||''));
  const [note,setNote]=useState(session.note||'');
  const [xeVeCount,setXeVeCount]=useState(String(session.xeVeCount||1));
  // attendees: copy from session, default all false if missing
  const initAtt=()=>{
    const obj={};
    members.forEach(m=>{ obj[m.name]=!!(session.attendees?.[m.name]); });
    return obj;
  };
  const [attendees,setAttendees]=useState(initAtt);
  const toggle=name=>setAttendees(p=>({...p,[name]:!p[name]}));

  const attending=Object.entries(attendees).filter(([,v])=>v).map(([k])=>k);
  const xeVeOn=attending.includes('Xé Vé');
  const xeVeCnt=xeVeOn?Math.max(1,parseInt(xeVeCount)||1):0;
  const others=attending.filter(n=>n!=='Xé Vé').length;
  const shares=others+xeVeCnt;
  const perPerson=shares>0&&total?Math.round(parseInt(total)/shares):0;

  const save=()=>{
    if(!date||!total) return;
    onSave({
      ...session,
      date,
      total:parseInt(total),
      note,
      attendees,
      players:attending.length,
      xeVeCount:xeVeOn?xeVeCnt:undefined,
    });
  };

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:480}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">✏️ Sửa buổi chơi</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>

        <div className="form-grid" style={{marginBottom:'12px'}}>
          <div className="fg"><label className="fl">📅 Ngày</label><DateInput value={date} onChange={setDate}/></div>
          <div className="fg"><label className="fl">Tổng tiền (VNĐ)</label><input className="fi" type="number" value={total} onChange={e=>setTotal(e.target.value)} placeholder="380000"/></div>
        </div>

        {/* Xé Vé count */}
        {xeVeOn&&(
          <div style={{background:'var(--bg3)',borderRadius:'10px',padding:'10px 12px',marginBottom:'10px',border:'1px solid var(--border)'}}>
            <div style={{fontSize:'12px',color:'var(--yellow)',fontWeight:600,marginBottom:'8px'}}>🎫 Xé vé tùy biến</div>
            <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
              <label className="fl" style={{whiteSpace:'nowrap'}}>Số người xé vé:</label>
              <input className="fi" type="number" min="1" value={xeVeCount} onChange={e=>setXeVeCount(e.target.value)} placeholder="2" style={{width:'70px',padding:'5px 8px',fontSize:'13px'}}/>
            </div>
          </div>
        )}

        {/* Attendees */}
        <div style={{marginBottom:'10px'}}>
          <div className="fl" style={{marginBottom:'8px'}}>Ai đi buổi này? ({attending.length} người)</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
            {members.map(m=>{
              const on=!!attendees[m.name];
              return(
                <button key={m.name} onClick={()=>toggle(m.name)} style={{
                  padding:'5px 12px',borderRadius:'20px',border:'1px solid',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',transition:'.15s',
                  borderColor:on?m.color:'var(--border)',
                  background:on?m.color+'33':'transparent',
                  color:on?m.color:'var(--muted)',fontWeight:on?600:400
                }}>{m.name}</button>
              );
            })}
          </div>
          {total&&attending.length>0&&(
            <div style={{marginTop:'8px',fontSize:'12px',color:'var(--green)',fontWeight:600}}>
              Mỗi người: {fmt(perPerson)}{xeVeOn&&xeVeCnt>1?` · Nhóm Xé Vé (${xeVeCnt} người) tổng: ${fmt(perPerson*xeVeCnt)}`:''}
            </div>
          )}
        </div>

        <div className="fg" style={{marginBottom:'12px'}}>
          <label className="fl">📝 Ghi chú</label>
          <input className="fi" value={note} onChange={e=>setNote(e.target.value)} placeholder="VD: Sân Hoàng Anh 200k, cầu 150k..."/>
        </div>

        <div className="form-actions">
          <button className="btn-cancel" onClick={onClose}>Hủy</button>
          <button className="btn-save" onClick={save}>💾 Lưu thay đổi</button>
        </div>
      </div>
    </div>
  );
}

/* ─── FUND TAB ───────────────────────────────────────────── */
function FundTab({players,setPlayers,sessions,setSessions,members,setMembers,matches,setMatches}){
  const memberNames = FUND_MEMBERS.map(m=>m.name);
  // Data được load/save bởi App cha — FundTab chỉ dùng trực tiếp
  const [showAdd,setShowAdd]=useState(false);
  const [showAddMember,setShowAddMember]=useState(false);
  const [newMember,setNewMember]=useState({name:'',paid:''});
  const [expandedSession,setExpandedSession]=useState(null);
  const [depositTarget,setDepositTarget]=useState(null); // {name, idx}
  const [depositAmt,setDepositAmt]=useState('');
  const [depositDate,setDepositDate]=useState('');
  const [f,setF]=useState({date:'',total:'',attendees:{},note:''});
  const sf=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const [renamingMember,setRenamingMember]=useState(null); // idx
  const [renameVal,setRenameVal]=useState('');
  const [confirmDeleteSession,setConfirmDeleteSession]=useState(null);
  const [confirmDeleteMember,setConfirmDeleteMember]=useState(null);
  const [editingSession,setEditingSession]=useState(null);
  const [expandedMember,setExpandedMember]=useState(null); // idx đang mở chi tiết
  const [memberSearch,setMemberSearch]=useState('');
  const [onlyDebt,setOnlyDebt]=useState(false);

  // computed per member: how much they owe from sessions
  const memberSpent = useMemo(()=>{
    const spent = {};
    members.forEach(m=>{ spent[m.name]=0; });
    sessions.forEach(s=>{
      if(s.attendees && Object.keys(s.attendees).length>0){
        const attending = Object.entries(s.attendees).filter(([,v])=>v).map(([k])=>k);
        const share = shareAmount(s);
        attending.forEach(name=>{
          if(spent[name]===undefined) return;
          if(name==='Xé Vé'){
            const cnt=Math.max(1, parseInt(s.xeVeCount)||1);
            spent[name]+=share*cnt;
          } else {
            spent[name]+=share;
          }
        });
      } else {
        // legacy: split equally
        const share = s.players>0 ? Math.round(s.total/s.players) : 0;
        members.forEach(m=>{ spent[m.name]+=share; });
      }
    });
    return spent;
  },[sessions,members]);

  const totalFund=members.reduce((a,m)=>a+m.paid,0);
  const totalSpent=sessions.reduce((a,s)=>a+s.total,0);
  const remaining=totalFund-totalSpent;

  const toggleAttendee=(name)=>{
    setF(p=>({...p,attendees:{...p.attendees,[name]:!p.attendees[name]}}));
  };

  const addSession=()=>{
    if(!f.date||!f.total) return;
    const att = f.attendees;
    const attending = Object.entries(att).filter(([,v])=>v).map(([k])=>k);
    setSessions(p=>[...p,{id:Date.now(),date:f.date,players:attending.length,total:parseInt(f.total),attendees:{...att},xeVeCount:att['Xé Vé']?(parseInt(f.xeVeCount)||1):0,note:f.note||''}]);
    setF({date:'',total:'',attendees:{},note:''});
    setShowAdd(false);
  };

  const deleteSession=(id)=>{
    setSessions(p=>p.filter(s=>s.id!==id));
    setConfirmDeleteSession(null);
  };

  const addMember=()=>{
    if(!newMember.name||!newMember.paid) return;
    setMembers(p=>{
      const usedColors=p.map(m=>m.color);
      const nextColor=COLORS.find(c=>!usedColors.includes(c))||COLORS[p.length%COLORS.length];
      return [...p,{name:newMember.name,paid:parseInt(newMember.paid),color:nextColor,deposits:[{date:'Ban đầu',amount:parseInt(newMember.paid)}]}];
    });
    setNewMember({name:'',paid:''});
    setShowAddMember(false);
  };

  const deleteMember=(idx)=>{
    setMembers(p=>p.filter((_,i)=>i!==idx));
    setConfirmDeleteMember(null);
  };

  const renameMember=(idx,newName)=>{
    const oldName=members[idx].name;
    if(!newName||newName===oldName){ setRenamingMember(null);setRenameVal(''); return; }
    setMembers(p=>p.map((m,i)=>i===idx?{...m,name:newName}:m));
    // đồng bộ tên trong players (BXH)
    if(setPlayers) setPlayers(p=>p.map(pl=>pl.name===oldName?{...pl,name:newName}:pl));
    // đồng bộ tên trong attendees của tất cả buổi chơi đã lưu (tránh mất dữ liệu chi tiêu)
    setSessions(p=>p.map(s=>{
      if(!s.attendees || !(oldName in s.attendees)) return s;
      const {[oldName]:val, ...rest}=s.attendees;
      return {...s, attendees:{...rest, [newName]:val}};
    }));
    // đồng bộ tên trong toàn bộ lịch sử đấu (myTeam/oppTeam là chuỗi "A & B", team1Players/team2Players là mảng tên, eloChanges là mảng {name,delta})
    if(setMatches) setMatches(p=>p.map(mt=>{
      const swapTeamStr=str=>!str?str:str.split(' & ').map(n=>n===oldName?newName:n).join(' & ');
      const swapArr=arr=>(arr||[]).map(n=>n===oldName?newName:n);
      const swapElo=arr=>(arr||[]).map(e=>e.name===oldName?{...e,name:newName}:e);
      const usesOldName=mt.myTeam===oldName||mt.oppTeam===oldName||
        (mt.myTeam||'').split(' & ').includes(oldName)||(mt.oppTeam||'').split(' & ').includes(oldName)||
        (mt.team1Players||[]).includes(oldName)||(mt.team2Players||[]).includes(oldName)||
        (mt.eloChanges||[]).some(e=>e.name===oldName);
      if(!usesOldName) return mt;
      return {...mt,
        myTeam:swapTeamStr(mt.myTeam),
        oppTeam:swapTeamStr(mt.oppTeam),
        team1Players:swapArr(mt.team1Players),
        team2Players:swapArr(mt.team2Players),
        eloChanges:swapElo(mt.eloChanges)
      };
    }));
    setRenamingMember(null);setRenameVal('');
  };

  const addDeposit=()=>{
    if(!depositTarget||!depositAmt) return;
    const amt=parseInt(depositAmt);
    setMembers(p=>p.map((m,i)=>i===depositTarget.idx?{...m,paid:m.paid+amt,deposits:[...(m.deposits||[]),{date:depositDate||'—',amount:amt}]}:m));
    setDepositTarget(null);setDepositAmt('');setDepositDate('');
  };

  // Month filter
  const [monthFund,setMonthFund]=useState('Tất cả');
  const fundMonths=useMemo(()=>{
    const s=new Set();
    sessions.forEach(s2=>{const p=s2.date.split(/[\/\-]/);if(p.length>=2)s.add(p[1]);});
    return ['Tất cả',...[...s].sort((a,b)=>parseInt(a)-parseInt(b)).map(m=>`Tháng ${m}`)];
  },[sessions]);

  const filteredSessions=useMemo(()=>{
    if(monthFund==='Tất cả') return sessions;
    const mon=monthFund.replace('Tháng ','');
    return sessions.filter(s2=>{const p=s2.date.split(/[\/\-]/);return p.length>=2&&p[1]===mon;});
  },[sessions,monthFund]);

  const monthTotal=filteredSessions.reduce((a,s2)=>a+s2.total,0);

  // Export fund CSV
  const exportFundCSV=()=>{
    const rows=[['Ngày','Số người','Tổng','Mỗi người','Người tham dự']];
    [...sessions].reverse().forEach(s2=>{
      const att=s2.attendees?Object.entries(s2.attendees).filter(([,v])=>v).map(([k])=>k):[];
      const per=att.length>0?shareAmount(s2):(s2.players>0?Math.round(s2.total/s2.players):0);
      rows.push([s2.date,s2.players,s2.total,per,att.join(' | ')]);
    });
    const mRows=[['Tên','Đã đóng','Đã chi','Còn lại']];
    members.forEach(m2=>{
      const sp=memberSpent[m2.name]||0;
      mRows.push([m2.name,m2.paid,sp,m2.paid-sp]);
    });
    const toCSV=rs=>rs.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
    const csv='=== LỊCH SỬ BUỔI CHƠI ===\n'+toCSV(rows)+'\n\n=== TÌNH TRẠNG THÀNH VIÊN ===\n'+toCSV(mRows);
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='picklepro_quy.csv';a.click();
    URL.revokeObjectURL(url);
  };

  // âm quỹ members
  const amQuy=members.filter(m2=>(m2.paid-(memberSpent[m2.name]||0))<0);

  return <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}}>
      <div className="section-title">💰 Quỹ CLB</div>
      <button onClick={exportFundCSV} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--muted)',padding:'6px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',display:'flex',alignItems:'center',gap:'5px'}}>📥 Xuất Excel</button>
    </div>

    <div className="stats-grid" style={{marginBottom:'16px'}}>
      <div className="stat-card sc-green"><div className="sc-label">Tổng đã đóng</div><div className="sc-val" style={{fontSize:'20px'}}>{fmt(totalFund)}</div></div>
      <div className="stat-card sc-red"><div className="sc-label">Đã chi</div><div className="sc-val" style={{fontSize:'20px'}}>{fmt(totalSpent)}</div></div>
      <div className="stat-card sc-purple" style={{gridColumn:'span 2'}}><div className="sc-label">Còn lại trong quỹ</div><div className="sc-val" style={{fontSize:'22px',color:'var(--purple)'}}>{fmt(remaining)}</div></div>
    </div>

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
      <div className="section-title" style={{fontSize:'14px'}}>Tình trạng từng thành viên</div>
      <button onClick={()=>setShowAddMember(!showAddMember)} style={{background:'var(--surface)',border:'1px dashed var(--border2)',borderRadius:'8px',color:'var(--muted)',padding:'5px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>+ Thêm thành viên</button>
    </div>

    {showAddMember && (
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'14px',marginBottom:'12px'}}>
        <div className="form-grid">
          <div className="fg"><label className="fl">Tên</label><input className="fi" value={newMember.name} onChange={e=>setNewMember(p=>({...p,name:e.target.value}))} placeholder="Tên thành viên"/></div>
          <div className="fg"><label className="fl">Đã đóng (VNĐ)</label><input className="fi" type="number" value={newMember.paid} onChange={e=>setNewMember(p=>({...p,paid:e.target.value}))} placeholder="500000"/></div>
        </div>
        <div className="form-actions"><button className="btn-cancel" onClick={()=>setShowAddMember(false)}>Hủy</button><button className="btn-save" onClick={addMember}>Thêm</button></div>
      </div>
    )}

    {/* Tìm nhanh + lọc người còn nợ quỹ — hữu ích khi CLB đông thành viên */}
    <div style={{display:'flex',gap:'8px',marginBottom:'10px'}}>
      <input className="fi" style={{flex:1,padding:'8px 12px',fontSize:'13px'}} value={memberSearch} onChange={e=>setMemberSearch(e.target.value)} placeholder="🔍 Tìm theo tên..."/>
      <button onClick={()=>setOnlyDebt(v=>!v)} style={{
        flexShrink:0,padding:'0 12px',borderRadius:'9px',border:'1px solid',fontSize:'12px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif',whiteSpace:'nowrap',
        borderColor:onlyDebt?'var(--red)':'var(--border)',
        background:onlyDebt?'var(--red-bg)':'var(--surface)',
        color:onlyDebt?'var(--red)':'var(--muted)'
      }}>{onlyDebt?'🔴 Đang lọc: còn nợ':'Chỉ hiện người còn nợ'}</button>
    </div>

    <div className="fund-members" style={{display:'flex',flexDirection:'column',gap:'8px'}}>
      {members.map((m,i)=>({m,i})).filter(({m})=>{
        if(memberSearch.trim()&&!m.name.toLowerCase().includes(memberSearch.trim().toLowerCase()))return false;
        if(onlyDebt&&(m.paid-(memberSpent[m.name]||0))>=0)return false;
        return true;
      }).map(({m,i})=>{
        const spent = memberSpent[m.name]||0;
        const rem = m.paid-spent;
        const isDepTarget=depositTarget?.idx===i;
        const isRenaming=renamingMember===i;
        const isExpanded=expandedMember===i;
        const matchedPlayer=(players||[]).find(p=>p.name===m.name);
        return (
          <div key={i} style={{background:'var(--surface)',border:'1px solid var(--border)',borderLeft:`3px solid ${m.color}`,borderRadius:'10px',overflow:'hidden'}}>
            {/* Dòng gọn — bấm để mở/thu chi tiết */}
            <div onClick={()=>setExpandedMember(isExpanded?null:i)} style={{display:'flex',alignItems:'center',gap:'9px',padding:'10px 12px',cursor:'pointer'}}>
              <div style={{width:'28px',height:'28px',borderRadius:'50%',overflow:'hidden',flexShrink:0,background:matchedPlayer?.avatar?'transparent':m.color+'22',color:m.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'10px',fontWeight:700}}>
                {matchedPlayer?.avatar?<img src={matchedPlayer.avatar} alt={m.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:initials(m.name)}
              </div>

/* ─── FIREBASE CONFIG ─────────────────────────────────────
   1) Tạo Firebase project: https://console.firebase.google.com
   2) Vào Realtime Database → Create database (chọn test mode)
   3) Copy URL (dạng https://xxx-default-rtdb.firebaseio.com)
   4) Dán vào FB_URL bên dưới rồi deploy lại
──────────────────────────────────────────────────────── */
const ADMIN_PIN = '142536';
const FB_URL = 'https://test-7df23-default-rtdb.firebaseio.com';

async function fbGet(path){
  try{const r=await fetch(FB_URL+'/'+path+'.json');if(!r.ok)return null;const d=await r.json();
  // Nếu data được wrap với _ts thì unwrap
  if(d&&typeof d==='object'&&'_data' in d) return d._data;
  return d;}catch{return null;}
}

// Timestamp lần cuối mình ghi lên Firebase cho từng path
const _fbLastWrite={};
// Flag đang trong quá trình fetch PUT
const _fbSaving={};

async function fbSet(path,val){
  _fbSaving[path]=true;
  const ts=Date.now();
  _fbLastWrite[path]=ts;
  try{
    await fetch(FB_URL+'/'+path+'.json',{method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({_data:val,_ts:ts})
    });
  }catch{}finally{
    setTimeout(()=>{ _fbSaving[path]=false; },2000);
  }
}

// Poll an toàn: chỉ apply data nếu server _ts MỚI HƠN lần cuối mình write + 5s
// → tránh poll kéo data cũ về ghi đè thay đổi local vừa làm
async function fbPoll(path){
  if(_fbSaving[path]) return null;
  try{
    const r=await fetch(FB_URL+'/'+path+'.json');
    if(!r.ok) return null;
    const d=await r.json();
    if(!d||typeof d!=='object') return null;
    const serverTs=d._ts||0;
    const myLastWrite=_fbLastWrite[path]||0;
    // Bỏ qua nếu server timestamp chưa vượt quá lần cuối mình ghi + 5s buffer
    if(serverTs < myLastWrite + 5000) return null;
    return ('_data' in d) ? d._data : d;
  }catch{ return null; }
}

  const has = !!badge.holder;
  return (
    <div className={`badge-card${has?' won':' empty'}`} onClick={()=>onTap&&onTap(badge)} style={{cursor:'pointer',userSelect:'none'}}>
      <div className="badge-glow" style={{background:badge.color}}/>
      <span className="badge-emoji">{badge.emoji}</span>
      <div className="badge-title">{badge.title}</div>
      <div className="badge-desc">{badge.desc}</div>
      {has ? (
        <div className="badge-holder">
          <div className="av" style={{background:badge.holder.avatar?'transparent':badge.holder.color+'22',color:badge.holder.color,overflow:'hidden'}}>
            {badge.holder.avatar ? <img src={badge.holder.avatar} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/> : initials(badge.holder.name)}
          </div>
          <div>
            <div>{badge.holder.name.split(' ').slice(-2).join(' ')}</div>
            {badge.extra && <div style={{fontSize:'10px',color:'var(--muted)',fontWeight:500}}>{badge.extra}</div>}
          </div>
        </div>
      ) : (
        <div className="badge-holder" style={{color:'var(--muted)',fontWeight:500}}>Chưa có ai đạt được</div>
      )}
      <div style={{fontSize:'10px',color:'var(--muted)',marginTop:'6px',textAlign:'right',opacity:.6}}>Tap để xem chi tiết ›</div>
    </div>
  );
}

/* ─── MATCH HISTORY DRAWER ───────────────────────────────── */
function MatchHistoryDrawer({matches, onClose}){
  const [filter, setFilter] = React.useState('all'); // 'all' | 'W' | 'L'
  const filtered = filter==='all' ? matches : matches.filter(m=>m.result===filter);
  return (
    <div className="history-drawer-overlay" onClick={onClose}>
      <div className="history-drawer" onClick={e=>e.stopPropagation()}>
        <div className="history-drawer-handle"/>
        <div className="history-drawer-head">
          <div style={{fontFamily:'Quicksand,sans-serif',fontSize:'17px',fontWeight:700}}>📋 Toàn bộ lịch sử</div>
          <button onClick={onClose} style={{background:'var(--surface2)',border:'none',borderRadius:'8px',color:'var(--muted)',width:'32px',height:'32px',cursor:'pointer',fontSize:'16px',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
        </div>

        {/* Filter pills */}
        <div style={{display:'flex',gap:'6px',padding:'0 18px 12px'}}>
          {[['all','Tất cả',matches.length],['W','Thắng',matches.filter(m=>m.result==='W').length],['L','Thua',matches.filter(m=>m.result==='L').length]].map(([val,lb,cnt])=>(
            <button key={val} onClick={()=>setFilter(val)} style={{
              padding:'5px 12px',borderRadius:'20px',border:'1px solid',fontSize:'12px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif',
              borderColor:filter===val?(val==='W'?'var(--green)':val==='L'?'var(--red)':'var(--purple)'):'var(--border)',
              background:filter===val?(val==='W'?'var(--green-bg)':val==='L'?'var(--red-bg)':'var(--purple-bg)'):'transparent',
              color:filter===val?(val==='W'?'var(--green)':val==='L'?'var(--red)':'var(--purple)'):'var(--muted)'
            }}>{lb} <span style={{opacity:.7}}>({cnt})</span></button>
          ))}
        </div>

        <div className="history-drawer-body">
          {filtered.length===0 && <div style={{textAlign:'center',padding:'32px',color:'var(--muted)'}}>Không có trận nào</div>}
          <div className="match-list">
            {filtered.map(m=>(
              <MatchItem key={m.id} m={m} showDel={false}/>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function BadgeSection({players, matches}){
  const [selectedBadge, setSelectedBadge] = React.useState(null);
  const badges = useMemo(()=>computeBadges(players, matches), [players, matches]);
  return (
    <>
      <div className="badge-grid">
        {badges.map(b=><BadgeCard key={b.id} badge={b} onTap={setSelectedBadge}/>)}
      </div>
      {selectedBadge && <BadgePopup badge={selectedBadge} onClose={()=>setSelectedBadge(null)}/>}
    </>
  );
}

function FunTab({players, matches}){
  const badges = useMemo(()=>computeBadges(players, matches), [players, matches]);

  return <>
    <div className="fun-section-title">🏅 Huy Hiệu CLB</div>
    {players.length===0 ? (
      <div style={{textAlign:'center',padding:'40px',color:'var(--muted)',background:'var(--surface)',borderRadius:'14px',border:'1px solid var(--border)'}}>
        <div style={{fontSize:'32px',marginBottom:'8px'}}>🏅</div>
        <div>Chưa có người chơi nào để xét huy hiệu.</div>
        <div style={{fontSize:'12px',marginTop:'4px'}}>Vào tab BXH để thêm người chơi và ghi trận trước.</div>
      </div>
    ) : (
      <div className="badge-grid">
        {badges.map(b=><BadgeCard key={b.id} badge={b}/>)}
      </div>
    )}
  </>;
}

/* ─── APP ────────────────────────────────────────────────── */
function App(){
  const [tab,setTab]=useState('dashboard');
  const [players,setPlayers]=useState(INIT_PLAYERS);
  const [matches,setMatches]=useState(INIT_MATCHES);
  const [sessions,setSessions]=useState(INIT_SESSIONS);
  const [members,setMembers]=useState([
    {name:'Huy Xinh',        paid:1500000,color:COLORS[0],deposits:[{date:'Ban đầu',amount:500000},{date:'11/04',amount:500000},{date:'05/05',amount:500000}]},
    {name:'Nhi Xinh',        paid:1332000,color:COLORS[1],deposits:[{date:'Ban đầu',amount:332000},{date:'11/04',amount:500000},{date:'05/05',amount:500000}]},
    {name:'Chị Thương Xinh', paid:1500000,color:COLORS[2],deposits:[{date:'Ban đầu',amount:500000},{date:'21/04',amount:500000},{date:'05/05',amount:500000}]},
    {name:'Em Thương Xinh',  paid:1000000,color:COLORS[3],deposits:[{date:'Ban đầu',amount:500000},{date:'23/03',amount:500000}]},
    {name:'Tuấn Xinh',       paid:1500000,color:COLORS[4],deposits:[{date:'Ban đầu',amount:500000},{date:'23/03',amount:500000},{date:'05/05',amount:500000}]},
    {name:'Xé Vé',           paid:435000, color:COLORS[5],deposits:[{date:'Ban đầu',amount:75000},{date:'Ban đầu',amount:70000},{date:'Ban đầu',amount:140000},{date:'06/03',amount:150000}]},
  ]);
  const [dbReady,setDbReady]=useState(false);
  const [syncing,setSyncing]=useState(false);
  const [bannerImg,setBannerImg]=useState(null);
  const [bannerTitle,setBannerTitle]=useState('Pích Cờ Bôn Phông Bạt');
  const [bannerSub,setBannerSub]=useState('Stats & Quỹ CLB · Phông Bạt 🏓');

  // Load tất cả data từ Firebase khi khởi động
  useEffect(()=>{
    (async()=>{
      setSyncing(true);
      const [p,m,s,mb,bn]=await Promise.all([fbGet('players'),fbGet('matches'),fbGet('sessions'),fbGet('members'),fbGet('banner')]);
      if(Array.isArray(p)&&p.length) setPlayers(p);
      if(Array.isArray(m)&&m.length) setMatches(m);
      if(Array.isArray(s)&&s.length) setSessions(s);
      if(Array.isArray(mb)&&mb.length) setMembers(mb);
      if(bn&&typeof bn==='object'){
        if(bn.bannerImg!==undefined) setBannerImg(bn.bannerImg);
        if(bn.bannerTitle) setBannerTitle(bn.bannerTitle);
        if(bn.bannerSub) setBannerSub(bn.bannerSub);
      }
      setDbReady(true);
      setSyncing(false);
    })();
    // Poll mỗi 30s — dùng fbPoll để bỏ qua khi đang ghi (tăng lên 30s tránh ghi đè khi đang chỉnh)
    const id=setInterval(async()=>{
      const [p,m,s,mb,bn]=await Promise.all([fbPoll('players'),fbPoll('matches'),fbPoll('sessions'),fbPoll('members'),fbPoll('banner')]);
      if(Array.isArray(p)&&p.length) setPlayers(p);
      if(Array.isArray(m)&&m.length) setMatches(m);
      if(Array.isArray(s)&&s.length) setSessions(s);
      if(Array.isArray(mb)&&mb.length) setMembers(mb);
      if(bn&&typeof bn==='object'&&!_fbSaving['banner']){
        if(bn.bannerImg!==undefined) setBannerImg(bn.bannerImg);
        if(bn.bannerTitle) setBannerTitle(bn.bannerTitle);
        if(bn.bannerSub) setBannerSub(bn.bannerSub);
      }
    },30000);
    return ()=>clearInterval(id);
  },[]);

  // Sync lên Firebase khi data thay đổi
  // Dùng useRef để skip N lần render đầu (trước khi Firebase load xong)
  const _skipPlayers=React.useRef(1);
  const _skipMatches=React.useRef(1);
  const _skipSessions=React.useRef(1);
  const _skipMembers=React.useRef(1);
  const _skipBanner=React.useRef(1);
  useEffect(()=>{
    if(_skipPlayers.current>0){_skipPlayers.current--;return;}
    if(dbReady)fbSet('players',players);
  },[players]);
  useEffect(()=>{
    if(_skipMatches.current>0){_skipMatches.current--;return;}
    if(dbReady)fbSet('matches',matches);
  },[matches]);
  useEffect(()=>{
    if(_skipSessions.current>0){_skipSessions.current--;return;}
    if(dbReady)fbSet('sessions',sessions);
  },[sessions]);
  useEffect(()=>{
    if(_skipMembers.current>0){_skipMembers.current--;return;}
    if(dbReady)fbSet('members',members);
  },[members]);
  useEffect(()=>{
    if(_skipBanner.current>0){_skipBanner.current--;return;}
    if(dbReady)fbSet('banner',{bannerImg,bannerTitle,bannerSub});
  },[bannerImg,bannerTitle,bannerSub]);
  const [showAdd,setShowAdd]=useState(false);
  const [confirmId,setConfirmId]=useState(null);
  const [toast,setToast]=useState(null);
  const [isAdmin,setIsAdmin]=useState(()=>{ try{ return localStorage.getItem('pcb_admin')==='1'; }catch(e){ return false; } });
  const [showPin,setShowPin]=useState(false);
  const pendingAction=React.useRef(null);

  const requireAdmin=fn=>(...args)=>{
    if(isAdmin){ fn(...args); return; }
    pendingAction.current=()=>fn(...args);
    setShowPin(true);
  };
  const handlePinConfirm=()=>{
    setIsAdmin(true);
    try{ localStorage.setItem('pcb_admin','1'); }catch(e){}
    setShowPin(false);
    if(pendingAction.current){ const fn=pendingAction.current; pendingAction.current=null; fn(); }
  };
  const toggleLock=()=>{
    if(isAdmin){
      setIsAdmin(false);
      try{ localStorage.removeItem('pcb_admin'); }catch(e){}
      showToast('Đã khoá quyền chỉnh sửa');
    } else {
      setShowPin(true);
    }
  };
  const [matchSeg,setMatchSeg]=useState('Đôi');

  const showToast=msg=>setToast(msg);
  const openAdd=requireAdmin(()=>setShowAdd(true));

  // Derive "myElo" as the first player's ELO, or 1500
  const myElo=players.length?players[0].elo:1500;

  const addPlayer=(name,elo=1500)=>{
    const id=Date.now();
    const color=COLORS[players.length%COLORS.length];
    const eloVal=parseInt(elo)||1500;
    setPlayers(p=>[...p,{id,name,elo:eloVal,wins:0,losses:0,color,avatar:null}]);
    showToast(`Đã thêm ${name} (ELO ${eloVal})`);
  };

  const deletePlayer=(id)=>{
    setPlayers(p=>p.filter(x=>x.id!==id));
    showToast('Đã xóa người chơi');
  };

  const updatePlayerAvatar=(id, dataUrl)=>{
    setPlayers(p=>p.map(x=>x.id===id?{...x, avatar:dataUrl}:x));
    showToast('Đã cập nhật ảnh đại diện');
  };

  const addMatch=m=>{
    // Apply ELO changes to all involved players
    setPlayers(prev=>{
      const updated=[...prev];
      (m.eloChanges||[]).forEach(({name,delta})=>{
        const idx=updated.findIndex(p=>p.name===name);
        if(idx>=0){
          const win=delta>0;
          updated[idx]={...updated[idx],
            elo:updated[idx].elo+delta,
            wins:updated[idx].wins+(win?1:0),
            losses:updated[idx].losses+(win?0:1)
          };
        }
      });
      return updated;
    });
    setMatches(p=>[m,...p]);
    showToast('Đã lưu trận & cập nhật ELO!');
  };

  const editMatch=m=>{
    // Reverse old ELO, apply new ELO
    const old=matches.find(x=>x.id===m.id);
    setPlayers(prev=>{
      let updated=[...prev];
      // hoàn ELO cũ
      (old?.eloChanges||[]).forEach(({name,delta})=>{
        const idx=updated.findIndex(p=>p.name===name);
        if(idx>=0){const wasWin=delta>0;updated[idx]={...updated[idx],elo:updated[idx].elo-delta,wins:updated[idx].wins-(wasWin?1:0),losses:updated[idx].losses-(wasWin?0:1)};}
      });
      // áp ELO mới
      (m.eloChanges||[]).forEach(({name,delta})=>{
        const idx=updated.findIndex(p=>p.name===name);
        if(idx>=0){const win=delta>0;updated[idx]={...updated[idx],elo:updated[idx].elo+delta,wins:updated[idx].wins+(win?1:0),losses:updated[idx].losses+(win?0:1)};}
      });
      return updated;
    });
    setMatches(p=>p.map(x=>x.id===m.id?m:x));
    showToast('Đã cập nhật trận & ELO!');
  };

  const deleteMatch=id=>{
    const m=matches.find(x=>x.id===id);
    if(!m) return;
    // Reverse ELO changes
    setPlayers(prev=>{
      const updated=[...prev];
      (m.eloChanges||[]).forEach(({name,delta})=>{
        const idx=updated.findIndex(p=>p.name===name);
        if(idx>=0){
          const wasWin=delta>0;
          updated[idx]={...updated[idx],
            elo:updated[idx].elo-delta,
            wins:updated[idx].wins-(wasWin?1:0),
            losses:updated[idx].losses-(wasWin?0:1)
          };
        }
      });
      return updated;
    });
    setMatches(p=>p.filter(x=>x.id!==id));
    setConfirmId(null);
    showToast('Đã xóa trận & hoàn ELO!');
  };

  const guardedDeleteMatch=requireAdmin(id=>setConfirmId(id));
  const guardedEditMatch=requireAdmin(editMatch);
  const guardedAddPlayer=requireAdmin(addPlayer);
  const guardedDeletePlayer=requireAdmin(deletePlayer);
  const guardedUpdateAvatar=requireAdmin(updatePlayerAvatar);
  const guardedBannerUpdate=requireAdmin(({bannerImg:img, bannerTitle:t, bannerSub:s})=>{
    setBannerImg(img);
    setBannerTitle(t);
    setBannerSub(s);
  });

  const TABS=[
    {id:'dashboard',label:'Tổng Quan',icon:'📊'},
    {id:'matches',  label:'Lịch Sử',icon:'🏓'},
    {id:'bxh',      label:'BXH',icon:'🏆'},
    {id:'sokeo',    label:'So Kèo',icon:'⚔️'},
  ];

  return <>
    <div className="topbar">
      <div className="logo">
        <div className="logo-icon">⚡</div>
        <div>
          <div className="logo-text">PÍCH CỜ BÔN</div>
          <span className="logo-sub">Phông Bạt</span>
        </div>
      </div>
      <div className="nav-tabs">
        {TABS.map(t=>(
          <button key={t.id} className={`nav-tab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </div>
      <div className="nav-right" style={{display:'flex',alignItems:'center',gap:'8px'}}>
        {syncing&&<span style={{fontSize:'11px',color:'var(--muted)',background:'var(--surface)',borderRadius:'20px',padding:'3px 10px',border:'1px solid var(--border)'}}>⏳ Đang đồng bộ...</span>}
        {FB_URL.includes('YOUR_PROJECT')&&<span style={{fontSize:'10px',color:'var(--orange)',background:'var(--orange-bg)',borderRadius:'20px',padding:'3px 8px',cursor:'pointer'}} title="Chưa cấu hình Firebase">⚠️ Chưa có DB</span>}
        <button onClick={()=>setTab('fund')} style={{background:tab==='fund'?'var(--yellow)':'rgba(234,179,8,.15)',border:'1px solid var(--yellow)',borderRadius:'8px',color:tab==='fund'?'#000':'var(--yellow)',padding:'7px 13px',fontSize:'12px',fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',fontFamily:'Nunito,sans-serif',display:'flex',alignItems:'center',gap:'5px'}}>💰 Quỹ CLB</button>
        <button onClick={toggleLock} title={isAdmin?'Đã mở khoá - bấm để khoá lại':'Đang khoá - bấm để mở khoá quản trị'} style={{background:isAdmin?'var(--green-bg)':'rgba(255,255,255,.08)',border:`1px solid ${isAdmin?'var(--green)':'rgba(255,255,255,.2)'}`,borderRadius:'8px',color:isAdmin?'var(--green)':'#9aa1b3',padding:'7px 10px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>{isAdmin?'🔓':'🔒'}</button>
        <button className="btn-ghi" onClick={openAdd}>+ Ghi Trận</button>
      </div>
    </div>

    {/* Mobile header */}
    <div className="mobile-header">
      <div className="logo">
        <div className="logo-icon">⚡</div>
        <div>
          <div className="logo-text">PÍCH CỜ BÔN</div>
          <span className="logo-sub">Phông Bạt</span>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
        <button onClick={toggleLock} title={isAdmin?'Đã mở khoá - bấm để khoá lại':'Đang khoá - bấm để mở khoá quản trị'} style={{background:isAdmin?'var(--green-bg)':'rgba(255,255,255,.08)',border:`1px solid ${isAdmin?'var(--green)':'rgba(255,255,255,.2)'}`,borderRadius:'8px',color:isAdmin?'var(--green)':'#9aa1b3',padding:'6px 10px',fontSize:'13px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>{isAdmin?'🔓':'🔒'}</button>
        <button onClick={()=>setTab('fund')} style={{background:tab==='fund'?'var(--yellow)':'rgba(234,179,8,.15)',border:'1px solid var(--yellow)',borderRadius:'8px',color:tab==='fund'?'#000':'var(--yellow)',padding:'6px 12px',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif',display:'flex',alignItems:'center',gap:'4px'}}>💰 Quỹ CLB</button>
      </div>
    </div>

    <Banner
      bannerImg={bannerImg}
      bannerTitle={bannerTitle}
      bannerSub={bannerSub}
      editable={isAdmin}
      onUpdate={guardedBannerUpdate}
    />

    {tab!=='bxh' && tab!=='fund' && (
      <div className="seg-wrap">
        <div className="seg">
          <button className={`seg-btn${matchSeg==='Đôi'?' active':''}`} onClick={()=>setMatchSeg('Đôi')}>👥 Chỉ Số Đánh Đôi</button>
          <button className={`seg-btn${matchSeg==='Đơn'?' active':''}`} onClick={()=>setMatchSeg('Đơn')}>🧍 Chỉ Số Đánh Đơn</button>
        </div>
      </div>
    )}

    <div className="main">
      {tab==='dashboard' && <Dashboard matches={matches.filter(m=>matchSeg==='Tất cả'||m.type===matchSeg)} myElo={myElo} onAdd={openAdd} sessions={sessions} members={members} players={players}/>}
      {tab==='matches'   && <MatchesTab matches={matches} players={players} myElo={myElo} onAdd={openAdd} onDelete={guardedDeleteMatch} onEditMatch={guardedEditMatch}/>}
      {tab==='bxh'       && <LeaderboardTab players={players} matches={matches} onAddPlayer={guardedAddPlayer} onDeletePlayer={guardedDeletePlayer} onUpdateAvatar={guardedUpdateAvatar}/>}
      {tab==='sokeo'     && <SoKeoTab players={players} matches={matches}/>}
      {tab==='fund'      && <FundTab players={players} setPlayers={setPlayers} sessions={sessions} setSessions={setSessions} members={members} setMembers={setMembers} matches={matches} setMatches={setMatches}/>}
    </div>

    {showAdd && <AddMatchModal players={players} onClose={()=>setShowAdd(false)} onSave={addMatch}/>}
    {confirmId && <ConfirmModal
      msg="Bạn có chắc muốn xóa trận này không? ELO sẽ được hoàn lại."
      onConfirm={()=>deleteMatch(confirmId)}
      onClose={()=>setConfirmId(null)}
    />}
    {toast && <Toast msg={toast} onClose={()=>setToast(null)}/>}
    {showPin && <PinModal onConfirm={handlePinConfirm} onClose={()=>{setShowPin(false); pendingAction.current=null;}}/>}

    {/* Mobile bottom nav — 2 tabs · FAB · 2 tabs */}
    <nav className="mobile-nav">
      {TABS.slice(0,2).map(t=>(
        <button key={t.id} className={`mobile-nav-tab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>
          <span className="mni">{t.icon}</span>
          <span>{t.label}</span>
        </button>
      ))}
      <button className="mobile-nav-fab" onClick={openAdd} title="Ghi trận đấu">
        <span>+</span>
      </button>
      {TABS.slice(2).map(t=>(
        <button key={t.id} className={`mobile-nav-tab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>
          <span className="mni">{t.icon}</span>
          <span>{t.label}</span>
        </button>
      ))}
    </nav>
  </>;
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>

<script>
// Đăng ký Service Worker để app chạy như PWA (cài lên màn hình chính, mở nhanh, đỡ trắng màn hình khi mạng chập chờn)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
