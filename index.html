/* ─── EXPORT CSV ─────────────────────────────────────────── */
function exportCSV(matches,players){
  // Matches sheet
  const mRows=[['Ngày','Loại','Đội A','Đội B','Tỉ số','Kết quả','Công Đức thay đổi']];
  matches.forEach(m=>{
    const eloStr=(m.eloChanges||[]).map(e=>`${e.name}:${e.delta>0?'+':''}${e.delta}`).join(' | ');
    mRows.push([m.date,m.type,m.myTeam,m.oppTeam,`${m.score1}-${m.score2}`,m.result,eloStr]);
  });
  // Players sheet
  const pRows=[['Tên','Công Đức','Thắng','Thua','Tỉ lệ thắng']];
  [...players].sort((a,b)=>b.elo-a.elo).forEach(p=>{
    const total=p.wins+p.losses;
    pRows.push([p.name,p.elo,p.wins,p.losses,total?Math.round(p.wins/total*100)+'%':'—']);
  });
  const toCSV=rows=>rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const csv='=== LỊCH SỬ TRẬN ===\n'+toCSV(mRows)+'\n\n=== BXH NGƯỜI CHƠI ===\n'+toCSV(pRows);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='picklepro_export.csv';a.click();
  URL.revokeObjectURL(url);
}

/* ─── ELO HISTORY CHART ──────────────────────────────────── */
function EloChart({players,matches}){
  const [selected,setSelected]=useState('');
  const player=players.find(p=>p.name===selected);

  const history=useMemo(()=>{
    if(!player) return [];
    // build elo timeline from matches (oldest first)
    let elo=1500;
    const sorted=[...matches].reverse();
    const pts=[{date:'Bắt đầu',elo:1500}];
    sorted.forEach(m=>{
      const change=(m.eloChanges||[]).find(e=>e.name===player.name);
      if(change){elo+=change.delta;pts.push({date:m.date,elo,delta:change.delta});}
    });
    return pts;
  },[player,matches]);

  const minE=history.length?Math.min(...history.map(h=>h.elo))-30:1470;
  const maxE=history.length?Math.max(...history.map(h=>h.elo))+30:1530;
  const W=560,H=180,PAD=40;
  const xScale=i=>history.length>1?PAD+(i/(history.length-1))*(W-PAD*2):W/2;
  const yScale=e=>H-PAD-((e-minE)/(maxE-minE))*(H-PAD*2);

  const pathD=history.map((h,i)=>`${i===0?'M':'L'}${xScale(i)},${yScale(h.elo)}`).join(' ');

  return (
    <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',padding:'16px',marginBottom:'20px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
        <div className="section-title" style={{fontSize:'15px'}}>📈 Biểu đồ Công Đức</div>
        <select className="month-sel" value={selected} onChange={e=>setSelected(e.target.value)} style={{fontSize:'12px',padding:'5px 10px'}}>
          <option value="">-- Chọn người chơi --</option>
          {players.map(p=><option key={p.id}>{p.name}</option>)}
        </select>
      </div>
      {!selected && <div style={{textAlign:'center',padding:'32px',color:'var(--muted)',fontSize:'13px'}}>Chọn người chơi để xem biểu đồ Công Đức</div>}
      {selected && history.length<=1 && <div style={{textAlign:'center',padding:'32px',color:'var(--muted)',fontSize:'13px'}}>Chưa có đủ dữ liệu trận đấu</div>}
      {selected && history.length>1 && (
        <>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible'}}>
            {/* Grid lines */}
            {[0,.25,.5,.75,1].map(t=>{
              const y=PAD+(1-t)*(H-PAD*2);
              const v=Math.round(minE+(maxE-minE)*t);
              return <g key={t}>
                <line x1={PAD} y1={y} x2={W-PAD} y2={y} stroke="var(--border)" strokeWidth="0.5" strokeDasharray="3"/>
                <text x={PAD-4} y={y+4} textAnchor="end" fontSize="9" fill="var(--muted)">{v}</text>
              </g>;
            })}
            {/* Path */}
            <path d={pathD} fill="none" stroke="var(--green)" strokeWidth="2" strokeLinejoin="round"/>
            {/* Fill */}
            <path d={pathD+` L${xScale(history.length-1)},${H-PAD} L${PAD},${H-PAD} Z`} fill="var(--green)" opacity="0.08"/>
            {/* Points */}
            {history.map((h,i)=>(
              <g key={i}>
                <circle cx={xScale(i)} cy={yScale(h.elo)} r="3" fill={h.delta>0?'var(--green)':h.delta<0?'var(--red)':'var(--muted)'} stroke="var(--bg)" strokeWidth="1.5"/>
              </g>
            ))}
          </svg>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'4px',fontSize:'11px',color:'var(--muted)',padding:`0 ${PAD}px`}}>
            <span>{history[0]?.date}</span>
            <span style={{fontFamily:'Quicksand',fontSize:'14px',fontWeight:700,color:player.elo>=1500?'var(--green)':'var(--red)'}}>
              Công Đức hiện tại: {player.elo}
            </span>
            <span>{history[history.length-1]?.date}</span>
          </div>
        </>
      )}
    </div>
  );
}

/* ─── TRANG RIÊNG: LỊCH SỬ ĐÁNH CHI TIẾT CỦA NGƯỜI CHƠI ──── */
function PlayerHistoryPage({player, players, matches, onBack, onEditMatch, onDeleteMatch, onUpdateAvatar, onResyncStats, onViewHistory}){
  const [typeFilter,setTypeFilter]=useState('Tất cả');
  const [monthFilter,setMonthFilter]=useState('Tất cả');
  const [editMatch,setEditMatch]=useState(null);
  const [showFullAvatar,setShowFullAvatar]=useState(false);
  const [cropSrc,setCropSrc]=useState(null);
  const [duyenTab,setDuyenTab]=useState('opp');
  const avatarInputRef=React.useRef(null);
  const handleAvatarFile=(e)=>{
    const file=e.target.files?.[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>setCropSrc(ev.target.result);
    reader.readAsDataURL(file);
    e.target.value='';
  };

  const tier=getTier(player.elo);

  // Toàn bộ trận có sự tham gia của người này (cũ→mới để build timeline ELO)
  const myMatchesAsc=useMemo(()=>{
    return [...matches].reverse().filter(m=>{
      const all=[...(m.team1Players||(m.myTeam?[m.myTeam]:[])),...(m.team2Players||(m.oppTeam?[m.oppTeam]:[]))];
      return all.includes(player.name);
    });
  },[matches,player.name]);

  // Thắng/thua ĐẾM TRỰC TIẾP từ danh sách trận đấu thật (nguồn dữ liệu gốc) —
  // KHÔNG dùng bộ đếm lũy kế player.wins/player.losses vì bộ đếm này có thể bị
  // lệch dần theo thời gian do đồng bộ đa thiết bị (ghi đè không nguyên tử qua Firebase).
  // Cách tính này đảm bảo luôn khớp 100% với số trận hiển thị bên dưới.
  const realWins=myMatchesAsc.filter(m=>{
    const inT1=(m.team1Players||(m.myTeam?[m.myTeam]:[])).includes(player.name);
    return inT1?m.result==='W':m.result==='L';
  }).length;
  const realLosses=myMatchesAsc.length-realWins;
  const total=realWins+realLosses;
  const wr=total?Math.round(realWins/total*100):0;
  // Phát hiện lệch số liệu so với bộ đếm đang lưu trên hồ sơ
  const statsMismatch = player.wins!==realWins || player.losses!==realLosses;

  const allBadges=useMemo(()=>computeBadges(players||[], matches), [players, matches]);
  const myBadges=allBadges.filter(b=>b.holder&&b.holder.id===player.id);

  const history=useMemo(()=>{
    let elo=1500;
    const pts=[{date:'Bắt đầu',elo:1500}];
    myMatchesAsc.forEach(m=>{
      const change=(m.eloChanges||[]).find(e=>e.name===player.name);
      if(change){elo+=change.delta;pts.push({date:m.date,elo,delta:change.delta});}
    });
    return pts;
  },[myMatchesAsc,player.name]);

  const minE=history.length?Math.min(...history.map(h=>h.elo))-30:1470;
  const maxE=history.length?Math.max(...history.map(h=>h.elo))+30:1530;
  const W=680,H=200,PAD=40;
  const xScale=i=>history.length>1?PAD+(i/(history.length-1))*(W-PAD*2):W/2;
  const yScale=e=>H-PAD-((e-minE)/(maxE-minE||1))*(H-PAD*2);
  const pathD=history.map((h,i)=>`${i===0?'M':'L'}${xScale(i)},${yScale(h.elo)}`).join(' ');

  // Danh sách trận (mới→cũ) áp bộ lọc loại trận / tháng, giữ nguyên góc nhìn của người này
  const months=useMemo(()=>{
    const s=new Set();
    myMatchesAsc.forEach(m=>{
      const parts=m.date.split(/[\/\-]/);
      if(parts.length>=2) s.add(parts[1]);
    });
    return ['Tất cả',...[...s].sort((a,b)=>parseInt(a)-parseInt(b)).map(m=>`Tháng ${m}`)];
  },[myMatchesAsc]);

  const filteredMatches=useMemo(()=>{
    return [...myMatchesAsc].reverse().filter(m=>{
      if(typeFilter!=='Tất cả'&&m.type!==typeFilter) return false;
      if(monthFilter!=='Tất cả'){
        const mon=monthFilter.replace('Tháng ','');
        const parts=m.date.split(/[\/\-]/);
        if(parts.length<2||parts[1]!==mon) return false;
      }
      return true;
    });
  },[myMatchesAsc,typeFilter,monthFilter]);

  const fWins=filteredMatches.filter(m=>{
    const inT1=(m.team1Players||(m.myTeam?[m.myTeam]:[])).includes(player.name);
    return inT1?m.result==='W':m.result==='L';
  }).length;
  const fLosses=filteredMatches.length-fWins;

  // Đối thủ hay gặp nhất: đếm số trận đối đầu (khác đội) với từng người,
  // cùng thắng/thua riêng với người đó — cùng logic với Đối Đầu Trực Tiếp ở tab BXH.
  const opponentStats=useMemo(()=>{
    const map={};
    myMatchesAsc.forEach(m=>{
      const team1=m.team1Players||(m.myTeam?[m.myTeam]:[]);
      const team2=m.team2Players||(m.oppTeam?[m.oppTeam]:[]);
      const inT1=team1.includes(player.name);
      const oppTeam=inT1?team2:team1;
      const won=inT1?m.result==='W':m.result==='L';
      oppTeam.forEach(oppName=>{
        if(!oppName||oppName===player.name) return;
        if(!map[oppName]) map[oppName]={name:oppName,matches:0,wins:0,losses:0};
        map[oppName].matches++;
        if(won) map[oppName].wins++; else map[oppName].losses++;
      });
    });
    return Object.values(map)
      .map(s=>({...s,winRate:s.matches?Math.round(s.wins/s.matches*100):0}))
      .sort((a,b)=>b.matches-a.matches)
      .slice(0,5);
  },[myMatchesAsc,player.name]);

  // Đồng đội (đánh đôi cùng đội, tối thiểu 2 trận chung) — dùng để xếp
  // "Quý Nhân Phù Trợ" (thắng cao) và "Vận Rủi Đồng Hành" (thua nhiều)
  const teammateStats=useMemo(()=>{
    const map={};
    myMatchesAsc.forEach(m=>{
      const team1=m.team1Players||(m.myTeam?[m.myTeam]:[]);
      const team2=m.team2Players||(m.oppTeam?[m.oppTeam]:[]);
      const inT1=team1.includes(player.name);
      const myTeam=inT1?team1:team2;
      const won=inT1?m.result==='W':m.result==='L';
      myTeam.forEach(mateName=>{
        if(!mateName||mateName===player.name) return;
        if(!map[mateName]) map[mateName]={name:mateName,matches:0,wins:0,losses:0};
        map[mateName].matches++;
        if(won) map[mateName].wins++; else map[mateName].losses++;
      });
    });
    return Object.values(map)
      .map(s=>({...s,winRate:s.matches?Math.round(s.wins/s.matches*100):0}))
      .filter(s=>s.matches>=2);
  },[myMatchesAsc,player.name]);

  const teammateBest=useMemo(()=>
    [...teammateStats].sort((a,b)=>b.winRate-a.winRate||b.matches-a.matches).slice(0,5),
  [teammateStats]);
  const teammateWorst=useMemo(()=>
    [...teammateStats].sort((a,b)=>a.winRate-b.winRate||b.matches-a.matches).slice(0,5),
  [teammateStats]);

  // Tổng điểm ELO cộng/trừ trong khoảng đang lọc
  const netElo=filteredMatches.reduce((sum,m)=>{
    const ch=(m.eloChanges||[]).find(e=>e.name===player.name);
    return sum+(ch?ch.delta:0);
  },0);

  return (
    <div>
      <button onClick={onBack} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--text)',padding:'7px 14px',fontSize:'12px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif',marginBottom:'16px',display:'flex',alignItems:'center',gap:'5px'}}>← Quay lại BXH</button>

      <div style={{display:'flex',alignItems:'center',gap:'16px',marginBottom:'18px',flexWrap:'wrap'}}>
        <div style={{position:'relative',flexShrink:0}}>
          <div
            className="av"
            onClick={()=>player.avatar&&setShowFullAvatar(true)}
            style={{
              width:96,height:96,borderRadius:'50%',
              background:player.avatar?'transparent':player.color+'22',
              color:player.color,overflow:'hidden',
              display:'flex',alignItems:'center',justifyContent:'center',
              fontSize:'28px',fontWeight:700,
              cursor:player.avatar?'zoom-in':'default'
            }}
            title={player.avatar?'Xem ảnh cỡ lớn':''}
          >
            {player.avatar
              ? <img src={player.avatar} alt={player.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              : initials(player.name)}
          </div>
          {onUpdateAvatar && (
            <>
              <button onClick={()=>avatarInputRef.current?.click()} title="Đổi ảnh đại diện"
                style={{position:'absolute',bottom:0,right:0,width:'30px',height:'30px',borderRadius:'50%',background:'var(--green)',border:'2px solid var(--surface)',color:'#fff',fontSize:'13px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>📷</button>
              <input ref={avatarInputRef} type="file" accept="image/*" onChange={handleAvatarFile} style={{display:'none'}}/>
            </>
          )}
        </div>
        <div style={{minWidth:0}}>
          <div style={{fontFamily:'Quicksand,sans-serif',fontWeight:700,fontSize:'21px'}}>{player.name}</div>
          <div style={{display:'flex',alignItems:'center',gap:'6px',marginTop:'4px',flexWrap:'wrap'}}>
            <span style={{fontSize:'11px',padding:'2px 9px',borderRadius:'20px',background:tier.bg,color:tier.color,fontWeight:700}}>{tier.icon} {tier.label}</span>
            <span style={{fontSize:'14px',color:'var(--muted)'}}>Công Đức {player.elo}</span>
          </div>

      {(opponentStats.length>0 || teammateStats.length>0) && (() => {

          {id:'opp',   emoji:'🤺', label:'Đối thủ hay gặp nhất',  list:opponentStats, empty:'Chưa đủ dữ liệu đối đầu.'},
          {id:'best',  emoji:'🧧', label:'Quý Nhân Phù Trợ',      list:teammateBest,  empty:'Chưa có đồng đội nào đánh chung ≥2 trận.'},
          {id:'worst', emoji:'🌧️', label:'Vận Rủi Đồng Hành',     list:teammateWorst, empty:'Chưa có đồng đội nào đánh chung ≥2 trận.'},
        ];
        const active=DUYEN_TABS.find(t=>t.id===duyenTab)||DUYEN_TABS[0];
        return (
          <>
            <div style={{display:'flex',gap:'4px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'10px',padding:'4px',marginBottom:'10px',overflowX:'auto'}}>

                <button key={t.id} onClick={()=>setDuyenTab(t.id)}
                  style={{flex:'1 1 auto',whiteSpace:'nowrap',padding:'6px 10px',borderRadius:'7px',border:'none',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontSize:'11px',fontWeight:700,background:duyenTab===t.id?'var(--purple)':'transparent',color:duyenTab===t.id?'#fff':'var(--muted)'}}>
                  {t.emoji} {t.label}
                </button>
              ))}
            </div>
            <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',padding:active.list.length?'6px 14px':'20px',marginBottom:'20px'}}>
              {active.list.length===0 ? (
                <div style={{textAlign:'center',color:'var(--muted)',fontSize:'12px'}}>{active.empty}</div>
              ) : active.list.map((o,i)=>{
                const oppPlayer=players.find(pp=>pp.name===o.name);
                const clickable=!!(oppPlayer&&onViewHistory);
                return (
                  <div key={o.name}
                    onClick={()=>clickable&&onViewHistory(oppPlayer)}
                    title={clickable?`Xem lịch sử của ${o.name}`:''}
                    style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px 0',borderTop:i>0?'1px solid var(--border)':'none',cursor:clickable?'pointer':'default'}}>
                    {oppPlayer

                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:'13px',fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',color:clickable?'var(--text)':'inherit'}}>{o.name}</div>
                      <div style={{display:'flex',alignItems:'center',gap:'6px',marginTop:'3px'}}>
                        <div style={{flex:1,height:'4px',background:'var(--bg3)',borderRadius:'2px',overflow:'hidden',maxWidth:'120px'}}>
                          <div style={{width:o.winRate+'%',height:'100%',background:o.winRate>=50?'var(--green)':'var(--red)'}}/>
                        </div>
                        <span style={{fontSize:'10px',color:'var(--muted)'}}>{o.matches} trận</span>
                      </div>
                    </div>
                    <div style={{textAlign:'right',flexShrink:0}}>
                      <div style={{fontSize:'13px',fontWeight:700}}>
                        <span style={{color:'var(--green)'}}>{o.wins}W</span>
                        <span style={{color:'var(--muted)'}}> - </span>
                        <span style={{color:'var(--red)'}}>{o.losses}L</span>
                      </div>
                      <div style={{fontSize:'10px',color:'var(--muted)'}}>{o.winRate}% thắng</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        );
      })()}

      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',padding:'16px',marginBottom:'20px'}}>
        <div className="section-title" style={{fontSize:'15px',marginBottom:'12px'}}>📈 Biểu đồ Công Đức</div>
        {history.length<=1 ? (
          <div style={{textAlign:'center',padding:'32px',color:'var(--muted)',fontSize:'13px'}}>Chưa có đủ dữ liệu trận đấu.</div>
        ) : (
          <>
            <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible'}}>
              {[0,.25,.5,.75,1].map(t=>{
                const y=PAD+(1-t)*(H-PAD*2);
                const v=Math.round(minE+(maxE-minE)*t);
                return <g key={t}>
                  <line x1={PAD} y1={y} x2={W-PAD} y2={y} stroke="var(--border)" strokeWidth="0.5" strokeDasharray="3"/>
                  <text x={PAD-4} y={y+4} textAnchor="end" fontSize="9" fill="var(--muted)">{v}</text>
                </g>;
              })}
              <path d={pathD} fill="none" stroke={player.color||'var(--green)'} strokeWidth="2" strokeLinejoin="round"/>
              <path d={pathD+` L${xScale(history.length-1)},${H-PAD} L${PAD},${H-PAD} Z`} fill={player.color||'var(--green)'} opacity="0.08"/>
              {history.map((h,i)=>(
                <circle key={i} cx={xScale(i)} cy={yScale(h.elo)} r="3" fill={h.delta>0?'var(--green)':h.delta<0?'var(--red)':(player.color||'var(--muted)')} stroke="var(--bg)" strokeWidth="1.5"/>

            </svg>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'4px',fontSize:'11px',color:'var(--muted)',padding:`0 ${PAD}px`}}>
              <span>{history[0]?.date}</span>
              <span style={{fontFamily:'Quicksand',fontSize:'14px',fontWeight:700,color:player.elo>=1500?'var(--green)':'var(--red)'}}>Công Đức hiện tại: {player.elo}</span>
              <span>{history[history.length-1]?.date}</span>
            </div>
          </>

      {/* Bộ lọc lịch sử trận */}
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'12px 14px',marginBottom:'14px'}}>
        <div style={{fontSize:'11px',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.6px',marginBottom:'10px'}}>🔍 Lọc trận</div>
        <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
          <div style={{flex:'1 1 130px'}}>
            <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'5px'}}>Loại trận</div>
            <select className="fi" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
              {['Tất cả','Đơn','Đôi'].map(t=><option key={t}>{t}</option>)}
            </select>
          </div>
          <div style={{flex:'1 1 130px'}}>
            <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'5px'}}>Theo tháng</div>
            <select className="fi" value={monthFilter} onChange={e=>setMonthFilter(e.target.value)}>
              {months.map(m=><option key={m}>{m}</option>)}
            </select>
          </div>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px',flexWrap:'wrap',gap:'6px'}}>
        <span style={{fontSize:'13px',color:'var(--muted)'}}>{filteredMatches.length} trận · {fWins}W {fLosses}L</span>
        {filteredMatches.length>0 && (
          <span style={{fontSize:'13px',fontWeight:700,color:netElo>0?'var(--green)':netElo<0?'var(--red)':'var(--muted)'}}>
            Tổng Công Đức: {netElo>0?'+':''}{netElo}
          </span>
        )}
      </div>

      {filteredMatches.length===0 ? (
        <div style={{textAlign:'center',padding:'40px',color:'var(--muted)',background:'var(--surface)',borderRadius:'14px',border:'1px solid var(--border)'}}>
          <div style={{fontSize:'32px',marginBottom:'8px'}}>🏓</div>
          <div>Chưa có trận nào phù hợp bộ lọc.</div>
        </div>
      ) : (
        <MatchList matches={filteredMatches} showDel={!!(onEditMatch&&onDeleteMatch)} onDelete={onDeleteMatch} players={players} onEdit={m=>setEditMatch(m)} perspective={player.name}/>
      )}
      {editMatch&&<EditMatchModal match={editMatch} players={players} onClose={()=>setEditMatch(null)} onSave={m=>{onEditMatch&&onEditMatch(m);setEditMatch(null);}}/>}
    </div>
  );
}

/* ─── MATCHES TAB ───────────────────────────────────────── */
function MatchesTab({matches,players,myElo,onAdd,onDelete,onEditMatch}){
  const [typeFilter,setTypeFilter]=useState('Tất cả');
  const [monthFilter,setMonthFilter]=useState('Tất cả');
  const [playerFilter,setPlayerFilter]=useState('Tất cả');
  const [editMatch,setEditMatch]=useState(null);

  // extract unique months from match dates (DD/MM or DD-MM)
  const months=useMemo(()=>{
    const s=new Set();
    matches.forEach(m=>{
      const parts=m.date.split(/[\/\-]/);
      if(parts.length>=2) s.add(parts[1]);
    });
    return ['Tất cả',...[...s].sort((a,b)=>parseInt(a)-parseInt(b)).map(m=>`Tháng ${m}`)];
  },[matches]);

  const playerNames=['Tất cả',...players.map(p=>p.name)];

  const filtered=useMemo(()=>{
    return matches.filter(m=>{
      if(typeFilter!=='Tất cả'&&m.type!==typeFilter) return false;
      if(monthFilter!=='Tất cả'){
        const mon=monthFilter.replace('Tháng ','');
        const parts=m.date.split(/[\/\-]/);
        if(parts.length<2||parts[1]!==mon) return false;
      }
      if(playerFilter!=='Tất cả'){
        const all=[...(m.team1Players||[]),...(m.team2Players||[])];
        if(!all.includes(playerFilter)) return false;
      }
      return true;
    });
  },[matches,typeFilter,monthFilter,playerFilter]);

  // Khi có lọc theo người: tính W/L theo đúng góc nhìn của người đó
  // (m.result luôn theo Đội A, nên nếu người này ở Đội B thì phải đảo lại).
  const wins = playerFilter!=='Tất cả'
    ? filtered.filter(m=>{
        const inT1 = (m.team1Players||[]).includes(playerFilter);
        return inT1 ? m.result==='W' : m.result==='L';
      }).length
    : filtered.filter(m=>m.result==='W').length;
  const losses = filtered.length - wins;
  const winRate = filtered.length ? Math.round((wins/filtered.length)*100) : 0;

  return <>
    <div className="match-header">
      <div className="section-title">Lịch sử trận đấu</div>
      <div style={{display:'flex',gap:'6px'}}>
        <button onClick={()=>exportCSV(matches,players)} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--muted)',padding:'7px 12px',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>📥 Xuất CSV</button>
        <button className="btn-ghi" onClick={onAdd}>+ Ghi trận</button>
      </div>
    </div>
    <EloCard myElo={myElo}/>
    <EloChart players={players} matches={matches}/>

    {/* Filters */}
    <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'12px 14px',marginBottom:'14px'}}>
      <div style={{fontSize:'11px',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.6px',marginBottom:'10px'}}>🔍 Lọc trận</div>
      <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
        <div style={{flex:'1 1 130px'}}>
          <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'5px'}}>Loại trận</div>
          <select className="fi" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
            {['Tất cả','Đơn','Đôi'].map(t=><option key={t}>{t}</option>)}
          </select>
        </div>
        <div style={{flex:'1 1 130px'}}>
          <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'5px'}}>Theo tháng</div>
          <select className="fi" value={monthFilter} onChange={e=>setMonthFilter(e.target.value)}>
            {months.map(m=><option key={m}>{m}</option>)}
          </select>
        </div>
        <div style={{flex:'1 1 130px'}}>
          <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'5px'}}>Theo người</div>
          <select className="fi" value={playerFilter} onChange={e=>setPlayerFilter(e.target.value)}>
            {playerNames.map(n=><option key={n}>{n}</option>)}
          </select>
        </div>
      </div>
    </div>

    {playerFilter!=='Tất cả' && filtered.length>0 && (
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'14px 16px',marginBottom:'14px',display:'flex',alignItems:'center',gap:'16px'}}>
        <div style={{position:'relative',width:'56px',height:'56px',flexShrink:0}}>
          <svg width="56" height="56" viewBox="0 0 56 56" style={{transform:'rotate(-90deg)'}}>
            <circle cx="28" cy="28" r="24" fill="none" stroke="var(--border)" strokeWidth="6"/>
            <circle cx="28" cy="28" r="24" fill="none" stroke={winRate>=50?'var(--green)':'var(--red)'} strokeWidth="6"
              strokeDasharray={`${2*Math.PI*24}`} strokeDashoffset={`${2*Math.PI*24*(1-winRate/100)}`} strokeLinecap="round"/>
          </svg>
          <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Quicksand,sans-serif',fontWeight:700,fontSize:'13px'}}>{winRate}%</div>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'2px'}}>Thống kê của <b style={{color:'var(--text)'}}>{playerFilter}</b></div>
          <div style={{display:'flex',gap:'14px',fontSize:'13px'}}>
            <span style={{color:'var(--green)',fontWeight:700}}>{wins} thắng</span>
            <span style={{color:'var(--red)',fontWeight:700}}>{losses} thua</span>
            <span style={{color:'var(--muted)'}}>{filtered.length} trận</span>
          </div>
        </div>
      </div>
    )}

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
      <span style={{fontSize:'13px',color:'var(--muted)'}}>{filtered.length} trận · {wins}W {losses}L</span>
    </div>
    <MatchList matches={filtered} showDel={true} onDelete={onDelete} players={players} onEdit={m=>setEditMatch(m)} perspective={playerFilter!=='Tất cả'?playerFilter:null}/>
    {editMatch&&<EditMatchModal match={editMatch} players={players} onClose={()=>setEditMatch(null)} onSave={m=>{onEditMatch(m);setEditMatch(null);}}/>}
  </>;
}

/* ─── LEADERBOARD ───────────────────────────────────────── */
function LeaderboardTab({players,matches,members,onAddPlayer,onDeletePlayer,onRenamePlayer,onViewHistory,isAdmin}){
  const [bxhSeg,setBxhSeg]=useState('bxh');
  const [h2hA,setH2hA]=useState('');
  const [h2hB,setH2hB]=useState('');
  const [showAddPlayer,setShowAddPlayer]=useState(false);
  const [newName,setNewName]=useState('');
  const [newElo,setNewElo]=useState('1500');
  const [addPlayerError,setAddPlayerError]=useState('');
  const [search,setSearch]=useState('');
  const [showAllTiers,setShowAllTiers]=useState(false);
  const [monthFilter,setMonthFilter]=useState('all');
  const [confirmDeletePlayer,setConfirmDeletePlayer]=useState(null);
  const [renamingId,setRenamingId]=useState(null);
  const [renameVal,setRenameVal]=useState('');
  const [renameError,setRenameError]=useState('');

  // Danh sách các tháng có dữ liệu trận đấu (để hiện trong dropdown lọc)
  const availableMonths=useMemo(()=>{
    const set=new Set();
    matches.forEach(m=>{
      const mm=parseMatchMonth(m.date);
      if(mm) set.add(mm);
    });
    return [...set].sort();
  },[matches]);

  const monthMatches=useMemo(()=>{
    if(monthFilter==='all') return matches;
    return matches.filter(m=>parseMatchMonth(m.date)===monthFilter);
  },[matches,monthFilter]);

  // Tính lại thắng/thua/tổng trận theo phạm vi lọc (tất cả hoặc theo tháng) — không dùng trực tiếp p.wins/p.losses lũy kế
  const statsForRange=useMemo(()=>{
    const map={};
    players.forEach(p=>{ map[p.name]={wins:0,losses:0}; });
    monthMatches.forEach(m=>{
      (m.eloChanges||[]).forEach(({name,delta})=>{
        if(!map[name]) map[name]={wins:0,losses:0};
        if(delta>0) map[name].wins++;
        else if(delta<0) map[name].losses++;
      });
    });
    return map;
  },[players,monthMatches]);

  const filteredSorted=useMemo(()=>{
    let list=[...players].sort((a,b)=>b.elo-a.elo);
    if(search.trim()){
      const q=search.trim().toLowerCase();
      list=list.filter(p=>p.name.toLowerCase().includes(q));
    }
    return list;
  },[players,search]);

  // Tổng kết toàn CLB cho phạm vi đang lọc
  const clubSummary=useMemo(()=>{
    let totalWins=0,totalLosses=0;
    Object.values(statsForRange).forEach(s=>{ totalWins+=s.wins; totalLosses+=s.losses; });
    return {totalMatches:monthMatches.length, totalWins, totalLosses};
  },[statsForRange,monthMatches]);

  const sorted=filteredSorted;
  const maxElo=sorted.length?sorted[0].elo:1600;
  const minElo=1400;

  const doRename=(p)=>{
    const nn=renameVal.trim();
    if(!nn){ setRenameError('Vui lòng nhập tên'); return; }
    if(nn===p.name){ setRenamingId(null); return; }
    if(isNameTaken(nn, players, members, p.name)){ setRenameError('Tên này đã tồn tại, hãy chọn tên khác'); return; }
    onRenamePlayer(p.name, nn, p.id);
    setRenamingId(null);
    setRenameError('');
  };

  // head-to-head
  const h2hData=useMemo(()=>{
    if(!h2hA||!h2hB) return null;
    const relevant=matches.filter(m=>{
      const allP=[...(m.team1Players||[]),(m.team2Players||[])];
      return (m.team1Players||[]).includes(h2hA)&&(m.team2Players||[]).includes(h2hB)||
             (m.team1Players||[]).includes(h2hB)&&(m.team2Players||[]).includes(h2hA);
    });
    let wA=0,wB=0;
    relevant.forEach(m=>{
      const aInT1=(m.team1Players||[]).includes(h2hA);
      if(aInT1&&m.result==='W') wA++;
      else if(!aInT1&&m.result==='L') wA++;
      else wB++;
    });
    return {matches:relevant,wA,wB};
  },[h2hA,h2hB,matches]);

  return <>
    {/* Segment */}
    <div style={{display:'flex',background:'var(--surface)',borderRadius:'10px',padding:'4px',gap:'4px',marginBottom:'16px',width:'fit-content'}}>
      {[['bxh','🏆 Bảng Công Đức'],['h2h','⚔️ Đối Đầu']].map(([id,lb])=>(
        <button key={id} onClick={()=>setBxhSeg(id)} className={`seg-btn${bxhSeg===id?' active':''}`}>{lb}</button>
      ))}
    </div>

    {bxhSeg==='bxh' && <>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px',flexWrap:'wrap',gap:'8px'}}>
        <div className="section-title">🏆 Bảng Công Đức (Rating)</div>
        {isAdmin && <button onClick={()=>setShowAddPlayer(!showAddPlayer)} style={{background:'var(--green-bg)',border:'1px solid var(--green)',borderRadius:'8px',color:'var(--green)',padding:'6px 14px',fontSize:'12px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>+ Thêm người chơi</button>}
      </div>

      {showAddPlayer && (
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'14px',marginBottom:'14px'}}>
          <div style={{display:'flex',gap:'10px',alignItems:'flex-end',marginBottom:'0'}}>
            <div className="fg" style={{flex:2}}><label className="fl">Tên người chơi</label><input className="fi" value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Nguyễn Văn A"/></div>
            <div className="fg" style={{flex:1}}>
              <label className="fl">Công đức ban đầu</label>
              <input className="fi" type="number" value={newElo} onChange={e=>setNewElo(e.target.value)} placeholder="1500" min="0" max="3000"/>
            </div>
          </div>
          <div style={{fontSize:'11px',color:'var(--muted)',margin:'6px 0 10px'}}>
            🪷 ≥1810 · 🙏 ≥1750 · 🧧 ≥1690 · 🍀 ≥1630 · 🕯️ ≥1570 · ☯️ ≥1510 · 🍂 &lt;1510
          </div>
          {addPlayerError && <div style={{fontSize:'12px',color:'var(--red)',marginBottom:'10px'}}>⚠️ {addPlayerError}</div>}
          <div style={{display:'flex',gap:'8px'}}>
            <button className="btn-save" style={{flex:1}} onClick={()=>{
              const nm=newName.trim();
              if(!nm){ setAddPlayerError('Vui lòng nhập tên'); return; }
              if(isNameTaken(nm, players, members)){ setAddPlayerError('Tên này đã tồn tại trong CLB, hãy chọn tên khác'); return; }
              onAddPlayer(nm,newElo);setNewName('');setNewElo('1500');setShowAddPlayer(false);setAddPlayerError('');
            }}>Thêm</button>
            <button className="btn-cancel" onClick={()=>{setShowAddPlayer(false);setNewElo('1500');setAddPlayerError('');}}>Hủy</button>
          </div>
        </div>
      )}

      {/* Tìm kiếm + lọc tháng */}
      <div style={{display:'flex',gap:'8px',marginBottom:'12px',flexWrap:'wrap'}}>
        <div style={{position:'relative',flex:'1 1 200px'}}>
          <span style={{position:'absolute',left:'12px',top:'50%',transform:'translateY(-50%)',fontSize:'13px',color:'var(--muted)',pointerEvents:'none'}}>🔍</span>
          <input
            className="fi"
            style={{paddingLeft:'32px'}}
            value={search}
            onChange={e=>setSearch(e.target.value)}
            placeholder="Tìm tên người chơi..."
          />
        </div>
        <select className="month-sel" value={monthFilter} onChange={e=>setMonthFilter(e.target.value)} style={{flex:'0 0 auto'}}>
          <option value="all">📅 Tất cả thời gian</option>
          {availableMonths.map(mm=><option key={mm} value={mm}>Tháng {mm}</option>)}
        </select>
      </div>

      {/* Tổng kết */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:'14px'}}>
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'10px',padding:'10px',textAlign:'center'}}>

      <div style={{marginBottom:'12px'}}>
        <div style={{display:'flex',gap:'6px',flexWrap:'wrap',alignItems:'center'}}>

              <div style={{textAlign:'center',fontSize:'13px',fontWeight:700}}>
                <span style={{color:'var(--green)'}}>{rangeStats.wins}</span>
                <span style={{color:'var(--muted)',fontWeight:500}}> / </span>
                <span style={{color:'var(--red)'}}>{rangeStats.losses}</span>

              <div style={{display:'flex',gap:'4px',alignItems:'center',justifyContent:'flex-end'}}>
                {isAdmin && !isRenaming && <button onClick={()=>{setRenamingId(p.id);setRenameVal(p.name);setRenameError('');}} style={{background:'none',border:'none',color:'var(--muted2)',cursor:'pointer',fontSize:'12px',opacity:.5,padding:'0'}} title="Sửa tên">✏️</button>}
                {isAdmin && <button onClick={()=>setConfirmDeletePlayer(p.id)} style={{background:'none',border:'none',color:'var(--muted2)',cursor:'pointer',fontSize:'13px',opacity:.5,padding:'0'}} title="Xóa">✕</button>}
              </div>

      </div>
      {confirmDeletePlayer&&<ConfirmModal
        msg={`Xóa người chơi "${players.find(p=>p.id===confirmDeletePlayer)?.name}"? Toàn bộ dữ liệu Công Đức và lịch sử người này sẽ bị xóa.`}
        onConfirm={()=>{onDeletePlayer(confirmDeletePlayer);setConfirmDeletePlayer(null);}}
        onClose={()=>setConfirmDeletePlayer(null)}
      />}

      {/* ── HUY HIỆU CLB (gộp vào BXH) ── */}
      <div style={{marginTop:'24px'}}>
        <div className="fun-section-title" style={{marginTop:0}}>🏅 Huy Hiệu CLB</div>
        <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'12px',marginTop:'-10px'}}>Tap vào huy hiệu để xem ý nghĩa & điều kiện đạt được</div>
        {players.length===0 ? (
          <div style={{textAlign:'center',padding:'32px',color:'var(--muted)',background:'var(--surface)',borderRadius:'14px',border:'1px solid var(--border)'}}>
            <div style={{fontSize:'32px',marginBottom:'8px'}}>🏅</div>
            <div>Thêm người chơi và ghi trận để xét huy hiệu.</div>
          </div>
        ) : (
          <BadgeSection players={sorted} matches={matches}/>
        )}
      </div>
    </>}

    {bxhSeg==='h2h' && <>
      <div className="section-title" style={{marginBottom:'14px'}}>⚔️ Đối Đầu Trực Tiếp</div>
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'16px',marginBottom:'16px'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:'12px',alignItems:'center'}}>
          <div>
            <div className="fl" style={{marginBottom:'6px'}}>Người / Đội A</div>
            <select className="fi" value={h2hA} onChange={e=>setH2hA(e.target.value)}>
              <option value="">-- Chọn --</option>
              {players.map(p=><option key={p.id}>{p.name}</option>)}
            </select>
          </div>
          <div style={{textAlign:'center',fontFamily:'Quicksand',fontWeight:700,color:'var(--orange)',fontSize:'18px'}}>VS</div>
          <div>
            <div className="fl" style={{marginBottom:'6px'}}>Người / Đội B</div>
            <select className="fi" value={h2hB} onChange={e=>setH2hB(e.target.value)}>
              <option value="">-- Chọn --</option>
              {players.map(p=><option key={p.id}>{p.name}</option>)}
            </select>
          </div>
        </div>
      </div>

      {h2hData && h2hA && h2hB && h2hA!==h2hB && (
        <>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'16px'}}>
            <div style={{background:'var(--green-bg)',border:'1px solid var(--green)',borderRadius:'12px',padding:'16px',textAlign:'center'}}>
              <div style={{fontSize:'11px',color:'var(--green)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.7px',marginBottom:'6px'}}>{h2hA}</div>
              <div style={{fontFamily:'Quicksand',fontSize:'36px',fontWeight:800,color:'var(--green)'}}>{h2hData.wA}</div>
              <div style={{fontSize:'11px',color:'var(--muted)'}}>trận thắng</div>
            </div>
            <div style={{background:'var(--red-bg)',border:'1px solid var(--red)',borderRadius:'12px',padding:'16px',textAlign:'center'}}>
              <div style={{fontSize:'11px',color:'var(--red)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.7px',marginBottom:'6px'}}>{h2hB}</div>
              <div style={{fontFamily:'Quicksand',fontSize:'36px',fontWeight:800,color:'var(--red)'}}>{h2hData.wB}</div>
              <div style={{fontSize:'11px',color:'var(--muted)'}}>trận thắng</div>

          <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'12px',marginBottom:'8px',textAlign:'center'}}>
            <span style={{fontSize:'13px',color:'var(--muted)'}}>Tổng {h2hData.matches.length} trận đã gặp nhau</span>
            {h2hData.matches.length>0 && <span style={{marginLeft:'12px',fontWeight:700,color:h2hData.wA>h2hData.wB?'var(--green)':h2hData.wA<h2hData.wB?'var(--red)':'var(--yellow)'}}>
              {h2hData.wA>h2hData.wB?`${h2hA} đang dẫn`:h2hData.wA<h2hData.wB?`${h2hB} đang dẫn`:'Hoà bằng nhau'}

          <div className="match-list">

                </div>

/* ─── SO KEO TAB ─────────────────────────────────────────── */

function SoKeoTab({players, matches}){
  const [mode,setMode]=useState('doi'); // 'don' | 'doi'
  const [mainTab,setMainTab]=useState('sokeo'); // 'sokeo' | 'partner' 
  // Đơn
  const [pA,setPa]=useState('');
  const [pB,setPb]=useState('');
  // Đôi
  const [d1a,setD1a]=useState('');
  const [d1b,setD1b]=useState('');
  const [d2a,setD2a]=useState('');
  const [d2b,setD2b]=useState('');
  // Partner analysis
  const [partnerFor,setPartnerFor]=useState('');
  // H2H expanded
  const [h2hExpanded,setH2hExpanded]=useState(false);

  const pOpts=players.map(p=>p.name);
  const sel=(val,fn,exclude=[])=>(
    <select className="fi" value={val} onChange={e=>fn(e.target.value)}>
      <option value="">-- Chọn --</option>
      {pOpts.filter(n=>!exclude.includes(n)).map(n=><option key={n}>{n}</option>)}
    </select>
  );

  const analysis = useMemo(()=>{
    if(mode==='don'){
      const pa=players.find(p=>p.name===pA), pb=players.find(p=>p.name===pB);
      if(!pa||!pb||pa===pb) return null;
      const diff=pa.elo-pb.elo;
      const winPctA=Math.round(1/(1+Math.pow(10,-diff/400))*100);
      // handicap: số quả chấp (mỗi 50 ELO ~ 1 quả chấp trong pickleball)
      const handicap=Math.round(Math.abs(diff)/60);
      const stronger=diff>0?pa:pb;
      const weaker=diff>0?pb:pa;
      // h2h
      const h2h=matches.filter(m=>{
        return (m.team1Players||[]).includes(pa.name)&&(m.team2Players||[]).includes(pb.name)||
               (m.team1Players||[]).includes(pb.name)&&(m.team2Players||[]).includes(pa.name);
      });
      let wA=0,wB=0;
      h2h.forEach(m=>{
        const aInT1=(m.team1Players||[]).includes(pa.name);
        if(aInT1&&m.result==='W') wA++;
        else if(!aInT1&&m.result==='L') wA++;
        else wB++;
      });
      return {type:'don',pa,pb,diff:Math.abs(diff),winPctA,winPctB:100-winPctA,handicap,stronger,weaker,h2h,wA,wB,
        quality:Math.max(0,100-Math.round(Math.abs(diff)/8))};
    } else {
      const pa=players.find(p=>p.name===d1a),pb=players.find(p=>p.name===d1b);
      const pc=players.find(p=>p.name===d2a),pd=players.find(p=>p.name===d2b);
      if(!pa||!pc) return null;
      const elo1=Math.round((pa.elo+(pb?.elo||pa.elo))/2);
      const elo2=Math.round((pc.elo+(pd?.elo||pc.elo))/2);
      const diff=elo1-elo2;
      const winPct1=Math.round(1/(1+Math.pow(10,-diff/400))*100);
      const handicap=Math.round(Math.abs(diff)/60);
      const t1=[pa,pb].filter(Boolean), t2=[pc,pd].filter(Boolean);
      const stronger=diff>0?t1.map(p=>p.name).join(' & '):t2.map(p=>p.name).join(' & ');
      const weaker=diff>0?t2.map(p=>p.name).join(' & '):t1.map(p=>p.name).join(' & ');
      // h2h for team
      const h2h=matches.filter(m=>{
        const t1p=m.team1Players||[], t2p=m.team2Players||[];
        return (t1p.includes(d1a)||t1p.includes(d1b||'__'))&&(t2p.includes(d2a)||t2p.includes(d2b||'__'))||
               (t2p.includes(d1a)||t2p.includes(d1b||'__'))&&(t1p.includes(d2a)||t1p.includes(d2b||'__'));
      });
      return {type:'doi',t1,t2,elo1,elo2,diff:Math.abs(diff),winPct1,winPct2:100-winPct1,handicap,stronger,weaker,h2h,
        quality:Math.max(0,100-Math.round(Math.abs(diff)/8))};
    }
  },[mode,pA,pB,d1a,d1b,d2a,d2b,players,matches]);

  const qColor=q=>q>=75?'var(--green)':q>=50?'var(--yellow)':'var(--red)';

  // Partner analysis: tính tỷ lệ thắng khi ghép đôi với từng người
  const partnerStats = useMemo(()=>{
    if(!partnerFor) return [];
    return players.filter(p=>p.name!==partnerFor).map(partner=>{
      const paired = matches.filter(m=>{
        if(m.type!=='Đôi') return false;
        const t1=m.team1Players||[], t2=m.team2Players||[];
        return (t1.includes(partnerFor)&&t1.includes(partner.name))||
               (t2.includes(partnerFor)&&t2.includes(partner.name));
      });
      let wins=0;
      paired.forEach(m=>{
        const inT1=(m.team1Players||[]).includes(partnerFor);
        if((inT1&&m.result==='W')||(!inT1&&m.result==='L')) wins++;
      });
      const total=paired.length;
      const wr=total>0?Math.round(wins/total*100):null;
      return {name:partner.name, color:partner.color, avatar:partner.avatar, elo:partner.elo, wins, total, wr, matches:paired};
    }).sort((a,b)=>{
      // Ưu tiên: có trận nhiều nhất trước, sau đó tỷ lệ thắng
      if(b.total!==a.total) return b.total-a.total;
      return (b.wr||0)-(a.wr||0);
    });
  },[partnerFor,players,matches]);

  return <>
    <div className="section-title" style={{marginBottom:'16px'}}>⚔️ So Kèo & Đánh Giá Chấp</div>

    {/* Main tab toggle */}
    <div style={{display:'flex',gap:'6px',marginBottom:'16px'}}>
      {[['sokeo','⚔️ So Kèo'],['partner','🤝 Người Ăn Ý']].map(([id,lb])=>(
        <button key={id} onClick={()=>setMainTab(id)} style={{flex:1,padding:'10px',borderRadius:'10px',border:'1px solid',fontSize:'13px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontWeight:600,transition:'.15s',
          borderColor:mainTab===id?'var(--purple)':'var(--border)',
          background:mainTab===id?'var(--purple-bg)':'var(--surface)',
          color:mainTab===id?'var(--purple)':'var(--muted)'}}>
          {lb}
        </button>
      ))}
    </div>

    {/* ── PARTNER TAB ── */}
    {mainTab==='partner' && <>
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',padding:'16px',marginBottom:'16px'}}>
        <div className="fl" style={{marginBottom:'8px'}}>🎯 Chọn người muốn xem</div>
        <select className="fi" value={partnerFor} onChange={e=>setPartnerFor(e.target.value)}>
          <option value="">-- Chọn người chơi --</option>
          {players.map(p=><option key={p.name} value={p.name}>{p.name}</option>)}
        </select>
      </div>

      {partnerFor && partnerStats.length>0 && (
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'14px',overflow:'hidden',marginBottom:'16px'}}>
          <div style={{padding:'12px 16px',background:'var(--bg3)',borderBottom:'1px solid var(--border)',fontSize:'12px',color:'var(--muted)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.6px'}}>
            🤝 Khi {partnerFor.split(' ').slice(-2).join(' ')} đánh đôi cùng...
          </div>
          {partnerStats.map((p,i)=>{
            const hasData=p.total>0;
            const wrColor=!hasData?'var(--muted)':p.wr>=60?'var(--green)':p.wr>=40?'var(--yellow)':'var(--red)';
            return (
              <div key={p.name} style={{padding:'13px 16px',borderBottom:i<partnerStats.length-1?'1px solid var(--border)':'none',display:'flex',alignItems:'center',gap:'12px'}}>
                {/* Avatar */}
                <div style={{width:38,height:38,borderRadius:'50%',background:p.avatar?'transparent':p.color+'22',color:p.color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:'13px',flexShrink:0,overflow:'hidden'}}>
                  {p.avatar?<img src={p.avatar} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:p.name.split(' ').slice(-2).map(w=>w[0]).join('').toUpperCase()}
                </div>
                {/* Name + bar */}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:'14px',marginBottom:'5px'}}>{p.name}</div>
                  {hasData ? (
                    <>
                      <div style={{height:'5px',background:'var(--bg3)',borderRadius:'3px',overflow:'hidden',marginBottom:'3px'}}>
                        <div style={{height:'100%',width:p.wr+'%',background:wrColor,borderRadius:'3px',transition:'width .4s ease'}}/>
                      </div>
                      <div style={{fontSize:'11px',color:'var(--muted)'}}>{p.wins} thắng / {p.total} trận</div>
                    </>
                  ) : (

/* ─── EDIT SESSION MODAL ─────────────────────────────────── */
function EditSessionModal({session,members,onClose,onSave}){
  const [date,setDate]=useState(session.date||'');
  const [total,setTotal]=useState(String(session.total||''));
  const [note,setNote]=useState(session.note||'');
  const [xeVeCount,setXeVeCount]=useState(String(session.xeVeCount||1));
  // attendees: copy from session, default all false if missing
  const initAtt=()=>{
    const obj={};
    members.forEach(m=>{ obj[m.name]=!!(session.attendees?.[m.name]); });
    return obj;
  };
  const [attendees,setAttendees]=useState(initAtt);
  const toggle=name=>setAttendees(p=>({...p,[name]:!p[name]}));

  const attending=Object.entries(attendees).filter(([,v])=>v).map(([k])=>k);
  const xeVeOn=attending.includes('Xé Vé');
  const xeVeCnt=xeVeOn?Math.max(1,parseInt(xeVeCount)||1):0;
  const others=attending.filter(n=>n!=='Xé Vé').length;
  const shares=others+xeVeCnt;
  const perPerson=shares>0&&total?Math.round(parseInt(total)/shares):0;

  const save=()=>{
    if(!date||!total) return;
    onSave({
      ...session,
      date,
      total:parseInt(total),
      note,
      attendees,
      players:attending.length,
      xeVeCount:xeVeOn?xeVeCnt:undefined,
    });
  };

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:480}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">✏️ Sửa buổi chơi</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>

        <div className="form-grid" style={{marginBottom:'12px'}}>
          <div className="fg"><label className="fl">📅 Ngày</label><DateInput value={date} onChange={setDate}/></div>
          <div className="fg"><label className="fl">Tổng tiền (VNĐ)</label><MoneyInput value={total} onChange={setTotal} placeholder="380,000"/></div>
        </div>

        {/* Xé Vé count */}
        {xeVeOn&&(
          <div style={{background:'var(--bg3)',borderRadius:'10px',padding:'10px 12px',marginBottom:'10px',border:'1px solid var(--border)'}}>
            <div style={{fontSize:'12px',color:'var(--yellow)',fontWeight:600,marginBottom:'8px'}}>🎫 Xé vé tùy biến</div>
            <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
              <label className="fl" style={{whiteSpace:'nowrap'}}>Số người xé vé:</label>
              <input className="fi" type="number" min="1" value={xeVeCount} onChange={e=>setXeVeCount(e.target.value)} placeholder="2" style={{width:'70px',padding:'5px 8px',fontSize:'13px'}}/>
            </div>
          </div>
        )}

        {/* Attendees */}
        <div style={{marginBottom:'10px'}}>
          <div className="fl" style={{marginBottom:'8px'}}>Ai đi buổi này? ({attending.length} người)</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
            {members.map(m=>{
              const on=!!attendees[m.name];
              return(
                <button key={m.name} onClick={()=>toggle(m.name)} style={{
                  padding:'5px 12px',borderRadius:'20px',border:'1px solid',fontSize:'12px',cursor:'pointer',fontFamily:'Nunito,sans-serif',transition:'.15s',
                  borderColor:on?m.color:'var(--border)',
                  background:on?m.color+'33':'transparent',
                  color:on?m.color:'var(--muted)',fontWeight:on?600:400
                }}>{m.name}</button>
              );
            })}
          </div>
          {total&&attending.length>0&&(
            <div style={{marginTop:'8px',fontSize:'12px',color:'var(--green)',fontWeight:600}}>
              Mỗi người: {fmt(perPerson)}{xeVeOn&&xeVeCnt>1?` · Nhóm Xé Vé (${xeVeCnt} người) tổng: ${fmt(perPerson*xeVeCnt)}`:''}
            </div>
          )}
        </div>

        <div className="fg" style={{marginBottom:'12px'}}>
          <label className="fl">📝 Ghi chú</label>
          <input className="fi" value={note} onChange={e=>setNote(e.target.value)} placeholder="VD: Sân Hoàng Anh 200k, cầu 150k..."/>
        </div>

        <div className="form-actions">
          <button className="btn-cancel" onClick={onClose}>Hủy</button>
          <button className="btn-save" onClick={save}>💾 Lưu thay đổi</button>
        </div>
      </div>
    </div>
  );
}
