/* ─── LEADERBOARD ───────────────────────────────────────── */
function LeaderboardTab({players,matches,members,sessions,onAddPlayer,onDeletePlayer,onRenamePlayer,onViewHistory,isAdmin,onUpdateElo,showToast}){
  const [bxhSeg,setBxhSeg]=useState('bxh');
  const [h2hA,setH2hA]=useState('');
  const [h2hB,setH2hB]=useState('');
  const [showAddPlayer,setShowAddPlayer]=useState(false);
  const [newName,setNewName]=useState('');
  const [newElo,setNewElo]=useState('1500');
  const [addPlayerError,setAddPlayerError]=useState('');
  const [search,setSearch]=useState('');
  const [showAllTiers,setShowAllTiers]=useState(false);
  const [monthFilter,setMonthFilter]=useState('all');
  const [confirmDeletePlayer,setConfirmDeletePlayer]=useState(null);
  const [renamingId,setRenamingId]=useState(null);
  const [renameVal,setRenameVal]=useState('');
  const [renameError,setRenameError]=useState('');
  const [editingEloId,setEditingEloId]=useState(null);
  const [editingEloVal,setEditingEloVal]=useState('');

  // Danh sách các tháng có dữ liệu trận đấu (để hiện trong dropdown lọc)
  const availableMonths=useMemo(()=>{
    const set=new Set();
    matches.forEach(m=>{
      const mm=parseMatchMonth(m.date);
      if(mm) set.add(mm);
    });
    return [...set].sort();
  },[matches]);

  const monthMatches=useMemo(()=>{
    if(monthFilter==='all') return matches;
    return matches.filter(m=>parseMatchMonth(m.date)===monthFilter);
  },[matches,monthFilter]);

  // Tính lại thắng/thua/tổng trận theo phạm vi lọc (tất cả hoặc theo tháng) — không dùng trực tiếp p.wins/p.losses lũy kế
  const statsForRange=useMemo(()=>{
    const map={};
    players.forEach(p=>{ map[p.name]={wins:0,losses:0}; });
    monthMatches.forEach(m=>{
      (m.eloChanges||[]).forEach(({name,delta})=>{
        if(!map[name]) map[name]={wins:0,losses:0};
        if(delta>0) map[name].wins++;
        else if(delta<0) map[name].losses++;
      });
    });
    return map;
  },[players,monthMatches]);

  // Chuỗi buổi chơi liên tiếp — Cách A
  const sessionStreaks=useMemo(()=>computeSessionStreaks(players,sessions),[players,sessions]);

  const filteredSorted=useMemo(()=>{
    // Chỉ hiện những người chơi đã có lịch sử đánh (đã có ít nhất 1 trận thắng/thua
    // trong phạm vi đang lọc) — người mới thêm nhưng chưa đánh trận nào sẽ không hiện ở BXH.
    let list=[...players].filter(p=>{
      const s=statsForRange[p.name]||{wins:0,losses:0};
      return (s.wins+s.losses)>0;
    }).sort((a,b)=>b.elo-a.elo);
    if(search.trim()){
      const q=search.trim().toLowerCase();
      list=list.filter(p=>p.name.toLowerCase().includes(q));
    }
    return list;
  },[players,search,statsForRange]);

  // Tổng kết toàn CLB cho phạm vi đang lọc
  const clubSummary=useMemo(()=>{
    let totalWins=0,totalLosses=0;
    Object.values(statsForRange).forEach(s=>{ totalWins+=s.wins; totalLosses+=s.losses; });
    return {totalMatches:monthMatches.length, totalWins, totalLosses};
  },[statsForRange,monthMatches]);

  const sorted=filteredSorted;
  const maxElo=sorted.length?sorted[0].elo:1600;
  const minElo=1400;

  const doRename=(p)=>{
    const nn=renameVal.trim();
    if(!nn){ setRenameError('Vui lòng nhập tên'); return; }
    if(nn===p.name){ setRenamingId(null); return; }
    if(isNameTaken(nn, players, members, p.name)){ setRenameError('Tên này đã tồn tại, hãy chọn tên khác'); return; }
    onRenamePlayer(p.name, nn, p.id);
    setRenamingId(null);
    setRenameError('');
  };

  // head-to-head
  const h2hData=useMemo(()=>{
    if(!h2hA||!h2hB) return null;
    const relevant=matches.filter(m=>{
      const allP=[...(m.team1Players||[]),(m.team2Players||[])];
      return (m.team1Players||[]).includes(h2hA)&&(m.team2Players||[]).includes(h2hB)||
             (m.team1Players||[]).includes(h2hB)&&(m.team2Players||[]).includes(h2hA);
    });
    let wA=0,wB=0;
    relevant.forEach(m=>{
      const aInT1=(m.team1Players||[]).includes(h2hA);
      if(aInT1&&m.result==='W') wA++;
      else if(!aInT1&&m.result==='L') wA++;
      else wB++;
    });
    return {matches:relevant,wA,wB};
  },[h2hA,h2hB,matches]);

  return <>
    {/* Segment */}
    <div style={{display:'flex',background:'var(--surface)',borderRadius:'10px',padding:'4px',gap:'4px',marginBottom:'16px',width:'fit-content'}}>
      {[['bxh','🏆 Bảng Công Đức'],['h2h','⚔️ Đối Đầu'],['members','👤 Thành Viên']].map(([id,lb])=>(
        <button key={id} onClick={()=>setBxhSeg(id)} className={`seg-btn${bxhSeg===id?' active':''}`}>{lb}</button>
      ))}
    </div>

    {bxhSeg==='bxh' && <>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px',flexWrap:'wrap',gap:'8px'}}>
        <div className="section-title">🏆 Bảng Công Đức (Rating)</div>
        {isAdmin && <button onClick={()=>setShowAddPlayer(!showAddPlayer)} style={{background:'var(--green-bg)',border:'1px solid var(--green)',borderRadius:'8px',color:'var(--green)',padding:'6px 14px',fontSize:'12px',fontWeight:600,cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>+ Thêm người chơi</button>}
      </div>

      {showAddPlayer && (
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'14px',marginBottom:'14px'}}>
          <div style={{display:'flex',gap:'10px',alignItems:'flex-end',marginBottom:'0'}}>
            <div className="fg" style={{flex:2}}><label className="fl">Tên người chơi</label><input className="fi" value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Nguyễn Văn A"/></div>
            <div className="fg" style={{flex:1}}>
              <label className="fl">Công đức ban đầu</label>
              <input className="fi" type="number" value={newElo} onChange={e=>setNewElo(e.target.value)} placeholder="1500" min="0" max="3000"/>
            </div>
          </div>
          <div style={{fontSize:'11px',color:'var(--muted)',margin:'6px 0 10px'}}>
            🪷 ≥1810 · 🙏 ≥1750 · 🧧 ≥1690 · 🍀 ≥1630 · 🕯️ ≥1570 · ☯️ ≥1510 · 🍂 &lt;1510
          </div>
          {addPlayerError && <div style={{fontSize:'12px',color:'var(--red)',marginBottom:'10px'}}>⚠️ {addPlayerError}</div>}
          <div style={{display:'flex',gap:'8px'}}>
            <button className="btn-save" style={{flex:1}} onClick={()=>{
              const nm=newName.trim();
              if(!nm){ setAddPlayerError('Vui lòng nhập tên'); return; }
              if(isNameTaken(nm, players, members)){ setAddPlayerError('Tên này đã tồn tại trong CLB, hãy chọn tên khác'); return; }
              onAddPlayer(nm,newElo);setNewName('');setNewElo('1500');setShowAddPlayer(false);setAddPlayerError('');
            }}>Thêm</button>
            <button className="btn-cancel" onClick={()=>{setShowAddPlayer(false);setNewElo('1500');setAddPlayerError('');}}>Hủy</button>
          </div>
        </div>
      )}

      {/* Tìm kiếm + lọc tháng */}
      <div style={{display:'flex',gap:'8px',marginBottom:'12px',flexWrap:'wrap'}}>
        <div style={{position:'relative',flex:'1 1 200px'}}>
          <span style={{position:'absolute',left:'12px',top:'50%',transform:'translateY(-50%)',fontSize:'13px',color:'var(--muted)',pointerEvents:'none'}}>🔍</span>
          <input
            className="fi"
            style={{paddingLeft:'32px'}}
            value={search}
            onChange={e=>setSearch(e.target.value)}
            placeholder="Tìm tên người chơi..."
          />
        </div>
        <select className="month-sel" value={monthFilter} onChange={e=>setMonthFilter(e.target.value)} style={{flex:'0 0 auto'}}>
          <option value="all">📅 Tất cả thời gian</option>
          {availableMonths.map(mm=><option key={mm} value={mm}>Tháng {mm}</option>)}
        </select>
      </div>

      {/* Tổng kết */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:'14px'}}>
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'10px',padding:'10px',textAlign:'center'}}>
          <div style={{fontSize:'10px',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'3px'}}>Tổng trận</div>
          <div style={{fontFamily:'Quicksand,sans-serif',fontWeight:700,fontSize:'18px'}}>{clubSummary.totalMatches}</div>
        </div>
        <div style={{background:'var(--green-bg)',border:'1px solid var(--green)',borderRadius:'10px',padding:'10px',textAlign:'center'}}>
          <div style={{fontSize:'10px',color:'var(--green)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'3px'}}>Tổng thắng</div>
          <div style={{fontFamily:'Quicksand,sans-serif',fontWeight:700,fontSize:'18px',color:'var(--green)'}}>{clubSummary.totalWins}</div>
        </div>
        <div style={{background:'var(--red-bg)',border:'1px solid var(--red)',borderRadius:'10px',padding:'10px',textAlign:'center'}}>
          <div style={{fontSize:'10px',color:'var(--red)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'3px'}}>Tổng thua</div>
          <div style={{fontFamily:'Quicksand,sans-serif',fontWeight:700,fontSize:'18px',color:'var(--red)'}}>{clubSummary.totalLosses}</div>
        </div>
      </div>

      {/* Tier legend */}
      <div style={{marginBottom:'12px'}}>
        <div style={{display:'flex',gap:'6px',flexWrap:'wrap',alignItems:'center'}}>
          {TIERS.slice(0,4).map(t=>(
            <span key={t.label} style={{fontSize:'11px',padding:'3px 10px',borderRadius:'20px',background:t.bg,color:t.color,fontWeight:600}}>
              {t.icon} {t.label} {t.min>0?`≥${t.min}`:''}
            </span>
          ))}
        </div>
        <div className={`expand-region ${showAllTiers?'expanded':'collapsed'}`}>
          <div style={{display:'flex',gap:'6px',flexWrap:'wrap',alignItems:'center',paddingTop:'6px'}}>
            {TIERS.slice(4).map(t=>(
              <span key={t.label} style={{fontSize:'11px',padding:'3px 10px',borderRadius:'20px',background:t.bg,color:t.color,fontWeight:600}}>
                {t.icon} {t.label} {t.min>0?`≥${t.min}`:''}
              </span>
            ))}
          </div>
        </div>
        {TIERS.length>4 && (
          <button className="btn-expand" onClick={()=>setShowAllTiers(v=>!v)}>
            {showAllTiers?'▲ Thu gọn':`🏅 Xem thêm ${TIERS.length-4} hạng`}
          </button>
        )}
        {(() => {
          if(showAllTiers || !search.trim() || sorted.length!==1) return null;
          const found = sorted[0];
          const foundTier = getTier(found.elo);
          const inTop4 = TIERS.slice(0,4).some(t=>t.label===foundTier.label);
          if(inTop4) return null;
          return (
            <div style={{marginTop:'8px',fontSize:'11px',color:'var(--muted)'}}>
              Hạng của {found.name}: <span style={{padding:'3px 10px',borderRadius:'20px',background:foundTier.bg,color:foundTier.color,fontWeight:600}}>
                {foundTier.icon} {foundTier.label} {foundTier.min>0?`≥${foundTier.min}`:''}
              </span>
            </div>
          );
        })()}
      </div>

      {sorted.length===0 && (
        <div style={{textAlign:'center',padding:'40px',color:'var(--muted)'}}>
          <div style={{fontSize:'32px',marginBottom:'8px'}}>👥</div>
          <div>{search.trim()?'Không tìm thấy người chơi nào.':'Chưa có người chơi nào. Thêm người chơi để bắt đầu!'}</div>
        </div>
      )}

      <div className="bxh-card">
        <div className="bxh-header-row">
          <div>#</div><div>Người chơi</div>
          <div style={{textAlign:'center'}}>Công Đức</div>
          <div style={{textAlign:'center'}}>W/L</div>
          <div></div>
        </div>
        {sorted.map((p,i)=>{
          const rangeStats=statsForRange[p.name]||{wins:0,losses:0};
          const total=rangeStats.wins+rangeStats.losses;
          const barW=maxElo>minElo?Math.round(Math.max(0,(p.elo-minElo)/(maxElo-minElo))*100):50;
          const tier=getTier(p.elo);
          const allBadges=computeBadges(sorted,matches);
          const myBadges=allBadges.filter(b=>b.holder&&b.holder.id===p.id);
          const isRenaming=renamingId===p.id;
          return (
            <div className="bxh-row" key={p.id}>
              <div className={`rank-num${i===0?' r1':i===1?' r2':i===2?' r3':''}`}>
                {i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}
              </div>
              <div className="player-cell">
                <div onClick={()=>!isRenaming&&onViewHistory&&onViewHistory(p)} style={{flexShrink:0,cursor:isRenaming?'default':'pointer'}} title={isRenaming?'':'Xem lịch sử đánh +/- điểm'}>
                  <PlayerAvatar player={p} size={34}/>
                </div>
                <div style={{minWidth:0,flex:1}}>
                  {isRenaming ? (
                    <div style={{display:'flex',gap:'4px',alignItems:'center'}} onClick={e=>e.stopPropagation()}>
                      <input className="fi" style={{padding:'4px 8px',fontSize:'12px',width:'120px'}} value={renameVal} autoFocus
                        onChange={e=>{setRenameVal(e.target.value);setRenameError('');}}
                        onKeyDown={e=>{if(e.key==='Enter')doRename(p);if(e.key==='Escape'){setRenamingId(null);setRenameError('');}}}/>
                      <button onClick={()=>doRename(p)} style={{background:'var(--green)',border:'none',borderRadius:'6px',color:'#fff',padding:'4px 7px',fontSize:'11px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✓</button>
                      <button onClick={()=>{setRenamingId(null);setRenameError('');}} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'6px',color:'var(--muted)',padding:'4px 7px',fontSize:'11px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✕</button>
                    </div>
                  ) : (
                    <div onClick={()=>onViewHistory&&onViewHistory(p)} style={{cursor:'pointer'}} title="Xem lịch sử đánh +/- điểm">
                      <div style={{display:'flex',alignItems:'center',gap:'3px',flexWrap:'wrap'}}>
                        <div className="player-name" style={{fontSize:'13px'}}>{p.name.split(' ').slice(-2).join(' ')}</div>
                        {myBadges.map(b=>(
                          <span key={b.id} title={b.title} style={{fontSize:'12px',cursor:'default'}}>{b.emoji}</span>
                        ))}
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:'4px',marginTop:'2px',flexWrap:'wrap'}}>
                        <div className="elo-bar-wrap" style={{width:'40px',flexShrink:0}}><div className="elo-bar" style={{width:barW+'%'}}/></div>
                        <span style={{fontSize:'9px',padding:'1px 5px',borderRadius:'10px',background:tier.bg,color:tier.color,fontWeight:600,whiteSpace:'nowrap'}}>{tier.icon} {tier.label}</span>
                        {sessionStreaks[p.name]>=2&&<span title={`Chuỗi ${sessionStreaks[p.name]} buổi liên tiếp`} style={{fontSize:'9px',padding:'1px 6px',borderRadius:'10px',background:'rgba(251,146,60,.18)',color:'var(--orange)',fontWeight:700,whiteSpace:'nowrap'}}>🔥 {sessionStreaks[p.name]} buổi</span>}
                      </div>
                    </div>
                  )}
                  {isRenaming && renameError && <div style={{fontSize:'10px',color:'var(--red)',marginTop:'3px'}}>⚠️ {renameError}</div>}
                </div>
              </div>
              <div className="elo-val" style={{fontSize:'14px',cursor:isAdmin?'pointer':'default'}} onClick={()=>{if(isAdmin&&!editingEloId){setEditingEloId(p.id);setEditingEloVal(String(p.elo));}}}>
                {editingEloId===p.id ? (
                  <div onClick={e=>e.stopPropagation()} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'3px'}}>
                    <input type="number" autoFocus value={editingEloVal}
                      onChange={e=>setEditingEloVal(e.target.value)}
                      onKeyDown={e=>{
                        if(e.key==='Enter'){onUpdateElo&&onUpdateElo(p.id,editingEloVal);setEditingEloId(null);}
                        if(e.key==='Escape') setEditingEloId(null);
                      }}
                      style={{width:'64px',textAlign:'center',padding:'3px 4px',fontSize:'13px',borderRadius:'6px',border:'1px solid var(--green)',outline:'none',background:'var(--surface)',color:'var(--text)',fontFamily:'Quicksand,sans-serif',fontWeight:700}}
                    />
                    <div style={{display:'flex',gap:'3px'}}>
                      <button onClick={()=>{onUpdateElo&&onUpdateElo(p.id,editingEloVal);setEditingEloId(null);}} style={{background:'var(--green)',border:'none',borderRadius:'5px',color:'#fff',padding:'2px 7px',fontSize:'10px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✓</button>
                      <button onClick={()=>setEditingEloId(null)} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'5px',color:'var(--muted)',padding:'2px 5px',fontSize:'10px',cursor:'pointer',fontFamily:'Nunito,sans-serif'}}>✕</button>
                    </div>
                  </div>
                ) : (
                  <span title={isAdmin?'Bấm để sửa Công Đức':undefined}>
                    {p.elo}{isAdmin&&<span style={{fontSize:'9px',color:'var(--muted)',marginLeft:'2px',opacity:.5}}>✏️</span>}
                  </span>
                )}
              </div>
              <div style={{textAlign:'center',fontSize:'13px',fontWeight:700}}>
                <span style={{color:'var(--green)'}}>{rangeStats.wins}</span>
                <span style={{color:'var(--muted)',fontWeight:500}}> / </span>
                <span style={{color:'var(--red)'}}>{rangeStats.losses}</span>
              </div>
              <div style={{display:'flex',gap:'4px',alignItems:'center',justifyContent:'flex-end'}}>
                {isAdmin && !isRenaming && <button onClick={()=>{setRenamingId(p.id);setRenameVal(p.name);setRenameError('');}} style={{background:'none',border:'none',color:'var(--muted2)',cursor:'pointer',fontSize:'12px',opacity:.5,padding:'0'}} title="Sửa tên">✏️</button>}
                {isAdmin && <button onClick={()=>setConfirmDeletePlayer(p.id)} style={{background:'none',border:'none',color:'var(--muted2)',cursor:'pointer',fontSize:'13px',opacity:.5,padding:'0'}} title="Xóa">✕</button>}
              </div>
            </div>
          );
        })}
      </div>
      {confirmDeletePlayer&&<ConfirmModal
        msg={`Xóa người chơi "${players.find(p=>p.id===confirmDeletePlayer)?.name}"? Toàn bộ dữ liệu Công Đức và lịch sử người này sẽ bị xóa.`}
        onConfirm={()=>{onDeletePlayer(confirmDeletePlayer);setConfirmDeletePlayer(null);}}
        onClose={()=>setConfirmDeletePlayer(null)}
      />}

      {/* ── HUY HIỆU CLB (gộp vào BXH) ── */}
      <div style={{marginTop:'24px'}}>
        <div className="fun-section-title" style={{marginTop:0}}>🏅 Huy Hiệu CLB</div>
        <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'12px',marginTop:'-10px'}}>Tap vào huy hiệu để xem ý nghĩa & điều kiện đạt được</div>
        {players.length===0 ? (
          <div style={{textAlign:'center',padding:'32px',color:'var(--muted)',background:'var(--surface)',borderRadius:'14px',border:'1px solid var(--border)'}}>
            <div style={{fontSize:'32px',marginBottom:'8px'}}>🏅</div>
            <div>Thêm người chơi và ghi trận để xét huy hiệu.</div>
          </div>
        ) : (
          <BadgeSection players={sorted} matches={matches}/>
        )}
      </div>
    </>}

    {bxhSeg==='h2h' && <>
      <div className="section-title" style={{marginBottom:'14px'}}>⚔️ Đối Đầu Trực Tiếp</div>
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'16px',marginBottom:'16px'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:'12px',alignItems:'center'}}>
          <div>
            <div className="fl" style={{marginBottom:'6px'}}>Người / Đội A</div>
            <select className="fi" value={h2hA} onChange={e=>setH2hA(e.target.value)}>
              <option value="">-- Chọn --</option>
              {players.map(p=><option key={p.id}>{p.name}</option>)}
            </select>
          </div>
          <div style={{textAlign:'center',fontFamily:'Quicksand',fontWeight:700,color:'var(--orange)',fontSize:'18px'}}>VS</div>
          <div>
            <div className="fl" style={{marginBottom:'6px'}}>Người / Đội B</div>
            <select className="fi" value={h2hB} onChange={e=>setH2hB(e.target.value)}>
              <option value="">-- Chọn --</option>
              {players.map(p=><option key={p.id}>{p.name}</option>)}
            </select>
          </div>
        </div>
      </div>

      {h2hData && h2hA && h2hB && h2hA!==h2hB && (
        <>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'16px'}}>
            <div style={{background:'var(--green-bg)',border:'1px solid var(--green)',borderRadius:'12px',padding:'16px',textAlign:'center'}}>
              <div style={{fontSize:'11px',color:'var(--green)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.7px',marginBottom:'6px'}}>{h2hA}</div>
              <div style={{fontFamily:'Quicksand',fontSize:'36px',fontWeight:800,color:'var(--green)'}}>{h2hData.wA}</div>
              <div style={{fontSize:'11px',color:'var(--muted)'}}>trận thắng</div>
            </div>
            <div style={{background:'var(--red-bg)',border:'1px solid var(--red)',borderRadius:'12px',padding:'16px',textAlign:'center'}}>
              <div style={{fontSize:'11px',color:'var(--red)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.7px',marginBottom:'6px'}}>{h2hB}</div>
              <div style={{fontFamily:'Quicksand',fontSize:'36px',fontWeight:800,color:'var(--red)'}}>{h2hData.wB}</div>
              <div style={{fontSize:'11px',color:'var(--muted)'}}>trận thắng</div>
            </div>
          </div>
          <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'12px',marginBottom:'8px',textAlign:'center'}}>
            <span style={{fontSize:'13px',color:'var(--muted)'}}>Tổng {h2hData.matches.length} trận đã gặp nhau</span>
            {h2hData.matches.length>0 && <span style={{marginLeft:'12px',fontWeight:700,color:h2hData.wA>h2hData.wB?'var(--green)':h2hData.wA<h2hData.wB?'var(--red)':'var(--yellow)'}}>
              {h2hData.wA>h2hData.wB?`${h2hA} đang dẫn`:h2hData.wA<h2hData.wB?`${h2hB} đang dẫn`:'Hoà bằng nhau'}
            </span>}
          </div>
          {h2hData.matches.length===0&&<div style={{textAlign:'center',padding:'20px',color:'var(--muted)'}}>Chưa có trận nào giữa 2 người này</div>}
          <div className="match-list">
            {h2hData.matches.map(m=>(
              <div className="match-item" key={m.id}>
                <div className={`result-badge rb-${(m.team1Players||[]).includes(h2hA)?m.result:m.result==='W'?'L':'W'}`}>
                  {(m.team1Players||[]).includes(h2hA)?m.result:m.result==='W'?'L':'W'}
                </div>
                <div>
                  <div className="m-vs">{m.myTeam} vs {m.oppTeam}</div>
                  <div className="m-meta"><span>{m.date}</span><span>{m.type}</span>{m.isStar&&<span style={{color:'#fbbf24',fontWeight:700}}>⭐×2</span>}</div>
                </div>
                <div>
                  <div className="m-score" style={{color:m.result==='W'?'var(--green)':'var(--red)'}}>{m.score1}–{m.score2}</div>
                </div>
                <div/>
              </div>
            ))}
          </div>
        </>
      )}
      {(!h2hA||!h2hB||h2hA===h2hB)&&<div style={{textAlign:'center',padding:'32px',color:'var(--muted)'}}>Chọn 2 người chơi khác nhau để xem lịch sử đối đầu</div>}
    </>}
    {bxhSeg==='members' && <MembersTab players={players} members={members} matches={matches}
      sessions={sessions} isAdmin={isAdmin} onAddPlayer={onAddPlayer}
      onDeletePlayer={onDeletePlayer} onRenamePlayer={onRenamePlayer}
      onUpdateElo={onUpdateElo} onViewHistory={onViewHistory} showToast={showToast}/>}
  </>;
}

/* ─── SO KEO TAB ─────────────────────────────────────────── */

/* ─── GIẢI ĐẤU: Modal nhập tỉ số 1 trận ──────────────────── */
function MatchScoreModal({label, teamAName, teamBName, initialA, initialB, onSave, onClose}){
  const [a,setA]=useState(initialA!==undefined&&initialA!==null?String(initialA):'');
  const [b,setB]=useState(initialB!==undefined&&initialB!==null?String(initialB):'');
  const onKey=e=>{if(e.key==='Enter'&&a!==''&&b!=='') onSave(a,b); if(e.key==='Escape') onClose();};
  return (
    <div style={{
      position:'fixed',bottom:0,left:0,right:0,zIndex:500,
      background:'var(--surface)',borderTop:'2px solid var(--border)',
      borderRadius:'16px 16px 0 0',padding:'14px 16px',
      paddingBottom:'max(20px,env(safe-area-inset-bottom))',
      boxShadow:'0 -6px 28px rgba(0,0,0,.22)',
    }}>
      <div style={{maxWidth:480,margin:'0 auto'}}>

/* ─── GIẢI ĐẤU: Modal sắp xếp lại cặp đấu Vòng 1 ─────────── */
function EditRound1Modal({teams, round0, onClose, onSave}){
  const initial=[];
  round0.forEach(m=>{ initial.push(m.teamA); initial.push(m.teamB); });
  const [slots,setSlots]=useState(initial);

  const setSlot=(idx,teamId)=>{
    setSlots(prev=>{
      const next=[...prev];
      // Nếu đội này đang ở ô khác thì tự đổi chỗ cho nhau, tránh 1 đội bị gán 2 nơi
      const otherIdx=next.findIndex((tid,i)=>i!==idx&&tid===teamId&&teamId);
      if(otherIdx>=0){ next[otherIdx]=next[idx]; }
      next[idx]=teamId;
      return next;
    });
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:480}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">🔀 Sắp xếp lại cặp đấu Vòng 1</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'12px'}}>Chọn lại đội cho từng ô — nếu đội đó đang ở ô khác, 2 đội sẽ tự đổi chỗ cho nhau. Đổi cặp đấu sẽ xoá tỉ số đã nhập của những trận bị ảnh hưởng.</div>
        <div style={{maxHeight:'50vh',overflowY:'auto'}}>
          {Array.from({length:slots.length/2},(_,mi)=>(
            <div key={mi} style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:'8px',alignItems:'center',marginBottom:'10px'}}>
              <select className="fi" value={slots[mi*2]||''} onChange={e=>setSlot(mi*2,e.target.value)}>
                <option value="">-- Chọn đội --</option>
                {teams.map(t=><option key={t.id} value={t.id}>{t.players.join(' & ')} ({t.avgElo})</option>)}
              </select>
              <span style={{fontSize:'12px',color:'var(--muted)',fontWeight:700}}>VS</span>
              <select className="fi" value={slots[mi*2+1]||''} onChange={e=>setSlot(mi*2+1,e.target.value)}>
                <option value="">-- Chọn đội --</option>
                {teams.map(t=><option key={t.id} value={t.id}>{t.players.join(' & ')} ({t.avgElo})</option>)}
              </select>
            </div>
          ))}
        </div>
        <div className="form-actions">
          <button className="btn-cancel" onClick={onClose}>Huỷ</button>
          <button className="btn-save" onClick={()=>onSave(slots)}>💾 Lưu sắp xếp</button>
        </div>
      </div>
    </div>
  );
}

/* ─── GIẢI ĐẤU: Sơ đồ nhánh đấu (bracket) ─────────────────── */
function BracketView({rounds, thirdPlace, teamsById, isAdmin, onEditMatch, onEditThirdPlace}){
  const CARD_H=68, ROW_H=CARD_H+24, COL_W=176, CONN_W=34, PAD=18, TITLE_H=23;
  const round0Count=rounds[0].matches.length;
  const totalH=round0Count*ROW_H+PAD*2;

  const centersByRound=useMemo(()=>{
    let centers=Array.from({length:round0Count},(_,i)=>PAD+i*ROW_H+CARD_H/2);
    const all=[centers];
    while(centers.length>1){
      const next=[];
      for(let i=0;i<centers.length;i+=2) next.push((centers[i]+centers[i+1])/2);
      centers=next; all.push(centers);
    }
    return all;
  },[round0Count]);

  const renderMatchCard=(m,ri,mi)=>{
    const tA=teamsById[m.teamA], tB=teamsById[m.teamB];
    const isFinal=ri===rounds.length-1;
    const decided=!!m.winnerId;
    const clickable=tA&&tB;
    return (
      <div key={m.id} onClick={()=>clickable&&onEditMatch(ri,mi)} style={{
        position:'absolute', top:centersByRound[ri][mi]-CARD_H/2, left:0, width:COL_W, height:CARD_H,
        background:isFinal?'linear-gradient(135deg,#7c3aed,#a855f7)':'var(--surface)',
        border:isFinal?'1px solid #a855f7':'1px solid var(--border)',
        borderRadius:'10px', padding:'6px 8px', cursor:clickable?'pointer':'default',
        display:'flex',flexDirection:'column',justifyContent:'center',gap:'4px',
        boxShadow:isFinal?'0 4px 14px rgba(168,85,247,.35)':'none',
      }} title={clickable?'Bấm để nhập tỉ số':undefined}>
        {['A','B'].map(side=>{
          const t=side==='A'?tA:tB;
          const score=side==='A'?m.scoreA:m.scoreB;
          const isWinner=decided&&m.winnerId===(side==='A'?m.teamA:m.teamB);
          return (
            <div key={side} style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'6px'}}>
              <span style={{fontSize:'11px',fontWeight:isWinner?800:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',
                color:!t?'var(--muted2)':isFinal?'#fff':(isWinner?'var(--text)':'var(--muted)')}}>
                {t? t.players.map(n=>n.split(' ').slice(-2).join(' ')).join(' & '): '—'}
              </span>
              <span style={{fontSize:'11px',fontWeight:800,flexShrink:0,color:isFinal?'#fff':(isWinner?'var(--green)':'var(--muted)')}}>
                {score!==''&&score!==undefined&&score!==null?score:'-'}
              </span>
            </div>
          );
        })}
      </div>
    );
  };

  const renderConnectors=ri=>{
    const cur=centersByRound[ri], next=centersByRound[ri+1];
    const lines=[];
    for(let i=0;i<next.length;i++){
      const y0=cur[i*2], y1=cur[i*2+1], ym=next[i];
      lines.push(<div key={'h0'+i} style={{position:'absolute',left:0,top:y0-1,width:CONN_W/2,height:2,background:'var(--border2)'}}/>);
      lines.push(<div key={'h1'+i} style={{position:'absolute',left:0,top:y1-1,width:CONN_W/2,height:2,background:'var(--border2)'}}/>);
      lines.push(<div key={'v'+i} style={{position:'absolute',left:CONN_W/2-1,top:Math.min(y0,y1),width:2,height:Math.abs(y1-y0),background:'var(--border2)'}}/>);
      lines.push(<div key={'h2'+i} style={{position:'absolute',left:CONN_W/2,top:ym-1,width:CONN_W/2,height:2,background:'var(--border2)'}}/>);
    }
    return lines;
  };

  return (
    <>
      <div style={{overflowX:'auto',paddingBottom:'12px'}}>
        <div style={{display:'flex',minWidth:'fit-content'}}>
          {rounds.map((round,ri)=>(
            <React.Fragment key={ri}>
              <div>
                <div style={{height:TITLE_H,textAlign:'center',fontSize:'11px',fontWeight:700,color:'var(--purple)',textTransform:'uppercase',letterSpacing:'.5px'}}>{round.name}</div>
                <div style={{position:'relative',width:COL_W,height:totalH}}>
                  {round.matches.map((m,mi)=>renderMatchCard(m,ri,mi))}
                </div>
              </div>
              {ri<rounds.length-1 && (
                <div>
                  <div style={{height:TITLE_H}}/>
                  <div style={{position:'relative',width:CONN_W,height:totalH}}>{renderConnectors(ri)}</div>
                </div>
              )}
            </React.Fragment>
          ))}
        </div>
      </div>

      {thirdPlace && thirdPlace.teamA && thirdPlace.teamB && (
        <div style={{maxWidth:280,margin:'8px auto 0'}}>
          <div style={{textAlign:'center',fontSize:'11px',fontWeight:700,color:'var(--orange)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'8px'}}>🥉 Tranh Hạng 3</div>
          <div onClick={()=>onEditThirdPlace()} style={{cursor:'pointer',background:'var(--surface)',border:'1px solid var(--orange)',borderRadius:'10px',padding:'8px 10px'}}>
            {['A','B'].map(side=>{
              const id=side==='A'?thirdPlace.teamA:thirdPlace.teamB;
              const t=teamsById[id];
              const score=side==='A'?thirdPlace.scoreA:thirdPlace.scoreB;
              const isWinner=thirdPlace.winnerId&&thirdPlace.winnerId===id;
              return (
                <div key={side} style={{display:'flex',justifyContent:'space-between',padding:'4px 0'}}>
                  <span style={{fontSize:'12px',fontWeight:isWinner?800:500,color:isWinner?'var(--text)':'var(--muted)'}}>{t?t.players.map(n=>n.split(' ').slice(-2).join(' ')).join(' & '):'—'}</span>
                  <span style={{fontSize:'12px',fontWeight:800,color:isWinner?'var(--green)':'var(--muted)'}}>{score!==''&&score!=null?score:'-'}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </>
  );
}

/* ─── Phân tích kết quả sau giải ─── */
function TournamentAnalysis({tournament, teamsById}){
  const [open,setOpen]=useState(false);
  const isRR=tournament.type==='roundrobin';

  // ── Lấy tất cả trận đã có kết quả ──
  const allMatches=isRR
    ?(tournament.rrMatches||[]).filter(m=>m.scoreA!==''&&m.scoreA!=null&&m.scoreB!==''&&m.scoreB!=null)
    :(tournament.rounds||[]).flatMap(r=>(r.matches||[]).filter(m=>m.scoreA!==''&&m.scoreA!=null&&m.scoreB!==''&&m.scoreB!=null));
  const parsed=allMatches.map(m=>({...m,a:parseInt(m.scoreA),b:parseInt(m.scoreB),diff:Math.abs(parseInt(m.scoreA)-parseInt(m.scoreB)),total:parseInt(m.scoreA)+parseInt(m.scoreB)})).filter(m=>!isNaN(m.a)&&!isNaN(m.b));
  if(!parsed.length) return null;

  const short=t=>t?t.players.map(n=>n.split(' ').slice(-2).join(' ')).join(' & '):'?';
  const sc=m=>`${m.scoreA}–${m.scoreB}`;

  // ── Vô địch / Á quân (knockout) ──
  let champion=null, runnerUp=null, thirdTeam=null;
  if(!isRR && tournament.rounds?.length){
    const finalRound=tournament.rounds[tournament.rounds.length-1];
    const finalMatch=finalRound?.matches?.[0];
    if(finalMatch?.winnerId){
      champion=teamsById[finalMatch.winnerId];
      const loserId=finalMatch.winnerId===finalMatch.teamA?finalMatch.teamB:finalMatch.teamA;
      runnerUp=teamsById[loserId];
    }
    if(tournament.thirdPlace?.winnerId){
      thirdTeam=teamsById[tournament.thirdPlace.winnerId];
    }
  }
  // RR: top 2 theo standings
  let rrChampion=null, rrRunnerUp=null;
  if(isRR){
    const st=computeRRStandings(tournament.teams||[],tournament.rrMatches||[]);
    if(st[0]) rrChampion=teamsById[st[0].id];
    if(st[1]) rrRunnerUp=teamsById[st[1].id];
  }

  // ── Thống kê tấn công / thủ cho TẤT CẢ loại giải ──
  const teamStats={};
  (tournament.teams||[]).forEach(t=>{teamStats[t.id]={id:t.id,gf:0,ga:0,w:0,l:0,matches:0};});
  parsed.forEach(m=>{
    if(teamStats[m.teamA]){teamStats[m.teamA].gf+=m.a;teamStats[m.teamA].ga+=m.b;teamStats[m.teamA].matches++;if(m.a>m.b)teamStats[m.teamA].w++;else teamStats[m.teamA].l++;}
    if(teamStats[m.teamB]){teamStats[m.teamB].gf+=m.b;teamStats[m.teamB].ga+=m.a;teamStats[m.teamB].matches++;if(m.b>m.a)teamStats[m.teamB].w++;else teamStats[m.teamB].l++;}
  });
  const statsArr=Object.values(teamStats).filter(s=>s.matches>0);
  const bestAttack=statsArr.length?statsArr.reduce((b,s)=>s.gf>b.gf?s:b,statsArr[0]):null;
  const bestDefense=statsArr.length?statsArr.reduce((b,s)=>s.ga<b.ga?s:b,statsArr[0]):null;
  // Tệ nhất (để làm giải hài hước)
  const worstDefense=statsArr.length?statsArr.reduce((b,s)=>s.ga>b.ga?s:b,statsArr[0]):null;
  const worstAttack=statsArr.length?statsArr.reduce((b,s)=>s.gf<b.gf?s:b,statsArr[0]):null;

  // ── Trận đặc biệt ──
  const mostExciting=parsed.reduce((best,m)=>!best||(m.diff<best.diff||(m.diff===best.diff&&m.total>best.total))?m:best,null);
  const biggestWin=parsed.reduce((best,m)=>!best||m.diff>best.diff?m:best,null);
  const mostGoals=parsed.reduce((best,m)=>!best||m.total>best.total?m:best,null);

  // ── Giải hài hước ──
  // "Muỗng vàng": đội thua nhiều nhất / bị ghi nhiều nhất
  const goldenSpoon=worstDefense&&worstDefense.id!==(champion?.id)&&worstDefense.id!==(runnerUp?.id)?worstDefense:null;
  // "Đội ngủ quên": thua với tỉ số tệ nhất (lớn nhất bị thua)
  let biggestLoser=null;
  if(biggestWin){
    const loserId=parseInt(biggestWin.scoreA)<parseInt(biggestWin.scoreB)?biggestWin.teamA:biggestWin.teamB;
    biggestLoser=teamsById[loserId];
  }
  // "Kẻ cứng đầu": đội thua nhưng ghi được nhiều điểm nhất cho đội thua
  const toughLoser=worstAttack&&worstAttack.l>0&&worstAttack.id!==(champion?.id)?worstAttack:null;

  const funComments=[
    '😴 Ngủ quên trên sân',
    '🫠 Chân không chịu chạy',
    '🍌 Trơn như chuối',
    '🥱 Đánh như đang ấm người',
    '☕ Cần uống thêm cà phê',
    '🎭 Màn trình diễn đặc biệt',
  ];
  const funComment=biggestLoser?funComments[Math.abs(biggestLoser.players?.[0]?.charCodeAt(0)||0)%funComments.length]:'';

  // ── Danh sách mục hiển thị ──
  const usedIds=new Set();
  const dedup=(m)=>{if(!m||usedIds.has(m.id)) return false; usedIds.add(m.id); return true;};

  const items=[
    // Podium
    (champion||rrChampion)&&{icon:'🏆',label:'Vô Địch',main:short(champion||rrChampion),sub:'Nhà vô địch giải đấu',highlight:'var(--yellow)',bg:'rgba(234,179,8,.08)'},
    (runnerUp||rrRunnerUp)&&{icon:'🥈',label:'Á Quân',main:short(runnerUp||rrRunnerUp),sub:'Chỉ cần thêm một chút nữa thôi...',highlight:'#94a3b8',bg:'rgba(148,163,184,.08)'},
    thirdTeam&&{icon:'🥉',label:'Hạng Ba',main:short(thirdTeam),sub:'Đánh tốt lắm, lần sau tiếp!',highlight:'#d97706',bg:'rgba(217,119,6,.08)'},
  ].filter(Boolean);

  const statItems=[
    mostExciting&&dedup(mostExciting)&&{icon:'🎯',label:'Trận kịch tính nhất',main:`${short(teamsById[mostExciting.teamA])} ${sc(mostExciting)} ${short(teamsById[mostExciting.teamB])}`,sub:`Cách biệt ${mostExciting.diff} · Tổng ${mostExciting.total} điểm`},
    biggestWin&&biggestWin.diff>0&&dedup(biggestWin)&&{icon:'💪',label:'Thắng thuyết phục nhất',main:`${short(teamsById[biggestWin.teamA])} ${sc(biggestWin)} ${short(teamsById[biggestWin.teamB])}`,sub:`Cách biệt ${biggestWin.diff} điểm`},
    mostGoals&&dedup(mostGoals)&&{icon:'🔥',label:'Trận nhiều điểm nhất',main:`${short(teamsById[mostGoals.teamA])} ${sc(mostGoals)} ${short(teamsById[mostGoals.teamB])}`,sub:`Tổng ${mostGoals.total} điểm`},
    bestAttack&&{icon:'⚡',label:'Hàng công sắc bén nhất',main:short(teamsById[bestAttack.id]),sub:`Ghi ${bestAttack.gf} điểm · ${bestAttack.w} trận thắng`},
    bestDefense&&bestDefense.id!==bestAttack?.id&&{icon:'🛡️',label:'Hàng thủ vững nhất',main:short(teamsById[bestDefense.id]),sub:`Chỉ thủng lưới ${bestDefense.ga} điểm`},
  ].filter(Boolean);

  const funItems=[
    biggestLoser&&{icon:'🥄',label:'Muỗng Vàng',main:short(biggestLoser),sub:`${funComment} · Thua ${biggestWin?.diff} điểm trong 1 trận`,color:'var(--orange)'},
    goldenSpoon&&goldenSpoon.id!==biggestLoser?.id&&{icon:'🍅',label:'Hàng thủ... đặc biệt',main:short(teamsById[goldenSpoon.id]),sub:`Để lọt lưới ${goldenSpoon.ga} điểm · Cần luyện thêm 💪`,color:'var(--red)'},
    toughLoser&&toughLoser.id!==biggestLoser?.id&&{icon:'🫡',label:'Thua nhưng không bỏ cuộc',main:short(teamsById[toughLoser.id]),sub:`Dù thua vẫn ghi được ${toughLoser.gf} điểm · Tinh thần thép`,color:'var(--purple)'},
  ].filter(Boolean);

  const allItems=[...statItems,...funItems];
  if(!allItems.length&&!items.length) return null;

  return (
    <div style={{marginBottom:'14px',border:'1px solid var(--border)',borderRadius:'12px',overflow:'hidden'}}>
      <button onClick={()=>setOpen(p=>!p)} style={{width:'100%',background:'var(--surface)',border:'none',padding:'11px 14px',cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center',fontFamily:'Nunito,sans-serif',fontSize:'13px',fontWeight:700,color:'var(--text)'}}>
        <span>📊 Phân tích sau giải</span>
        <span style={{color:'var(--muted)',fontSize:'11px'}}>{open?'▲':'▼'}</span>
      </button>
      {open&&(
        <div style={{borderTop:'1px solid var(--border)',background:'var(--bg3)'}}>

          {/* Podium */}
          {items.length>0&&(
            <div style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:'8px',borderBottom:'1px solid var(--border)'}}>
              {items.map((item,i)=>(
                <div key={i} style={{display:'flex',gap:'10px',alignItems:'center',padding:'10px 12px',borderRadius:'10px',background:item.bg,border:`1px solid ${item.highlight}44`}}>
                  <div style={{fontSize:'22px',lineHeight:1,flexShrink:0}}>{item.icon}</div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:'10px',color:item.highlight,fontWeight:800,marginBottom:'2px',textTransform:'uppercase',letterSpacing:'.5px'}}>{item.label}</div>
                    <div style={{fontSize:'14px',fontWeight:800,color:'var(--text)',fontFamily:'Quicksand,sans-serif'}}>{item.main}</div>
                    <div style={{fontSize:'11px',color:'var(--muted)',marginTop:'1px'}}>{item.sub}</div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Stats */}
          {statItems.length>0&&(
            <div style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:'12px',borderBottom:funItems.length?'1px solid var(--border)':'none'}}>
              {statItems.map((item,i)=>(
                <div key={i} style={{display:'flex',gap:'10px',alignItems:'flex-start'}}>
                  <div style={{fontSize:'18px',lineHeight:1,flexShrink:0,marginTop:'1px'}}>{item.icon}</div>
                  <div>
                    <div style={{fontSize:'10px',color:'var(--muted)',fontWeight:700,marginBottom:'2px',textTransform:'uppercase',letterSpacing:'.5px'}}>{item.label}</div>
